<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FWS-CIM System Atlas</title>
<style>
:root{
  --ink:#1c2a33; --muted:#5f7280; --faint:#8497a2; --accent:#176778;
  --line:#dde5e9; --bg:#f7f9fa; --card:#ffffff; --code:#eef2f4;
  --notice-bg:#f4f1e8; --notice-rule:#6b5a2a;
  --refuse-bg:#f6ecea; --refuse-rule:#7a2e2e;
  --tint:#e8f0f2; --on-accent:#ffffff; --ok:#2f6b46;
  --slot-free:#edf1f4; --slot-strand:#e3e0d7; --slot-strand-ink:#b5ae9b;
  --slot-ragged:#f3ece1; --slot-ragged-ink:#c8b393; --seam-bg:#f0e9da;
}
/* The reader's theme decides. Only the tokens move; the rules above and below
   are written once and hold in both. The drilldown SVGs draw their chrome -
   text, rules and frames - from these same tokens; the only literal colours
   left in them ENCODE DATA (a layer's hue, a pool's outline), and those hold
   their meaning in either theme. */
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e7eef2; --muted:#a7b6bf; --faint:#7e919c; --accent:#63c3d6;
    --line:#2b3941; --bg:#121a1f; --card:#19232a; --code:#202c33;
    --notice-bg:#262114; --notice-rule:#d3b46a;
    --refuse-bg:#2b1a19; --refuse-rule:#e09189;
    --tint:#1d353c; --on-accent:#0d1418; --ok:#7ec79d;
    --slot-free:#1f2a31; --slot-strand:#2e2b24; --slot-strand-ink:#5e5749;
    --slot-ragged:#332c22; --slot-ragged-ink:#6f6047; --seam-bg:#2a2417;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Georgia,"Times New Roman",serif}
.ui{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
main{max-width:74rem;margin:0 auto;padding:1.6rem 1.1rem 4rem}

header.top{border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:1rem}
.pid{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-size:1.65rem;line-height:1.2;margin:.3rem 0 .25rem;text-wrap:balance}
.sub{color:var(--muted);font-style:italic;margin:0 0 .6rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;font:11px/1 "Segoe UI",system-ui,sans-serif}
.pill{display:inline-block;letter-spacing:.06em;text-transform:uppercase;padding:.42em .62em;border-radius:999px;background:var(--code);color:var(--muted);font-weight:600}
.pill.on{background:var(--tint);color:var(--accent)}
.pill.mark{background:var(--notice-bg);color:var(--notice-rule)}

.bar.filt{border-top:0;padding-top:.1rem}
.bar .tag{font:700 10px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.bar .pick{display:inline-flex;align-items:center;gap:.35rem;font-size:11.5px;color:var(--muted)}
.bar .pick select,.bar .pick input{font:inherit;font-size:11.5px;padding:.18rem .3rem;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.bar .pick input[type=search]{min-width:15rem}
.bar .chk{display:inline-flex;align-items:center;gap:.3rem;font-size:11.5px;color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem;margin:.1rem 0 .6rem;font-size:12px}
.crumbs a{color:var(--accent);text-decoration:none;border-bottom:1px solid #cfe0e4}
.crumbs a:hover{border-bottom-color:var(--accent)}
.crumbs .here{font-weight:700;color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .note{color:var(--faint);font-size:11px}
.st tr.skip td{color:var(--faint)}
.band{border-left:3px solid var(--notice-rule);background:var(--notice-bg);padding:.7rem .9rem;margin:0 0 1rem;border-radius:0 4px 4px 0}
.band h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .45rem;color:var(--notice-rule)}
.band ul{margin:0;padding-left:1.1rem}
.band ul.two{column-count:2;column-gap:1.6rem}
.band ul.two li{break-inside:avoid}
@media (max-width:60rem){.band ul.two{column-count:1}}
.band li{margin:.22rem 0;font-size:.9rem}
.band .c{font-weight:700}
.band p{margin:.25rem 0;font:12.5px/1.55 "Segoe UI",system-ui,sans-serif}
.band.hard{border-left-color:var(--refuse-rule);background:var(--refuse-bg)}
.band.hard h2{color:var(--refuse-rule)}

.refuse{border-left:3px solid var(--refuse-rule);background:var(--refuse-bg);padding:.9rem 1rem;border-radius:0 4px 4px 0}
.refuse h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .5rem;color:var(--refuse-rule)}
.refuse p{margin:.3rem 0 .7rem;font-size:.92rem}
.refuse table{width:100%;border-collapse:collapse;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif}
.refuse th{text-align:left;border-bottom:1px solid var(--line);padding:.3rem .45rem;font-weight:600;color:var(--refuse-rule)}
.refuse td{border-bottom:1px solid var(--line);padding:.3rem .45rem;vertical-align:top}

.bar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 .7rem;font:12.5px/1 "Segoe UI",system-ui,sans-serif}
button,select,label.file{font:12.5px/1 "Segoe UI",system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;cursor:pointer}
button:hover,select:hover,label.file:hover{border-color:var(--accent);color:var(--accent)}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button[disabled]{opacity:.45;cursor:default}
input[type=file]{display:none}
.bar .note{color:var(--faint);margin-left:auto;font-size:11.5px}

.body{display:flex;gap:1rem;align-items:flex-start}
.canvas{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem}
.canvas .overflow{overflow-x:auto}
svg{display:block;width:100%;height:auto;max-width:100%}
.rail{flex:0 0 19rem;max-width:19rem}
@media (max-width:60rem){.body{flex-direction:column}.rail{flex:1 1 auto;max-width:none;width:100%}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;margin-bottom:.7rem}
.panel h3{font:600 10.5px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 .5rem}
.legrow{display:flex;align-items:center;gap:.5rem;margin:.28rem 0;font:12px/1.35 "Segoe UI",system-ui,sans-serif}
.legrow .sw{flex:0 0 auto}
.legrow .tx{color:var(--muted)}
.legrow .tx b{color:var(--ink);font-weight:600}
.leg-sub{font:11px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.45rem 0 .1rem;border-top:1px solid var(--line);padding-top:.45rem}

.card dl{margin:0;font:12.2px/1.5 "Segoe UI",system-ui,sans-serif}
.card dt{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:.5rem}
.card dd{margin:.1rem 0 0;color:var(--ink);word-break:break-word}
.card .ttl{font:600 13px/1.35 "Segoe UI",system-ui,sans-serif;margin:0 0 .1rem}
.card .idl{font-size:11px;color:var(--muted);word-break:break-all}
.card table{width:100%;border-collapse:collapse;font:11.5px/1.4 "Segoe UI",system-ui,sans-serif;margin-top:.3rem}
.card th{text-align:left;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line);padding:.22rem .3rem}
.card td{border-bottom:1px solid var(--line);padding:.22rem .3rem;vertical-align:top}
.meter{height:6px;background:var(--code);border-radius:3px;overflow:hidden;margin:.2rem 0}
.meter i{display:block;height:100%}
.inv{color:var(--notice-rule);font-weight:700}
.hintline{font:11.5px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.5rem 0 0}

.st table{width:100%;border-collapse:collapse;font:12px/1.45 "Segoe UI",system-ui,sans-serif}
.st th{text-align:left;border-bottom:1px solid var(--line);padding:.28rem .4rem;color:var(--faint);font-weight:600}
.st td{border-bottom:1px solid var(--line);padding:.28rem .4rem}
.st .ok{color:var(--ok);font-weight:700}
.st .no{color:var(--refuse-rule);font-weight:700}
.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
foreignObject div{font:11px/1.2 "Segoe UI",system-ui,sans-serif}

/* ---- results layer ---- */
.hwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(23rem,1fr));gap:1rem;margin:.8rem 0}
.hwcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.9rem 1.1rem}
.hwcard h3{margin:0 0 .1rem;font:600 1rem/1.3 "Segoe UI",system-ui,sans-serif}
.hwcard .cnt{font:12px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--muted);margin-bottom:.5rem}
.hwcard table{width:100%;border-collapse:collapse;font:13px/1.5 "Segoe UI",system-ui,sans-serif}
.hwcard td{padding:.24rem .1rem;border-bottom:1px solid var(--line);vertical-align:top}
.hwcard td:first-child{color:var(--muted);white-space:nowrap;padding-right:.8rem}
.hwcard td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hwcard .grp{padding-top:.6rem;color:var(--ink);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:0}
.legband{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:flex-start;margin:.5rem 0 0}
.legband .lb{font:11px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.3rem}
.blk{display:inline-flex;align-items:center;gap:.35rem;font:12px/1.5 "Segoe UI",system-ui,sans-serif;margin-right:.7rem}

.pid a{color:var(--faint);text-decoration:none} .pid a:hover{color:var(--accent)}
h2.sect{font:600 1.02rem/1.3 "Segoe UI",system-ui,sans-serif;margin:2.4rem 0 .8rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--ink)}
h2.sect.first{margin-top:.6rem;padding-top:0;border-top:0}
h3.rsub{margin:1.5rem 0 .3rem;font:600 .9rem/1.3 "Segoe UI",system-ui,sans-serif;color:var(--ink)}
.panel2{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1rem;overflow-x:auto}
#h-models{margin:.2rem 0 .6rem}
#h-models button{font:600 12.5px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.03em;padding:.5em .95em;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;margin-right:.45rem;margin-bottom:.35rem}
#h-models button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.hl{display:flex;flex-wrap:wrap;gap:.8rem;margin:1.1rem 0 .4rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem 1rem;min-width:9.5rem}
.stat .v{font:600 1.35rem/1.2 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat .k{font:11px/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:.15rem}
#rs-tip{position:fixed;z-index:40;background:#20303b;color:#eef4f7;border-radius:5px;padding:.55rem .75rem;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif;max-width:26rem;pointer-events:none;display:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#rs-tip .t{font-weight:600;margin-bottom:.15rem}
#rs-tip .b{color:#aebfca;font-size:11.5px;margin-top:.25rem}
.rtable{border-collapse:collapse;width:100%;font:13px/1.5 "Segoe UI",system-ui,sans-serif;margin:.4rem 0}
.rtable th{text-align:left;border-bottom:2px solid var(--ink);padding:.35rem .5rem;font-weight:600}
.rtable td{border-bottom:1px solid var(--line);padding:.35rem .5rem;vertical-align:top;font-variant-numeric:tabular-nums}
.rtable td.basis{color:var(--muted);font-size:12px;max-width:36rem;font-variant-numeric:normal}
.rtable tr.pick td{background:var(--tint)}
.rtable tr.bad td{color:var(--refuse-rule)}
.rtable tr.click{cursor:pointer}
.rtable tr.click:hover td{background:var(--code)}
.selcand{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:.9rem 1rem;margin:.8rem 0}
.selcand.bad{border-left-color:var(--refuse-rule)}
.selcand h3{margin:0 0 .35rem;font:600 1rem/1.3 "Segoe UI",system-ui,sans-serif}
.selcand .knobs{font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:.3rem}
.selcand details{margin-top:.5rem} .selcand summary{cursor:pointer;font:600 12.5px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--accent)}
.verd-ok{color:var(--ok);font-weight:600}.verd-bad{color:var(--refuse-rule);font-weight:600}
.disc2 .d{background:var(--code);border-left:3px solid var(--faint);padding:.55rem .8rem;margin:.45rem 0;font:12.5px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--ink)}
.disc2 .d p{margin:.25rem 0 0;white-space:pre-wrap}
.rnote{font:12.5px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--muted)}
.rerr{color:var(--refuse-rule);font-weight:600}
/* An ABSENCE is a first-class rendering: never a zero, never another point's
   number. The dotted rule marks the em-dash as a stated absence with a reason
   the reader can read, and .why prints that reason under the table. */
.ab{color:var(--faint);border-bottom:1px dotted var(--faint);cursor:help}
.why{font:11.5px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.35rem 0 0}
.why b{color:var(--muted);font-weight:600}
.absent{background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:.85rem 1rem;font:12.5px/1.6 "Segoe UI",system-ui,sans-serif;color:var(--muted)}
.absent b{color:var(--ink)}
.zeroban{background:var(--notice-bg);border-left:3px solid var(--notice-rule);padding:.6rem .8rem;border-radius:0 4px 4px 0;font:12.5px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--ink);margin:.5rem 0}
/* A FINDING. Not a footnote, not a disclosure: something about this point the
   reader would be wrong to miss. One box, plain words, above the drawing. */
.finding{background:var(--notice-bg);border-left:4px solid var(--notice-rule);padding:.8rem 1rem;border-radius:0 5px 5px 0;margin:0 0 .9rem;font:13.5px/1.65 "Segoe UI",system-ui,sans-serif;color:var(--ink)}
.finding h4{margin:0 0 .3rem;font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--notice-rule)}
.finding b{color:var(--ink)}
.finding .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.zeroban button{margin-left:.6rem}

/* ---- THE SLOT MAP ------------------------------------------------------- */
.slotwrap{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;margin:.7rem 0}
.slotwrap .cap{font:11px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--faint);letter-spacing:.02em;margin:0 0 .55rem}
.legband>div{flex:0 0 auto}
#h-slotlegend .blk{white-space:nowrap}
.bchip,.bchip .sub{white-space:nowrap}
.slotscroll{overflow-x:auto;overflow-y:hidden;padding-bottom:.25rem}
.slotscroll svg.slotsvg{display:block;width:auto;max-width:none;height:auto}
.sg-ax{font:600 9.5px/1 "Segoe UI",system-ui,sans-serif;fill:var(--muted);letter-spacing:.05em}
.sg-ax2{font:9px/1 "Segoe UI",system-ui,sans-serif;fill:var(--faint)}
.sg-chipname{font:600 11px/1 "Segoe UI",system-ui,sans-serif;fill:var(--ink);letter-spacing:.03em}
.sg-chip{fill:none;stroke:var(--line);stroke-width:1}
.sg-free,.sg-blank{fill:var(--slot-free)}
.sg-strand{fill:url(#sp-strand)}
.sg-ragged{fill:url(#sp-ragged)}
.sp-strandbg{fill:var(--slot-strand)}
.sp-strandline{stroke:var(--slot-strand-ink);stroke-width:1.6}
.sp-raggedbg{fill:var(--slot-ragged)}
.sp-raggedline{stroke:var(--slot-ragged-ink);stroke-width:1}
.sw-beat{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.sw-beatlab{font:9.5px/1 "Segoe UI",system-ui,sans-serif;fill:var(--faint);letter-spacing:.04em}
.sw-seam{fill:var(--seam-bg)}
.sw-hop{fill:var(--code)}
.sw-seamlab{font:600 9.5px/1 "Segoe UI",system-ui,sans-serif;fill:var(--notice-rule)}
.sw-chiprule{stroke:var(--line);stroke-width:1}
.sw-chipname{font:600 9.5px/1 "Segoe UI",system-ui,sans-serif;fill:var(--muted)}
.sw-brk{fill:none;stroke:var(--faint);stroke-width:1}
.sw-brklab{font:9.5px/1 "Segoe UI",system-ui,sans-serif;fill:var(--muted)}
.sw-L{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3}
.sw-Llab{font:600 10px/1 "Segoe UI",system-ui,sans-serif;fill:var(--accent)}
.sw-Llab2{font:10px/1 "Segoe UI",system-ui,sans-serif;fill:var(--muted)}
.sw-tick{stroke:var(--faint);stroke-width:1}
.sw-ns{font:8.5px/1 "Segoe UI",system-ui,sans-serif;fill:var(--faint)}
.sw-ghost{opacity:.32}
#h-slotsec .s-dim{opacity:.12}
#h-slotsec .s-hot .cell{stroke:var(--ink);stroke-width:.9}
.sled{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0 .2rem}
.sled .t{flex:1 1 9.5rem;min-width:9.5rem;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:.5rem .65rem}
.sled .t.warn{border-left:3px solid var(--notice-rule)}
.sled .v{font:600 1.05rem/1.2 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)}
.sled .v .u{font-size:.68em;font-weight:500;color:var(--muted)}
.sled .k{font:10.5px/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}
.sled .b{font:10.5px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin-top:.2rem}
.bchain{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;margin:.3rem 0 .1rem}
.bchain .arrow{color:var(--faint);font-size:11px}
.bchain .arrow.seam{color:var(--notice-rule);font-weight:600;letter-spacing:.02em}
.bchip{display:inline-flex;align-items:center;gap:.35rem;font:12px/1.2 "Segoe UI",system-ui,sans-serif;padding:.35rem .55rem;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);cursor:pointer}
.bchip .nm{font-weight:600}
.bchip .sub{color:var(--faint);font-size:10.5px}
.bchip .seamdot{color:var(--notice-rule);font-weight:700}
.bchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bchip[aria-pressed="true"] .sub{color:var(--on-accent);opacity:.82}
.bswitch{font:11.5px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.15rem 0 .3rem}
.bswitch a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line)}
.bswitch a:hover{border-bottom-color:var(--accent)}
.bswitch b{color:var(--muted);font-weight:600}
/* the frontier plot's inks, so the picture follows the reader's theme */
.fx-grid{stroke:var(--line);stroke-width:1}
.fx-axis{stroke:var(--ink);stroke-width:1.2}
.fx-lab{font-size:11px;fill:var(--muted)}
.fx-axlab{font-size:12px;fill:var(--muted)}
.fx-open{fill:var(--card)}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="pid"><a href="../index.html">QIF board</a> &middot; results</div>
    <div id="h-models"></div>
    <h1 id="h-title">QIF Results</h1>
    <p class="sub" id="h-sub"></p>
    <div class="pills" id="h-pills"></div>
  </header>
  <div id="h-alerts"></div>
  <div id="h-frontsec"></div>
  <div id="h-hw"></div>
  <div id="h-pipesec"></div>
  <div id="h-beat"></div>
  <div id="h-state"></div>
  <div id="h-energy"></div>
  <div id="h-util"></div>
  <div id="h-bounds"></div>
  <div id="h-disc"></div>
</main>
<div id="rs-tip"></div>

<script>
// ==ATLAS-CORE-START==  (no DOM here: this block is also run headlessly)
var ATLAS = (function () {
  "use strict";

  // The four validated group hues. Slot order is fixed; hues are never cycled.
  // Checked with the dataviz palette validator, all-pairs, surface #f7f9fa:
  // lightness band PASS, chroma floor PASS, CVD dE 9.3 (deutan) PASS,
  // normal-vision dE 17.8 PASS, contrast >= 3:1 PASS. See SCHEMA.md.
  var HUES = ["#108ca0", "#a63931", "#714ba8", "#808402"];
  var AXES = ["tp", "ep", "pp"];
  var PAPER = "#f7f9fa";
  var MUTED = "#5f7280";
  var DRAW_BUDGET = 10000;
  // Duty cycle is its OWN channel: a dedicated bar in one neutral ink, never a
  // hue and never the occupancy fill (P5's encoding law). The ink is deliberately
  // outside HUES so no reader can mistake a duty bar for a group.
  var DUTY_INK = "#3d4f5c";
  // A tile band narrower than this would vanish; it is drawn at the floor and
  // the exact span is printed in the card beside it.
  var BAND_FLOOR_PX = 1.5;

  function isInt(n) { return typeof n === "number" && isFinite(n) && Math.floor(n) === n; }
  function isStr(s) { return typeof s === "string" && s.length > 0; }
  function byId(list) { var m = {}; (list || []).forEach(function (o) { if (o && o.id != null) m[o.id] = o; }); return m; }

  function capacityOf(doc, macro) {
    if (macro && macro.capacity) return macro.capacity;
    var card = doc.cards && doc.cards[macro && macro.card];
    return (card && card.capacity) || null;
  }

  // Hue keys are a property of the file, not of what is on screen: sorted by
  // the fixed axis order tp, ep, pp and then by index, so a filter never
  // repaints a group.
  function hueKeys(doc) {
    var seen = {};
    function take(o) {
      if (!o || !isStr(o.primary_group) || !o.groups) return;
      var idx = o.groups[o.primary_group];
      if (!isInt(idx)) return;
      seen[o.primary_group + ":" + idx] = true;
    }
    (doc.tiles || []).forEach(take);
    (doc.chips || []).forEach(take);
    return Object.keys(seen).sort(function (a, b) {
      var A = a.split(":"), B = b.split(":");
      return (AXES.indexOf(A[0]) - AXES.indexOf(B[0])) || (+A[1] - +B[1]);
    });
  }

  function hueMap(doc) {
    var keys = hueKeys(doc), m = {};
    keys.forEach(function (k, i) { m[k] = i < HUES.length ? HUES[i] : null; });
    return { order: keys, hue: m };
  }

  function groupKey(o) {
    if (!o || !isStr(o.primary_group) || !o.groups) return null;
    var idx = o.groups[o.primary_group];
    return isInt(idx) ? o.primary_group + ":" + idx : null;
  }

  // ---- colour helpers -------------------------------------------------------
  function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgb2hex(c) { return "#" + c.map(function (v) { return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0"); }).join(""); }
  function mix(a, b, t) {
    var A = hex2rgb(a), B = hex2rgb(b);
    return rgb2hex([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
  }
  // One hue, light to dark. The light end keeps a floor so an empty macro is
  // still a drawn object rather than a hole in the page.
  function ramp(hue, occ) {
    if (hue == null) return PAPER;
    var t = Math.max(0, Math.min(1, occ == null ? 0 : occ));
    return mix(PAPER, hue, 0.10 + 0.90 * t);
  }

  // ---- formatting -----------------------------------------------------------
  function fmt(v) {
    if (v == null) return "—";
    if (typeof v !== "number") return String(v);
    if (!isFinite(v)) return String(v);
    var a = Math.abs(v);
    if (a === 0) return "0";
    if (a < 1e-3) return v.toExponential(3);
    if (a < 1) return String(Math.round(v * 1e6) / 1e6);
    if (a < 1000) return String(Math.round(v * 1000) / 1000);
    return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function fmtBytes(n) {
    if (!isFinite(n)) return "—";
    var u = ["B", "KiB", "MiB", "GiB"], i = 0, v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i === 0 ? String(n) : (Math.round(v * 100) / 100) + " " + u[i]) + (i === 0 ? " B" : " (" + n.toLocaleString("en-US") + " B)");
  }
  function pct(v) { return v == null ? "—" : (Math.round(v * 1000) / 10) + "%"; }

  // ---- the fixture_invented convention -------------------------------------
  function inventedIndex(doc) {
    var paths = {};
    ((doc.provenance && doc.provenance.invented_fields) || []).forEach(function (p) { paths[p] = true; });
    return paths;
  }
  // collection is "macros" | "tiles" | "chips" | "links" | "metrics"
  function isInvented(paths, collection, obj, field) {
    if (obj && obj.fixture_invented === true) return true;
    if (obj && Array.isArray(obj.fixture_invented) && obj.fixture_invented.indexOf(field) >= 0) return true;
    return !!paths[collection + "[]." + field];
  }

  // ---- the loader's refusals ------------------------------------------------
  function validate(doc) {
    var errors = [], warnings = [];
    function E(rule, field, message) { errors.push({ rule: rule, field: field, message: message }); }
    function W(rule, field, message) { warnings.push({ rule: rule, field: field, message: message }); }

    if (!doc || typeof doc !== "object" || Array.isArray(doc)) {
      E("R1", "(document)", "not a JSON object");
      return { errors: errors, warnings: warnings };
    }
    if (doc.schema !== "fws_atlas/1") {
      E("R1", "schema", 'expected "fws_atlas/1", found ' + JSON.stringify(doc.schema));
    }

    // structure first; every later rule assumes the tables exist
    var arrays = ["systems", "chips", "macros", "tiles", "links", "metrics", "relaxations"];
    var structural = false;
    if (doc.cards == null || typeof doc.cards !== "object" || Array.isArray(doc.cards)) {
      E("R1", "cards", "required object of device cards is missing"); structural = true;
    }
    if (!isStr(doc.title)) E("R1", "title", "required string is missing");
    if (doc.provenance == null || typeof doc.provenance !== "object" || Array.isArray(doc.provenance)) {
      E("R1", "provenance",
        "required object is missing. Without it every fixture_invented mark disappears and a " +
        "placeholder reads as evidence — the one thing the convention exists to prevent");
    } else {
      if (!isStr(doc.provenance.authored)) E("R1", "provenance.authored", "a document states when it was authored");
      if (!isStr(doc.provenance.author)) E("R1", "provenance.author", "a document states what produced it");
      if (!Array.isArray(doc.provenance.invented_fields)) {
        E("R1", "provenance.invented_fields",
          "must be an array of marked field paths; a real producer's output declares an empty one");
      }
    }
    arrays.forEach(function (k) {
      if (!Array.isArray(doc[k])) {
        E(k === "chips" ? "R9" : "R1", k,
          k === "chips"
            ? "chips must be an array of objects. A chip count is not a placement"
            : "required array is missing or not an array");
        structural = true;
      }
    });
    if (structural) return { errors: errors, warnings: warnings };

    // R9 - a chip count that is a division is not a placement (AUDIT finding 1)
    var QUOTIENT = /(_per_chip$)|(^chips?_per_)|(chip_count$)|(^chips_count$)/i;
    function scanQuotient(obj, path, depth) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj) || depth > 3) return;
      Object.keys(obj).forEach(function (k) {
        var v = obj[k];
        if (QUOTIENT.test(k) && typeof v === "number" && !isInt(v)) {
          E("R9", path + k, "a derived chip count is not a placement: " + k + " = " + v);
        }
        if (v && typeof v === "object" && !Array.isArray(v)) scanQuotient(v, path + k + ".", depth + 1);
      });
    }
    scanQuotient(doc, "", 0);
    doc.systems.forEach(function (s) { scanQuotient(s, "systems[" + s.id + "].", 0); });
    doc.chips.forEach(function (c) { scanQuotient(c, "chips[" + c.id + "].", 0); });
    ["macros", "tiles", "links", "metrics"].forEach(function (k) {
      doc[k].forEach(function (o, i) {
        scanQuotient(o, k + "[" + ((o && o.id != null) ? o.id : i) + "].", 0);
      });
    });

    // R24 - the device cards themselves. ADJ-4: slicing is present iff
    // bits_per_cell < weight_bits, and a mux slot stores cols_adc columns (P2).
    Object.keys(doc.cards).forEach(function (cid) {
      var c = doc.cards[cid] || {}, at = "cards." + cid;
      if (["analog_macro", "digital_engine"].indexOf(c.kind) < 0) {
        E("R24", at + ".kind", 'must be "analog_macro" or "digital_engine", found ' + JSON.stringify(c.kind));
      }
      if (!isInt(c.weight_bits) || c.weight_bits <= 0) {
        E("R24", at + ".weight_bits", "must be a positive integer, found " + JSON.stringify(c.weight_bits));
      }
      var ccap = c.capacity || {};
      if (isInt(ccap.cols_adc) && isInt(ccap.mux) && isInt(ccap.stored_cols) &&
          ccap.stored_cols !== ccap.cols_adc * ccap.mux) {
        E("R24", at + ".capacity.stored_cols",
          "declares " + ccap.stored_cols + " but cols_adc x mux = " + (ccap.cols_adc * ccap.mux));
      }
      var slices = isInt(c.bits_per_cell) && isInt(c.weight_bits) && c.bits_per_cell < c.weight_bits;
      if (c.slicing !== slices) {
        E("R24", at + ".slicing",
          "declares " + JSON.stringify(c.slicing) + " but bits_per_cell " + JSON.stringify(c.bits_per_cell) +
          " against weight_bits " + JSON.stringify(c.weight_bits) + " makes slicing " + slices +
          " (ADJ-4: slicing is present iff bits_per_cell < weight_bits)");
      }
    });

    // R26 - a system states which inventory it is and at which phase (D16)
    doc.systems.forEach(function (sy) {
      var at = "systems[" + sy.id + "]";
      if (["unified", "prefill", "decode"].indexOf(sy.role) < 0) {
        E("R26", at + ".role", 'must be "unified", "prefill" or "decode" (D16), found ' + JSON.stringify(sy.role));
      }
      if (["prefill", "decode"].indexOf(sy.phase) < 0) {
        E("R26", at + ".phase",
          'must be "prefill" or "decode": the metrics and duty cycles describe one operating point, found ' +
          JSON.stringify(sy.phase));
      }
    });

    var sysById = byId(doc.systems), chipById = byId(doc.chips);
    var macroById = byId(doc.macros), tileById = byId(doc.tiles);

    var modelById = {};
    doc.systems.forEach(function (s) {
      (s.models || []).forEach(function (m) { if (m && m.id != null) modelById[m.id] = m; });
    });

    // R2 / R8 / R4 - chips
    var chipHolds = {};
    doc.chips.forEach(function (c) {
      var at = "chips[" + c.id + "]";
      if (!sysById[c.system]) E("R2", at + ".system", 'no system "' + c.system + '" in systems[]');
      if (c.pool !== "analog" && c.pool !== "digital") E("R2", at + ".pool", 'pool must be "analog" or "digital", found ' + JSON.stringify(c.pool));

      var slots = c.capacity && c.capacity.macro_slots;
      if (!isInt(slots) || slots <= 0) {
        E("R8", at + ".capacity.macro_slots", "must be a positive integer, found " + JSON.stringify(slots));
      } else if (!Array.isArray(c.macros) || c.macros.length !== slots) {
        E("R8", at + ".capacity.macro_slots",
          "declares " + slots + " slots but lists " + (Array.isArray(c.macros) ? c.macros.length : 0) + " macros");
      }
      var held = {};
      (c.macros || []).forEach(function (mid) {
        held[mid] = true;
        var m = macroById[mid];
        if (!m) E("R4", at + ".macros", 'lists macro "' + mid + '", which is not in macros[]');
        else if (m.chip !== c.id) E("R4", at + ".macros", 'lists macro "' + mid + '", whose .chip is "' + m.chip + '"');
      });
      chipHolds[c.id] = held;
    });

    // R3 / R7 / R10 / R5 - macros
    doc.macros.forEach(function (m) {
      var at = "macros[" + m.id + "]";
      if (!chipById[m.chip]) E("R3", at + ".chip", 'no chip "' + m.chip + '" in chips[]');
      else if (!chipHolds[m.chip][m.id]) E("R3", at + ".chip", 'chip "' + m.chip + '" does not list this macro');

      if (!doc.cards[m.card]) E("R7", at + ".card", 'no device card "' + m.card + '" in cards');

      var tl = Array.isArray(m.tiles) ? m.tiles : [];
      if (!Array.isArray(m.tiles)) E("R5", at + ".tiles", "must be an array of tile ids");
      tl.forEach(function (tid) {
        var t = tileById[tid];
        if (!t) E("R5", at + ".tiles", 'lists tile "' + tid + '", which is not in tiles[]');
        else if (t.macro !== m.id) E("R5", at + ".tiles", 'lists tile "' + tid + '", whose .macro is "' + t.macro + '"');
      });
      // R27 - a duty cycle is a fraction of a period, and it is painted as a
      // bar: an out-of-range value would render as a plausible full or empty one.
      if (m.duty_cycle != null &&
          (typeof m.duty_cycle !== "number" || !isFinite(m.duty_cycle) || m.duty_cycle < 0 || m.duty_cycle > 1)) {
        E("R27", at + ".duty_cycle", "must be a fraction in [0, 1] or null, found " + JSON.stringify(m.duty_cycle));
      }
      // the named-owner invariant (D21)
      if (tl.length === 0 && !isStr(m.reserved)) {
        E("R10", at + ".reserved",
          "a macro with no tiles must name its reservation: every macro has a named owner");
      }
    });

    // R11..R16 - tiles
    var spans = {};
    doc.tiles.forEach(function (t) {
      var at = "tiles[" + t.id + "]";
      var m = macroById[t.macro];
      if (!m) { E("R5", at + ".macro", 'no macro "' + t.macro + '" in macros[]'); return; }
      if ((m.tiles || []).indexOf(t.id) < 0) E("R5", at + ".macro", 'macro "' + m.id + '" does not list this tile');

      var o = t.owner || {};
      var model = modelById[o.model];
      if (!model) E("R11", at + ".owner.model", 'no model "' + o.model + '" in systems[].models[]');
      else if (Array.isArray(model.blocks) && model.blocks.indexOf(o.block) < 0) {
        E("R11", at + ".owner.block", '"' + o.block + '" is not in the model\'s blocks[]');
      } else if (!isInt(o.layer)) {
        var ends = (model.endpoint_blocks || []);
        if (o.layer !== null) E("R11", at + ".owner.layer", "must be an integer or null, found " + JSON.stringify(o.layer));
        else if (ends.indexOf(o.block) < 0) E("R11", at + ".owner.layer", 'is null, but "' + o.block + '" is not an endpoint block');
      }

      var cap = capacityOf(doc, m);
      var col = t.columns || {};
      if (!isInt(col.start) || col.start < 0) E("R12", at + ".columns.start", "must be a non-negative integer, found " + JSON.stringify(col.start));
      if (!isInt(col.count) || col.count <= 0) E("R12", at + ".columns.count", "must be a positive integer, found " + JSON.stringify(col.count));
      if (cap && isInt(col.start) && isInt(col.count) && col.start + col.count > cap.stored_cols) {
        E("R12", at + ".columns", "span [" + col.start + ", " + (col.start + col.count) + ") exceeds the macro's " + cap.stored_cols + " stored columns");
      }
      var sh = t.shape || {};
      if (isInt(col.count) && sh.N !== col.count) E("R14", at + ".shape.N", "N = " + JSON.stringify(sh.N) + " but the column span holds " + col.count);
      if (cap && isInt(sh.K) && sh.K > cap.rows) E("R15", at + ".shape.K", "K = " + sh.K + " exceeds the macro's " + cap.rows + " rows");

      // R25 - bit slicing (D11) is a card property; a tile may not claim a
      // slice role on a card that stores whole weight words.
      var tcard = doc.cards[m.card] || {};
      if (t.slice != null) {
        if (!tcard.slicing) {
          E("R25", at + ".slice", 'is set, but card "' + m.card + '" does not slice (D11)');
        } else if (!isInt(t.slice.of) || t.slice.of <= 0 || !isInt(t.slice.index) ||
                   t.slice.index < 0 || t.slice.index >= t.slice.of ||
                   !isInt(t.slice.bits) || t.slice.bits <= 0) {
          E("R25", at + ".slice",
            "must be {index, of, bits} with 0 <= index < of and bits > 0, found " + JSON.stringify(t.slice));
        }
      }

      if (!isStr(t.primary_group) || AXES.indexOf(t.primary_group) < 0) {
        E("R20", at + ".primary_group", 'must be "tp", "ep" or "pp", found ' + JSON.stringify(t.primary_group));
      } else if (!t.groups || !isInt(t.groups[t.primary_group])) {
        E("R20", at + ".groups." + t.primary_group, "the primary axis has no index in groups");
      }

      if (isInt(col.start) && isInt(col.count)) {
        (spans[t.macro] = spans[t.macro] || []).push({ id: t.id, a: col.start, b: col.start + col.count });
      }
    });

    // R13 / R16 - column spans and the occupancy they imply
    doc.macros.forEach(function (m) {
      var at = "macros[" + m.id + "]";
      var list = (spans[m.id] || []).slice().sort(function (x, y) { return x.a - y.a; });
      var held = 0;
      for (var i = 0; i < list.length; i++) {
        held += list[i].b - list[i].a;
        if (i > 0 && list[i].a < list[i - 1].b) {
          E("R13", "tiles[" + list[i].id + "].columns",
            'overlaps tile "' + list[i - 1].id + '" on macro ' + m.id + " (columns " + list[i].a + " < " + list[i - 1].b + ")");
        }
      }
      var cap = capacityOf(doc, m);
      if (cap && isInt(cap.stored_cols) && cap.stored_cols > 0) {
        var want = held / cap.stored_cols;
        if (typeof m.occupancy !== "number" || Math.abs(m.occupancy - want) > 1e-9) {
          E("R16", at + ".occupancy",
            "declares " + fmt(m.occupancy) + " but the enumerated column spans hold " + held + " of " + cap.stored_cols + " (" + fmt(want) + ")");
        }
      }
    });

    // R17 - chip occupancy against the enumerated macros
    doc.chips.forEach(function (c) {
      var slots = c.capacity && c.capacity.macro_slots;
      if (!isInt(slots) || slots <= 0) return;
      var used = 0;
      (c.macros || []).forEach(function (mid) {
        var m = macroById[mid];
        if (m && Array.isArray(m.tiles) && m.tiles.length > 0) used++;
      });
      var want = used / slots;
      if (typeof c.occupancy !== "number" || Math.abs(c.occupancy - want) > 1e-9) {
        E("R17", "chips[" + c.id + "].occupancy",
          "declares " + fmt(c.occupancy) + " but " + used + " of " + slots + " enumerated slots hold tiles (" + fmt(want) + ")");
      }
    });

    // R21 - a chip may not claim a group its own tiles contradict
    doc.chips.forEach(function (c) {
      if (!isStr(c.primary_group) || !c.groups || !isInt(c.groups[c.primary_group])) {
        if (c.primary_group != null || c.groups != null) {
          E("R21", "chips[" + c.id + "].primary_group", "must name an axis that groups indexes");
        }
        return;
      }
      var ax = c.primary_group, idx = c.groups[ax];
      (c.macros || []).forEach(function (mid) {
        var m = macroById[mid];
        ((m && m.tiles) || []).forEach(function (tid) {
          var t = tileById[tid];
          if (t && t.groups && isInt(t.groups[ax]) && t.groups[ax] !== idx) {
            E("R21", "chips[" + c.id + "].groups." + ax,
              "chip claims " + ax + " " + idx + ' but resident tile "' + tid + '" is ' + ax + " " + t.groups[ax]);
          }
        });
      });
    });

    // R6 - links
    doc.links.forEach(function (l) {
      var at = "links[" + l.id + "]";
      if (!chipById[l.from]) E("R6", at + ".from", 'no chip "' + l.from + '" in chips[]');
      if (!chipById[l.to]) E("R6", at + ".to", 'no chip "' + l.to + '" in chips[]');
      if (["tp", "ep", "pp", "pd", "act", "svc"].indexOf(l.role) < 0) E("R6", at + ".role", "unknown link role " + JSON.stringify(l.role));
      if (typeof l.bytes !== "number" || !isFinite(l.bytes) || l.bytes < 0) E("R6", at + ".bytes", "must be a non-negative number, found " + JSON.stringify(l.bytes));
      if (!isStr(l.per)) E("R6", at + ".per", "a byte count states what it is per (a step, a token, a request)");
      if (!isStr(l.basis)) E("R6", at + ".basis", "every link states where its number came from");
    });

    // R18 - one labeled accounting per metric (AUDIT finding 4)
    var byKey = {};
    doc.metrics.forEach(function (m, i) {
      var at = "metrics[" + i + " " + (m && m.key) + "]";
      if (!isStr(m.key)) { E("R18", at + ".key", "a metric needs a key"); return; }
      if (!isStr(m.basis)) E("R18", at + ".basis", "every metric states where its number came from");
      if (typeof m.value !== "number" || !isFinite(m.value)) {
        E("R18", at + ".value", "must be a finite number, found " + JSON.stringify(m.value));
      }
      (byKey[m.key] = byKey[m.key] || []).push({ i: i, label: m.label });
    });
    Object.keys(byKey).forEach(function (k) {
      var list = byKey[k], seen = {};
      list.forEach(function (e) {
        var at = "metrics[" + e.i + " " + k + "].label";
        if (!isStr(e.label)) {
          E("R18", at, list.length > 1
            ? "two figures for one metric are legal only when both are labeled"
            : "a metric needs a label; the atlas never picks which figure is the headline");
        } else if (seen[e.label]) {
          E("R18", at, 'duplicates the label "' + e.label + '" already used for metric "' + k + '"');
        } else seen[e.label] = true;
      });
    });

    // R19 - disclosed relaxations
    doc.relaxations.forEach(function (r, i) {
      ["constraint", "value", "reason"].forEach(function (f) {
        if (!isStr(r && r[f])) E("R19", "relaxations[" + i + "]." + f, "a disclosed relaxation states its " + f);
      });
    });

    // R28 - in a document with more than one system, every metric must name the
    // system it measures. A PD pair publishes the same headline LABEL twice,
    // once per inventory (D16), so a metric strip that does not say whose figure
    // it is puts two readings of one quantity in front of a reader with no way
    // to tell them apart - AUDIT finding 4 one level up.
    if (doc.systems.length > 1) {
      doc.metrics.forEach(function (m, i) {
        var at = "metrics[" + i + " " + (m && m.key) + "]";
        var named = null;
        if (m && m.system != null) {
          if (!sysById[m.system]) {
            E("R28", at + ".system", 'names system "' + m.system + '", which is not in systems[]');
          } else named = m.system;
        } else if (isStr(m && m.key)) {
          doc.systems.forEach(function (sy) {
            if (m.key.indexOf(sy.id + ".") === 0 && (named == null || sy.id.length > named.length)) {
              named = sy.id;
            }
          });
        }
        if (named == null) {
          E("R28", at + ".system",
            "this document holds " + doc.systems.length + " systems, so every metric states which one it " +
            "measures: give it a system field naming one, or a key prefixed with the system id");
        }
      });
    }

    // R29 - PD is two inventories and ONE handoff (D16). Two systems drawn side
    // by side with no link between them are two pictures, not a machine, and a
    // pd link with both ends inside one system is a handoff to itself.
    var pdLinks = doc.links.filter(function (l) { return l.role === "pd"; });
    pdLinks.forEach(function (l) {
      var a = chipById[l.from], b = chipById[l.to];
      if (a && b && a.system === b.system) {
        E("R29", "links[" + l.id + "].role",
          'a pd handoff runs BETWEEN a prefill system and a decode system (D16); both ends of this one are in "' +
          a.system + '"');
      }
    });
    if (doc.systems.length > 1) {
      var roles = doc.systems.map(function (sy) { return sy.role; });
      if (roles.slice().sort().join(",") !== "decode,prefill") {
        E("R29", "systems[].role",
          "two or more systems in one document is PD disaggregation: exactly one prefill and one decode " +
          "(D16). Found " + JSON.stringify(roles));
      }
      if (pdLinks.length !== 1) {
        E("R29", "links[].role",
          "a PD document carries exactly ONE handoff link (D16); found " + pdLinks.length +
          ". The handoff is the only coupling the two inventories have, so a document without it draws " +
          "two machines that never meet");
      }
    }

    // R22 - hue capacity. A warning: the excess draws as the over-palette hatch,
    // and no hue is ever cycled.
    var keys = hueKeys(doc);
    if (keys.length > HUES.length) {
      W("R22", "tiles[].primary_group",
        keys.length + " distinct (axis, index) groups are co-visible but the validated palette holds " +
        HUES.length + ". " + keys.slice(HUES.length).join(", ") + " draw as the over-palette hatch. Hues are never cycled.");
    }

    // draw budget, stated out loud - and measured in the unit it is stated in
    doc.chips.forEach(function (c) {
      var rects = chipRects(doc, c, true);
      if (rects > DRAW_BUDGET) {
        W("R23", "chips[" + c.id + "].macros",
          ((c.macros || []).length) + " enumerated macros draw " + rects +
          " rects with the duty overlay on, past the phase-1 draw budget of " +
          DRAW_BUDGET + "; this chip is not drawn");
      }
    });

    return { errors: errors, warnings: warnings };
  }

  // ---- the drill/filter view rules (phase 2) --------------------------------
  // Everything here is PURE: it decides what is drawn, never what a number is.
  // A filter changes the picture and never a figure, and the hue map is built
  // from the whole file so a filter can never repaint a group.

  function makeIndex(doc) {
    var ix = {
      chip: byId(doc.chips), macro: byId(doc.macros), tile: byId(doc.tiles),
      link: byId(doc.links), sys: byId(doc.systems), owner: {}
    };
    // owner tuple -> every tile that carries a piece of that ONE weight matrix,
    // wherever it sits. It is what tells a reader whether a matrix composes
    // inside one macro or chains across several (D11).
    (doc.tiles || []).forEach(function (t) {
      var key = ownerKey(t);
      (ix.owner[key] = ix.owner[key] || []).push(t.id);
    });
    return ix;
  }

  function emptyFilter() { return { model: "", layer: "", group: "", pool: "", q: "" }; }
  function filterActive(f) {
    return !!(f && (f.model || f.layer || f.group || f.pool || f.q));
  }

  function layerKey(tile) {
    var o = (tile && tile.owner) || {};
    return o.layer == null ? "endpoint" : String(o.layer);
  }
  // The owner vocabulary a search may match: identities only. Occupancy, duty
  // cycle and every other MEASURED number is deliberately absent - a search that
  // matched digits would let a reader select by a value and read the selection
  // as a fact about it.
  function ownerText(doc, ix, tile) {
    var o = (tile && tile.owner) || {};
    var chip = ix.macro[tile.macro] ? ix.macro[tile.macro].chip : "";
    return [
      tile.id, tile.macro, chip, o.model, o.block,
      o.layer == null ? "endpoint" : "layer " + o.layer,
      o.expert == null ? "" : "expert " + o.expert,
      tile.slice ? "slice " + tile.slice.index + "/" + tile.slice.of : "",
      groupKey(tile) || ""
    ].join(" ").toLowerCase();
  }
  function macroText(doc, ix, macro) {
    return [macro.id, macro.chip, macro.card, macro.reserved || ""].join(" ").toLowerCase();
  }
  function chipText(doc, ix, chip) {
    return [chip.id, chip.label || "", chip.system, chip.pool].join(" ").toLowerCase();
  }

  function tileMatches(doc, ix, tile, f) {
    if (!filterActive(f)) return true;
    var o = (tile && tile.owner) || {};
    if (f.model && o.model !== f.model) return false;
    if (f.layer && layerKey(tile) !== f.layer) return false;
    if (f.group && groupKey(tile) !== f.group) return false;
    if (f.pool) {
      var macro = ix.macro[tile.macro], chip = macro && ix.chip[macro.chip];
      if (!chip || chip.pool !== f.pool) return false;
    }
    if (f.q && ownerText(doc, ix, tile).indexOf(f.q.toLowerCase()) < 0) return false;
    return true;
  }

  function macroMatches(doc, ix, macro, f) {
    if (!filterActive(f)) return true;
    var chip = ix.chip[macro.chip];
    if (f.pool && (!chip || chip.pool !== f.pool)) return false;
    var owned = (macro.tiles || []).map(function (id) { return ix.tile[id]; }).filter(Boolean);
    // An owner filter is about tiles, so a macro holding none can only match on
    // the axes that are its own: its pool and its text. It is still DRAWN either
    // way - a reserved slot is an object, not a gap (D21).
    var ownerish = !!(f.model || f.layer || f.group);
    if (!owned.length) {
      if (ownerish) return false;
      return f.q ? macroText(doc, ix, macro).indexOf(f.q.toLowerCase()) >= 0 : true;
    }
    var hit = owned.some(function (t) { return tileMatches(doc, ix, t, f); });
    if (hit) return true;
    return !!(f.q && !f.model && !f.layer && !f.group &&
      macroText(doc, ix, macro).indexOf(f.q.toLowerCase()) >= 0);
  }

  function chipMatches(doc, ix, chip, f) {
    if (!filterActive(f)) return true;
    if (f.pool && chip.pool !== f.pool) return false;
    var ownerish = !!(f.model || f.layer || f.group);
    if (!ownerish && f.q && chipText(doc, ix, chip).indexOf(f.q.toLowerCase()) >= 0) return true;
    return (chip.macros || []).some(function (mid) {
      var m = ix.macro[mid];
      return m && macroMatches(doc, ix, m, f);
    });
  }

  // The filter controls, built from the file itself so a filter can only ever
  // name something the document contains.
  function filterOptions(doc, ix) {
    var models = {}, layers = {}, pools = {};
    doc.systems.forEach(function (sy) {
      (sy.models || []).forEach(function (m) { if (m && m.id != null) models[m.id] = true; });
    });
    doc.tiles.forEach(function (t) { layers[layerKey(t)] = true; });
    doc.chips.forEach(function (c) { pools[c.pool] = true; });

      if (a === "endpoint") return 1;
      if (b === "endpoint") return -1;
      return (+a) - (+b);
    });
    return {
      models: Object.keys(models).sort(),
      layers: layerList,
      groups: hueKeys(doc),
      pools: Object.keys(pools).sort()
    };
  }

  // ---- duty cycle (P4) ------------------------------------------------------
  // The bar is drawn on the ABSOLUTE 0-1 scale, because a duty cycle is already
  // a fraction of the period and rescaling it to the busiest macro would invent
  // a second reading of the same number. dutyExtreme SELECTS the largest value
  // in the file - it is a lookup, not an accounting - so the legend can say out
  // loud why every bar on a real run is short.
  function dutyExtreme(doc) {
    var best = null;
    (doc.macros || []).forEach(function (m) {
      if (typeof m.duty_cycle === "number" && isFinite(m.duty_cycle)) {
        if (best == null || m.duty_cycle > best.value) best = { id: m.id, value: m.duty_cycle };
      }
    });
    return best;
  }
  function dutyState(macro) {
    if (!macro || macro.duty_cycle == null) return "unknown";
    return macro.duty_cycle > 0 ? "active" : "idle";
  }
  function hasDuty(doc) { return dutyExtreme(doc) != null; }

  // ---- the macro column map (D11) -------------------------------------------
  // Tiles that share ONE owner tuple are one weight matrix carried by several
  // tiles: bit slices of it (D11), or row slabs of a K taller than the macro.
  // They share a bracket. A bracket therefore never spans two owners - that is
  // the whole claim it makes.
  function ownerKey(tile) {
    var o = (tile && tile.owner) || {};
    return [o.model, o.layer == null ? "endpoint" : o.layer, o.block,
            o.expert == null ? "-" : o.expert].join("/");
  }
  function macroTiles(doc, ix, macro) {
    return (macro.tiles || []).map(function (id) { return ix.tile[id]; }).filter(Boolean)
      .sort(function (a, b) { return a.columns.start - b.columns.start; });
  }
  function bracketsFor(doc, ix, macro) {
    var tiles = macroTiles(doc, ix, macro);
    var order = [], groups = {};
    tiles.forEach(function (t) {
      var k = ownerKey(t);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(t);
    });
    var out = [];
    order.forEach(function (k) {
      var list = groups[k];
      var all = ix.owner[k] || list.map(function (t) { return t.id; });
      var elsewhere = {};
      all.forEach(function (id) {
        var t = ix.tile[id];
        if (t && t.macro !== macro.id) elsewhere[t.macro] = true;
      });
      var chained = Object.keys(elsewhere);
      // A matrix that is one tile on one macro needs no bracket: there is
      // nothing it composes with.
      if (list.length < 2 && !chained.length) return;
      var sliced = list.filter(function (t) { return t.slice != null; }).length;
      var o = list[0].owner || {};
      var what = sliced ? "bit slices" : (list.length > 1 ? "column sets" : "pieces");
      out.push({
        key: k,
        kind: sliced ? "slice" : (list.length > 1 ? "row" : "chain"),
        tiles: list.map(function (t) { return t.id; }),
        of: all.length,
        chained: chained.sort(),
        start: Math.min.apply(null, list.map(function (t) { return t.columns.start; })),
        end: Math.max.apply(null, list.map(function (t) { return t.columns.start + t.columns.count; })),
        label: list.length + " of " + all.length + " " + what + " of " +
          (o.layer == null ? "" : "layer " + o.layer + " ") + o.block +
          (o.expert == null ? "" : " expert " + o.expert) +
          (chained.length ? " \u00b7 chains across " + chained.length + " more macro" +
            (chained.length === 1 ? "" : "s") : "")
      });
    });
    return out;
  }

  // ---- containment, for breadcrumbs -----------------------------------------
  function crumbs(doc, ix, view, chipId, macroId) {
    var out = [{ level: "package", id: null, label: "Package" }];
    var macro = view === "macro" ? ix.macro[macroId] : null;
    var chip = ix.chip[macro ? macro.chip : chipId];
    if (chip && (view === "chip" || view === "macro")) {
      var sys = ix.sys[chip.system];
      out.push({ level: "chip", id: chip.id, label: chip.id, note: sys ? sys.role : "" });
    }
    if (macro) out.push({ level: "macro", id: macro.id, label: macro.id });
    return out;
  }

  // The stated draw budget, applied. Above it only the opened chip is drawn -
  // and a chip that alone is past the budget is not drawn either, and says so.
  //
  // WAVE C AUDIT. The budget is stated in RECTS, so it is now COUNTED in rects.
  // It used to be enforced against capacity.macro_slots, which undercounts by
  // ~5x on every shipped document (a 640-slot chip emits ~3,160 rects), so a
  // chip declaring 9,999 slots was admitted and drew ~50,000. These three
  // counters mirror what drawPackage / drawChip / drawMacro actually emit;
  // CHANGE A DRAWER, CHANGE ITS COUNTER - they sit next to the drawers'
  // rect-per-object comments for exactly that reason.
  function packageRects(doc) {
    // drawPackage: one lane box per system when there is more than one, one
    // pool box per (lane, pool) that holds chips, and 3 rects per chip (body,
    // inner outline, label plate).
    var pools = {};
    doc.chips.forEach(function (c) { pools[c.system + "/" + c.pool] = true; });
    var lanes = doc.systems.length > 1 ? doc.systems.length : 0;
    return lanes + Object.keys(pools).length + doc.chips.length * 3;
  }
  function chipRects(doc, chip, duty) {
    // drawChip, per macro: the macro rect, plus two duty rects when the
    // overlay is on, plus - when the macro holds tiles - the column-strip base
    // and one band per resident tile.
    var ids = (chip && chip.macros) || [];
    if (!ids.length) return 0;
    var by = byId(doc.macros || []);
    var total = ids.length * (1 + (duty ? 2 : 0));
    for (var i = 0; i < ids.length; i++) {
      var m = by[ids[i]];
      var held = (m && m.tiles) ? m.tiles.length : 0;
      if (held) total += 1 + held;
    }
    return total;
  }
  function macroRects(macro, duty) {
    // drawMacro: the full-width track, one band per resident tile, and the two
    // duty rects when the overlay is on. Brackets and the axis are paths and
    // text, not rects.
    return 1 + ((macro && macro.tiles) || []).length + (duty ? 2 : 0);
  }
  function chipDrawable(doc, chip) {
    // Judged with the duty overlay ON: the overlay is the reader's own toggle,
    // so the budget has to hold in the worst case the reader can ask for.
    return chipRects(doc, chip, true) <= DRAW_BUDGET;
  }
  function drawnRects(doc, view, chip, macro, duty) {
    if (view === "package") return packageRects(doc);
    if (view === "chip") return chipRects(doc, chip, !!duty);
    return macroRects(macro, !!duty);
  }

  // Systems are lanes in the package view; two of them is the PD picture (D16).
  function systemLanes(doc) {
    return doc.systems.map(function (sy) {
      return {
        system: sy,
        chips: doc.chips.filter(function (c) { return c.system === sy.id; })
      };
    });
  }
  function crossSystemLinks(doc, ix) {
    return doc.links.filter(function (l) {
      var a = ix.chip[l.from], b = ix.chip[l.to];
      return a && b && a.system !== b.system;
    });
  }
  // Which system a metric measures (R28 guarantees the answer exists whenever
  // the document holds more than one).
  function metricSystem(doc, metric) {
    if (!metric) return null;
    if (metric.system != null) return metric.system;
    var named = null;
    if (isStr(metric.key)) {
      doc.systems.forEach(function (sy) {
        if (metric.key.indexOf(sy.id + ".") === 0 && (named == null || sy.id.length > named.length)) {
          named = sy.id;
        }
      });
    }
    return named;
  }

  // ---- self-test: corrupt a copy once per rule, assert the refusal fires -----
  function clone(d) { return JSON.parse(JSON.stringify(d)); }
  function firstMacroWith(d, n) {
    for (var i = 0; i < d.macros.length; i++) if ((d.macros[i].tiles || []).length >= n) return d.macros[i];
    return d.macros[0];
  }
  function firstReserved(d) {
    for (var i = 0; i < d.macros.length; i++) if (!(d.macros[i].tiles || []).length) return d.macros[i];
    return null;
  }
  function firstChipWithTiles(d) {
    var mById = byId(d.macros);
    for (var i = 0; i < d.chips.length; i++) {
      var c = d.chips[i];
      for (var j = 0; j < (c.macros || []).length; j++) {
        var m = mById[c.macros[j]];
        if (m && (m.tiles || []).length) return c;
      }
    }
    return null;
  }
  function retag(d, chipId, axis, idx) {
    var c = null, i;
    for (i = 0; i < d.chips.length; i++) if (d.chips[i].id === chipId) c = d.chips[i];
    if (!c) return;
    c.groups[axis] = idx; c.primary_group = axis;
    var mset = {}; (c.macros || []).forEach(function (m) { mset[m] = true; });
    d.macros.forEach(function (m) {
      if (!mset[m.id]) return;
      (m.tiles || []).forEach(function (tid) {
        d.tiles.forEach(function (t) { if (t.id === tid) { t.groups[axis] = idx; t.primary_group = axis; } });
      });
    });
  }

  // A corruption that cannot be BUILT on a document proves nothing about it.
  // These predicates say what each case needs, so a document that cannot host
  // it is reported as "not constructible" instead of throwing on a [0] index of
  // an empty table. ViT places no inter-chip link at all, and the two link
  // cases used to take down the whole page on it.
  function has(table, n) {
    return function (d) { return ((d && d[table]) || []).length >= (n || 1); };
  }
  function hasCards(d) { return Object.keys((d && d.cards) || {}).length > 0; }
  function hasHeldMacro(n) {
    return function (d) {
      return ((d && d.macros) || []).some(function (m) { return (m.tiles || []).length >= n; });
    };
  }
  function hasReserved(d) { return firstReserved(d) != null; }
  function hasChipWithTiles(d) { return firstChipWithTiles(d) != null; }
  function hasChipMacro(d) {
    return ((d && d.chips) || []).some(function (c) { return (c.macros || []).length > 0; });
  }

  var CORRUPTIONS = [
    { rule: "R1", what: "schema id is not fws_atlas/1", expect: "^schema$", mutate: function (d) { d.schema = "fws_atlas/2"; } },
    { rule: "R2", what: "chip names a system that does not exist", expect: "\\.system$", needs: has("chips"), mutate: function (d) { d.chips[0].system = "sys.ghost"; } },
    { rule: "R3", what: "macro names a chip that does not exist", expect: "^macros\\[.*\\]\\.chip$", needs: has("macros"), mutate: function (d) { d.macros[0].chip = "chip.ghost"; } },
    { rule: "R4", what: "chip lists a macro that does not exist", expect: "^chips\\[.*\\]\\.macros$", needs: hasChipMacro, mutate: function (d) { d.chips[0].macros[0] = "mac.ghost"; } },
    { rule: "R5", what: "macro lists a tile that does not exist", expect: "\\.tiles$", needs: hasHeldMacro(1), mutate: function (d) { firstMacroWith(d, 1).tiles[0] = "tile.ghost"; } },
    { rule: "R6", what: "link names a chip that does not exist", expect: "^links\\[.*\\]\\.from$", needs: has("links"), mutate: function (d) { d.links[0].from = "chip.ghost"; } },
    { rule: "R7", what: "macro names a device card that does not exist", expect: "\\.card$", needs: has("macros"), mutate: function (d) { d.macros[0].card = "card.ghost"; } },
    { rule: "R8", what: "slot count disagrees with the enumerated macros", expect: "macro_slots$", needs: has("chips"), mutate: function (d) { d.chips[0].capacity.macro_slots = d.chips[0].macros.length + 1; } },
    { rule: "R9", what: "a chip count arrives as a quotient", expect: "layers_per_chip$", needs: has("systems"), mutate: function (d) { d.systems[0].layers_per_chip = 5.3333; } },
    { rule: "R10", what: "a macro holds no tiles and names no reservation", expect: "\\.reserved$", needs: hasReserved, mutate: function (d) { var m = firstReserved(d); if (m) m.reserved = null; } },
    { rule: "R11", what: "a tile owner names a block the model does not have", expect: "owner\\.block$", needs: has("tiles"), mutate: function (d) { d.tiles[0].owner.block = "mystery_proj"; } },
    { rule: "R12", what: "a tile's columns run past the macro's capacity", expect: "^tiles\\[.*\\]\\.columns$", needs: has("tiles"), mutate: function (d) { d.tiles[0].columns.start = 4000000; } },
    { rule: "R13", what: "two tiles overlap on one macro", expect: "^tiles\\[.*\\]\\.columns$",
      needs: function (d) { return d.macros.some(function (m) { return (m.tiles || []).length >= 2; }); },
      mutate: function (d) { var m = firstMacroWith(d, 2), a = null, b = null; d.tiles.forEach(function (t) { if (t.macro === m.id) { if (!a) a = t; else if (!b) b = t; } }); if (b) b.columns.start = a.columns.start; } },
    { rule: "R14", what: "shape.N disagrees with the column span", expect: "shape\\.N$", needs: has("tiles"), mutate: function (d) { d.tiles[0].shape.N = d.tiles[0].shape.N + 7; } },
    { rule: "R15", what: "shape.K exceeds the macro's rows", expect: "shape\\.K$", needs: has("tiles"), mutate: function (d) { d.tiles[0].shape.K = 999999; } },
    { rule: "R16", what: "declared macro occupancy disagrees with its spans", expect: "^macros\\[.*\\]\\.occupancy$", needs: hasHeldMacro(1), mutate: function (d) { firstMacroWith(d, 1).occupancy = 0.123; } },
    { rule: "R17", what: "declared chip occupancy disagrees with its macros", expect: "^chips\\[.*\\]\\.occupancy$", needs: has("chips"), mutate: function (d) { d.chips[0].occupancy = 0.123; } },
    { rule: "R18", what: "two figures for one metric, one unlabeled", expect: "^metrics\\[.*\\]\\.label$", needs: has("metrics"), mutate: function (d) { var m = clone(d.metrics[0]); m.label = ""; d.metrics.push(m); } },
    { rule: "R18", what: "two figures for one metric share a label", expect: "^metrics\\[.*\\]\\.label$", needs: has("metrics"), mutate: function (d) { d.metrics.push(clone(d.metrics[0])); } },
    { rule: "R19", what: "a relaxation is disclosed without a reason", expect: "^relaxations\\[.*\\]\\.reason$", needs: has("relaxations"), mutate: function (d) { d.relaxations[0].reason = ""; } },
    { rule: "R20", what: "primary_group names no parallelism axis", expect: "primary_group$", needs: has("tiles"), mutate: function (d) { d.tiles[0].primary_group = "zz"; } },
    { rule: "R21", what: "a chip claims a group its own tiles contradict", expect: "^chips\\[.*\\]\\.groups\\.", needs: hasChipWithTiles, mutate: function (d) { var c = firstChipWithTiles(d); if (c) c.groups[c.primary_group] = 9; } },
    { rule: "R1", what: "the document carries no provenance", expect: "^provenance$", mutate: function (d) { delete d.provenance; } },
    { rule: "R6", what: "a link carries bytes with no basis", expect: "^links\\[.*\\]\\.basis$", needs: has("links"), mutate: function (d) { d.links[0].basis = ""; } },
    { rule: "R9", what: "a placement row carries a per-chip quotient", expect: "^macros\\[.*\\]\\.arrays_per_chip$", needs: has("macros"), mutate: function (d) { d.macros[0].arrays_per_chip = 3.7; } },
    { rule: "R18", what: "a metric value is not a number", expect: "^metrics\\[.*\\]\\.value$", needs: has("metrics"), mutate: function (d) { d.metrics[0].value = "lots"; } },
    { rule: "R24", what: "stored columns disagree with cols_adc x mux", expect: "capacity\\.stored_cols$", needs: hasCards, mutate: function (d) { var k = Object.keys(d.cards)[0]; d.cards[k].capacity.stored_cols = d.cards[k].capacity.stored_cols + 1; } },
    { rule: "R24", what: "a card declares slicing its bit width contradicts", expect: "^cards\\..*\\.slicing$", needs: hasCards, mutate: function (d) { d.cards[Object.keys(d.cards)[0]].slicing = true; } },
    { rule: "R25", what: "a tile claims a slice role on a card that does not slice", expect: "^tiles\\[.*\\]\\.slice$", needs: has("tiles"), mutate: function (d) { d.tiles[0].slice = { index: 9, of: 2, bits: 4 }; } },

      else if (i === 1) body = '<path d="M0 8 L8 0" stroke="var(--ink)" stroke-width="' + w(1.5) + '" stroke-opacity=".5"/>';
      else if (i === 2) body = '<path d="M0 0 L8 8" stroke="var(--ink)" stroke-width="' + w(1.5) + '" stroke-opacity=".5"/>';
      else if (i === 3) body = '<circle cx="4" cy="4" r="' + w(1.5) + '" fill="var(--ink)" fill-opacity=".45"/>';
      else if (i === 4) body = '<path d="M0 4 L8 4" stroke="var(--ink)" stroke-width="' + w(1.5) + '" stroke-opacity=".5"/>';
      else if (i === 5) body = '<path d="M4 0 L4 8" stroke="var(--ink)" stroke-width="' + w(1.5) + '" stroke-opacity=".5"/>';
      else if (i === 6) body = '<path d="M0 8 L8 0 M0 0 L8 8" stroke="var(--ink)" stroke-width="' + w(1.2) + '" stroke-opacity=".45"/>';
      else if (i === 7) body = '<rect width="4" height="4" fill="var(--ink)" fill-opacity=".35"/><rect x="4" y="4" width="4" height="4" fill="var(--ink)" fill-opacity=".35"/>';
      else if (i === 8) body = '<path d="M0 2 L8 2 M0 6 L8 6" stroke="var(--ink)" stroke-width="' + w(1) + '" stroke-opacity=".45"/>';
      else if (i === 9) body = '<path d="M2 0 L2 8 M6 0 L6 8" stroke="var(--ink)" stroke-width="' + w(1) + '" stroke-opacity=".45"/>';
      else if (i === 10) body = '<circle cx="2" cy="2" r="' + w(1) + '" fill="var(--ink)" fill-opacity=".4"/><circle cx="6" cy="6" r="' + w(1) + '" fill="var(--ink)" fill-opacity=".4"/>';
      else body = '<path d="M0 8 L4 4 L8 8" fill="none" stroke="var(--ink)" stroke-width="' + w(1.2) + '" stroke-opacity=".45"/>';
      out.push('<pattern id="hx' + sfx + i + '" width="8" height="8" patternUnits="userSpaceOnUse"' + tf + ">" + body + "</pattern>");
    }
    return "<defs>" + out.join("") + "</defs>";
  }
  // Past the palette a block gets NO hatch rather than a borrowed one: two
  // weight matrices drawn identically is a legend that lies about the picture.
  function hatchFor(block, sfx) {
    var i = blockIndex(block);
    return (i == null || i >= HATCH) ? null : "url(#hx" + (sfx || "") + i + ")";
  }

  // Package view: one LANE per system (two of them is the PD picture, D16),
  // chips clustered by pool inside it, links weighted by bytes.
  function drawPackage() {
    var d = S.doc;
    var CW = 158, CH = 106, GAP = 18, PAD = 14, HEADER = 22, LANE_HEAD = 34, LANE_GAP = 54;
    var lanes = A.systemLanes(d);
    var boxes = [], laneBoxes = [], pos = {}, x = PAD, maxH = 0;
    lanes.forEach(function (lane) {
      var laneX = x, laneW = 0, laneH = 0;
      ["analog", "digital"].forEach(function (p) {
        var list = lane.chips.filter(function (c) { return c.pool === p; });
        if (!list.length) return;
        var cols = Math.min(4, Math.ceil(Math.sqrt(list.length)));
        var rows = Math.ceil(list.length / cols);
        var bw = cols * CW + (cols - 1) * GAP + 2 * PAD;
        var bh = rows * CH + (rows - 1) * GAP + 2 * PAD + HEADER;
        boxes.push({ pool: p, x: x, y: LANE_HEAD, w: bw, h: bh, n: list.length });
        list.forEach(function (c, i) {
          var r = Math.floor(i / cols), q = i % cols;
          pos[c.id] = {
            x: x + PAD + q * (CW + GAP),
            y: LANE_HEAD + PAD + HEADER + r * (CH + GAP), w: CW, h: CH
          };
        });
        x += bw + 30;
        laneW += bw + 30;
        laneH = Math.max(laneH, bh);
      });
      laneW = Math.max(0, laneW - 30);
      laneBoxes.push({ lane: lane, x: laneX, w: laneW, h: laneH + LANE_HEAD });
      maxH = Math.max(maxH, laneH + LANE_HEAD);
      x += LANE_GAP;
    });
    var W = x - LANE_GAP + PAD, H = maxH + PAD;

    var maxBytes = Math.max.apply(null, d.links.map(function (l) { return l.bytes || 0; }).concat([1]));
    var s = [];
    s.push(svgDefs());
    // the lane frame: only drawn when the document holds more than one system,
    // because a single system IS the package and a frame around it says nothing
    if (laneBoxes.length > 1) {
      laneBoxes.forEach(function (b) {
        var sy = b.lane.system;
        s.push('<rect x="' + (b.x - 8) + '" y="0" width="' + (b.w + 16) + '" height="' + (b.h + 8) +
          '" rx="9" fill="var(--card)" stroke="var(--line)"/>');
        s.push('<text class="ui" x="' + b.x + '" y="15" font-size="11.5" font-weight="700" fill="var(--ink)">' +
          esc(sy.role.toUpperCase() + " SYSTEM") + "</text>");
        s.push('<text class="ui" x="' + b.x + '" y="28" font-size="10.5" fill="var(--muted)">' +
          esc(sy.id + " · " + (sy.label || "") + " · phase " + sy.phase + " · " +
            A.AXES.map(function (a) { return a + " " + ((sy.parallelism || {})[a]); }).join("/")) + "</text>");
      });
    }
    boxes.forEach(function (b) {
      s.push('<rect x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h +
        '" rx="7" fill="none" stroke="var(--line)"/>');
      s.push('<text class="ui" x="' + (b.x + PAD) + '" y="' + (b.y + 16) + '" font-size="10.5" letter-spacing="1.4" fill="var(--faint)">' +
        esc(b.pool.toUpperCase()) + " POOL &middot; " + b.n + " CHIPS</text>");
    });

    // links behind the chips, with a paper halo so crossings stay readable
    d.links.forEach(function (l) {
      var a = pos[l.from], b = pos[l.to];
      if (!a || !b) return;
      var x1 = a.x + a.w / 2, y1 = a.y + a.h / 2, x2 = b.x + b.w / 2, y2 = b.y + b.h / 2;
      var w = 1.2 + 5.2 * Math.sqrt((l.bytes || 0) / maxBytes);
      s.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
        '" stroke="' + A.PAPER + '" stroke-width="' + (w + 3.5) + '" stroke-linecap="round"/>');
      s.push('<line class="hit" data-link="' + esc(l.id) + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
        '" stroke="' + (l.role === "pd" ? "#1c2a33" : "#4a5c68") + '" stroke-width="' + w +
        '" stroke-linecap="round" stroke-dasharray="' + roleDash(l.role) +
        '" style="cursor:pointer"><title>' + esc(l.role + " · " + A.fmtBytes(l.bytes) + " per " + (l.per || "")) + "</title></line>");
      if (l.role === "pd") {
        s.push('<text class="ui" x="' + ((x1 + x2) / 2) + '" y="' + ((y1 + y2) / 2 - 7) +
          '" text-anchor="middle" font-size="10.5" fill="var(--ink)">handoff ' +
          esc(A.fmtBytes(l.bytes).split(" (")[0]) + " / " + esc(l.per || "") + "</text>");
      }
    });

    d.chips.forEach(function (c) {
      var p = pos[c.id]; if (!p) return;
      var hue = hueOf(c);
      var fill = hue == null ? "url(#p-over)" : A.ramp(hue, c.occupancy);
      var stroke = hue == null ? A.MUTED : hue;
      var dim = !A.chipMatches(d, S.ix, c, S.filter);
      s.push('<g data-chip="' + esc(c.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h +
        '" rx="5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.4"' + poolDash(c.pool) + "/>");
      // the identity plate: the fill carries occupancy, so the label gets its own ground
      s.push('<rect x="' + (p.x + 1.5) + '" y="' + (p.y + 1.5) + '" width="' + (p.w - 3) +
        '" height="40" rx="4" fill="' + A.PAPER + '" opacity="0.9"/>');
      s.push('<text class="mono" x="' + (p.x + 9) + '" y="' + (p.y + 19) + '" font-size="11" fill="var(--ink)">' + esc(c.id) + "</text>");
      s.push('<text class="ui" x="' + (p.x + 9) + '" y="' + (p.y + 34) + '" font-size="10.5" fill="var(--muted)">' +
        esc(c.primary_group + " " + (c.groups ? c.groups[c.primary_group] : "?")) + " &middot; " +
        (c.capacity ? c.capacity.macro_slots : "?") + " slots &middot; " + c.pool + "</text>");
      // the fill already is the occupancy; the number rides on its own pill so it
      // stays readable at every step of the ramp
      s.push('<rect x="' + (p.x + 6) + '" y="' + (p.y + p.h - 22) + '" width="102" height="16" rx="8" fill="' + A.PAPER + '" opacity="0.9"/>');
      s.push('<text class="ui" x="' + (p.x + 14) + '" y="' + (p.y + p.h - 10) + '" font-size="10.5" fill="var(--muted)">slots used ' + esc(A.pct(c.occupancy)) + "</text>");
      s.push("<title>" + esc(c.id + " — " + (c.label || "")) + "</title></g>");
    });

    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // Chip view: the macro grid, ordered by id.
  function drawChip() {
    var d = S.doc;
    var chip = S.ix.chip[S.chip];
    if (!chip) return '<p class="ui">No chip selected.</p>';
    if (!A.chipDrawable(d, chip)) {
      return '<p class="ui">' + esc(chip.id) + " lists " + ((chip.macros || []).length) +
        " macros, which draw " + A.chipRects(d, chip, true) +
        " rects with the duty overlay on, past the draw budget of " + A.DRAW_BUDGET +
        " rects. Not drawn.</p>";
    }
    var ids = (chip.macros || []).slice().sort();
    var n = ids.length;
    var cols = Math.max(1, Math.min(16, Math.ceil(Math.sqrt(n * 1.35))));
    var rows = Math.ceil(n / cols);
    var CW = 46, GAP = 6, PAD = 12, HEADER = 30;
    var W = cols * CW + (cols - 1) * GAP + 2 * PAD;
    var H = rows * CW + (rows - 1) * GAP + 2 * PAD + HEADER;
    var sys = S.ix.sys[chip.system];
    var s = [svgDefs()];
    s.push('<text class="mono" x="' + PAD + '" y="16" font-size="11.5" fill="var(--ink)">' + esc(chip.id) + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="30" font-size="10.5" fill="var(--muted)">' +
      esc((chip.label || "") + " · " + chip.pool + " pool · " + n + " slots · slots used " + A.pct(chip.occupancy) +
        (sys ? " · " + sys.role + " system" : "")) + "</text>");

    ids.forEach(function (mid, i) {
      var m = S.ix.macro[mid];
      var r = Math.floor(i / cols), q = i % cols;
      var x = PAD + q * (CW + GAP), y = PAD + HEADER + r * (CW + GAP);
      if (!m) {
        s.push('<rect x="' + x + '" y="' + y + '" width="' + CW + '" height="' + CW + '" rx="3" fill="url(#p-unk)" stroke="' + A.MUTED + '"/>');
        return;
      }
      var tiles = A.macroTiles(d, S.ix, m);
      var lead = tiles.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; })[0];
      var hue = lead ? hueOf(lead) : hueOf(chip);
      var reserved = !tiles.length;
      var fill = A.fillFor(d, S.ix, m, hue);
      var stroke = reserved ? "#c2ced5" : (hue == null ? A.MUTED : hue);
      var dim = !A.macroMatches(d, S.ix, m, S.filter);
      s.push('<g data-macro="' + esc(m.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + x + '" y="' + y + '" width="' + CW + '" height="' + CW + '" rx="3" fill="' + fill +
        '" stroke="' + stroke + '" stroke-width="1.2"' + poolDash(chip.pool) + "/>");
      // the DUTY CHANNEL: its own bar on its own edge, in its own neutral ink,
      // on the absolute 0-1 scale. It never touches the occupancy fill and it
      // never becomes a hue (P5's encoding law).
      if (S.duty) s.push(dutyBar(m, x + 4, y + 4, CW - 8));
      // the column strip: position is the column offset inside the macro
      var cap = A.capacityOf(d, m);
      if (cap && cap.stored_cols && tiles.length) {
        var sx = x + 4, sw = CW - 8, sy2 = y + CW - 9;
        s.push('<rect x="' + sx + '" y="' + sy2 + '" width="' + sw + '" height="5" rx="1" fill="var(--card)" opacity="0.75"/>');
        tiles.forEach(function (t) {
          var th = hueOf(t);
          var a = sx + (t.columns.start / cap.stored_cols) * sw;
          var w = Math.max(1, (t.columns.count / cap.stored_cols) * sw);
          s.push('<rect x="' + a + '" y="' + sy2 + '" width="' + w + '" height="5" rx="1" fill="' + (th || "#8497a2") + '"/>');
        });
      }
      s.push("<title>" + esc(m.id + (reserved ? " — reserved" : " — occupancy " + A.pct(m.occupancy) + ", " + tiles.length + " tile(s)") +
        (S.duty ? " · duty " + (m.duty_cycle == null ? "unknown" : A.pct(m.duty_cycle)) : "")) + "</title>");
      s.push("</g>");
    });
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // One macro's duty cycle, drawn on the absolute 0-1 scale. A file that
  // declares none draws the unknown hatch: an absent measurement is not zero.
  function dutyBar(m, x, y, w) {
    var out = ['<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="1" fill="var(--card)" opacity="0.85" stroke="var(--line)" stroke-width="0.5"/>'];
    if (m.duty_cycle == null) {
      out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="1" fill="url(#p-unk)"/>');
      return out.join("");
    }
    var t = Math.max(0, Math.min(1, m.duty_cycle));
    if (t > 0) {
      out.push('<rect x="' + x + '" y="' + y + '" width="' + Math.max(A.BAND_FLOOR_PX, t * w) +
        '" height="4" rx="1" fill="' + A.DUTY_INK + '"/>');
    }
    return out.join("");
  }

  // Macro view: the column map. One band per resident tile, positioned at its
  // own column offset; tiles that carry ONE weight matrix share a bracket (D11).
  function drawMacro() {
    var d = S.doc;
    var m = S.ix.macro[S.macro];
    if (!m) return '<p class="ui">No macro selected. Open a chip and click a macro.</p>';
    var cap = A.capacityOf(d, m) || {};
    var stored = cap.stored_cols || 1;
    var tiles = A.macroTiles(d, S.ix, m);
    var brackets = A.bracketsFor(d, S.ix, m);
    var PAD = 14, W = 900, TRACK = 58, LANE = 24;
    var lanes = brackets.length;
    // an empty macro spends its bracket lane on the reservation line instead
    var top = 46 + lanes * LANE + (tiles.length ? 0 : 14);
    var H = top + TRACK + 74;
    var x0 = PAD, w0 = W - 2 * PAD;
    function px(col) { return x0 + (col / stored) * w0; }
    var s = [svgDefs()];
    s.push('<text class="mono" x="' + PAD + '" y="16" font-size="11.5" fill="var(--ink)">' + esc(m.id) + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="30" font-size="10.5" fill="var(--muted)">' +
      esc("on " + m.chip + " · card " + m.card + " · " + cap.rows + " rows × " + stored +
        " stored columns · occupancy " + A.pct(m.occupancy) +
        " · duty " + (m.duty_cycle == null ? "unknown" : A.fmt(m.duty_cycle))) + "</text>");

    // brackets, one lane each, above the track. The label sits above its own
    // bracket and is clamped into the box: a caption that runs off the edge is
    // a caption the reader does not get.
    brackets.forEach(function (b, i) {
      var lane = 40 + i * LANE;
      var y = lane + 11;
      var a = px(b.start), z = px(b.end);
      s.push('<path d="M' + a + " " + (y + 9) + "V" + y + "H" + z + "V" + (y + 9) +
        '" fill="none" stroke="' + (b.kind === "slice" ? "#1c2a33" : "#8497a2") +
        '" stroke-width="' + (b.kind === "slice" ? 1.5 : 1) + '"/>');
      var est = b.label.length * 5.1;
      var lx = Math.max(PAD, Math.min(a, W - PAD - est));
      s.push('<text class="ui" x="' + lx + '" y="' + (lane + 7) + '" font-size="10" fill="var(--muted)">' +
        esc(b.label) + "</text>");
    });

    // A macro with no tiles is still a drawn object with a NAMED owner (D21):
    // the column map is empty and the reservation says why.
    if (!tiles.length) {
      s.push('<text class="ui" x="' + PAD + '" y="' + (top - 8) + '" font-size="10.5" fill="var(--muted)">' +
        esc("no tiles — reserved: " + (m.reserved || "(unnamed)")) + "</text>");
    }
    // the track: every stored column of the macro, whether or not a tile holds it
    s.push('<rect x="' + x0 + '" y="' + top + '" width="' + w0 + '" height="' + TRACK +
