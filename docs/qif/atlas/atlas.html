      var a = pos[l.from], b = pos[l.to];
      if (!a || !b) return;
      var x1 = a.x + a.w / 2, y1 = a.y + a.h / 2, x2 = b.x + b.w / 2, y2 = b.y + b.h / 2;
      var w = 1.2 + 5.2 * Math.sqrt((l.bytes || 0) / maxBytes);
      s.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
        '" stroke="' + A.PAPER + '" stroke-width="' + (w + 3.5) + '" stroke-linecap="round"/>');
      s.push('<line class="hit" data-link="' + esc(l.id) + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
        '" stroke="' + (l.role === "pd" ? "#1c2a33" : "#4a5c68") + '" stroke-width="' + w +
        '" stroke-linecap="round" stroke-dasharray="' + roleDash(l.role) +
        '" style="cursor:pointer"><title>' + esc(l.role + " · " + A.fmtBytes(l.bytes) + " per " + (l.per || "")) + "</title></line>");
      if (l.role === "pd") {
        s.push('<text class="ui" x="' + ((x1 + x2) / 2) + '" y="' + ((y1 + y2) / 2 - 7) +
          '" text-anchor="middle" font-size="10.5" fill="#1c2a33">handoff ' +
          esc(A.fmtBytes(l.bytes).split(" (")[0]) + " / " + esc(l.per || "") + "</text>");
      }
    });

    d.chips.forEach(function (c) {
      var p = pos[c.id]; if (!p) return;
      var hue = hueOf(c);
      var fill = hue == null ? "url(#p-over)" : A.ramp(hue, c.occupancy);
      var stroke = hue == null ? A.MUTED : hue;
      var dim = !A.chipMatches(d, S.ix, c, S.filter);
      s.push('<g data-chip="' + esc(c.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h +
        '" rx="5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.4"' + poolDash(c.pool) + "/>");
      // the identity plate: the fill carries occupancy, so the label gets its own ground
      s.push('<rect x="' + (p.x + 1.5) + '" y="' + (p.y + 1.5) + '" width="' + (p.w - 3) +
        '" height="40" rx="4" fill="' + A.PAPER + '" opacity="0.9"/>');
      s.push('<text class="mono" x="' + (p.x + 9) + '" y="' + (p.y + 19) + '" font-size="11" fill="#1c2a33">' + esc(c.id) + "</text>");
      s.push('<text class="ui" x="' + (p.x + 9) + '" y="' + (p.y + 34) + '" font-size="10.5" fill="#5f7280">' +
        esc(c.primary_group + " " + (c.groups ? c.groups[c.primary_group] : "?")) + " &middot; " +
        (c.capacity ? c.capacity.macro_slots : "?") + " slots &middot; " + c.pool + "</text>");
      // the fill already is the occupancy; the number rides on its own pill so it
      // stays readable at every step of the ramp
      s.push('<rect x="' + (p.x + 6) + '" y="' + (p.y + p.h - 22) + '" width="102" height="16" rx="8" fill="' + A.PAPER + '" opacity="0.9"/>');
      s.push('<text class="ui" x="' + (p.x + 14) + '" y="' + (p.y + p.h - 10) + '" font-size="10.5" fill="#5f7280">occupancy ' + esc(A.pct(c.occupancy)) + "</text>");
      s.push("<title>" + esc(c.id + " — " + (c.label || "")) + "</title></g>");
    });

    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // Chip view: the macro grid, ordered by id.
  function drawChip() {
    var d = S.doc;
    var chip = S.ix.chip[S.chip];
    if (!chip) return '<p class="ui">No chip selected.</p>';
    if (!A.chipDrawable(d, chip)) {
      return '<p class="ui">' + esc(chip.id) + " declares " +
        ((chip.capacity && chip.capacity.macro_slots) || 0) +
        " slots, past the draw budget of " + A.DRAW_BUDGET + " rects. Not drawn.</p>";
    }
    var ids = (chip.macros || []).slice().sort();
    var n = ids.length;
    var cols = Math.max(1, Math.min(16, Math.ceil(Math.sqrt(n * 1.35))));
    var rows = Math.ceil(n / cols);
    var CW = 46, GAP = 6, PAD = 12, HEADER = 30;
    var W = cols * CW + (cols - 1) * GAP + 2 * PAD;
    var H = rows * CW + (rows - 1) * GAP + 2 * PAD + HEADER;
    var sys = S.ix.sys[chip.system];
    var s = [svgDefs()];
    s.push('<text class="mono" x="' + PAD + '" y="16" font-size="11.5" fill="#1c2a33">' + esc(chip.id) + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="30" font-size="10.5" fill="#5f7280">' +
      esc((chip.label || "") + " · " + chip.pool + " pool · " + n + " slots · occupancy " + A.pct(chip.occupancy) +
        (sys ? " · " + sys.role + " system" : "")) + "</text>");

    ids.forEach(function (mid, i) {
      var m = S.ix.macro[mid];
      var r = Math.floor(i / cols), q = i % cols;
      var x = PAD + q * (CW + GAP), y = PAD + HEADER + r * (CW + GAP);
      if (!m) {
        s.push('<rect x="' + x + '" y="' + y + '" width="' + CW + '" height="' + CW + '" rx="3" fill="url(#p-unk)" stroke="' + A.MUTED + '"/>');
        return;
      }
      var tiles = A.macroTiles(d, S.ix, m);
      var lead = tiles.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; })[0];
      var hue = lead ? hueOf(lead) : hueOf(chip);
      var reserved = !tiles.length;
      var fill = A.fillFor(d, S.ix, m, hue);
      var stroke = reserved ? "#c2ced5" : (hue == null ? A.MUTED : hue);
      var dim = !A.macroMatches(d, S.ix, m, S.filter);
      s.push('<g data-macro="' + esc(m.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + x + '" y="' + y + '" width="' + CW + '" height="' + CW + '" rx="3" fill="' + fill +
        '" stroke="' + stroke + '" stroke-width="1.2"' + poolDash(chip.pool) + "/>");
      // the DUTY CHANNEL: its own bar on its own edge, in its own neutral ink,
      // on the absolute 0-1 scale. It never touches the occupancy fill and it
      // never becomes a hue (P5's encoding law).
      if (S.duty) s.push(dutyBar(m, x + 4, y + 4, CW - 8));
      // the column strip: position is the column offset inside the macro
      var cap = A.capacityOf(d, m);
      if (cap && cap.stored_cols && tiles.length) {
        var sx = x + 4, sw = CW - 8, sy2 = y + CW - 9;
        s.push('<rect x="' + sx + '" y="' + sy2 + '" width="' + sw + '" height="5" rx="1" fill="#ffffff" opacity="0.75"/>');
        tiles.forEach(function (t) {
          var th = hueOf(t);
          var a = sx + (t.columns.start / cap.stored_cols) * sw;
          var w = Math.max(1, (t.columns.count / cap.stored_cols) * sw);
          s.push('<rect x="' + a + '" y="' + sy2 + '" width="' + w + '" height="5" rx="1" fill="' + (th || "#8497a2") + '"/>');
        });
      }
      s.push("<title>" + esc(m.id + (reserved ? " — reserved" : " — occupancy " + A.pct(m.occupancy) + ", " + tiles.length + " tile(s)") +
        (S.duty ? " · duty " + (m.duty_cycle == null ? "unknown" : A.pct(m.duty_cycle)) : "")) + "</title>");
      s.push("</g>");
    });
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // One macro's duty cycle, drawn on the absolute 0-1 scale. A file that
  // declares none draws the unknown hatch: an absent measurement is not zero.
  function dutyBar(m, x, y, w) {
    var out = ['<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="1" fill="#ffffff" opacity="0.85" stroke="#d5dfe4" stroke-width="0.5"/>'];
    if (m.duty_cycle == null) {
      out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="1" fill="url(#p-unk)"/>');
      return out.join("");
    }
    var t = Math.max(0, Math.min(1, m.duty_cycle));
    if (t > 0) {
      out.push('<rect x="' + x + '" y="' + y + '" width="' + Math.max(A.BAND_FLOOR_PX, t * w) +
        '" height="4" rx="1" fill="' + A.DUTY_INK + '"/>');
    }
    return out.join("");
  }

  // Macro view: the column map. One band per resident tile, positioned at its
  // own column offset; tiles that carry ONE weight matrix share a bracket (D11).
  function drawMacro() {
    var d = S.doc;
    var m = S.ix.macro[S.macro];
    if (!m) return '<p class="ui">No macro selected. Open a chip and click a macro.</p>';
    var cap = A.capacityOf(d, m) || {};
    var stored = cap.stored_cols || 1;
    var tiles = A.macroTiles(d, S.ix, m);
    var brackets = A.bracketsFor(d, S.ix, m);
    var PAD = 14, W = 900, TRACK = 58, LANE = 24;
    var lanes = brackets.length;
    // an empty macro spends its bracket lane on the reservation line instead
    var top = 46 + lanes * LANE + (tiles.length ? 0 : 14);
    var H = top + TRACK + 74;
    var x0 = PAD, w0 = W - 2 * PAD;
    function px(col) { return x0 + (col / stored) * w0; }
    var s = [svgDefs()];
    s.push('<text class="mono" x="' + PAD + '" y="16" font-size="11.5" fill="#1c2a33">' + esc(m.id) + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="30" font-size="10.5" fill="#5f7280">' +
      esc("on " + m.chip + " · card " + m.card + " · " + cap.rows + " rows × " + stored +
        " stored columns · occupancy " + A.pct(m.occupancy) +
        " · duty " + (m.duty_cycle == null ? "unknown" : A.fmt(m.duty_cycle))) + "</text>");

    // brackets, one lane each, above the track. The label sits above its own
    // bracket and is clamped into the box: a caption that runs off the edge is
    // a caption the reader does not get.
    brackets.forEach(function (b, i) {
      var lane = 40 + i * LANE;
      var y = lane + 11;
      var a = px(b.start), z = px(b.end);
      s.push('<path d="M' + a + " " + (y + 9) + "V" + y + "H" + z + "V" + (y + 9) +
        '" fill="none" stroke="' + (b.kind === "slice" ? "#1c2a33" : "#8497a2") +
        '" stroke-width="' + (b.kind === "slice" ? 1.5 : 1) + '"/>');
      var est = b.label.length * 5.1;
      var lx = Math.max(PAD, Math.min(a, W - PAD - est));
      s.push('<text class="ui" x="' + lx + '" y="' + (lane + 7) + '" font-size="10" fill="#5f7280">' +
        esc(b.label) + "</text>");
    });

    // A macro with no tiles is still a drawn object with a NAMED owner (D21):
    // the column map is empty and the reservation says why.
    if (!tiles.length) {
      s.push('<text class="ui" x="' + PAD + '" y="' + (top - 8) + '" font-size="10.5" fill="#5f7280">' +
        esc("no tiles — reserved: " + (m.reserved || "(unnamed)")) + "</text>");
    }
    // the track: every stored column of the macro, whether or not a tile holds it
    s.push('<rect x="' + x0 + '" y="' + top + '" width="' + w0 + '" height="' + TRACK +
      '" rx="3" fill="url(#p-unk)" stroke="#d5dfe4"/>');
    tiles.forEach(function (t) {
      var a = px(t.columns.start);
      var w = Math.max(A.BAND_FLOOR_PX, (t.columns.count / stored) * w0);
      var hue = hueOf(t) || "#8497a2";
      var dim = !A.tileMatches(d, S.ix, t, S.filter);
      s.push('<g data-tile="' + esc(t.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + a + '" y="' + top + '" width="' + w + '" height="' + TRACK +
        '" rx="2" fill="' + hue + '" stroke="#ffffff" stroke-width="0.75"/>');
      if (w > 54) {
        var o = t.owner || {};
        s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 17) + '" font-size="10.5" fill="#ffffff">' +
          esc(o.block + (o.layer == null ? "" : " L" + o.layer)) + "</text>");
        s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 31) + '" font-size="10" fill="#ffffff" opacity="0.88">' +
          esc(t.shape.K + "×" + t.shape.N) + "</text>");
        if (t.slice) {
          s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 45) + '" font-size="10" fill="#ffffff" opacity="0.88">' +
            esc("slice " + t.slice.index + "/" + t.slice.of) + "</text>");
        }
      }
      s.push("<title>" + esc(t.id + " — columns [" + t.columns.start + ", " +
        (t.columns.start + t.columns.count) + ")") + "</title></g>");
    });

    // the column axis: the only positions on screen are column offsets
    var yAxis = top + TRACK + 16;
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var col = Math.round(f * stored);
      s.push('<line x1="' + px(col) + '" y1="' + (top + TRACK) + '" x2="' + px(col) + '" y2="' + (yAxis - 8) +
        '" stroke="#c8d4da"/>');
      s.push('<text class="mono" x="' + px(col) + '" y="' + yAxis + '" font-size="10" fill="#8497a2" text-anchor="' +
        (f === 0 ? "start" : f === 1 ? "end" : "middle") + '">' + col + "</text>");
    });
    s.push('<text class="ui" x="' + x0 + '" y="' + (yAxis + 16) + '" font-size="10.5" fill="#8497a2">' +
      esc("stored column offset · hatch = columns no tile holds (unowned capacity is legal and reported, ADJ-5)") +
      "</text>");
    if (S.duty) {
      s.push('<text class="ui" x="' + x0 + '" y="' + (yAxis + 32) + '" font-size="10.5" fill="' + A.DUTY_INK + '">' +
        esc(m.duty_cycle == null
          ? "duty cycle unknown — this document declares none for this macro"
          : "duty cycle " + A.fmt(m.duty_cycle) + " — the fraction of the period this macro is " +
            "active, drawn on the absolute 0–1 scale") + "</text>");
      s.push(dutyBar(m, x0, yAxis + 38, w0));
    }
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // ----------------------------------------------------------------- cards ---
  function meter(v, hue) {
    var t = Math.max(0, Math.min(1, v == null ? 0 : v));
    return '<div class="meter"><i style="width:' + (t * 100) + "%;background:" + (hue || A.MUTED) + '"></i></div>';
  }
  // The duty bar in a card: the SAME absolute 0-1 scale and the SAME neutral
  // ink as the overlay, so one number reads one way wherever it appears.
  function dutyMeter(v) {
    var t = Math.max(0, Math.min(1, v == null ? 0 : v));
    return '<div class="meter" title="absolute 0–1 scale"><i style="width:' +
      (t > 0 ? Math.max(0.6, t * 100) : 0) + "%;background:" + A.DUTY_INK + '"></i></div>' +
      '<span class="hintline" style="display:block">fraction of the period this macro is active — absolute 0–1 scale</span>';
  }
  function invMark(paths, coll, obj, field) {
    return A.isInvented(paths, coll, obj, field) ? '<span class="inv" title="fixture-invented value">◇</span> ' : "";
  }
  function groupWords(o) {
    if (!o || !o.groups) return "unknown";
    return A.AXES.map(function (a) { return a + " " + (o.groups[a] == null ? "—" : o.groups[a]); }).join(" &middot; ") +
      (o.primary_group ? " &middot; hue from <b>" + esc(o.primary_group) + "</b>" : "");
  }

  function macroCard(m) {
    var d = S.doc, paths = A.inventedIndex(d);
    var tById = A.byId(d.tiles);
    var cap = A.capacityOf(d, m) || {};
    var card = d.cards[m.card] || {};
    var tiles = (m.tiles || []).map(function (t) { return tById[t]; }).filter(Boolean)
      .sort(function (a, b) { return a.columns.start - b.columns.start; });
    var hue = tiles.length ? hueOf(tiles[0]) : null;
    var h = ['<div class="ttl">macro</div><div class="idl mono">' + esc(m.id) + "</div><dl>"];
    h.push("<dt>chip</dt><dd class=\"mono\">" + esc(m.chip) + "</dd>");
    h.push("<dt>device card</dt><dd>" + esc(card.label || m.card) + "<br><span class=\"mono\" style=\"font-size:11px\">" +
      esc(cap.rows + " rows × " + cap.cols_adc + " ADC × " + cap.mux + " mux = " + cap.stored_cols + " stored columns") + "</span></dd>");
    h.push("<dt>area</dt><dd>" + (card.area_mm2 == null ? '<span style="color:#8497a2">unknown — no run supplies it</span>' : esc(A.fmt(card.area_mm2)) + " mm²") + "</dd>");
    h.push("<dt>occupancy</dt><dd>" + invMark(paths, "macros", m, "occupancy") + esc(A.pct(m.occupancy)) + meter(m.occupancy, hue) + "</dd>");
    h.push("<dt>duty cycle</dt><dd>" + invMark(paths, "macros", m, "duty_cycle") +
      (m.duty_cycle == null
        ? '<span style="color:#8497a2">unknown — this document declares none (P4 owns it)</span>'
        : esc(A.fmt(m.duty_cycle)) + dutyMeter(m.duty_cycle)) + "</dd>");
    if (m.digital_pool) {
      h.push("<dt>per-macro digital pool (D12)</dt><dd>" + invMark(paths, "macros", m, "digital_pool") +
        esc(m.digital_pool.shift_add_units + " shift/add units · " + m.digital_pool.act_lanes + " activation lanes · " +
          A.fmt(m.digital_pool.area_mm2) + " mm²") + "</dd>");
    }
    if (m.reserved) h.push("<dt>reserved</dt><dd>" + esc(m.reserved) + "</dd>");
    h.push("</dl>");
    if (tiles.length) {
      h.push('<div class="ttl" style="margin-top:.7rem">tiles — ' + tiles.length + "</div>");
      h.push("<table><tr><th>owner</th><th>K×N</th><th>columns</th><th>group</th></tr>");
      tiles.forEach(function (t) {
        var o = t.owner || {};
        var g = t.groups ? t.primary_group + " " + t.groups[t.primary_group] : "—";
        h.push("<tr><td>" + esc(o.model) + "<br>" +
          esc(o.layer == null ? "endpoint" : "layer " + o.layer) + " &middot; " + esc(o.block) +
          (o.expert == null ? "" : " &middot; expert " + esc(o.expert)) +
          (t.slice ? "<br>slice " + esc(t.slice.index + "/" + t.slice.of) : "") + "</td>" +
          "<td>" + esc(t.shape.K + "×" + t.shape.N) + "</td>" +
          "<td>" + invMark(paths, "tiles", t, "columns") +
          esc("[" + t.columns.start + ", " + (t.columns.start + t.columns.count) + ")") + "</td>" +
          '<td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' +
          (hueOf(t) || "#8497a2") + '"></span> ' + esc(g) + "</td></tr>");
      });
      h.push("</table>");
      h.push('<p class="hintline">Gaps in the column strip are columns no tile spans. Unowned capacity is legal and reported (ADJ-5).</p>');
      var brackets = A.bracketsFor(d, S.ix, m);
      if (brackets.length) {
        h.push('<div class="ttl" style="margin-top:.7rem">column map brackets — ' + brackets.length + "</div>");
        h.push("<ul style=\"margin:.2rem 0 0;padding-left:1.05rem;font-size:11.5px\">");
        brackets.forEach(function (b) {
          h.push("<li>" + esc(b.label) +
            (b.chained.length ? ' <span class="mono" style="font-size:10.5px">' + esc(b.chained.join(" ")) + "</span>" : "") +
            "</li>");
        });
        h.push("</ul>");
      }
      h.push('<p class="hintline">Open the Macro view for the full column map and its brackets (D11).</p>');
    }
    return h.join("");
  }

  function tileCard(t) {
    var d = S.doc, paths = A.inventedIndex(d);
    var o = t.owner || {};
    var macro = S.ix.macro[t.macro];
    var siblings = (S.ix.owner[A.ownerKey(t)] || []).filter(function (id) { return id !== t.id; });
    var h = ['<div class="ttl">tile</div><div class="idl mono">' + esc(t.id) + "</div><dl>"];
    h.push("<dt>owner</dt><dd>" + esc(o.model) + "<br>" +
      esc((o.layer == null ? "endpoint" : "layer " + o.layer) + " · " + o.block +
        (o.expert == null ? "" : " · expert " + o.expert)) + "</dd>");
    h.push("<dt>shape</dt><dd>" + esc(t.shape.K + " × " + t.shape.N) + " — this tile, not the whole matrix</dd>");
    h.push("<dt>columns</dt><dd>" + invMark(paths, "tiles", t, "columns") +
      esc("[" + t.columns.start + ", " + (t.columns.start + t.columns.count) + ") of " +
        ((A.capacityOf(d, macro) || {}).stored_cols || "?")) + "</dd>");
    h.push("<dt>slice</dt><dd>" + (t.slice
      ? esc("slice " + t.slice.index + " of " + t.slice.of + " · " + t.slice.bits + " bits per cell (D11)")
      : '<span style="color:#8497a2">none — this card stores whole weight words</span>') + "</dd>");
    h.push("<dt>group</dt><dd>" + groupWords(t) + "</dd>");
    h.push("<dt>host</dt><dd class=\"mono\">" + esc(t.macro + " · " + (macro ? macro.chip : "?")) + "</dd>");
    h.push("</dl>");
    if (siblings.length) {
      h.push('<p class="hintline">This weight matrix is carried by ' + (siblings.length + 1) +
        " tiles sharing one owner tuple; the column map brackets them (D11).</p>");
    }
    return h.join("");
  }

  function chipCard(c) {
    var d = S.doc, paths = A.inventedIndex(d);
    var h = ['<div class="ttl">chip</div><div class="idl mono">' + esc(c.id) + "</div><dl>"];
    h.push("<dt>label</dt><dd>" + esc(c.label || "—") + "</dd>");
    h.push("<dt>system</dt><dd class=\"mono\">" + esc(c.system) + "</dd>");
    h.push("<dt>pool</dt><dd>" + esc(c.pool) + (c.pool === "digital" ? " — shared digital chiplet (D13); it stores no weights" : " — analog macro chiplet") + "</dd>");
    h.push("<dt>slots</dt><dd>" + esc((c.capacity && c.capacity.macro_slots) || "?") + " enumerated macro slots</dd>");
    h.push("<dt>occupancy</dt><dd>" + invMark(paths, "chips", c, "occupancy") + esc(A.pct(c.occupancy)) + meter(c.occupancy, hueOf(c)) + "</dd>");
    h.push("<dt>groups</dt><dd>" + groupWords(c) + "</dd>");
    h.push("</dl>");
    var ls = d.links.filter(function (l) { return l.from === c.id || l.to === c.id; });
    if (ls.length) {
      h.push('<div class="ttl" style="margin-top:.7rem">links — ' + ls.length + "</div>");
      h.push("<table><tr><th>role</th><th>other end</th><th>bytes</th></tr>");
      ls.forEach(function (l) {
        h.push("<tr><td>" + esc(l.role) + "</td><td class=\"mono\">" + esc(l.from === c.id ? l.to : l.from) + "</td><td>" +
          invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</td></tr>");
      });
      h.push("</table>");
    }
    h.push('<p class="hintline">Click the chip, or pick it in the Chip view, to see its macros.</p>');
    return h.join("");
  }

  function linkCard(l) {
    var paths = A.inventedIndex(S.doc);
    return ['<div class="ttl">link</div><div class="idl mono">' + esc(l.id) + "</div><dl>",
      "<dt>role</dt><dd>" + esc(l.role) + "</dd>",
      "<dt>from &rarr; to</dt><dd class=\"mono\">" + esc(l.from) + " &rarr; " + esc(l.to) + "</dd>",
      "<dt>bytes per " + esc(l.per || "unit") + "</dt><dd>" + invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</dd>",
      "<dt>carries</dt><dd>" + esc(l.label || "—") + "</dd>",
      "<dt>basis</dt><dd>" + esc(l.basis || "—") + "</dd></dl>",

  function metricCard(m) {
    var paths = A.inventedIndex(S.doc);

  function defaultCard() {
    if (S.view === "frontier") return frontierCard();
    if (S.view === "fold") return foldPanelCard();
    var d = S.doc;
    if (!d) return '<div class="ttl">No document</div><p class="hintline">Drop an atlas.json onto this page, or use Open.</p>';
    if (d.systems.length > 1) return pdCard();
    var sys = d.systems[0] || {}, mdl = (sys.models || [])[0] || {};
    var h = ['<div class="ttl">system</div><div class="idl mono">' + esc(sys.id || "") + "</div><dl>"];
    h.push("<dt>role &middot; phase</dt><dd>" + esc((sys.role || "?") + " · " + (sys.phase || "?")) + "</dd>");
    h.push("<dt>parallelism</dt><dd>" + esc(A.AXES.map(function (a) { return a + " = " + ((sys.parallelism || {})[a]); }).join(" · ")) + "</dd>");
    h.push("<dt>model</dt><dd>" + esc(mdl.label || mdl.id || "—") + "<br><span style=\"font-size:11px;color:#5f7280\">" +
      esc(mdl.layers + " layers · hidden " + mdl.hidden_dim + " · ffn " + mdl.intermediate_size + " · vocab " + mdl.vocab_size) + "</span></dd>");
    if (mdl.serving) h.push("<dt>serving</dt><dd>" + esc("batch " + mdl.serving.batch + " · prefill " + mdl.serving.prefill_len +

    h.push("</dl>");

    return h.join("");

  // A PD document has two systems and no single "the system" (D16), so the
  // resting card is the pair and the one thing that couples them.
  function pdCard() {
    var d = S.doc;
    var h = ['<div class="ttl">PD machine — ' + d.systems.length + " systems</div>"];
    d.systems.forEach(function (sys) {
      var mdl = (sys.models || [])[0] || {};
      var chips = d.chips.filter(function (c) { return c.system === sys.id; });
      h.push('<div class="idl mono">' + esc(sys.id) + "</div><dl>");
      h.push("<dt>role &middot; phase</dt><dd>" + esc(sys.role + " · " + sys.phase) + "</dd>");
      h.push("<dt>inventory</dt><dd>" + esc(chips.filter(function (c) { return c.pool === "analog"; }).length +
        " analog chiplets · " + chips.filter(function (c) { return c.pool === "digital"; }).length +
        " shared digital") + "</dd>");
      h.push("<dt>parallelism</dt><dd>" + esc(A.AXES.map(function (a) {
        return a + " = " + ((sys.parallelism || {})[a]);
      }).join(" · ")) + "</dd>");
      h.push("<dt>model</dt><dd>" + esc(mdl.label || mdl.id || "—") + "</dd>");
      h.push("</dl>");
    });
    var pd = d.links.filter(function (l) { return l.role === "pd"; })[0];
    if (pd) {
      h.push('<div class="ttl" style="margin-top:.7rem">handoff</div><dl>');
      h.push("<dt>bytes per " + esc(pd.per || "unit") + "</dt><dd>" + esc(A.fmtBytes(pd.bytes)) + "</dd>");
      h.push("<dt>basis</dt><dd>" + esc(pd.basis || "—") + "</dd></dl>");
    }
    h.push('<p class="hintline">Two inventories, one priced handoff (D16). Each system holds the whole model and is priced on its own timeline — read relaxations[] before comparing the two.</p>');
    return h.join("");
  }

  // ---- P7.6 cards -----------------------------------------------------------
  function pointCard(id) {
    var f = S.front || { points: [] };
    var pt = (f.points || []).filter(function (x) { return x.id === id; })[0];
    if (!pt) return defaultCard();

    h.push('<p class="idl">' + esc(pt.label) + "</p><dl>");

  function passCard(id) {
    var parts = id.split("|");
    var box = null, lane = null, pass = null;
    ((S.doc.passes && S.doc.passes.boxes) || []).concat(
      (function () {
        var out = [];
        ((S.doc.folding && S.doc.folding.cards) || []).forEach(function (c) {
          (c.variants || []).forEach(function (v) { (v.boxes || []).forEach(function (b) { out.push(b); }); });
        });
        return out;
      })()
    ).forEach(function (b) {
      if (b.id !== parts[0]) return;
      (b.lanes || []).forEach(function (l) {
        if (String(l.bank) !== parts[1]) return;
        (l.passes || []).forEach(function (pp) {
          if (String(pp.pass) === parts[2]) { box = b; lane = l; pass = pp; }
        });
      });
    });
    if (!pass) return defaultCard();
    var h = ['<p class="ttl">' + esc(pass.label) + "</p>"];
    h.push('<p class="idl">' + esc(box.macro ? box.macro : box.id) + "</p><dl>");
    h.push("<dt>tensor</dt><dd>" + esc(A.ownerLabel(pass.owner)) + "</dd>");
    h.push("<dt>block</dt><dd>" + esc("K block " + pass.k_block + " · N block " + pass.n_block) + "</dd>");
    h.push("<dt>bank / pass</dt><dd>" + esc("bank " + lane.bank + " · pass " + pass.pass +
      " of this decode step") + "</dd>");
    h.push("<dt>rows × columns</dt><dd>" + esc("[" + pass.rows.start + ", " + (pass.rows.start + pass.rows.count) +
      ") × [" + pass.columns.start + ", " + (pass.columns.start + pass.columns.count) + ") — " +
      A.pct(pass.columns.count / lane.columns.count) + " of the bank") + "</dd>");
    h.push("<dt>tile</dt><dd>" + esc(pass.tile || "none: this box is a fold, not a placement") + "</dd>");
    if (pass.co_tenant) {
      h.push("<dt>co-tenant</dt><dd>" + esc("another tensor sharing this bank. Decode runs layers " +
        "in sequence, so co-residency never contends (P7 Fact 3)") + "</dd>");
    }
    h.push("</dl>");
    return h.join("");
  }

  function frontierCard() {

    h.push('<div class="legrow"><span class="sw"><svg width="26" height="12"><path d="M2 9V3H24V9" fill="none" stroke="#1c2a33" stroke-width="1.5"/></svg></span><span class="tx">tiles of ONE weight matrix: bit slices</span></div>');

  // ===================================================================
  // P7.6 - the folding card, the macro time-lane view, the frontier explorer.
  // Three drawings, one encoding law. Hue is still the parallelism group and
  // nothing else: a fold VARIANT is told apart by position and label, and the
  // frontier draws no hue at all, because a design point has no group.
  // ===================================================================
  var LANE_H = 21, LANE_GUT = 74, SLOT_MIN = 96;
  var ACC_INK = "#3d4f5c";     // the accumulator glyph: the neutral structural ink

  function foldCards() { return ((S.doc && S.doc.folding && S.doc.folding.cards) || []); }
  function foldCardById(id) {
    return foldCards().filter(function (c) { return c.id === id; })[0] || foldCards()[0] || null;
  }
  function passBoxFor(macroId) {
    return (((S.doc && S.doc.passes && S.doc.passes.boxes) || [])
      .filter(function (b) { return b.macro === macroId; })[0]) || null;
  }
  function foldHue(card) {
    var k = A.foldHueKey(S.doc, S.ix, card);
    return k == null ? A.MUTED : (S.hue.hue[k] || A.MUTED);
  }

  // One box: the card's mux banks as horizontal time lanes, x = pass order
  // inside ONE decode step. The same drawing serves the folding card and the
  // macro drill-in, so the two pictures cannot drift apart.
  function drawBox(box, x, y, w, hue, tensorOwner, opts) {
    var s = [];
    var lanes = (box.lanes || []).slice().sort(function (a, b) { return a.bank - b.bank; });
    var maxPass = 0;
    lanes.forEach(function (l) {
      (l.passes || []).forEach(function (p) { maxPass = Math.max(maxPass, p.pass); });
    });
    var slots = maxPass + 1;
    var gut = LANE_GUT;
    var plot = Math.max(60, w - gut - 8);
    var slotW = plot / slots;
    var head = 30;
    var h = head + lanes.length * LANE_H + 8;
    s.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" rx="4" fill="#ffffff" stroke="#d5dfe4"' + (box.macro ? "" : ' stroke-dasharray="4 3"') + "/>");
    s.push('<text class="ui" x="' + (x + 8) + '" y="' + (y + 14) + '" font-size="10.5" fill="#1c2a33">' +
      esc(box.label || box.id) + "</text>");
    s.push('<text class="mono" x="' + (x + 8) + '" y="' + (y + 25) + '" font-size="9.5" fill="#8497a2">' +
      esc(box.macro ? box.macro : "no macro id: this box is a fold the mapper has not placed") + "</text>");
    // the pass axis: the only x positions in this drawing are pass indices
    for (var i = 0; i < slots; i++) {
      s.push('<text class="ui" x="' + (x + gut + i * slotW + slotW / 2) + '" y="' + (y + 25) +
        '" font-size="9" fill="#8497a2" text-anchor="middle">pass ' + i + "</text>");
    }
    lanes.forEach(function (l, li) {
      var ly = y + head + li * LANE_H;
      s.push('<text class="mono" x="' + (x + 8) + '" y="' + (ly + 14) + '" font-size="9.5" fill="#5f7280">' +
        esc("bank " + l.bank) + "</text>");
      s.push('<text class="mono" x="' + (x + 40) + '" y="' + (ly + 14) + '" font-size="8.5" fill="#aebac2">' +
        esc("c" + l.columns.start) + "</text>");
      var list = l.passes || [];
      if (!list.length) {
        s.push('<rect x="' + (x + gut) + '" y="' + (ly + 2) + '" width="' + plot + '" height="' + (LANE_H - 4) +
          '" rx="2" fill="url(#p-res)" stroke="#e0e7ea"/>');
        s.push('<text class="ui" x="' + (x + gut + 6) + '" y="' + (ly + 14) + '" font-size="9" fill="#7a2e2e">' +
          esc("idle bank — no pass drives it (waste, D27)") + "</text>");
        return;
      }
      list.forEach(function (p) {
        var px = x + gut + p.pass * slotW;
        var co = tensorOwner ? !A.sameOwner(p.owner, tensorOwner) : false;
        var cover = l.columns.count ? p.columns.count / l.columns.count : 1;
        s.push('<g data-fpass="' + esc(box.id + "|" + l.bank + "|" + p.pass) + '" style="cursor:pointer">');
        s.push('<rect x="' + (px + 1) + '" y="' + (ly + 2) + '" width="' + (slotW - 3) + '" height="' + (LANE_H - 4) +
          '" rx="2" fill="' + hue + '" fill-opacity="' + (co ? 0.42 : 1) + '" stroke="' + hue +
          '"' + (co ? ' stroke-dasharray="2 2"' : "") + ' stroke-width="1"/>');
        if (cover < 0.999) {
          // the part of the bank this pass does NOT drive, drawn where it is
          s.push('<rect x="' + (px + 1 + (slotW - 3) * cover) + '" y="' + (ly + 2) + '" width="' +
            ((slotW - 3) * (1 - cover)) + '" height="' + (LANE_H - 4) + '" rx="2" fill="url(#p-res)" stroke="none"/>');
        }
        var txt = "K" + p.k_block + " N" + p.n_block;
        s.push('<text class="ui" x="' + (px + 5) + '" y="' + (ly + 14) + '" font-size="9.5" fill="' +
          (co ? "#1c2a33" : "#ffffff") + '">' + esc(txt) + "</text>");
        s.push("<title>" + esc(p.label + "\n" + A.ownerLabel(p.owner) +
          "\nrows [" + p.rows.start + ", " + (p.rows.start + p.rows.count) + ")" +
          " · columns [" + p.columns.start + ", " + (p.columns.start + p.columns.count) + ")" +
          " · " + Math.round(cover * 1000) / 10 + "% of the bank" +
          (co ? "\nCO-TENANT: another tensor sharing this bank (decode runs layers in sequence, P7 Fact 3)" : "") +
          (p.tile ? "\ntile " + p.tile : "")) + "</title></g>");
      });
    });
    return { svg: s.join(""), h: h };
  }

  // The accumulator glyph, drawn where the K partials meet: a chevron plus the
  // operand count. Its ink is the structural neutral, never a group hue.
  function accGlyph(acc, x, y, w) {
    if (!acc || acc.where === "none") {
      return '<text class="ui" x="' + x + '" y="' + (y + 10) + '" font-size="9.5" fill="#8497a2">' +
        esc("no accumulator: one K block, nothing to meet") + "</text>";
    }
    var inm = acc.where === "in_macro";
    var s = [];
    s.push('<path d="M' + x + " " + y + "L" + (x + 9) + " " + (y + 7) + "L" + x + " " + (y + 14) +
      '" fill="none" stroke="' + ACC_INK + '" stroke-width="2"/>');
    s.push('<path d="M' + (x + 7) + " " + y + "L" + (x + 16) + " " + (y + 7) + "L" + (x + 7) + " " + (y + 14) +
      '" fill="none" stroke="' + ACC_INK + '" stroke-width="2"/>');
    s.push('<text class="ui" x="' + (x + 22) + '" y="' + (y + 6) + '" font-size="9.5" fill="' + ACC_INK + '">' +
      esc("Σ " + acc.operands + " K partials meet " + (inm ? "IN the macro" : "ACROSS macros")) + "</text>");
    s.push('<text class="ui" x="' + (x + 22) + '" y="' + (y + 17) + '" font-size="9.5" fill="#5f7280">' +
      esc(acc.transport_bytes ? A.fmtBytes(acc.transport_bytes) + " / " + (acc.per || "step") +
        " crosses the boundary" : "nothing crosses the boundary") + "</text>");
    return s.join("");
  }

  function foldFigure(v, hue) {
    var a = v.area || {}, t = v.time || {}, e = v.energy || {};
    var rows = [];
    rows.push(["area", a.value == null ? "unknown — no card law" : A.fmt(a.value) + " mm² (" +
      (a.basis_kind === "slots" ? a.slots + " macro slot(s)" : "cell share") + ")"]);
    rows.push(["time", t.passes + " ADC pass(es) / decode step" +
      (t.value == null ? "" : " · " + A.fmt(t.value) + " s")]);
    rows.push(["energy", e.value == null ? "UNCOVERED — no law prices it" : A.fmt(e.value) + " pJ"]);
    rows.push(["waste", A.fmt(v.waste.pct) + "% · " + v.waste.cells.toLocaleString("en-US") + " cells"]);
    return rows;
  }

  // ------------------------------------------------------------ fold view ---
  function drawFold() {
    var d = S.doc;
    if (!d.folding) {
      return '<p class="ui">This document carries no <span class="mono">folding</span> block. ' +
        'Open one that does — <span class="mono">?data=fixture_granite_folding.json</span> — or drop it on the page.</p>';
    }
    var card = foldCardById(S.foldCard);
    if (!card) return '<p class="ui">No folding card in this document.</p>';
    var hue = foldHue(card);
    var vs = card.variants || [];
    var W = 1000, PAD = 12;
    var colW = (W - PAD * 2 - (vs.length - 1) * 14) / vs.length;
    var s = [svgDefs()];
    var t = card.tensor;
    s.push('<text class="ui" x="' + PAD + '" y="15" font-size="12" fill="#1c2a33">' + esc(card.label) + "</text>");
    s.push('<text class="mono" x="' + PAD + '" y="30" font-size="10" fill="#5f7280">' +
      esc(A.ownerLabel(t.owner) + " · K " + t.K + " × N " + t.N + " = " + t.cells.toLocaleString("en-US") +
        " cells · floor " + card.floor_macros + " macro slot(s) on card " + card.card) + "</text>");
    var top = 44, bottom = top;
    vs.forEach(function (v, vi) {
      var x = PAD + vi * (colW + 14), y = top;
      s.push('<text class="ui" x="' + x + '" y="' + (y - 4) + '" font-size="11" fill="#1c2a33">' +
        esc((vi + 1) + ". " + v.label) + "</text>");
      var yy = y + 6;
      (v.boxes || []).forEach(function (b) {
        var out = drawBox(b, x, yy, colW, hue, t.owner, {});
        s.push(out.svg);
        yy += out.h + 8;
      });
      s.push(accGlyph(v.accumulator, x + 2, yy + 2, colW));
      yy += 30;
      foldFigure(v, hue).forEach(function (r) {
        s.push('<text class="ui" x="' + x + '" y="' + (yy + 10) + '" font-size="9.5" fill="#8497a2">' +
          esc(r[0]) + "</text>");
        s.push('<text class="ui" x="' + (x + 44) + '" y="' + (yy + 10) + '" font-size="10" fill="#1c2a33">' +
          esc(r[1]) + "</text>");
        yy += 13;
      });
      yy += 4;
      var words = (v.note || "").split(/\s+/), line = "", lines = [];
      words.forEach(function (wd) {
        if ((line + " " + wd).length * 5.0 > colW) { lines.push(line); line = wd; }
        else { line = line ? line + " " + wd : wd; }
      });
      if (line) lines.push(line);
      lines.slice(0, 8).forEach(function (ln) {
        s.push('<text class="ui" x="' + x + '" y="' + (yy + 9) + '" font-size="9.5" fill="#5f7280">' + esc(ln) + "</text>");
        yy += 11;
      });
      bottom = Math.max(bottom, yy);
    });
    var H = bottom + 38;
    s.push('<text class="ui" x="' + PAD + '" y="' + (H - 20) + '" font-size="9.5" fill="#8497a2">' +
      esc("one lane = one mux bank · x = ADC pass order inside ONE decode step (D25)") + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="' + (H - 8) + '" font-size="9.5" fill="#8497a2">' +
      esc("dotted outline = a co-tenant tensor sharing the bank · hatch = the part of a bank no pass drives (waste, D27)") + "</text>");
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + W +
      'px;max-width:100%">' + s.join("") + "</svg></div>";
  }

  // ------------------------------------------- macro drill-in: time lanes ---
  function drawMacroLanes() {
    var d = S.doc, m = S.ix.macro[S.macro];
    if (!m) return '<p class="ui">No macro selected.</p>';
    var box = passBoxFor(m.id);
    if (!box) {
      return '<p class="ui">No decode-pass schedule for <span class="mono">' + esc(m.id) +
        '</span> in this document. The column map is the view that always exists; the time lanes ' +
        "need a <span class=\"mono\">passes</span> block.</p>";
    }
    var W = 940, PAD = 12;
    var tiles = A.macroTiles(d, S.ix, m);
    var key = tiles.length ? A.groupKey(tiles[0]) : null;
    var ink = key == null ? A.MUTED : (S.hue.hue[key] || A.MUTED);
    var s = [svgDefs()];
    var pb = S.doc.passes;
    s.push('<text class="mono" x="' + PAD + '" y="15" font-size="11.5" fill="#1c2a33">' + esc(m.id) + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="29" font-size="10.5" fill="#5f7280">' +
      esc("decode step " + pb.step.index + " of the " + pb.step.of + "-step lowered window · " +
        box.passes + " pass(es) over " + (box.lanes || []).length + " banks · " +
        (pb.pass_time_s == null ? "no per-pass time declared" :
          "per-pass " + A.fmt(pb.pass_time_s) + " s ◇")) + "</text>");
    var out = drawBox(box, PAD, 40, W - 2 * PAD, ink, null, {});
    s.push(out.svg);
    var y = 40 + out.h + 16;
    s.push('<text class="ui" x="' + PAD + '" y="' + y + '" font-size="9.5" fill="#8497a2">' +
      esc("one lane = one mux bank of this macro's card · x = ADC pass order inside ONE decode step") + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="' + (y + 12) + '" font-size="9.5" fill="#8497a2">' +
      esc("K/N name the block of the tensor that fires · hatch = the part of a bank no pass drives (waste, D27)") + "</text>");
    y += 14;
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + (y + 10) + '" style="width:' + W +
      'px;max-width:100%">' + s.join("") + "</svg></div>";
  }

  // ------------------------------------------------------- frontier view ----
  function drawFrontier() {
    var f = S.front;
    if (!f) {
      return '<p class="ui">No frontier document loaded. Open one with ' +
        '<span class="mono">?frontier=fixture_frontier_granite.json</span>, or drop an ' +
        '<span class="mono">fws_frontier/1</span> file on the page.</p>';
    }
    if (S.frontRes.errors.length) {
      var rows = S.frontRes.errors.slice(0, 60).map(function (e) {
        return '<tr><td class="mono">' + esc(e.rule) + '</td><td class="mono">' + esc(e.field) +
          "</td><td>" + esc(e.message) + "</td></tr>";
      }).join("");
      return '<div class="refuse ui"><h2>The frontier refuses to draw</h2><p>' +
        S.frontRes.errors.length + " check(s) failed. See <span class=\"mono\">SCHEMA.md</span>, " +
        "rules X1&ndash;X14.</p><table><tr><th>rule</th><th>field</th><th>what is wrong</th></tr>" +
        rows + "</table></div>";
    }
    var pts = f.points || [];
    var W = 960, H = 430, L = 74, R = 18, T = 22, B = 54;
    var xs = pts.map(function (p) { return p.area.total_mm2; });
    var ys = pts.map(function (p) { return p.throughput.tokens_per_s; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var xpad = (x1 - x0) * 0.12 || 1, ypad = (y1 - y0) * 0.12 || 1;
    x0 -= xpad; x1 += xpad; y0 -= ypad; y1 += ypad;
    function px(v) { return L + (v - x0) / (x1 - x0) * (W - L - R); }
    function py(v) { return H - B - (v - y0) / (y1 - y0) * (H - T - B); }
    var s = [svgDefs()];
    // axes
    s.push('<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="#c8d4da"/>');
    s.push('<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" stroke="#c8d4da"/>');
    [0, 0.25, 0.5, 0.75, 1].forEach(function (t) {
      var xv = x0 + t * (x1 - x0), yv = y0 + t * (y1 - y0);
      s.push('<line x1="' + px(xv) + '" y1="' + (H - B) + '" x2="' + px(xv) + '" y2="' + (H - B + 5) + '" stroke="#c8d4da"/>');
      s.push('<text class="mono" x="' + px(xv) + '" y="' + (H - B + 17) + '" font-size="9.5" fill="#8497a2" text-anchor="middle">' +
        esc(A.fmt(xv)) + "</text>");
      s.push('<line x1="' + (L - 5) + '" y1="' + py(yv) + '" x2="' + L + '" y2="' + py(yv) + '" stroke="#c8d4da"/>');
      s.push('<text class="mono" x="' + (L - 8) + '" y="' + (py(yv) + 3) + '" font-size="9.5" fill="#8497a2" text-anchor="end">' +
        esc(A.fmt(yv)) + "</text>");
    });
    s.push('<text class="ui" x="' + ((L + W - R) / 2) + '" y="' + (H - 8) + '" font-size="10.5" fill="#5f7280" text-anchor="middle">' +
      esc(f.axes.x.label + " (" + f.axes.x.unit + ")") + "</text>");
    s.push('<text class="ui" transform="translate(14,' + ((T + H - B) / 2) + ') rotate(-90)" font-size="10.5" fill="#5f7280" text-anchor="middle">' +
      esc(f.axes.y.label + " (" + f.axes.y.unit + ")") + "</text>");
    // the front, as a staircase through the flagged points
    var front = A.frontierFront(f);
    if (front.length > 1) {
      var dpath = "";
      front.forEach(function (p, i) {
        var X = px(p.area.total_mm2), Y = py(p.throughput.tokens_per_s);
        dpath += i === 0 ? "M" + X + " " + Y : "L" + px(p.area.total_mm2) + " " + py(front[i - 1].throughput.tokens_per_s) + "L" + X + " " + Y;
      });
      s.push('<path d="' + dpath + '" fill="none" stroke="#1c2a33" stroke-width="1.2" stroke-dasharray="4 3"/>');
    }
    pts.forEach(function (p) {
      var X = px(p.area.total_mm2), Y = py(p.throughput.tokens_per_s);
      var clickable = !!(p.atlas && p.atlas.exists);
      var ink = p.pareto ? "#1c2a33" : "#8497a2";
      s.push('<g data-point="' + esc(p.id) + '" style="cursor:pointer">');
      if (p.knee) s.push('<circle cx="' + X + '" cy="' + Y + '" r="11" fill="none" stroke="' + ink + '" stroke-width="1.2"/>');
      if (clickable) {
        s.push('<rect x="' + (X - 5) + '" y="' + (Y - 5) + '" width="10" height="10" fill="' + ink + '"/>');
      } else {
        s.push('<circle cx="' + X + '" cy="' + Y + '" r="5" fill="' + (p.pareto ? ink : "#ffffff") +
          '" stroke="' + ink + '" stroke-width="1.4"/>');
      }
      s.push('<text class="mono" x="' + (X + 9) + '" y="' + (Y - 8) + '" font-size="9" fill="' + ink + '">' +
        esc(p.id + (p.knee ? " · KNEE" : "")) + "</text>");
      s.push("<title>" + esc(p.id + " — " + p.label + "\n" + A.fmt(p.area.total_mm2) + " mm² · " +
        A.fmt(p.throughput.tokens_per_s) + " tokens/s" +
        (clickable ? "\nclick: open its atlas (" + p.atlas.document + ")" : "\nno atlas artifact for this point")) +
        "</title></g>");
    });
    var svg = '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + W +
      'px;max-width:100%">' + s.join("") + "</svg></div>";
    // The per-point table: D28 wants utilization VISIBLE at every point, and a
    // scatter cannot carry it. The table is the second half of the picture.
    var classes = f.device_classes || [];
    var th = ["point", "knobs"].concat(classes.map(function (c) { return "util · " + c.label; }));
    th = th.concat(["waste %", "area mm²", "tokens/s", "atlas"]);
    var body = pts.map(function (p) {
      var cells = ['<td class="mono">' + esc(p.id) + (p.knee ? " <b>KNEE</b>" : "") +
        (p.pareto ? " ·front" : "") + "</td>", "<td>" + esc(p.label) + "</td>"];
      classes.forEach(function (c) {
        var u = (p.utilization || []).filter(function (x) { return x.device_class === c.id; })[0];
        if (!u || u.value == null) {
          cells.push('<td title="' + esc((u && u.uncovered) || "no entry") + '"><span class="mono">unknown</span></td>');
        } else {
          cells.push("<td>" + A.pct(u.value) + meter(u.value, A.MUTED) + "</td>");
        }
      });
      cells.push("<td>" + esc(A.fmt(p.packing.waste_pct)) + "%</td>");
      cells.push('<td class="mono">' + esc(A.fmt(p.area.total_mm2)) + "</td>");
      cells.push('<td class="mono">' + esc(A.fmt(p.throughput.tokens_per_s)) + "</td>");
      cells.push("<td>" + (p.atlas && p.atlas.exists
        ? '<a href="?data=' + esc(p.atlas.document) + '">' + esc(p.atlas.document) + "</a>"
        : '<span class="mono" title="' + esc((p.atlas && p.atlas.basis) || "") + '">none</span>') + "</td>");
      return "<tr>" + cells.join("") + "</tr>";
    }).join("");
    var table = '<div class="st ui" style="margin-top:.8rem"><table><tr>' +
      th.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr>" + body + "</table>" +
      '<p class="hintline">' + esc("filled square = a point with a placement document to open · " +
        "hollow circle = dominated · ring = the knee · dashed staircase = the declared front. No hue " +
        "appears in this view: a design point has no parallelism group, and hue carries nothing else.") +
      "</p></div>";
    var knee = '<p class="hintline">' + esc("knee: " + f.knee.point + " — " + f.knee.basis) +
      (f.knee.caveat ? "<br>" + esc(f.knee.caveat) : "") + "</p>";
    return svg + knee + table;
  }

  // ------------------------------------------------------- validation panel --
  function refusalPanel() {
    var rows = S.res.errors.slice(0, 200).map(function (e) {
      return "<tr><td class=\"mono\">" + esc(e.rule) + "</td><td class=\"mono\">" + esc(e.field) + "</td><td>" + esc(e.message) + "</td></tr>";
    }).join("");
    var ext = S.res.errors.filter(function (e) { return /^[FT]\d+$/.test(e.rule); }).length;
    return '<div class="refuse ui"><h2>The atlas refuses to draw</h2>' +
      (ext ? "<p>" + ext + " of these come from the folding extension (rules F and T): a fold that " +
        "cannot be drawn is not a fold, and the page refuses as one artifact.</p>" : "") +
      "<p>A mapping that cannot be drawn is not a mapping. " + S.res.errors.length +
      " check" + (S.res.errors.length === 1 ? "" : "s") + " failed; each names the field that failed it. " +
      "See <span class=\"mono\">SCHEMA.md</span> for the rule numbers.</p>" +
      "<table><tr><th>rule</th><th>field</th><th>what is wrong</th></tr>" + rows + "</table>" +
      (S.res.errors.length > 200 ? "<p>&hellip; and " + (S.res.errors.length - 200) + " more.</p>" : "") + "</div>";
  }

  // Every suite this page can run, in one panel: the atlas loader, the folding
  // and pass extensions, the frontier document, and the view rules of each.
  function allSelfTests() {
    if (!S.doc) return null;
    return {
      refusals: A.selfTest(S.doc),
      views: A.viewTest(S.doc),
      ext: A.extSelfTest(S.doc),
      front: S.front ? A.frontierSelfTest(S.front) : null,
      frontViews: S.front ? A.frontierViewTest(S.front) : null
    };
  }

  function stSection(title, rows, verb) {
    if (!rows) return "";
    var skipped = rows.filter(function (r) { return r.skipped; }).length;
    var pass = rows.filter(function (r) { return r.pass; }).length;
    var head = 'style="font:600 10.5px/1 \'Segoe UI\',sans-serif;letter-spacing:.12em;' +
      'text-transform:uppercase;color:#8497a2;margin:1rem 0 .5rem"';
    var body = rows.map(function (r) {
      return '<tr' + (r.skipped ? ' class="skip"' : "") + '><td class="mono">' + esc(r.rule) +
        "</td><td>" + esc(r.what) + '</td><td class="' + (r.skipped ? "" : r.pass ? "ok" : "no") + '">' +
        (r.skipped ? "n/a" : r.pass ? verb[0] : verb[1]) + '</td><td class="mono" style="font-size:11px">' +
        esc(r.got) + "</td></tr>";
    }).join("");
    return "<h3 " + head + ">" + esc(title) + " &mdash; " + pass + " / " + rows.length + " pass" +
      (skipped ? " (" + skipped + " not constructible on this document)" : "") + "</h3>" +
      "<table><tr><th>rule</th><th>case</th><th>verdict</th><th>evidence</th></tr>" + body + "</table>";
  }

  function selfTestPanel() {
    var refusals = S.selftest.refusals, views = S.selftest.views;
    var skipped = refusals.filter(function (r) { return r.skipped; }).length;
    var pass = refusals.filter(function (r) { return r.pass; }).length;
    var rows = refusals.map(function (r) {
      return '<tr' + (r.skipped ? ' class="skip"' : "") + '><td class="mono">' + esc(r.rule) + "</td><td>" + esc(r.what) +
        '</td><td class="' + (r.skipped ? "" : r.pass ? "ok" : "no") + '">' +
        (r.skipped ? "n/a" : r.pass ? "fires" : "MISSED") + '</td><td class="mono" style="font-size:11px">' +
        esc(r.got) + "</td></tr>";
    }).join("");
    var vpass = views.filter(function (r) { return r.pass; }).length;
    var vrows = views.map(function (r) {
      return '<tr><td class="mono">' + esc(r.rule) + "</td><td>" + esc(r.what) +
        '</td><td class="' + (r.pass ? "ok" : "no") + '">' + (r.pass ? "holds" : "BROKEN") +
        '</td><td class="mono" style="font-size:11px">' + esc(r.got) + "</td></tr>";
    }).join("");
    var head = 'style="font:600 10.5px/1 \'Segoe UI\',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8497a2;margin:0 0 .5rem"';
    return '<div class="st ui"><h3 ' + head + ">Loader self-test &mdash; " +
      pass + " / " + refusals.length + " pass" +
      (skipped ? " (" + skipped + " not constructible on this document)" : "") + "</h3>" +
      "<table><tr><th>rule</th><th>corruption</th><th>refusal</th><th>field named</th></tr>" + rows + "</table>" +
      '<p class="hintline">Each row corrupts a copy of the loaded document and asserts the loader refuses it and names the right field. A rule this document gives the harness no way to corrupt is reported as n/a rather than as a miss.</p>' +
      '<h3 ' + head + ' style="margin-top:1rem">View rules &mdash; ' + vpass + " / " + views.length + " hold</h3>" +
      "<table><tr><th>rule</th><th>what the renderer promises</th><th>verdict</th><th>evidence</th></tr>" + vrows + "</table>" +
      '<p class="hintline">The encoding law, asserted on this document: one fact per channel, a filter that moves no figure, a stated draw budget, brackets that claim only what D11 says, and one lane per system.</p>' +
      stSection("Folding extension (fws_fold/1 + fws_pass/1) — refusals", S.selftest.ext, ["fires", "MISSED"]) +
      (S.selftest.ext ? '<p class="hintline">Rules F1&ndash;F13 and T1&ndash;T9. The DOA register is enforced here: a variant that names a dead fold, or an artifact that drops one of the register\'s entries, is refused (D26). T9 is a WARNING, and it fires on every bank a schedule leaves idle (D27).</p>' : "") +
      stSection("Frontier document (fws_frontier/1) — refusals", S.selftest.front, ["fires", "MISSED"]) +
      stSection("Frontier view rules", S.selftest.frontViews, ["holds", "BROKEN"]) +
      (S.selftest.front ? '<p class="hintline">Rules X1&ndash;X14. A safety margin under any name is refused (D28); a point with no per-device utilization or no waste figure is refused (D28, D27); and the declared Pareto flags are checked against the enumerated points, which is the one place this page computes anything.</p>' : "") +
      "</div>";
  }

  // ---------------------------------------------------------------- render ---
  function render() {
    S.res = S.doc ? A.validate(S.doc) : { errors: [], warnings: [] };
    // The extension blocks have their own contracts and their own refusals; a
    // document that carries none is judged by none of them.
    if (S.doc) {
      var ext = A.validateExt(S.doc);
      S.res = {
        errors: S.res.errors.concat(ext.errors),
        warnings: S.res.warnings.concat(ext.warnings)
      };
    }
    S.frontRes = S.front ? A.validateFrontier(S.front) : { errors: [], warnings: [] };
    if (!S.front && S.view === "frontier") S.view = "package";
    if (!(S.doc && S.doc.folding) && S.view === "fold") S.view = "package";
    S.hue = S.doc ? A.hueMap(S.doc) : { order: [], hue: {} };
    S.ix = S.doc ? A.makeIndex(S.doc) : { chip: {}, macro: {}, tile: {}, link: {}, sys: {}, owner: {} };
    if (S.doc && !S.chip) {
      var first = S.doc.chips && S.doc.chips[0];
      S.chip = first ? first.id : null;
    }
    if (S.macro && !S.ix.macro[S.macro]) S.macro = null;
    if (S.view === "macro" && !S.macro) S.view = "chip";
    renderHeader(); renderBand(); renderMetrics(); renderBar(); renderCrumbs();

    var canvas = $("h-canvas");
    if (!S.doc) { canvas.innerHTML = '<p class="ui">No document loaded.</p>'; }
    else if (S.selftest) { canvas.innerHTML = selfTestPanel(); }
    else if (S.res.errors.length) { canvas.innerHTML = refusalPanel(); }
    else if (S.view === "frontier") { canvas.innerHTML = drawFrontier(); }
    else if (S.view === "fold") { canvas.innerHTML = drawFold(); }
    else if (S.view === "package") { canvas.innerHTML = drawPackage(); }
    else if (S.view === "macro") { canvas.innerHTML = S.lanes ? drawMacroLanes() : drawMacro(); }
    else { canvas.innerHTML = drawChip(); }

    renderLegend();
    if (!S.pinned) showCard(defaultCard());
    wireCanvas();
  }

  function wireCanvas() {
    var canvas = $("h-canvas");
    // Hover previews the card; click DESCENDS one level of containment
    // (package -> chip -> macro) and leaves the card pinned on the way. A leaf
    // — a link, a tile — has nothing under it, so a click there only pins.
    function bind(sel, attr, make, descend) {
      Array.prototype.forEach.call(canvas.querySelectorAll(sel), function (n) {
        var id = n.getAttribute(attr);
        n.addEventListener("mouseenter", function () { if (!S.pinned) showCard(make(id)); });
        n.addEventListener("click", function (ev) {
          ev.stopPropagation();
          S.pinned = true;
          showCard(make(id));
          if (descend) descend(id);
        });
      });
    }
    bind("[data-macro]", "data-macro", function (id) { return macroCard(S.ix.macro[id]); },
      function (id) { go("macro", null, id); });
    bind("[data-chip]", "data-chip", function (id) { return chipCard(S.ix.chip[id]); },
      function (id) { go("chip", id, null); });
    bind("[data-link]", "data-link", function (id) { return linkCard(S.ix.link[id]); }, null);
    bind("[data-tile]", "data-tile", function (id) { return tileCard(S.ix.tile[id]); }, null);
    bind("[data-point]", "data-point", function (id) { return pointCard(id); }, null);
    bind("[data-fpass]", "data-fpass", function (id) { return passCard(id); }, null);
    canvas.addEventListener("click", function () { S.pinned = false; showCard(defaultCard()); });
  }

  // ------------------------------------------------------------------ input --
  // Deep links keep a screenshot reproducible: ?view=chip&chip=<id>, ?selftest=1
  function adopt(doc, source) {
    S.doc = doc; S.source = source; S.chip = null; S.macro = null;
    S.pinned = false; S.selftest = null; S.filter = A.emptyFilter();
    var q = location.search || "";
    function param(name) {
      var m = new RegExp("[?&]" + name + "=([^&]*)").exec(q);
      return m ? decodeURIComponent(m[1]) : null;
    }
    if (param("chip")) S.chip = param("chip");
    if (param("macro")) S.macro = param("macro");
    if (param("view") === "chip") S.view = "chip";
    if (param("view") === "macro") S.view = "macro";
    if (param("view") === "fold") S.view = "fold";
    if (param("view") === "frontier") S.view = "frontier";
    if (param("fold")) S.foldCard = param("fold");
    if (param("lanes") === "1") S.lanes = true;
    if (param("duty") === "1") S.duty = true;
    ["model", "layer", "group", "pool", "q"].forEach(function (k) {
      if (param(k) != null) S.filter[k] = param(k);
    });
    render();
    if (param("selftest") === "1") { S.selftest = allSelfTests(); render(); }
  }
  // A frontier document is its own kind and never replaces the atlas: dropping
  // one alongside an atlas gives the reader both pictures at once.
  function adoptFrontier(doc, source) {
    S.front = doc; S.frontSource = source; S.selftest = null; S.view = "frontier";
    render();
  }
  function readFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var parsed = JSON.parse(fr.result);
        if (parsed && parsed.schema === A.FRONTIER_SCHEMA) { adoptFrontier(parsed, file.name); return; }
        adopt(parsed, file.name);
        return;
      }
      catch (e) { S.doc = null; S.source = file.name; render(); $("h-canvas").innerHTML = '<div class="refuse ui"><h2>Not JSON</h2><p>' + esc(e.message) + "</p></div>"; }
    };
    fr.readAsText(file);
  }

  document.addEventListener("dragover", function (e) { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", function () { document.body.classList.remove("dropping"); });
  document.addEventListener("drop", function (e) {
    e.preventDefault(); document.body.classList.remove("dropping");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  // The frontier explorer's document rides in its own embedded blob: an
  // fws_frontier/1 file is a different KIND of document (many provisionings,
  // not one placement), so it never displaces the atlas on screen.
  var embeddedFront = null;
  try { embeddedFront = JSON.parse($("frontier-embedded").textContent); } catch (e) { embeddedFront = null; }
  if (embeddedFront) { S.front = embeddedFront; S.frontSource = "embedded blob"; }

  // Embedded blob first, so the page paints with no network at all.
  var embedded = null;
  try { embedded = JSON.parse($("atlas-embedded").textContent); } catch (e) { embedded = null; }
  if (embedded) adopt(embedded, "embedded blob");
  else { S.doc = null; S.source = "none"; render(); }

  var wantedFront = (/[?&]frontier=([^&]+)/.exec(location.search || "") || [])[1];
  wantedFront = wantedFront ? decodeURIComponent(wantedFront) : null;
  if (wantedFront && /[\/\\]/.test(wantedFront)) wantedFront = null;
  if (wantedFront && typeof fetch === "function") {
    fetch(wantedFront, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.schema === A.FRONTIER_SCHEMA) { adoptFrontier(j, wantedFront + " (sibling file)"); }
      })
      .catch(function () { /* file:// blocks this; the embedded frontier already drew */ });
  }

  // ?data=<file> opens a sibling document instead of the embedded fixture, so a
  // screenshot of any document in this directory is one URL. The name is a bare
  // basename: the atlas fetches from its own directory and nowhere else.
  var wanted = (/[?&]data=([^&]+)/.exec(location.search || "") || [])[1];
  wanted = wanted ? decodeURIComponent(wanted) : null;
  if (wanted && /[\/\\]/.test(wanted)) wanted = null;

  // The fetch happens ONLY when the URL asked for a document, or when there is
  // no embedded blob to draw. It used to run unconditionally and race the page:
  // whoever embedded a document in this file meant it to be the one on screen,
  // and a late sibling fetch would silently replace it with whatever else
  // happens to sit in the directory. The embedded blob is a deliberate act, not
  // a placeholder waiting to be upgraded.
  var target = wanted || (embedded ? null : "fixture_llama7b_tp2.json");
  if (target && typeof fetch === "function") {
    fetch(target, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        // And it still never replaces a document the user dropped or picked
        // while it was in flight: that would show the wrong mapping under the
        // right title.
        if (j && j.schema && (S.source === "embedded blob" || S.source === "none")) {
          adopt(j, target + " (sibling file)");
        }
      })
      .catch(function () { /* file:// blocks this; the embedded blob already drew */ });
  }
})();
</script>
</body>
</html>
