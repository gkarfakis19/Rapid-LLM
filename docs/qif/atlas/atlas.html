<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FWS-CIM System Atlas</title>
<style>
:root{
  --ink:#1c2a33; --muted:#5f7280; --faint:#8497a2; --accent:#176778;
  --line:#dde5e9; --bg:#f7f9fa; --card:#ffffff; --code:#eef2f4;
  --notice-bg:#f4f1e8; --notice-rule:#6b5a2a;
  --refuse-bg:#f6ecea; --refuse-rule:#7a2e2e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Georgia,"Times New Roman",serif}
.ui{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
main{max-width:74rem;margin:0 auto;padding:1.6rem 1.1rem 4rem}

header.top{border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:1rem}
.pid{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-size:1.65rem;line-height:1.2;margin:.3rem 0 .25rem;text-wrap:balance}
.sub{color:var(--muted);font-style:italic;margin:0 0 .6rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;font:11px/1 "Segoe UI",system-ui,sans-serif}
.pill{display:inline-block;letter-spacing:.06em;text-transform:uppercase;padding:.42em .62em;border-radius:999px;background:var(--code);color:var(--muted);font-weight:600}
.pill.on{background:#e4eef0;color:var(--accent)}
.pill.mark{background:#efeadd;color:#6b5a2a}

.bar.filt{border-top:0;padding-top:.1rem}
.bar .tag{font:700 10px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.bar .pick{display:inline-flex;align-items:center;gap:.35rem;font-size:11.5px;color:var(--muted)}
.bar .pick select,.bar .pick input{font:inherit;font-size:11.5px;padding:.18rem .3rem;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.bar .pick input[type=search]{min-width:15rem}
.bar .chk{display:inline-flex;align-items:center;gap:.3rem;font-size:11.5px;color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem;margin:.1rem 0 .6rem;font-size:12px}
.crumbs a{color:var(--accent);text-decoration:none;border-bottom:1px solid #cfe0e4}
.crumbs a:hover{border-bottom-color:var(--accent)}
.crumbs .here{font-weight:700;color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .note{color:var(--faint);font-size:11px}
.st tr.skip td{color:var(--faint)}
.band{border-left:3px solid var(--notice-rule);background:var(--notice-bg);padding:.7rem .9rem;margin:0 0 1rem;border-radius:0 4px 4px 0}
.band h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .45rem;color:var(--notice-rule)}
.band ul{margin:0;padding-left:1.1rem}
.band ul.two{column-count:2;column-gap:1.6rem}
.band ul.two li{break-inside:avoid}
@media (max-width:60rem){.band ul.two{column-count:1}}
.band li{margin:.22rem 0;font-size:.9rem}
.band .c{font-weight:700}

.refuse{border-left:3px solid var(--refuse-rule);background:var(--refuse-bg);padding:.9rem 1rem;border-radius:0 4px 4px 0}
.refuse h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .5rem;color:var(--refuse-rule)}
.refuse p{margin:.3rem 0 .7rem;font-size:.92rem}
.refuse table{width:100%;border-collapse:collapse;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif}
.refuse th{text-align:left;border-bottom:1px solid #e0cdc9;padding:.3rem .45rem;font-weight:600;color:var(--refuse-rule)}
.refuse td{border-bottom:1px solid #eddedb;padding:.3rem .45rem;vertical-align:top}

.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.5rem;margin:0 0 1rem}
.metric{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:.5rem .6rem;cursor:pointer}
.metric:hover{border-color:var(--accent)}
.metric .k{font:600 10px/1.2 "Segoe UI",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.metric .v{font:400 1.22rem/1.25 Georgia,serif;margin:.16rem 0 .05rem}
.metric .v small{font-size:.62em;color:var(--muted);margin-left:.2em}
.metric .l{font:400 11.5px/1.35 "Segoe UI",system-ui,sans-serif;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 .7rem;font:12.5px/1 "Segoe UI",system-ui,sans-serif}
button,select,label.file{font:12.5px/1 "Segoe UI",system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;cursor:pointer}
button:hover,select:hover,label.file:hover{border-color:var(--accent);color:var(--accent)}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=file]{display:none}
.bar .note{color:var(--faint);margin-left:auto;font-size:11.5px}

.body{display:flex;gap:1rem;align-items:flex-start}
.canvas{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem}
.canvas .overflow{overflow-x:auto}
svg{display:block;width:100%;height:auto;max-width:100%}
.rail{flex:0 0 19rem;max-width:19rem}
@media (max-width:60rem){.body{flex-direction:column}.rail{flex:1 1 auto;max-width:none;width:100%}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;margin-bottom:.7rem}
.panel h3{font:600 10.5px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 .5rem}
.legrow{display:flex;align-items:center;gap:.5rem;margin:.28rem 0;font:12px/1.35 "Segoe UI",system-ui,sans-serif}
.legrow .sw{flex:0 0 auto}
.legrow .tx{color:var(--muted)}
.legrow .tx b{color:var(--ink);font-weight:600}
.leg-sub{font:11px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.45rem 0 .1rem;border-top:1px solid var(--line);padding-top:.45rem}

.card dl{margin:0;font:12.2px/1.5 "Segoe UI",system-ui,sans-serif}
.card dt{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:.5rem}
.card dd{margin:.1rem 0 0;color:var(--ink);word-break:break-word}
.card .ttl{font:600 13px/1.35 "Segoe UI",system-ui,sans-serif;margin:0 0 .1rem}
.card .idl{font-size:11px;color:var(--muted);word-break:break-all}
.card table{width:100%;border-collapse:collapse;font:11.5px/1.4 "Segoe UI",system-ui,sans-serif;margin-top:.3rem}
.card th{text-align:left;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line);padding:.22rem .3rem}
.card td{border-bottom:1px solid var(--line);padding:.22rem .3rem;vertical-align:top}
.meter{height:6px;background:var(--code);border-radius:3px;overflow:hidden;margin:.2rem 0}
.meter i{display:block;height:100%}
.inv{color:#6b5a2a;font-weight:700}
.hintline{font:11.5px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.5rem 0 0}

.st table{width:100%;border-collapse:collapse;font:12px/1.45 "Segoe UI",system-ui,sans-serif}
.st th{text-align:left;border-bottom:1px solid var(--line);padding:.28rem .4rem;color:var(--faint);font-weight:600}
.st td{border-bottom:1px solid var(--line);padding:.28rem .4rem}
.st .ok{color:#2f6b46;font-weight:700}
.st .no{color:var(--refuse-rule);font-weight:700}
.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
foreignObject div{font:11px/1.2 "Segoe UI",system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="pid">P5 &middot; fws_atlas/1</div>
    <h1 id="h-title">System Atlas</h1>
    <p class="sub" id="h-sub"></p>
    <div class="pills" id="h-pills"></div>
  </header>
  <div id="h-band"></div>
  <div id="h-metrics"></div>
  <div id="h-bar"></div>
  <div id="h-crumbs"></div>
  <div class="body">
    <div class="canvas" id="h-canvas"></div>
    <div class="rail">
      <div class="panel" id="h-legend"></div>
      <div class="panel card" id="h-card"></div>
    </div>
  </div>
</main>

      if (!isStr(doc.provenance.authored)) E("R1", "provenance.authored", "a document states when it was authored");
      if (!isStr(doc.provenance.author)) E("R1", "provenance.author", "a document states what produced it");
      if (!Array.isArray(doc.provenance.invented_fields)) {
        E("R1", "provenance.invented_fields",
          "must be an array of marked field paths; a real producer's output declares an empty one");
      }
    }
    arrays.forEach(function (k) {
      if (!Array.isArray(doc[k])) {
        E(k === "chips" ? "R9" : "R1", k,
          k === "chips"
            ? "chips must be an array of objects. A chip count is not a placement"
            : "required array is missing or not an array");
        structural = true;
      }
    });
    if (structural) return { errors: errors, warnings: warnings };

    // R9 - a chip count that is a division is not a placement (AUDIT finding 1)
    var QUOTIENT = /(_per_chip$)|(^chips?_per_)|(chip_count$)|(^chips_count$)/i;
    function scanQuotient(obj, path, depth) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj) || depth > 3) return;
      Object.keys(obj).forEach(function (k) {
        var v = obj[k];
        if (QUOTIENT.test(k) && typeof v === "number" && !isInt(v)) {
          E("R9", path + k, "a derived chip count is not a placement: " + k + " = " + v);
        }
        if (v && typeof v === "object" && !Array.isArray(v)) scanQuotient(v, path + k + ".", depth + 1);
      });
    }
    scanQuotient(doc, "", 0);
    doc.systems.forEach(function (s) { scanQuotient(s, "systems[" + s.id + "].", 0); });
    doc.chips.forEach(function (c) { scanQuotient(c, "chips[" + c.id + "].", 0); });
    ["macros", "tiles", "links", "metrics"].forEach(function (k) {
      doc[k].forEach(function (o, i) {
        scanQuotient(o, k + "[" + ((o && o.id != null) ? o.id : i) + "].", 0);
      });
    });

    // R24 - the device cards themselves. ADJ-4: slicing is present iff
    // bits_per_cell < weight_bits, and a mux slot stores cols_adc columns (P2).
    Object.keys(doc.cards).forEach(function (cid) {
      var c = doc.cards[cid] || {}, at = "cards." + cid;
      if (["analog_macro", "digital_engine"].indexOf(c.kind) < 0) {
        E("R24", at + ".kind", 'must be "analog_macro" or "digital_engine", found ' + JSON.stringify(c.kind));
      }
      if (!isInt(c.weight_bits) || c.weight_bits <= 0) {
        E("R24", at + ".weight_bits", "must be a positive integer, found " + JSON.stringify(c.weight_bits));
      }
      var ccap = c.capacity || {};
      if (isInt(ccap.cols_adc) && isInt(ccap.mux) && isInt(ccap.stored_cols) &&
          ccap.stored_cols !== ccap.cols_adc * ccap.mux) {
        E("R24", at + ".capacity.stored_cols",
          "declares " + ccap.stored_cols + " but cols_adc x mux = " + (ccap.cols_adc * ccap.mux));
      }
      var slices = isInt(c.bits_per_cell) && isInt(c.weight_bits) && c.bits_per_cell < c.weight_bits;
      if (c.slicing !== slices) {
        E("R24", at + ".slicing",
          "declares " + JSON.stringify(c.slicing) + " but bits_per_cell " + JSON.stringify(c.bits_per_cell) +
          " against weight_bits " + JSON.stringify(c.weight_bits) + " makes slicing " + slices +
          " (ADJ-4: slicing is present iff bits_per_cell < weight_bits)");
      }
    });

    // R26 - a system states which inventory it is and at which phase (D16)
    doc.systems.forEach(function (sy) {
      var at = "systems[" + sy.id + "]";
      if (["unified", "prefill", "decode"].indexOf(sy.role) < 0) {
        E("R26", at + ".role", 'must be "unified", "prefill" or "decode" (D16), found ' + JSON.stringify(sy.role));
      }
      if (["prefill", "decode"].indexOf(sy.phase) < 0) {
        E("R26", at + ".phase",
          'must be "prefill" or "decode": the metrics and duty cycles describe one operating point, found ' +
          JSON.stringify(sy.phase));
      }
    });

    var sysById = byId(doc.systems), chipById = byId(doc.chips);
    var macroById = byId(doc.macros), tileById = byId(doc.tiles);

    var modelById = {};
    doc.systems.forEach(function (s) {
      (s.models || []).forEach(function (m) { if (m && m.id != null) modelById[m.id] = m; });
    });

    // R2 / R8 / R4 - chips
    var chipHolds = {};
    doc.chips.forEach(function (c) {
      var at = "chips[" + c.id + "]";
      if (!sysById[c.system]) E("R2", at + ".system", 'no system "' + c.system + '" in systems[]');
      if (c.pool !== "analog" && c.pool !== "digital") E("R2", at + ".pool", 'pool must be "analog" or "digital", found ' + JSON.stringify(c.pool));

      var slots = c.capacity && c.capacity.macro_slots;
      if (!isInt(slots) || slots <= 0) {
        E("R8", at + ".capacity.macro_slots", "must be a positive integer, found " + JSON.stringify(slots));
      } else if (!Array.isArray(c.macros) || c.macros.length !== slots) {
        E("R8", at + ".capacity.macro_slots",
          "declares " + slots + " slots but lists " + (Array.isArray(c.macros) ? c.macros.length : 0) + " macros");
      }
      var held = {};
      (c.macros || []).forEach(function (mid) {
        held[mid] = true;
        var m = macroById[mid];
        if (!m) E("R4", at + ".macros", 'lists macro "' + mid + '", which is not in macros[]');
        else if (m.chip !== c.id) E("R4", at + ".macros", 'lists macro "' + mid + '", whose .chip is "' + m.chip + '"');
      });
      chipHolds[c.id] = held;
    });

    // R3 / R7 / R10 / R5 - macros
    doc.macros.forEach(function (m) {
      var at = "macros[" + m.id + "]";
      if (!chipById[m.chip]) E("R3", at + ".chip", 'no chip "' + m.chip + '" in chips[]');
      else if (!chipHolds[m.chip][m.id]) E("R3", at + ".chip", 'chip "' + m.chip + '" does not list this macro');

      if (!doc.cards[m.card]) E("R7", at + ".card", 'no device card "' + m.card + '" in cards');

      var tl = Array.isArray(m.tiles) ? m.tiles : [];
      if (!Array.isArray(m.tiles)) E("R5", at + ".tiles", "must be an array of tile ids");
      tl.forEach(function (tid) {
        var t = tileById[tid];
        if (!t) E("R5", at + ".tiles", 'lists tile "' + tid + '", which is not in tiles[]');
        else if (t.macro !== m.id) E("R5", at + ".tiles", 'lists tile "' + tid + '", whose .macro is "' + t.macro + '"');
      });
      // R27 - a duty cycle is a fraction of a period, and it is painted as a
      // bar: an out-of-range value would render as a plausible full or empty one.
      if (m.duty_cycle != null &&
          (typeof m.duty_cycle !== "number" || !isFinite(m.duty_cycle) || m.duty_cycle < 0 || m.duty_cycle > 1)) {
        E("R27", at + ".duty_cycle", "must be a fraction in [0, 1] or null, found " + JSON.stringify(m.duty_cycle));
      }
      // the named-owner invariant (D21)
      if (tl.length === 0 && !isStr(m.reserved)) {
        E("R10", at + ".reserved",
          "a macro with no tiles must name its reservation: every macro has a named owner");
      }
    });

    // R11..R16 - tiles
    var spans = {};
    doc.tiles.forEach(function (t) {
      var at = "tiles[" + t.id + "]";
      var m = macroById[t.macro];
      if (!m) { E("R5", at + ".macro", 'no macro "' + t.macro + '" in macros[]'); return; }
      if ((m.tiles || []).indexOf(t.id) < 0) E("R5", at + ".macro", 'macro "' + m.id + '" does not list this tile');

      var o = t.owner || {};
      var model = modelById[o.model];
      if (!model) E("R11", at + ".owner.model", 'no model "' + o.model + '" in systems[].models[]');
      else if (Array.isArray(model.blocks) && model.blocks.indexOf(o.block) < 0) {
        E("R11", at + ".owner.block", '"' + o.block + '" is not in the model\'s blocks[]');
      } else if (!isInt(o.layer)) {
        var ends = (model.endpoint_blocks || []);
        if (o.layer !== null) E("R11", at + ".owner.layer", "must be an integer or null, found " + JSON.stringify(o.layer));
        else if (ends.indexOf(o.block) < 0) E("R11", at + ".owner.layer", 'is null, but "' + o.block + '" is not an endpoint block');
      }

      var cap = capacityOf(doc, m);
      var col = t.columns || {};
      if (!isInt(col.start) || col.start < 0) E("R12", at + ".columns.start", "must be a non-negative integer, found " + JSON.stringify(col.start));
      if (!isInt(col.count) || col.count <= 0) E("R12", at + ".columns.count", "must be a positive integer, found " + JSON.stringify(col.count));
      if (cap && isInt(col.start) && isInt(col.count) && col.start + col.count > cap.stored_cols) {
        E("R12", at + ".columns", "span [" + col.start + ", " + (col.start + col.count) + ") exceeds the macro's " + cap.stored_cols + " stored columns");
      }
      var sh = t.shape || {};
      if (isInt(col.count) && sh.N !== col.count) E("R14", at + ".shape.N", "N = " + JSON.stringify(sh.N) + " but the column span holds " + col.count);
      if (cap && isInt(sh.K) && sh.K > cap.rows) E("R15", at + ".shape.K", "K = " + sh.K + " exceeds the macro's " + cap.rows + " rows");

      // R25 - bit slicing (D11) is a card property; a tile may not claim a
      // slice role on a card that stores whole weight words.
      var tcard = doc.cards[m.card] || {};
      if (t.slice != null) {
        if (!tcard.slicing) {
          E("R25", at + ".slice", 'is set, but card "' + m.card + '" does not slice (D11)');
        } else if (!isInt(t.slice.of) || t.slice.of <= 0 || !isInt(t.slice.index) ||
                   t.slice.index < 0 || t.slice.index >= t.slice.of ||
                   !isInt(t.slice.bits) || t.slice.bits <= 0) {
          E("R25", at + ".slice",
            "must be {index, of, bits} with 0 <= index < of and bits > 0, found " + JSON.stringify(t.slice));
        }
      }

      if (!isStr(t.primary_group) || AXES.indexOf(t.primary_group) < 0) {
        E("R20", at + ".primary_group", 'must be "tp", "ep" or "pp", found ' + JSON.stringify(t.primary_group));
      } else if (!t.groups || !isInt(t.groups[t.primary_group])) {
        E("R20", at + ".groups." + t.primary_group, "the primary axis has no index in groups");
      }

      if (isInt(col.start) && isInt(col.count)) {
        (spans[t.macro] = spans[t.macro] || []).push({ id: t.id, a: col.start, b: col.start + col.count });
      }
    });

    // R13 / R16 - column spans and the occupancy they imply
    doc.macros.forEach(function (m) {
      var at = "macros[" + m.id + "]";
      var list = (spans[m.id] || []).slice().sort(function (x, y) { return x.a - y.a; });
      var held = 0;
      for (var i = 0; i < list.length; i++) {
        held += list[i].b - list[i].a;
        if (i > 0 && list[i].a < list[i - 1].b) {
          E("R13", "tiles[" + list[i].id + "].columns",
            'overlaps tile "' + list[i - 1].id + '" on macro ' + m.id + " (columns " + list[i].a + " < " + list[i - 1].b + ")");
        }
      }
      var cap = capacityOf(doc, m);
      if (cap && isInt(cap.stored_cols) && cap.stored_cols > 0) {
        var want = held / cap.stored_cols;
        if (typeof m.occupancy !== "number" || Math.abs(m.occupancy - want) > 1e-9) {
          E("R16", at + ".occupancy",
            "declares " + fmt(m.occupancy) + " but the enumerated column spans hold " + held + " of " + cap.stored_cols + " (" + fmt(want) + ")");
        }
      }
    });

    // R17 - chip occupancy against the enumerated macros
    doc.chips.forEach(function (c) {
      var slots = c.capacity && c.capacity.macro_slots;
      if (!isInt(slots) || slots <= 0) return;
      var used = 0;
      (c.macros || []).forEach(function (mid) {
        var m = macroById[mid];
        if (m && Array.isArray(m.tiles) && m.tiles.length > 0) used++;
      });
      var want = used / slots;
      if (typeof c.occupancy !== "number" || Math.abs(c.occupancy - want) > 1e-9) {
        E("R17", "chips[" + c.id + "].occupancy",
          "declares " + fmt(c.occupancy) + " but " + used + " of " + slots + " enumerated slots hold tiles (" + fmt(want) + ")");
      }
    });

    // R21 - a chip may not claim a group its own tiles contradict
    doc.chips.forEach(function (c) {
      if (!isStr(c.primary_group) || !c.groups || !isInt(c.groups[c.primary_group])) {
        if (c.primary_group != null || c.groups != null) {
          E("R21", "chips[" + c.id + "].primary_group", "must name an axis that groups indexes");
        }
        return;
      }
      var ax = c.primary_group, idx = c.groups[ax];
      (c.macros || []).forEach(function (mid) {
        var m = macroById[mid];
        ((m && m.tiles) || []).forEach(function (tid) {
          var t = tileById[tid];
          if (t && t.groups && isInt(t.groups[ax]) && t.groups[ax] !== idx) {
            E("R21", "chips[" + c.id + "].groups." + ax,
              "chip claims " + ax + " " + idx + ' but resident tile "' + tid + '" is ' + ax + " " + t.groups[ax]);
          }
        });
      });
    });

    // R6 - links
    doc.links.forEach(function (l) {
      var at = "links[" + l.id + "]";
      if (!chipById[l.from]) E("R6", at + ".from", 'no chip "' + l.from + '" in chips[]');
      if (!chipById[l.to]) E("R6", at + ".to", 'no chip "' + l.to + '" in chips[]');
      if (["tp", "ep", "pp", "pd", "act"].indexOf(l.role) < 0) E("R6", at + ".role", "unknown link role " + JSON.stringify(l.role));
      if (typeof l.bytes !== "number" || !isFinite(l.bytes) || l.bytes < 0) E("R6", at + ".bytes", "must be a non-negative number, found " + JSON.stringify(l.bytes));
      if (!isStr(l.per)) E("R6", at + ".per", "a byte count states what it is per (a step, a token, a request)");
      if (!isStr(l.basis)) E("R6", at + ".basis", "every link states where its number came from");
    });

    // R18 - one labeled accounting per metric (AUDIT finding 4)
    var byKey = {};
    doc.metrics.forEach(function (m, i) {
      var at = "metrics[" + i + " " + (m && m.key) + "]";
      if (!isStr(m.key)) { E("R18", at + ".key", "a metric needs a key"); return; }
      if (!isStr(m.basis)) E("R18", at + ".basis", "every metric states where its number came from");
      if (typeof m.value !== "number" || !isFinite(m.value)) {
        E("R18", at + ".value", "must be a finite number, found " + JSON.stringify(m.value));
      }
      (byKey[m.key] = byKey[m.key] || []).push({ i: i, label: m.label });
    });
    Object.keys(byKey).forEach(function (k) {
      var list = byKey[k], seen = {};
      list.forEach(function (e) {
        var at = "metrics[" + e.i + " " + k + "].label";
        if (!isStr(e.label)) {
          E("R18", at, list.length > 1
            ? "two figures for one metric are legal only when both are labeled"
            : "a metric needs a label; the atlas never picks which figure is the headline");
        } else if (seen[e.label]) {
          E("R18", at, 'duplicates the label "' + e.label + '" already used for metric "' + k + '"');
        } else seen[e.label] = true;
      });
    });

    // R19 - disclosed relaxations
    doc.relaxations.forEach(function (r, i) {
      ["constraint", "value", "reason"].forEach(function (f) {
        if (!isStr(r && r[f])) E("R19", "relaxations[" + i + "]." + f, "a disclosed relaxation states its " + f);
      });
    });

    // R28 - in a document with more than one system, every metric must name the
    // system it measures. A PD pair publishes the same headline LABEL twice,
    // once per inventory (D16), so a metric strip that does not say whose figure
    // it is puts two readings of one quantity in front of a reader with no way
    // to tell them apart - AUDIT finding 4 one level up.
    if (doc.systems.length > 1) {
      doc.metrics.forEach(function (m, i) {
        var at = "metrics[" + i + " " + (m && m.key) + "]";
        var named = null;
        if (m && m.system != null) {
          if (!sysById[m.system]) {
            E("R28", at + ".system", 'names system "' + m.system + '", which is not in systems[]');
          } else named = m.system;
        } else if (isStr(m && m.key)) {
          doc.systems.forEach(function (sy) {
            if (m.key.indexOf(sy.id + ".") === 0 && (named == null || sy.id.length > named.length)) {
              named = sy.id;
            }
          });
        }
        if (named == null) {
          E("R28", at + ".system",
            "this document holds " + doc.systems.length + " systems, so every metric states which one it " +
            "measures: give it a system field naming one, or a key prefixed with the system id");
        }
      });
    }

    // R29 - PD is two inventories and ONE handoff (D16). Two systems drawn side
    // by side with no link between them are two pictures, not a machine, and a
    // pd link with both ends inside one system is a handoff to itself.
    var pdLinks = doc.links.filter(function (l) { return l.role === "pd"; });
    pdLinks.forEach(function (l) {
      var a = chipById[l.from], b = chipById[l.to];
      if (a && b && a.system === b.system) {
        E("R29", "links[" + l.id + "].role",
          'a pd handoff runs BETWEEN a prefill system and a decode system (D16); both ends of this one are in "' +
          a.system + '"');
      }
    });
    if (doc.systems.length > 1) {
      var roles = doc.systems.map(function (sy) { return sy.role; });
      if (roles.slice().sort().join(",") !== "decode,prefill") {
        E("R29", "systems[].role",
          "two or more systems in one document is PD disaggregation: exactly one prefill and one decode " +
          "(D16). Found " + JSON.stringify(roles));
      }
      if (pdLinks.length !== 1) {
        E("R29", "links[].role",
          "a PD document carries exactly ONE handoff link (D16); found " + pdLinks.length +
          ". The handoff is the only coupling the two inventories have, so a document without it draws " +
          "two machines that never meet");
      }
    }

    // R22 - hue capacity. A warning: the excess draws as the over-palette hatch,
    // and no hue is ever cycled.
    var keys = hueKeys(doc);
    if (keys.length > HUES.length) {
      W("R22", "tiles[].primary_group",
        keys.length + " distinct (axis, index) groups are co-visible but the validated palette holds " +
        HUES.length + ". " + keys.slice(HUES.length).join(", ") + " draw as the over-palette hatch. Hues are never cycled.");
    }

    // draw budget, stated out loud - and measured in the unit it is stated in
    doc.chips.forEach(function (c) {
      var rects = chipRects(doc, c, true);
      if (rects > DRAW_BUDGET) {
        W("R23", "chips[" + c.id + "].macros",
          ((c.macros || []).length) + " enumerated macros draw " + rects +
          " rects with the duty overlay on, past the phase-1 draw budget of " +
          DRAW_BUDGET + "; this chip is not drawn");
      }
    });

    return { errors: errors, warnings: warnings };
  }

  // ---- the drill/filter view rules (phase 2) --------------------------------
  // Everything here is PURE: it decides what is drawn, never what a number is.
  // A filter changes the picture and never a figure, and the hue map is built
  // from the whole file so a filter can never repaint a group.

  function makeIndex(doc) {
    var ix = {
      chip: byId(doc.chips), macro: byId(doc.macros), tile: byId(doc.tiles),
      link: byId(doc.links), sys: byId(doc.systems), owner: {}
    };
    // owner tuple -> every tile that carries a piece of that ONE weight matrix,
    // wherever it sits. It is what tells a reader whether a matrix composes
    // inside one macro or chains across several (D11).
    (doc.tiles || []).forEach(function (t) {
      var key = ownerKey(t);
      (ix.owner[key] = ix.owner[key] || []).push(t.id);
    });
    return ix;
  }

  function emptyFilter() { return { model: "", layer: "", group: "", pool: "", q: "" }; }
  function filterActive(f) {
    return !!(f && (f.model || f.layer || f.group || f.pool || f.q));
  }

  function layerKey(tile) {
    var o = (tile && tile.owner) || {};
    return o.layer == null ? "endpoint" : String(o.layer);
  }
  // The owner vocabulary a search may match: identities only. Occupancy, duty
  // cycle and every other MEASURED number is deliberately absent - a search that
  // matched digits would let a reader select by a value and read the selection
  // as a fact about it.
  function ownerText(doc, ix, tile) {
    var o = (tile && tile.owner) || {};
    var chip = ix.macro[tile.macro] ? ix.macro[tile.macro].chip : "";
    return [
      tile.id, tile.macro, chip, o.model, o.block,
      o.layer == null ? "endpoint" : "layer " + o.layer,
      o.expert == null ? "" : "expert " + o.expert,
      tile.slice ? "slice " + tile.slice.index + "/" + tile.slice.of : "",
      groupKey(tile) || ""
    ].join(" ").toLowerCase();
  }
  function macroText(doc, ix, macro) {
    return [macro.id, macro.chip, macro.card, macro.reserved || ""].join(" ").toLowerCase();
  }
  function chipText(doc, ix, chip) {
    return [chip.id, chip.label || "", chip.system, chip.pool].join(" ").toLowerCase();
  }

  function tileMatches(doc, ix, tile, f) {
    if (!filterActive(f)) return true;
    var o = (tile && tile.owner) || {};
    if (f.model && o.model !== f.model) return false;
    if (f.layer && layerKey(tile) !== f.layer) return false;
    if (f.group && groupKey(tile) !== f.group) return false;
    if (f.pool) {
      var macro = ix.macro[tile.macro], chip = macro && ix.chip[macro.chip];
      if (!chip || chip.pool !== f.pool) return false;
    }
    if (f.q && ownerText(doc, ix, tile).indexOf(f.q.toLowerCase()) < 0) return false;
    return true;
  }

  function macroMatches(doc, ix, macro, f) {
    if (!filterActive(f)) return true;
    var chip = ix.chip[macro.chip];
    if (f.pool && (!chip || chip.pool !== f.pool)) return false;
    var owned = (macro.tiles || []).map(function (id) { return ix.tile[id]; }).filter(Boolean);
    // An owner filter is about tiles, so a macro holding none can only match on
    // the axes that are its own: its pool and its text. It is still DRAWN either
    // way - a reserved slot is an object, not a gap (D21).
    var ownerish = !!(f.model || f.layer || f.group);
    if (!owned.length) {
      if (ownerish) return false;
      return f.q ? macroText(doc, ix, macro).indexOf(f.q.toLowerCase()) >= 0 : true;
    }
    var hit = owned.some(function (t) { return tileMatches(doc, ix, t, f); });
    if (hit) return true;
    return !!(f.q && !f.model && !f.layer && !f.group &&
      macroText(doc, ix, macro).indexOf(f.q.toLowerCase()) >= 0);
  }

  function chipMatches(doc, ix, chip, f) {
    if (!filterActive(f)) return true;
    if (f.pool && chip.pool !== f.pool) return false;
    var ownerish = !!(f.model || f.layer || f.group);
    if (!ownerish && f.q && chipText(doc, ix, chip).indexOf(f.q.toLowerCase()) >= 0) return true;
    return (chip.macros || []).some(function (mid) {
      var m = ix.macro[mid];
      return m && macroMatches(doc, ix, m, f);
    });
  }

      s.push('<g data-chip="' + esc(c.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h +
        '" rx="5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.4"' + poolDash(c.pool) + "/>");
      // the identity plate: the fill carries occupancy, so the label gets its own ground
      s.push('<rect x="' + (p.x + 1.5) + '" y="' + (p.y + 1.5) + '" width="' + (p.w - 3) +
        '" height="40" rx="4" fill="' + A.PAPER + '" opacity="0.9"/>');
      s.push('<text class="mono" x="' + (p.x + 9) + '" y="' + (p.y + 19) + '" font-size="11" fill="#1c2a33">' + esc(c.id) + "</text>");
      s.push('<text class="ui" x="' + (p.x + 9) + '" y="' + (p.y + 34) + '" font-size="10.5" fill="#5f7280">' +
        esc(c.primary_group + " " + (c.groups ? c.groups[c.primary_group] : "?")) + " &middot; " +
        (c.capacity ? c.capacity.macro_slots : "?") + " slots &middot; " + c.pool + "</text>");
      // the fill already is the occupancy; the number rides on its own pill so it
      // stays readable at every step of the ramp
      s.push('<rect x="' + (p.x + 6) + '" y="' + (p.y + p.h - 22) + '" width="102" height="16" rx="8" fill="' + A.PAPER + '" opacity="0.9"/>');
      s.push('<text class="ui" x="' + (p.x + 14) + '" y="' + (p.y + p.h - 10) + '" font-size="10.5" fill="#5f7280">occupancy ' + esc(A.pct(c.occupancy)) + "</text>");
      s.push("<title>" + esc(c.id + " — " + (c.label || "")) + "</title></g>");
    });

    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // Chip view: the macro grid, ordered by id.
  function drawChip() {
    var d = S.doc;
    var chip = S.ix.chip[S.chip];
    if (!chip) return '<p class="ui">No chip selected.</p>';
    if (!A.chipDrawable(d, chip)) {
      return '<p class="ui">' + esc(chip.id) + " declares " +
        ((chip.capacity && chip.capacity.macro_slots) || 0) +
        " slots, past the draw budget of " + A.DRAW_BUDGET + " rects. Not drawn.</p>";
    }
    var ids = (chip.macros || []).slice().sort();
    var n = ids.length;
    var cols = Math.max(1, Math.min(16, Math.ceil(Math.sqrt(n * 1.35))));
    var rows = Math.ceil(n / cols);
    var CW = 46, GAP = 6, PAD = 12, HEADER = 30;
    var W = cols * CW + (cols - 1) * GAP + 2 * PAD;
    var H = rows * CW + (rows - 1) * GAP + 2 * PAD + HEADER;
    var sys = S.ix.sys[chip.system];
    var s = [svgDefs()];
    s.push('<text class="mono" x="' + PAD + '" y="16" font-size="11.5" fill="#1c2a33">' + esc(chip.id) + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="30" font-size="10.5" fill="#5f7280">' +
      esc((chip.label || "") + " · " + chip.pool + " pool · " + n + " slots · occupancy " + A.pct(chip.occupancy) +
        (sys ? " · " + sys.role + " system" : "")) + "</text>");

    ids.forEach(function (mid, i) {
      var m = S.ix.macro[mid];
      var r = Math.floor(i / cols), q = i % cols;
      var x = PAD + q * (CW + GAP), y = PAD + HEADER + r * (CW + GAP);
      if (!m) {
        s.push('<rect x="' + x + '" y="' + y + '" width="' + CW + '" height="' + CW + '" rx="3" fill="url(#p-unk)" stroke="' + A.MUTED + '"/>');
        return;
      }
      var tiles = A.macroTiles(d, S.ix, m);
      var lead = tiles.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; })[0];
      var hue = lead ? hueOf(lead) : hueOf(chip);
      var reserved = !tiles.length;
      var fill = A.fillFor(d, S.ix, m, hue);
      var stroke = reserved ? "#c2ced5" : (hue == null ? A.MUTED : hue);
      var dim = !A.macroMatches(d, S.ix, m, S.filter);
      s.push('<g data-macro="' + esc(m.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + x + '" y="' + y + '" width="' + CW + '" height="' + CW + '" rx="3" fill="' + fill +
        '" stroke="' + stroke + '" stroke-width="1.2"' + poolDash(chip.pool) + "/>");
      // the DUTY CHANNEL: its own bar on its own edge, in its own neutral ink,
      // on the absolute 0-1 scale. It never touches the occupancy fill and it
      // never becomes a hue (P5's encoding law).
      if (S.duty) s.push(dutyBar(m, x + 4, y + 4, CW - 8));
      // the column strip: position is the column offset inside the macro
      var cap = A.capacityOf(d, m);
      if (cap && cap.stored_cols && tiles.length) {
        var sx = x + 4, sw = CW - 8, sy2 = y + CW - 9;
        s.push('<rect x="' + sx + '" y="' + sy2 + '" width="' + sw + '" height="5" rx="1" fill="#ffffff" opacity="0.75"/>');
        tiles.forEach(function (t) {
          var th = hueOf(t);
          var a = sx + (t.columns.start / cap.stored_cols) * sw;
          var w = Math.max(1, (t.columns.count / cap.stored_cols) * sw);
          s.push('<rect x="' + a + '" y="' + sy2 + '" width="' + w + '" height="5" rx="1" fill="' + (th || "#8497a2") + '"/>');
        });
      }
      s.push("<title>" + esc(m.id + (reserved ? " — reserved" : " — occupancy " + A.pct(m.occupancy) + ", " + tiles.length + " tile(s)") +
        (S.duty ? " · duty " + (m.duty_cycle == null ? "unknown" : A.pct(m.duty_cycle)) : "")) + "</title>");
      s.push("</g>");
    });
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // One macro's duty cycle, drawn on the absolute 0-1 scale. A file that
  // declares none draws the unknown hatch: an absent measurement is not zero.
  function dutyBar(m, x, y, w) {
    var out = ['<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="1" fill="#ffffff" opacity="0.85" stroke="#d5dfe4" stroke-width="0.5"/>'];
    if (m.duty_cycle == null) {
      out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="1" fill="url(#p-unk)"/>');
      return out.join("");
    }
    var t = Math.max(0, Math.min(1, m.duty_cycle));
    if (t > 0) {
      out.push('<rect x="' + x + '" y="' + y + '" width="' + Math.max(A.BAND_FLOOR_PX, t * w) +
        '" height="4" rx="1" fill="' + A.DUTY_INK + '"/>');
    }
    return out.join("");
  }

  // Macro view: the column map. One band per resident tile, positioned at its
  // own column offset; tiles that carry ONE weight matrix share a bracket (D11).
  function drawMacro() {
    var d = S.doc;
    var m = S.ix.macro[S.macro];
    if (!m) return '<p class="ui">No macro selected. Open a chip and click a macro.</p>';
    var cap = A.capacityOf(d, m) || {};
    var stored = cap.stored_cols || 1;
    var tiles = A.macroTiles(d, S.ix, m);
    var brackets = A.bracketsFor(d, S.ix, m);
    var PAD = 14, W = 900, TRACK = 58, LANE = 24;
    var lanes = brackets.length;
    // an empty macro spends its bracket lane on the reservation line instead
    var top = 46 + lanes * LANE + (tiles.length ? 0 : 14);
    var H = top + TRACK + 74;
    var x0 = PAD, w0 = W - 2 * PAD;
    function px(col) { return x0 + (col / stored) * w0; }
    var s = [svgDefs()];
    s.push('<text class="mono" x="' + PAD + '" y="16" font-size="11.5" fill="#1c2a33">' + esc(m.id) + "</text>");
    s.push('<text class="ui" x="' + PAD + '" y="30" font-size="10.5" fill="#5f7280">' +
      esc("on " + m.chip + " · card " + m.card + " · " + cap.rows + " rows × " + stored +
        " stored columns · occupancy " + A.pct(m.occupancy) +
        " · duty " + (m.duty_cycle == null ? "unknown" : A.fmt(m.duty_cycle))) + "</text>");

    // brackets, one lane each, above the track. The label sits above its own
    // bracket and is clamped into the box: a caption that runs off the edge is
    // a caption the reader does not get.
    brackets.forEach(function (b, i) {
      var lane = 40 + i * LANE;
      var y = lane + 11;
      var a = px(b.start), z = px(b.end);
      s.push('<path d="M' + a + " " + (y + 9) + "V" + y + "H" + z + "V" + (y + 9) +
        '" fill="none" stroke="' + (b.kind === "slice" ? "#1c2a33" : "#8497a2") +
        '" stroke-width="' + (b.kind === "slice" ? 1.5 : 1) + '"/>');
      var est = b.label.length * 5.1;
      var lx = Math.max(PAD, Math.min(a, W - PAD - est));
      s.push('<text class="ui" x="' + lx + '" y="' + (lane + 7) + '" font-size="10" fill="#5f7280">' +
        esc(b.label) + "</text>");
    });

    // A macro with no tiles is still a drawn object with a NAMED owner (D21):
    // the column map is empty and the reservation says why.
    if (!tiles.length) {
      s.push('<text class="ui" x="' + PAD + '" y="' + (top - 8) + '" font-size="10.5" fill="#5f7280">' +
        esc("no tiles — reserved: " + (m.reserved || "(unnamed)")) + "</text>");
    }
    // the track: every stored column of the macro, whether or not a tile holds it
    s.push('<rect x="' + x0 + '" y="' + top + '" width="' + w0 + '" height="' + TRACK +
      '" rx="3" fill="url(#p-unk)" stroke="#d5dfe4"/>');
    tiles.forEach(function (t) {
      var a = px(t.columns.start);
      var w = Math.max(A.BAND_FLOOR_PX, (t.columns.count / stored) * w0);
      var hue = hueOf(t) || "#8497a2";
      var dim = !A.tileMatches(d, S.ix, t, S.filter);
      s.push('<g data-tile="' + esc(t.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + a + '" y="' + top + '" width="' + w + '" height="' + TRACK +
        '" rx="2" fill="' + hue + '" stroke="#ffffff" stroke-width="0.75"/>');
      if (w > 54) {
        var o = t.owner || {};
        s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 17) + '" font-size="10.5" fill="#ffffff">' +
          esc(o.block + (o.layer == null ? "" : " L" + o.layer)) + "</text>");
        s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 31) + '" font-size="10" fill="#ffffff" opacity="0.88">' +
          esc(t.shape.K + "×" + t.shape.N) + "</text>");
        if (t.slice) {
          s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 45) + '" font-size="10" fill="#ffffff" opacity="0.88">' +
            esc("slice " + t.slice.index + "/" + t.slice.of) + "</text>");
        }
      }
      s.push("<title>" + esc(t.id + " — columns [" + t.columns.start + ", " +
        (t.columns.start + t.columns.count) + ")") + "</title></g>");
    });

    // the column axis: the only positions on screen are column offsets
    var yAxis = top + TRACK + 16;
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var col = Math.round(f * stored);
      s.push('<line x1="' + px(col) + '" y1="' + (top + TRACK) + '" x2="' + px(col) + '" y2="' + (yAxis - 8) +
        '" stroke="#c8d4da"/>');
      s.push('<text class="mono" x="' + px(col) + '" y="' + yAxis + '" font-size="10" fill="#8497a2" text-anchor="' +
        (f === 0 ? "start" : f === 1 ? "end" : "middle") + '">' + col + "</text>");
    });
    s.push('<text class="ui" x="' + x0 + '" y="' + (yAxis + 16) + '" font-size="10.5" fill="#8497a2">' +
      esc("stored column offset · hatch = columns no tile holds (unowned capacity is legal and reported, ADJ-5)") +
      "</text>");
    if (S.duty) {
      s.push('<text class="ui" x="' + x0 + '" y="' + (yAxis + 32) + '" font-size="10.5" fill="' + A.DUTY_INK + '">' +
        esc(m.duty_cycle == null
          ? "duty cycle unknown — this document declares none for this macro"
          : "duty cycle " + A.fmt(m.duty_cycle) + " — the fraction of the period this macro is " +
            "active, drawn on the absolute 0–1 scale") + "</text>");
      s.push(dutyBar(m, x0, yAxis + 38, w0));
    }
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // ----------------------------------------------------------------- cards ---
  function meter(v, hue) {
    var t = Math.max(0, Math.min(1, v == null ? 0 : v));
    return '<div class="meter"><i style="width:' + (t * 100) + "%;background:" + (hue || A.MUTED) + '"></i></div>';
  }
  // The duty bar in a card: the SAME absolute 0-1 scale and the SAME neutral
  // ink as the overlay, so one number reads one way wherever it appears.
  function dutyMeter(v) {
    var t = Math.max(0, Math.min(1, v == null ? 0 : v));
    return '<div class="meter" title="absolute 0–1 scale"><i style="width:' +
      (t > 0 ? Math.max(0.6, t * 100) : 0) + "%;background:" + A.DUTY_INK + '"></i></div>' +
      '<span class="hintline" style="display:block">fraction of the period this macro is active — absolute 0–1 scale</span>';
  }
  function invMark(paths, coll, obj, field) {
    return A.isInvented(paths, coll, obj, field) ? '<span class="inv" title="fixture-invented value">◇</span> ' : "";
  }
  function groupWords(o) {
    if (!o || !o.groups) return "unknown";
    return A.AXES.map(function (a) { return a + " " + (o.groups[a] == null ? "—" : o.groups[a]); }).join(" &middot; ") +
      (o.primary_group ? " &middot; hue from <b>" + esc(o.primary_group) + "</b>" : "");
  }

  function macroCard(m) {
    var d = S.doc, paths = A.inventedIndex(d);
    var tById = A.byId(d.tiles);
    var cap = A.capacityOf(d, m) || {};
    var card = d.cards[m.card] || {};
    var tiles = (m.tiles || []).map(function (t) { return tById[t]; }).filter(Boolean)
      .sort(function (a, b) { return a.columns.start - b.columns.start; });
    var hue = tiles.length ? hueOf(tiles[0]) : null;
    var h = ['<div class="ttl">macro</div><div class="idl mono">' + esc(m.id) + "</div><dl>"];
    h.push("<dt>chip</dt><dd class=\"mono\">" + esc(m.chip) + "</dd>");
    h.push("<dt>device card</dt><dd>" + esc(card.label || m.card) + "<br><span class=\"mono\" style=\"font-size:11px\">" +
      esc(cap.rows + " rows × " + cap.cols_adc + " ADC × " + cap.mux + " mux = " + cap.stored_cols + " stored columns") + "</span></dd>");
    h.push("<dt>area</dt><dd>" + (card.area_mm2 == null ? '<span style="color:#8497a2">unknown — no run supplies it</span>' : esc(A.fmt(card.area_mm2)) + " mm²") + "</dd>");
    h.push("<dt>occupancy</dt><dd>" + invMark(paths, "macros", m, "occupancy") + esc(A.pct(m.occupancy)) + meter(m.occupancy, hue) + "</dd>");
    h.push("<dt>duty cycle</dt><dd>" + invMark(paths, "macros", m, "duty_cycle") +
      (m.duty_cycle == null
        ? '<span style="color:#8497a2">unknown — this document declares none (P4 owns it)</span>'
        : esc(A.fmt(m.duty_cycle)) + dutyMeter(m.duty_cycle)) + "</dd>");
    if (m.digital_pool) {
      h.push("<dt>per-macro digital pool (D12)</dt><dd>" + invMark(paths, "macros", m, "digital_pool") +
        esc(m.digital_pool.shift_add_units + " shift/add units · " + m.digital_pool.act_lanes + " activation lanes · " +
          A.fmt(m.digital_pool.area_mm2) + " mm²") + "</dd>");
    }
    if (m.reserved) h.push("<dt>reserved</dt><dd>" + esc(m.reserved) + "</dd>");
    h.push("</dl>");
    if (tiles.length) {
      h.push('<div class="ttl" style="margin-top:.7rem">tiles — ' + tiles.length + "</div>");
      h.push("<table><tr><th>owner</th><th>K×N</th><th>columns</th><th>group</th></tr>");
      tiles.forEach(function (t) {
        var o = t.owner || {};
        var g = t.groups ? t.primary_group + " " + t.groups[t.primary_group] : "—";
        h.push("<tr><td>" + esc(o.model) + "<br>" +
          esc(o.layer == null ? "endpoint" : "layer " + o.layer) + " &middot; " + esc(o.block) +
          (o.expert == null ? "" : " &middot; expert " + esc(o.expert)) +
          (t.slice ? "<br>slice " + esc(t.slice.index + "/" + t.slice.of) : "") + "</td>" +
          "<td>" + esc(t.shape.K + "×" + t.shape.N) + "</td>" +
          "<td>" + invMark(paths, "tiles", t, "columns") +
          esc("[" + t.columns.start + ", " + (t.columns.start + t.columns.count) + ")") + "</td>" +
          '<td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' +
          (hueOf(t) || "#8497a2") + '"></span> ' + esc(g) + "</td></tr>");
      });
      h.push("</table>");
      h.push('<p class="hintline">Gaps in the column strip are columns no tile spans. Unowned capacity is legal and reported (ADJ-5).</p>');
      var brackets = A.bracketsFor(d, S.ix, m);
      if (brackets.length) {
        h.push('<div class="ttl" style="margin-top:.7rem">column map brackets — ' + brackets.length + "</div>");
        h.push("<ul style=\"margin:.2rem 0 0;padding-left:1.05rem;font-size:11.5px\">");
        brackets.forEach(function (b) {
          h.push("<li>" + esc(b.label) +
            (b.chained.length ? ' <span class="mono" style="font-size:10.5px">' + esc(b.chained.join(" ")) + "</span>" : "") +
            "</li>");
        });
        h.push("</ul>");
      }
      h.push('<p class="hintline">Open the Macro view for the full column map and its brackets (D11).</p>');
    }
    return h.join("");
  }

  function tileCard(t) {
    var d = S.doc, paths = A.inventedIndex(d);
    var o = t.owner || {};
    var macro = S.ix.macro[t.macro];
    var siblings = (S.ix.owner[A.ownerKey(t)] || []).filter(function (id) { return id !== t.id; });
    var h = ['<div class="ttl">tile</div><div class="idl mono">' + esc(t.id) + "</div><dl>"];
    h.push("<dt>owner</dt><dd>" + esc(o.model) + "<br>" +
      esc((o.layer == null ? "endpoint" : "layer " + o.layer) + " · " + o.block +
        (o.expert == null ? "" : " · expert " + o.expert)) + "</dd>");
    h.push("<dt>shape</dt><dd>" + esc(t.shape.K + " × " + t.shape.N) + " — this tile, not the whole matrix</dd>");
    h.push("<dt>columns</dt><dd>" + invMark(paths, "tiles", t, "columns") +
      esc("[" + t.columns.start + ", " + (t.columns.start + t.columns.count) + ") of " +
        ((A.capacityOf(d, macro) || {}).stored_cols || "?")) + "</dd>");
    h.push("<dt>slice</dt><dd>" + (t.slice
      ? esc("slice " + t.slice.index + " of " + t.slice.of + " · " + t.slice.bits + " bits per cell (D11)")
      : '<span style="color:#8497a2">none — this card stores whole weight words</span>') + "</dd>");
    h.push("<dt>group</dt><dd>" + groupWords(t) + "</dd>");
    h.push("<dt>host</dt><dd class=\"mono\">" + esc(t.macro + " · " + (macro ? macro.chip : "?")) + "</dd>");
    h.push("</dl>");
    if (siblings.length) {
      h.push('<p class="hintline">This weight matrix is carried by ' + (siblings.length + 1) +
        " tiles sharing one owner tuple; the column map brackets them (D11).</p>");
    }
    return h.join("");
  }

  function chipCard(c) {
    var d = S.doc, paths = A.inventedIndex(d);
    var h = ['<div class="ttl">chip</div><div class="idl mono">' + esc(c.id) + "</div><dl>"];
    h.push("<dt>label</dt><dd>" + esc(c.label || "—") + "</dd>");
    h.push("<dt>system</dt><dd class=\"mono\">" + esc(c.system) + "</dd>");
    h.push("<dt>pool</dt><dd>" + esc(c.pool) + (c.pool === "digital" ? " — shared digital chiplet (D13); it stores no weights" : " — analog macro chiplet") + "</dd>");
    h.push("<dt>slots</dt><dd>" + esc((c.capacity && c.capacity.macro_slots) || "?") + " enumerated macro slots</dd>");
    h.push("<dt>occupancy</dt><dd>" + invMark(paths, "chips", c, "occupancy") + esc(A.pct(c.occupancy)) + meter(c.occupancy, hueOf(c)) + "</dd>");
    h.push("<dt>groups</dt><dd>" + groupWords(c) + "</dd>");
    h.push("</dl>");
    var ls = d.links.filter(function (l) { return l.from === c.id || l.to === c.id; });
    if (ls.length) {
      h.push('<div class="ttl" style="margin-top:.7rem">links — ' + ls.length + "</div>");
      h.push("<table><tr><th>role</th><th>other end</th><th>bytes</th></tr>");
      ls.forEach(function (l) {
        h.push("<tr><td>" + esc(l.role) + "</td><td class=\"mono\">" + esc(l.from === c.id ? l.to : l.from) + "</td><td>" +
          invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</td></tr>");
      });
      h.push("</table>");
    }
    h.push('<p class="hintline">Click the chip, or pick it in the Chip view, to see its macros.</p>');
    return h.join("");
  }

  function linkCard(l) {
    var paths = A.inventedIndex(S.doc);
    return ['<div class="ttl">link</div><div class="idl mono">' + esc(l.id) + "</div><dl>",
      "<dt>role</dt><dd>" + esc(l.role) + "</dd>",
      "<dt>from &rarr; to</dt><dd class=\"mono\">" + esc(l.from) + " &rarr; " + esc(l.to) + "</dd>",
      "<dt>bytes per " + esc(l.per || "unit") + "</dt><dd>" + invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</dd>",
      "<dt>carries</dt><dd>" + esc(l.label || "—") + "</dd>",
      "<dt>basis</dt><dd>" + esc(l.basis || "—") + "</dd></dl>",
      '<p class="hintline">Fully-connected p2p, no congestion model (D17). The atlas draws bytes, never link times.</p>'
    ].join("");
  }

  function metricCard(m) {
    var paths = A.inventedIndex(S.doc);
    var sysId = A.metricSystem(S.doc, m);
    return ['<div class="ttl">metric</div><div class="idl mono">' + esc(m.key) + "</div><dl>",
      (S.doc.systems.length > 1
        ? "<dt>system</dt><dd class=\"mono\">" + esc(sysId || "—") +
          "</dd>" : ""),
      "<dt>figure</dt><dd>" + esc(m.label) + "</dd>",
      "<dt>value</dt><dd>" + invMark(paths, "metrics", m, "value") + esc(A.fmt(m.value)) + " " + esc(m.unit || "") + "</dd>",
      "<dt>basis</dt><dd>" + esc(m.basis || "—") + "</dd></dl>",
      '<p class="hintline">The producer labels its figures; the atlas never picks which one is the headline.</p>'
    ].join("");
  }

  function defaultCard() {
    var d = S.doc;
    if (!d) return '<div class="ttl">No document</div><p class="hintline">Drop an atlas.json onto this page, or use Open.</p>';
    if (d.systems.length > 1) return pdCard();
    var sys = d.systems[0] || {}, mdl = (sys.models || [])[0] || {};
    var h = ['<div class="ttl">system</div><div class="idl mono">' + esc(sys.id || "") + "</div><dl>"];
    h.push("<dt>role &middot; phase</dt><dd>" + esc((sys.role || "?") + " · " + (sys.phase || "?")) + "</dd>");
    h.push("<dt>parallelism</dt><dd>" + esc(A.AXES.map(function (a) { return a + " = " + ((sys.parallelism || {})[a]); }).join(" · ")) + "</dd>");
    h.push("<dt>model</dt><dd>" + esc(mdl.label || mdl.id || "—") + "<br><span style=\"font-size:11px;color:#5f7280\">" +
      esc(mdl.layers + " layers · hidden " + mdl.hidden_dim + " · ffn " + mdl.intermediate_size + " · vocab " + mdl.vocab_size) + "</span></dd>");
    if (mdl.serving) h.push("<dt>serving</dt><dd>" + esc("batch " + mdl.serving.batch + " · prefill " + mdl.serving.prefill_len +
      " · decode " + mdl.serving.decode_len) + "</dd>");
    if (d.provenance) h.push("<dt>provenance</dt><dd>" + esc(d.provenance.note || "") + "</dd>");
    h.push("</dl>");
    h.push('<p class="hintline">Hover a chip, link or macro for its card. Click to pin it.</p>');
    return h.join("");
  }

  // A PD document has two systems and no single "the system" (D16), so the
  // resting card is the pair and the one thing that couples them.
  function pdCard() {
    var d = S.doc;
    var h = ['<div class="ttl">PD machine — ' + d.systems.length + " systems</div>"];
    d.systems.forEach(function (sys) {
      var mdl = (sys.models || [])[0] || {};
      var chips = d.chips.filter(function (c) { return c.system === sys.id; });
      h.push('<div class="idl mono">' + esc(sys.id) + "</div><dl>");
      h.push("<dt>role &middot; phase</dt><dd>" + esc(sys.role + " · " + sys.phase) + "</dd>");
      h.push("<dt>inventory</dt><dd>" + esc(chips.filter(function (c) { return c.pool === "analog"; }).length +
        " analog chiplets · " + chips.filter(function (c) { return c.pool === "digital"; }).length +
        " shared digital") + "</dd>");
      h.push("<dt>parallelism</dt><dd>" + esc(A.AXES.map(function (a) {
        return a + " = " + ((sys.parallelism || {})[a]);
      }).join(" · ")) + "</dd>");
      h.push("<dt>model</dt><dd>" + esc(mdl.label || mdl.id || "—") + "</dd>");
      h.push("</dl>");
    });
    var pd = d.links.filter(function (l) { return l.role === "pd"; })[0];
    if (pd) {
      h.push('<div class="ttl" style="margin-top:.7rem">handoff</div><dl>');
      h.push("<dt>bytes per " + esc(pd.per || "unit") + "</dt><dd>" + esc(A.fmtBytes(pd.bytes)) + "</dd>");
      h.push("<dt>basis</dt><dd>" + esc(pd.basis || "—") + "</dd></dl>");
    }
    h.push('<p class="hintline">Two inventories, one priced handoff (D16). Each system holds the whole model and is priced on its own timeline — read relaxations[] before comparing the two.</p>');
    return h.join("");
  }

  function showCard(html) { $("h-card").innerHTML = html; }

  // ----------------------------------------------------------------- legend --
  function renderLegend() {
    if (!S.doc || S.res.errors.length) {
      $("h-legend").innerHTML = ""; $("h-legend").style.display = "none"; return;
    }
    $("h-legend").style.display = "";
    var h = ["<h3>Legend</h3>"];
    h.push('<div class="leg-sub">Hue — parallelism group, and nothing else</div>');
    S.hue.order.forEach(function (k, i) {
      var hue = S.hue.hue[k];
      var sw = hue == null
        ? '<svg width="16" height="16"><rect width="16" height="16" rx="3" fill="url(#p-over)" stroke="#5f7280"/>' + svgDefs() + "</svg>"
        : '<svg width="16" height="16"><rect width="16" height="16" rx="3" fill="' + hue + '"/></svg>';
      h.push('<div class="legrow"><span class="sw">' + sw + '</span><span class="tx"><b>' +
        esc(k.replace(":", " ")) + "</b>" + (hue == null ? " — past the palette" : "") + "</span></div>");
    });
    h.push('<div class="leg-sub">Fill — occupancy, one hue, light to dark</div>');
    var base = S.hue.hue[S.hue.order[0]] || A.MUTED;
    var stops = [0, 0.25, 0.5, 0.75, 1].map(function (t) {
      return '<rect x="' + (t * 128) + '" y="0" width="32" height="14" fill="' + A.ramp(base, t) + '" stroke="#dde5e9"/>';
    }).join("");
    h.push('<div class="legrow"><svg width="160" height="14">' + stops + "</svg></div>");
    h.push('<div class="legrow"><span class="tx" style="font-size:11px">0% ———————— 100% of stored columns</span></div>');

    h.push('<div class="leg-sub">Outline — pool membership</div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="3" fill="none" stroke="#1c2a33" stroke-width="1.4"/></svg></span><span class="tx">analog macro chiplet</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="3" fill="none" stroke="#1c2a33" stroke-width="1.4" stroke-dasharray="5 3"/></svg></span><span class="tx">shared digital chiplet (D13)</span></div>');

    h.push('<div class="leg-sub">Hatch — drawn, never inferred</div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16">' + svgDefs() + '<rect width="26" height="16" rx="3" fill="url(#p-res)" stroke="#c2ced5"/></svg></span><span class="tx">reserved slot, no tiles</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16">' + svgDefs() + '<rect width="26" height="16" rx="3" fill="url(#p-unk)" stroke="#8497a2"/></svg></span><span class="tx">unknown — the file omits it</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16">' + svgDefs() + '<rect width="26" height="16" rx="3" fill="url(#p-over)" stroke="#8497a2"/></svg></span><span class="tx">past the validated palette</span></div>');

    h.push('<div class="leg-sub">Links — weight is bytes, dash is role</div>');
    var roles = {};
    S.doc.links.forEach(function (l) { roles[l.role] = (roles[l.role] || 0) + 1; });
    ["tp", "ep", "pp", "pd", "act"].forEach(function (r) {
      var n = roles[r] || 0;
      h.push('<div class="legrow"><span class="sw"><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="' +
        (n ? "#4a5c68" : "#c8d4da") + '" stroke-width="2.4" stroke-dasharray="' + roleDash(r) + '"/></svg></span>' +
        '<span class="tx"' + (n ? "" : ' style="color:#aebac2"') + "><b>" + r + "</b> " + (n ? n + " drawn" : "not present") + "</span></div>");
    });

    var duty = A.dutyExtreme(S.doc);
    h.push('<div class="leg-sub">Duty cycle — its own channel, never a hue</div>');
    if (!duty) {
      h.push('<div class="legrow"><span class="tx" style="font-size:11px">This document declares no duty cycle. ' +
        'P4 owns it; an absent measurement draws as the unknown hatch, never as zero.</span></div>');
    } else {
      h.push('<div class="legrow"><span class="sw"><svg width="26" height="10"><rect x="0" y="2" width="26" height="5" rx="1" fill="#fff" stroke="#d5dfe4" stroke-width="0.5"/><rect x="0" y="2" width="9" height="5" rx="1" fill="' +
        A.DUTY_INK + '"/></svg></span><span class="tx">bar on the top edge of the macro — absolute 0–1 scale</span></div>');
      h.push('<div class="legrow"><span class="tx" style="font-size:11px">Busiest macro in this file: <b>' +
        esc(A.pct(duty.value)) + '</b> (<span class="mono">' + esc(duty.id) +
        '</span>). Every bar is short because the analog macros idle for most of the timeline — ' +
        'that is the finding, not a rendering fault. The scale stays absolute so the number on the ' +
        'card and the bar beside it are one reading.</span></div>');
    }
    h.push('<div class="leg-sub">Column map — brackets (D11)</div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="12"><path d="M2 9V3H24V9" fill="none" stroke="#1c2a33" stroke-width="1.5"/></svg></span><span class="tx">tiles of ONE weight matrix: bit slices</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="12"><path d="M2 9V3H24V9" fill="none" stroke="#8497a2" stroke-width="1"/></svg></span><span class="tx">column sets, or a piece that chains to other macros</span></div>');
    if (A.filterActive(S.filter)) {
      h.push('<div class="leg-sub">Filter</div>');
      h.push('<div class="legrow"><span class="tx" style="font-size:11px">Objects the filter does not select are drawn dimmed, never removed: position is containment, so hiding one would move the rest. No figure on this page changes when a filter does.</span></div>');
    }
    h.push('<div class="leg-sub">◇ fixture-invented value</div>');
    var paths = ((S.doc.provenance || {}).invented_fields || []);
    h.push('<div class="legrow"><span class="tx mono" style="font-size:10.5px">' + esc(paths.join("  ")) + "</span></div>");
    $("h-legend").innerHTML = h.join("");
  }

  // ------------------------------------------------------- validation panel --
  function refusalPanel() {
    var rows = S.res.errors.slice(0, 200).map(function (e) {
      return "<tr><td class=\"mono\">" + esc(e.rule) + "</td><td class=\"mono\">" + esc(e.field) + "</td><td>" + esc(e.message) + "</td></tr>";
    }).join("");
    return '<div class="refuse ui"><h2>The atlas refuses to draw</h2>' +
      "<p>A mapping that cannot be drawn is not a mapping. " + S.res.errors.length +
      " check" + (S.res.errors.length === 1 ? "" : "s") + " failed; each names the field that failed it. " +
      "See <span class=\"mono\">SCHEMA.md</span> for the rule numbers.</p>" +
      "<table><tr><th>rule</th><th>field</th><th>what is wrong</th></tr>" + rows + "</table>" +
      (S.res.errors.length > 200 ? "<p>&hellip; and " + (S.res.errors.length - 200) + " more.</p>" : "") + "</div>";
  }

  function selfTestPanel() {
    var refusals = S.selftest.refusals, views = S.selftest.views;
    var skipped = refusals.filter(function (r) { return r.skipped; }).length;
    var pass = refusals.filter(function (r) { return r.pass; }).length;
    var rows = refusals.map(function (r) {
      return '<tr' + (r.skipped ? ' class="skip"' : "") + '><td class="mono">' + esc(r.rule) + "</td><td>" + esc(r.what) +
        '</td><td class="' + (r.skipped ? "" : r.pass ? "ok" : "no") + '">' +
        (r.skipped ? "n/a" : r.pass ? "fires" : "MISSED") + '</td><td class="mono" style="font-size:11px">' +
        esc(r.got) + "</td></tr>";
    }).join("");
    var vpass = views.filter(function (r) { return r.pass; }).length;
    var vrows = views.map(function (r) {
      return '<tr><td class="mono">' + esc(r.rule) + "</td><td>" + esc(r.what) +
        '</td><td class="' + (r.pass ? "ok" : "no") + '">' + (r.pass ? "holds" : "BROKEN") +
        '</td><td class="mono" style="font-size:11px">' + esc(r.got) + "</td></tr>";
    }).join("");
    var head = 'style="font:600 10.5px/1 \'Segoe UI\',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8497a2;margin:0 0 .5rem"';
    return '<div class="st ui"><h3 ' + head + ">Loader self-test &mdash; " +
      pass + " / " + refusals.length + " pass" +
      (skipped ? " (" + skipped + " not constructible on this document)" : "") + "</h3>" +
      "<table><tr><th>rule</th><th>corruption</th><th>refusal</th><th>field named</th></tr>" + rows + "</table>" +
      '<p class="hintline">Each row corrupts a copy of the loaded document and asserts the loader refuses it and names the right field. A rule this document gives the harness no way to corrupt is reported as n/a rather than as a miss.</p>' +
      '<h3 ' + head + ' style="margin-top:1rem">View rules &mdash; ' + vpass + " / " + views.length + " hold</h3>" +
      "<table><tr><th>rule</th><th>what the renderer promises</th><th>verdict</th><th>evidence</th></tr>" + vrows + "</table>" +
      '<p class="hintline">The encoding law, asserted on this document: one fact per channel, a filter that moves no figure, a stated draw budget, brackets that claim only what D11 says, and one lane per system.</p></div>';
  }

  // ---------------------------------------------------------------- render ---
  function render() {
    S.res = S.doc ? A.validate(S.doc) : { errors: [], warnings: [] };
    S.hue = S.doc ? A.hueMap(S.doc) : { order: [], hue: {} };
    S.ix = S.doc ? A.makeIndex(S.doc) : { chip: {}, macro: {}, tile: {}, link: {}, sys: {}, owner: {} };
    if (S.doc && !S.chip) {
      var first = S.doc.chips && S.doc.chips[0];
      S.chip = first ? first.id : null;
    }
    if (S.macro && !S.ix.macro[S.macro]) S.macro = null;
    if (S.view === "macro" && !S.macro) S.view = "chip";
    renderHeader(); renderBand(); renderMetrics(); renderBar(); renderCrumbs();

    var canvas = $("h-canvas");
    if (!S.doc) { canvas.innerHTML = '<p class="ui">No document loaded.</p>'; }
    else if (S.selftest) { canvas.innerHTML = selfTestPanel(); }
    else if (S.res.errors.length) { canvas.innerHTML = refusalPanel(); }
    else if (S.view === "package") { canvas.innerHTML = drawPackage(); }
    else if (S.view === "macro") { canvas.innerHTML = drawMacro(); }
    else { canvas.innerHTML = drawChip(); }

    renderLegend();
    if (!S.pinned) showCard(defaultCard());
    wireCanvas();
  }

  function wireCanvas() {
    var canvas = $("h-canvas");
    // Hover previews the card; click DESCENDS one level of containment
    // (package -> chip -> macro) and leaves the card pinned on the way. A leaf
    // — a link, a tile — has nothing under it, so a click there only pins.
    function bind(sel, attr, make, descend) {
      Array.prototype.forEach.call(canvas.querySelectorAll(sel), function (n) {
        var id = n.getAttribute(attr);
        n.addEventListener("mouseenter", function () { if (!S.pinned) showCard(make(id)); });
        n.addEventListener("click", function (ev) {
          ev.stopPropagation();
          S.pinned = true;
          showCard(make(id));
          if (descend) descend(id);
        });
      });
    }
    bind("[data-macro]", "data-macro", function (id) { return macroCard(S.ix.macro[id]); },
      function (id) { go("macro", null, id); });
    bind("[data-chip]", "data-chip", function (id) { return chipCard(S.ix.chip[id]); },
      function (id) { go("chip", id, null); });
    bind("[data-link]", "data-link", function (id) { return linkCard(S.ix.link[id]); }, null);
    bind("[data-tile]", "data-tile", function (id) { return tileCard(S.ix.tile[id]); }, null);
    canvas.addEventListener("click", function () { S.pinned = false; showCard(defaultCard()); });
  }

  // ------------------------------------------------------------------ input --
  // Deep links keep a screenshot reproducible: ?view=chip&chip=<id>, ?selftest=1
  function adopt(doc, source) {
    S.doc = doc; S.source = source; S.chip = null; S.macro = null;
    S.pinned = false; S.selftest = null; S.filter = A.emptyFilter();
    var q = location.search || "";
    function param(name) {
      var m = new RegExp("[?&]" + name + "=([^&]*)").exec(q);
      return m ? decodeURIComponent(m[1]) : null;
    }
    if (param("chip")) S.chip = param("chip");
    if (param("macro")) S.macro = param("macro");
    if (param("view") === "chip") S.view = "chip";
    if (param("view") === "macro") S.view = "macro";
    if (param("duty") === "1") S.duty = true;
    ["model", "layer", "group", "pool", "q"].forEach(function (k) {
      if (param(k) != null) S.filter[k] = param(k);
    });
    render();
    if (param("selftest") === "1") {
      S.selftest = { refusals: A.selfTest(S.doc), views: A.viewTest(S.doc) };
      render();
    }
  }
  function readFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try { adopt(JSON.parse(fr.result), file.name); }
      catch (e) { S.doc = null; S.source = file.name; render(); $("h-canvas").innerHTML = '<div class="refuse ui"><h2>Not JSON</h2><p>' + esc(e.message) + "</p></div>"; }
    };
    fr.readAsText(file);
  }

  document.addEventListener("dragover", function (e) { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", function () { document.body.classList.remove("dropping"); });
  document.addEventListener("drop", function (e) {
    e.preventDefault(); document.body.classList.remove("dropping");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  // Embedded blob first, so the page paints with no network at all. Then try the
  // sibling file, which wins when the atlas is served over http next to it.
  var embedded = null;
  try { embedded = JSON.parse($("atlas-embedded").textContent); } catch (e) { embedded = null; }
  if (embedded) adopt(embedded, "embedded blob");
  else { S.doc = null; S.source = "none"; render(); }

  // ?data=<file> opens a sibling document instead of the embedded fixture, so a
  // screenshot of any document in this directory is one URL. The name is a bare
  // basename: the atlas fetches from its own directory and nowhere else.
  var wanted = (/[?&]data=([^&]+)/.exec(location.search || "") || [])[1];
  wanted = wanted ? decodeURIComponent(wanted) : null;
  if (wanted && /[\/\\]/.test(wanted)) wanted = null;

  if (typeof fetch === "function") {
    fetch(wanted || "fixture_llama7b_tp2.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        // Only ever replaces the embedded blob. A document the user dropped or
        // picked while this was in flight stays authoritative: silently swapping
        // it would show the wrong mapping under the right title.
        if (j && j.schema && S.source === "embedded blob") {
          adopt(j, (wanted || "fixture_llama7b_tp2.json") + " (sibling file)");
        }
      })
      .catch(function () { /* file:// blocks this; the embedded blob already drew */ });
  }
})();
</script>
</body>
