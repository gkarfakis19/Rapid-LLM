<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FWS-CIM System Atlas</title>
<style>
:root{
  --ink:#1c2a33; --muted:#5f7280; --faint:#8497a2; --accent:#176778;
  --line:#dde5e9; --bg:#f7f9fa; --card:#ffffff; --code:#eef2f4;
  --notice-bg:#f4f1e8; --notice-rule:#6b5a2a;
  --refuse-bg:#f6ecea; --refuse-rule:#7a2e2e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Georgia,"Times New Roman",serif}
.ui{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
main{max-width:74rem;margin:0 auto;padding:1.6rem 1.1rem 4rem}

header.top{border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:1rem}
.pid{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-size:1.65rem;line-height:1.2;margin:.3rem 0 .25rem;text-wrap:balance}
.sub{color:var(--muted);font-style:italic;margin:0 0 .6rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;font:11px/1 "Segoe UI",system-ui,sans-serif}
.pill{display:inline-block;letter-spacing:.06em;text-transform:uppercase;padding:.42em .62em;border-radius:999px;background:var(--code);color:var(--muted);font-weight:600}
.pill.on{background:#e4eef0;color:var(--accent)}
.pill.mark{background:#efeadd;color:#6b5a2a}

.band{border-left:3px solid var(--notice-rule);background:var(--notice-bg);padding:.7rem .9rem;margin:0 0 1rem;border-radius:0 4px 4px 0}
.band h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .45rem;color:var(--notice-rule)}
.band ul{margin:0;padding-left:1.1rem}
.band li{margin:.22rem 0;font-size:.9rem}
.band .c{font-weight:700}

.refuse{border-left:3px solid var(--refuse-rule);background:var(--refuse-bg);padding:.9rem 1rem;border-radius:0 4px 4px 0}
.refuse h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .5rem;color:var(--refuse-rule)}
.refuse p{margin:.3rem 0 .7rem;font-size:.92rem}
.refuse table{width:100%;border-collapse:collapse;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif}
.refuse th{text-align:left;border-bottom:1px solid #e0cdc9;padding:.3rem .45rem;font-weight:600;color:var(--refuse-rule)}
.refuse td{border-bottom:1px solid #eddedb;padding:.3rem .45rem;vertical-align:top}

.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.5rem;margin:0 0 1rem}
.metric{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:.5rem .6rem;cursor:pointer}
.metric:hover{border-color:var(--accent)}
.metric .k{font:600 10px/1.2 "Segoe UI",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.metric .v{font:400 1.22rem/1.25 Georgia,serif;margin:.16rem 0 .05rem}
.metric .v small{font-size:.62em;color:var(--muted);margin-left:.2em}
.metric .l{font:400 11.5px/1.35 "Segoe UI",system-ui,sans-serif;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 .7rem;font:12.5px/1 "Segoe UI",system-ui,sans-serif}
button,select,label.file{font:12.5px/1 "Segoe UI",system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;cursor:pointer}
button:hover,select:hover,label.file:hover{border-color:var(--accent);color:var(--accent)}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=file]{display:none}
.bar .note{color:var(--faint);margin-left:auto;font-size:11.5px}

.body{display:flex;gap:1rem;align-items:flex-start}
.canvas{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem}
.canvas .overflow{overflow-x:auto}
svg{display:block;width:100%;height:auto;max-width:100%}
.rail{flex:0 0 19rem;max-width:19rem}
@media (max-width:60rem){.body{flex-direction:column}.rail{flex:1 1 auto;max-width:none;width:100%}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;margin-bottom:.7rem}
.panel h3{font:600 10.5px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 .5rem}
.legrow{display:flex;align-items:center;gap:.5rem;margin:.28rem 0;font:12px/1.35 "Segoe UI",system-ui,sans-serif}
.legrow .sw{flex:0 0 auto}
.legrow .tx{color:var(--muted)}
.legrow .tx b{color:var(--ink);font-weight:600}
.leg-sub{font:11px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.45rem 0 .1rem;border-top:1px solid var(--line);padding-top:.45rem}

.card dl{margin:0;font:12.2px/1.5 "Segoe UI",system-ui,sans-serif}
.card dt{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:.5rem}
.card dd{margin:.1rem 0 0;color:var(--ink);word-break:break-word}
.card .ttl{font:600 13px/1.35 "Segoe UI",system-ui,sans-serif;margin:0 0 .1rem}
.card .idl{font-size:11px;color:var(--muted);word-break:break-all}
.card table{width:100%;border-collapse:collapse;font:11.5px/1.4 "Segoe UI",system-ui,sans-serif;margin-top:.3rem}
.card th{text-align:left;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line);padding:.22rem .3rem}
.card td{border-bottom:1px solid var(--line);padding:.22rem .3rem;vertical-align:top}
.meter{height:6px;background:var(--code);border-radius:3px;overflow:hidden;margin:.2rem 0}
.meter i{display:block;height:100%}
.inv{color:#6b5a2a;font-weight:700}
.hintline{font:11.5px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.5rem 0 0}

.st table{width:100%;border-collapse:collapse;font:12px/1.45 "Segoe UI",system-ui,sans-serif}
.st th{text-align:left;border-bottom:1px solid var(--line);padding:.28rem .4rem;color:var(--faint);font-weight:600}
.st td{border-bottom:1px solid var(--line);padding:.28rem .4rem}
.st .ok{color:#2f6b46;font-weight:700}
.st .no{color:var(--refuse-rule);font-weight:700}
.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
foreignObject div{font:11px/1.2 "Segoe UI",system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="pid">P5 &middot; fws_atlas/1</div>
    <h1 id="h-title">System Atlas</h1>
    <p class="sub" id="h-sub"></p>
    <div class="pills" id="h-pills"></div>
  </header>
  <div id="h-band"></div>
  <div id="h-metrics"></div>
  <div id="h-bar"></div>
  <div class="body">
    <div class="canvas" id="h-canvas"></div>
    <div class="rail">
      <div class="panel" id="h-legend"></div>
      <div class="panel card" id="h-card"></div>
    </div>
  </div>
</main>

            ? "chips must be an array of objects. A chip count is not a placement"

    // R9 - a chip count that is a division is not a placement (AUDIT finding 1)

    function scanQuotient(obj, path, depth) {

    doc.chips.forEach(function (c) { scanQuotient(c, "chips[" + c.id + "].", 0); });
    ["macros", "tiles", "links", "metrics"].forEach(function (k) {

    // R24 - the device cards themselves. ADJ-4: slicing is present iff
    // bits_per_cell < weight_bits, and a mux slot stores cols_adc columns (P2).
    Object.keys(doc.cards).forEach(function (cid) {
      var c = doc.cards[cid] || {}, at = "cards." + cid;

          "declares " + ccap.stored_cols + " but cols_adc x mux = " + (ccap.cols_adc * ccap.mux));

      if (c.slicing !== slices) {
        E("R24", at + ".slicing",
          "declares " + JSON.stringify(c.slicing) + " but bits_per_cell " + JSON.stringify(c.bits_per_cell) +
          " against weight_bits " + JSON.stringify(c.weight_bits) + " makes slicing " + slices +
          " (ADJ-4: slicing is present iff bits_per_cell < weight_bits)");

    // R26 - a system states which inventory it is and at which phase (D16)
    doc.systems.forEach(function (sy) {
      var at = "systems[" + sy.id + "]";
      if (["unified", "prefill", "decode"].indexOf(sy.role) < 0) {
        E("R26", at + ".role", 'must be "unified", "prefill" or "decode" (D16), found ' + JSON.stringify(sy.role));
      }
      if (["prefill", "decode"].indexOf(sy.phase) < 0) {

    var sysById = byId(doc.systems), chipById = byId(doc.chips);
    var macroById = byId(doc.macros), tileById = byId(doc.tiles);

    var modelById = {};
    doc.systems.forEach(function (s) {
      (s.models || []).forEach(function (m) { if (m && m.id != null) modelById[m.id] = m; });
    });

    // R2 / R8 / R4 - chips
    var chipHolds = {};
    doc.chips.forEach(function (c) {
      var at = "chips[" + c.id + "]";
      if (!sysById[c.system]) E("R2", at + ".system", 'no system "' + c.system + '" in systems[]');
      if (c.pool !== "analog" && c.pool !== "digital") E("R2", at + ".pool", 'pool must be "analog" or "digital", found ' + JSON.stringify(c.pool));

      var slots = c.capacity && c.capacity.macro_slots;
      if (!isInt(slots) || slots <= 0) {

      } else if (!Array.isArray(c.macros) || c.macros.length !== slots) {

    // R3 / R7 / R10 / R5 - macros
    doc.macros.forEach(function (m) {
      var at = "macros[" + m.id + "]";
      if (!chipById[m.chip]) E("R3", at + ".chip", 'no chip "' + m.chip + '" in chips[]');

    doc.tiles.forEach(function (t) {

      if (!chipById[l.to]) E("R6", at + ".to", 'no chip "' + l.to + '" in chips[]');

      if (typeof l.bytes !== "number" || !isFinite(l.bytes) || l.bytes < 0) E("R6", at + ".bytes", "must be a non-negative number, found " + JSON.stringify(l.bytes));
      if (!isStr(l.per)) E("R6", at + ".per", "a byte count states what it is per (a step, a token, a request)");

    var h = ['<div class="ttl">chip</div><div class="idl mono">' + esc(c.id) + "</div><dl>"];
    h.push("<dt>label</dt><dd>" + esc(c.label || "—") + "</dd>");
    h.push("<dt>system</dt><dd class=\"mono\">" + esc(c.system) + "</dd>");
    h.push("<dt>pool</dt><dd>" + esc(c.pool) + (c.pool === "digital" ? " — shared digital chiplet (D13); it stores no weights" : " — analog macro chiplet") + "</dd>");
    h.push("<dt>slots</dt><dd>" + esc((c.capacity && c.capacity.macro_slots) || "?") + " enumerated macro slots</dd>");
    h.push("<dt>occupancy</dt><dd>" + invMark(paths, "chips", c, "occupancy") + esc(A.pct(c.occupancy)) + meter(c.occupancy, hueOf(c)) + "</dd>");
    h.push("<dt>groups</dt><dd>" + groupWords(c) + "</dd>");
    h.push("</dl>");
    var ls = d.links.filter(function (l) { return l.from === c.id || l.to === c.id; });
    if (ls.length) {
      h.push('<div class="ttl" style="margin-top:.7rem">links — ' + ls.length + "</div>");
      h.push("<table><tr><th>role</th><th>other end</th><th>bytes</th></tr>");
      ls.forEach(function (l) {
        h.push("<tr><td>" + esc(l.role) + "</td><td class=\"mono\">" + esc(l.from === c.id ? l.to : l.from) + "</td><td>" +
          invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</td></tr>");
      });
      h.push("</table>");
    }
    h.push('<p class="hintline">Click the chip, or pick it in the Chip view, to see its macros.</p>');
    return h.join("");
  }

  function linkCard(l) {
    var paths = A.inventedIndex(S.doc);
    return ['<div class="ttl">link</div><div class="idl mono">' + esc(l.id) + "</div><dl>",
      "<dt>role</dt><dd>" + esc(l.role) + "</dd>",
      "<dt>from &rarr; to</dt><dd class=\"mono\">" + esc(l.from) + " &rarr; " + esc(l.to) + "</dd>",
      "<dt>bytes per " + esc(l.per || "unit") + "</dt><dd>" + invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</dd>",
      "<dt>carries</dt><dd>" + esc(l.label || "—") + "</dd>",
      "<dt>basis</dt><dd>" + esc(l.basis || "—") + "</dd></dl>",
      '<p class="hintline">Fully-connected p2p, no congestion model (D17). The atlas draws bytes, never link times.</p>'
    ].join("");
  }

  function metricCard(m) {
    var paths = A.inventedIndex(S.doc);
    return ['<div class="ttl">metric</div><div class="idl mono">' + esc(m.key) + "</div><dl>",
      "<dt>figure</dt><dd>" + esc(m.label) + "</dd>",
      "<dt>value</dt><dd>" + invMark(paths, "metrics", m, "value") + esc(A.fmt(m.value)) + " " + esc(m.unit || "") + "</dd>",
      "<dt>basis</dt><dd>" + esc(m.basis || "—") + "</dd></dl>",
      '<p class="hintline">The producer labels its figures; the atlas never picks which one is the headline.</p>'
    ].join("");
  }

  function defaultCard() {
    var d = S.doc;
    if (!d) return '<div class="ttl">No document</div><p class="hintline">Drop an atlas.json onto this page, or use Open.</p>';
    var sys = d.systems[0] || {}, mdl = (sys.models || [])[0] || {};
    var h = ['<div class="ttl">system</div><div class="idl mono">' + esc(sys.id || "") + "</div><dl>"];
    h.push("<dt>role &middot; phase</dt><dd>" + esc((sys.role || "?") + " · " + (sys.phase || "?")) + "</dd>");
    h.push("<dt>parallelism</dt><dd>" + esc(A.AXES.map(function (a) { return a + " = " + ((sys.parallelism || {})[a]); }).join(" · ")) + "</dd>");
    h.push("<dt>model</dt><dd>" + esc(mdl.label || mdl.id || "—") + "<br><span style=\"font-size:11px;color:#5f7280\">" +
      esc(mdl.layers + " layers · hidden " + mdl.hidden_dim + " · ffn " + mdl.intermediate_size + " · vocab " + mdl.vocab_size) + "</span></dd>");
    if (mdl.serving) h.push("<dt>serving</dt><dd>" + esc("batch " + mdl.serving.batch + " · prefill " + mdl.serving.prefill_len +
      " · decode " + mdl.serving.decode_len) + "</dd>");
    if (d.provenance) h.push("<dt>provenance</dt><dd>" + esc(d.provenance.note || "") + "</dd>");
    h.push("</dl>");
    h.push('<p class="hintline">Hover a chip, link or macro for its card. Click to pin it.</p>');
    return h.join("");
  }

  function showCard(html) { $("h-card").innerHTML = html; }

  // ----------------------------------------------------------------- legend --
  function renderLegend() {
    if (!S.doc || S.res.errors.length) {
      $("h-legend").innerHTML = ""; $("h-legend").style.display = "none"; return;
    }
    $("h-legend").style.display = "";
    var h = ["<h3>Legend</h3>"];
    h.push('<div class="leg-sub">Hue — parallelism group, and nothing else</div>');
    S.hue.order.forEach(function (k, i) {
      var hue = S.hue.hue[k];
      var sw = hue == null
        ? '<svg width="16" height="16"><rect width="16" height="16" rx="3" fill="url(#p-over)" stroke="#5f7280"/>' + svgDefs() + "</svg>"
        : '<svg width="16" height="16"><rect width="16" height="16" rx="3" fill="' + hue + '"/></svg>';
      h.push('<div class="legrow"><span class="sw">' + sw + '</span><span class="tx"><b>' +
        esc(k.replace(":", " ")) + "</b>" + (hue == null ? " — past the palette" : "") + "</span></div>");
    });
    h.push('<div class="leg-sub">Fill — occupancy, one hue, light to dark</div>');
    var base = S.hue.hue[S.hue.order[0]] || A.MUTED;
    var stops = [0, 0.25, 0.5, 0.75, 1].map(function (t) {
      return '<rect x="' + (t * 128) + '" y="0" width="32" height="14" fill="' + A.ramp(base, t) + '" stroke="#dde5e9"/>';
    }).join("");
    h.push('<div class="legrow"><svg width="160" height="14">' + stops + "</svg></div>");
    h.push('<div class="legrow"><span class="tx" style="font-size:11px">0% ———————— 100% of stored columns</span></div>');

    h.push('<div class="leg-sub">Outline — pool membership</div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="3" fill="none" stroke="#1c2a33" stroke-width="1.4"/></svg></span><span class="tx">analog macro chiplet</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="3" fill="none" stroke="#1c2a33" stroke-width="1.4" stroke-dasharray="5 3"/></svg></span><span class="tx">shared digital chiplet (D13)</span></div>');

    h.push('<div class="leg-sub">Hatch — drawn, never inferred</div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16">' + svgDefs() + '<rect width="26" height="16" rx="3" fill="url(#p-res)" stroke="#c2ced5"/></svg></span><span class="tx">reserved slot, no tiles</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16">' + svgDefs() + '<rect width="26" height="16" rx="3" fill="url(#p-unk)" stroke="#8497a2"/></svg></span><span class="tx">unknown — the file omits it</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16">' + svgDefs() + '<rect width="26" height="16" rx="3" fill="url(#p-over)" stroke="#8497a2"/></svg></span><span class="tx">past the validated palette</span></div>');

    h.push('<div class="leg-sub">Links — weight is bytes, dash is role</div>');
    var roles = {};
    S.doc.links.forEach(function (l) { roles[l.role] = (roles[l.role] || 0) + 1; });
    ["tp", "ep", "pp", "pd", "act"].forEach(function (r) {
      var n = roles[r] || 0;
      h.push('<div class="legrow"><span class="sw"><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="' +
        (n ? "#4a5c68" : "#c8d4da") + '" stroke-width="2.4" stroke-dasharray="' + roleDash(r) + '"/></svg></span>' +
        '<span class="tx"' + (n ? "" : ' style="color:#aebac2"') + "><b>" + r + "</b> " + (n ? n + " drawn" : "not present") + "</span></div>");
    });

    h.push('<div class="leg-sub">◇ fixture-invented value</div>');
    var paths = ((S.doc.provenance || {}).invented_fields || []);
    h.push('<div class="legrow"><span class="tx mono" style="font-size:10.5px">' + esc(paths.join("  ")) + "</span></div>");
    $("h-legend").innerHTML = h.join("");
  }

  // ------------------------------------------------------- validation panel --
  function refusalPanel() {
    var rows = S.res.errors.slice(0, 200).map(function (e) {
      return "<tr><td class=\"mono\">" + esc(e.rule) + "</td><td class=\"mono\">" + esc(e.field) + "</td><td>" + esc(e.message) + "</td></tr>";
    }).join("");
    return '<div class="refuse ui"><h2>The atlas refuses to draw</h2>' +
      "<p>A mapping that cannot be drawn is not a mapping. " + S.res.errors.length +
      " check" + (S.res.errors.length === 1 ? "" : "s") + " failed; each names the field that failed it. " +
      "See <span class=\"mono\">SCHEMA.md</span> for the rule numbers.</p>" +
      "<table><tr><th>rule</th><th>field</th><th>what is wrong</th></tr>" + rows + "</table>" +
      (S.res.errors.length > 200 ? "<p>&hellip; and " + (S.res.errors.length - 200) + " more.</p>" : "") + "</div>";
  }

  function selfTestPanel() {
    var pass = S.selftest.filter(function (r) { return r.pass; }).length;
    var rows = S.selftest.map(function (r) {
      return "<tr><td class=\"mono\">" + esc(r.rule) + '</td><td>' + esc(r.what) + '</td><td class="' + (r.pass ? "ok" : "no") +
        '">' + (r.pass ? "fires" : "MISSED") + '</td><td class="mono" style="font-size:11px">' + esc(r.got) + "</td></tr>";
    }).join("");
    return '<div class="st ui"><h3 style="font:600 10.5px/1 \'Segoe UI\',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8497a2;margin:0 0 .5rem">Loader self-test &mdash; ' +
      pass + " / " + S.selftest.length + " pass</h3>" +
      "<table><tr><th>rule</th><th>corruption</th><th>refusal</th><th>field named</th></tr>" + rows + "</table>" +
      '<p class="hintline">Each row corrupts a copy of the loaded document and asserts the loader refuses it and names the right field.</p></div>';
  }

  // ---------------------------------------------------------------- render ---
  function render() {
    S.res = S.doc ? A.validate(S.doc) : { errors: [], warnings: [] };
    S.hue = S.doc ? A.hueMap(S.doc) : { order: [], hue: {} };
    if (S.doc && !S.chip) {
      var first = S.doc.chips && S.doc.chips[0];
      S.chip = first ? first.id : null;
    }
    renderHeader(); renderBand(); renderMetrics(); renderBar();

    var canvas = $("h-canvas");
    if (!S.doc) { canvas.innerHTML = '<p class="ui">No document loaded.</p>'; }
    else if (S.selftest) { canvas.innerHTML = selfTestPanel(); }
    else if (S.res.errors.length) { canvas.innerHTML = refusalPanel(); }
    else { canvas.innerHTML = S.view === "package" ? drawPackage() : drawChip(); }

    renderLegend();
    if (!S.pinned) showCard(defaultCard());
    wireCanvas();
  }

  function wireCanvas() {
    var canvas = $("h-canvas");
    function bind(sel, attr, make) {
      Array.prototype.forEach.call(canvas.querySelectorAll(sel), function (n) {
        var id = n.getAttribute(attr);
        n.addEventListener("mouseenter", function () { if (!S.pinned) showCard(make(id)); });
        n.addEventListener("click", function (ev) {
          ev.stopPropagation();
          S.pinned = true; showCard(make(id));
        });
      });
    }
    var mById = S.doc ? A.byId(S.doc.macros) : {};
    var cById = S.doc ? A.byId(S.doc.chips) : {};
    var lById = S.doc ? A.byId(S.doc.links) : {};
    bind("[data-macro]", "data-macro", function (id) { return macroCard(mById[id]); });
    bind("[data-chip]", "data-chip", function (id) { return chipCard(cById[id]); });
    bind("[data-link]", "data-link", function (id) { return linkCard(lById[id]); });
    canvas.addEventListener("click", function () { S.pinned = false; showCard(defaultCard()); });
    Array.prototype.forEach.call(canvas.querySelectorAll("[data-chip]"), function (n) {
      n.addEventListener("dblclick", function () { S.chip = n.getAttribute("data-chip"); S.view = "chip"; S.selftest = null; render(); });
    });
  }

  // ------------------------------------------------------------------ input --
  // Deep links keep a screenshot reproducible: ?view=chip&chip=<id>, ?selftest=1
  function adopt(doc, source) {
    S.doc = doc; S.source = source; S.chip = null; S.pinned = false; S.selftest = null;
    var q = location.search || "";
    var m = /[?&]chip=([^&]+)/.exec(q);
    if (m) S.chip = decodeURIComponent(m[1]);
    if (/[?&]view=chip/.test(q)) S.view = "chip";
    render();
    if (/[?&]selftest=1/.test(q)) { S.selftest = A.selfTest(S.doc); render(); }
  }
  function readFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try { adopt(JSON.parse(fr.result), file.name); }
      catch (e) { S.doc = null; S.source = file.name; render(); $("h-canvas").innerHTML = '<div class="refuse ui"><h2>Not JSON</h2><p>' + esc(e.message) + "</p></div>"; }
    };
    fr.readAsText(file);
  }

  document.addEventListener("dragover", function (e) { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", function () { document.body.classList.remove("dropping"); });
  document.addEventListener("drop", function (e) {
    e.preventDefault(); document.body.classList.remove("dropping");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  // Embedded blob first, so the page paints with no network at all. Then try the
  // sibling file, which wins when the atlas is served over http next to it.
  var embedded = null;
  try { embedded = JSON.parse($("atlas-embedded").textContent); } catch (e) { embedded = null; }
  if (embedded) adopt(embedded, "embedded blob");
  else { S.doc = null; S.source = "none"; render(); }

  if (typeof fetch === "function") {
    fetch("fixture_llama7b_tp2.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        // Only ever replaces the embedded blob. A document the user dropped or
        // picked while this was in flight stays authoritative: silently swapping
        // it would show the wrong mapping under the right title.
        if (j && j.schema && S.source === "embedded blob") {
          adopt(j, "fixture_llama7b_tp2.json (sibling file)");
        }
      })
      .catch(function () { /* file:// blocks this; the embedded blob already drew */ });
  }
})();
</script>
</body>
</html>
