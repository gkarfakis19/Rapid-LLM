  function rsRenderHeadline() {
    var host = $("h-headline"); if (!host) return;
    if (RS.solo || !RS.report) { if (host) host.innerHTML = ""; return; }
    var ent = entriesOf(RS.report.evaluation && RS.report.evaluation.metrics);
    var em = entryMap(ent);
    function pick(key) { return em[key] || findEntry(ent, key); }
    function stat(e, label, unitFn) {
      if (!e || e.value == null) return "";
      return '<div class="stat"><div class="v">' + (unitFn ? unitFn(e.value) : rfmt(e.value)) + '</div><div class="k">' + esc(label) + "</div></div>";
    }
    var pipe = RS.report.evaluation && RS.report.evaluation.pipeline;
    var shipped = rsCand((RS.frontier || {}).selected_id);
    var si = shipped ? deepFindNumber(shipped.silicon || {}, /mm2/) : { v: null };
    host.innerHTML = '<div class="hl">'
      + stat(pick("sys.fws.tokens_per_s"), "decode tokens / s (headline)")
      + stat(pick("sys.fws.beat"), "pipeline beat", function (v) { return rfmt(v * 1e6, 2) + " \u00b5s"; })
      + (pipe && pipe.resident_streams != null
        ? '<div class="stat"><div class="v">' + pipe.resident_streams + '</div><div class="k">resident streams (D)</div></div>' : "")
      + stat(pick("sys.fws.per_stream_tokens_per_s"), "per-stream tokens / s")
      + stat(pick("sys.fws.per_token_latency"), "per-token latency", rsSecs)
      + (si.v != null
        ? '<div class="stat"><div class="v">' + rfmt(si.v) + ' mm\u00b2</div><div class="k">total silicon (shipped point)</div></div>' : "")
      + "</div>";
  }

  // ---- the frontier plot ---------------------------------------------------
  function rsFrontierPlot() {
    var f = RS.frontier, m = rsModel();
    var cands = (f.candidates || []).map(function (c) {
      var xy = candXY(c);
      return { c: c, x: xy.x, y: xy.y, onFront: (f.front_ids || []).indexOf(c.id) >= 0 };
    }).filter(function (p) { return p.x != null && p.y != null; });
    if (!cands.length) return null;
    var W = 1000, H = 440, L = 72, R = 24, T = 20, B = 48;
    var xs = cands.map(function (p) { return p.x; }), ys = cands.map(function (p) { return p.y; });
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
    var pad = (xmax - xmin) * 0.06 || xmax * 0.01 || 1; xmin -= pad; xmax += pad;
    var ymax = Math.max.apply(null, ys) * 1.08;
    function X(v) { return L + (v - xmin) / (xmax - xmin) * (W - L - R); }
    function Y(v) { return T + (1 - v / ymax) * (H - T - B); }
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", "100%"); svg.style.maxWidth = W + "px";
    function elx(t, att) { var e = document.createElementNS(ns, t); Object.keys(att || {}).forEach(function (k) { e.setAttribute(k, att[k]); }); svg.appendChild(e); return e; }
    function ticks(min, max, n) {
      var span = max - min; if (span <= 0) return [min];
      var step = Math.pow(10, Math.floor(Math.log10(span / n)));
      if (span / step > n * 2) step *= 5; else if (span / step > n) step *= 2;
      var t = [], v = Math.ceil(min / step) * step;
      for (; v <= max; v += step) t.push(v);
      return t;
    }
    ticks(0, ymax, 6).forEach(function (v) {
      elx("line", { x1: L, y1: Y(v), x2: W - R, y2: Y(v), stroke: "#e8eef1", "stroke-width": 1 });
      var t = elx("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "#5f7280" }); t.textContent = rfmt(v);
    });
    ticks(xmin, xmax, 7).forEach(function (v) {
      var t = elx("text", { x: X(v), y: H - B + 18, "text-anchor": "middle", "font-size": 11, fill: "#5f7280" }); t.textContent = rfmt(v);
    });
    elx("line", { x1: L, y1: H - B, x2: W - R, y2: H - B, stroke: "#1c2a33", "stroke-width": 1.2 });
    elx("line", { x1: L, y1: T, x2: L, y2: H - B, stroke: "#1c2a33", "stroke-width": 1.2 });
    var xl = elx("text", { x: (L + W - R) / 2, y: H - 8, "text-anchor": "middle", "font-size": 12, fill: "#3d4f5c" });
    xl.textContent = "total silicon (mm\u00b2) \u2014 analog floor + composed digital";
    var yl = elx("text", { x: 14, y: (T + H - B) / 2, "font-size": 12, fill: "#3d4f5c", transform: "rotate(-90 14 " + ((T + H - B) / 2) + ")", "text-anchor": "middle" });
    yl.textContent = "decode tokens / s (= 1 / beat)";
    var front = cands.filter(function (p) { return p.onFront; }).sort(function (a, b) { return a.x - b.x; });
    if (front.length > 1) {
      elx("polyline", { points: front.map(function (p) { return X(p.x) + "," + Y(p.y); }).join(" "), fill: "none", stroke: m.hex, "stroke-width": 2, "stroke-opacity": 0.5 });
    }
    cands.forEach(function (p) {

  // ---- the pipeline map ----------------------------------------------------
  function rsPipelineSVG() {

    var stages = (pipe && pipe.stages) || [];
    if (!stages.length) return null;
    var chipsById = {}; (atl.chips || []).forEach(function (c) { chipsById[c.id] = c; });
    var analog = (atl.chips || []).filter(function (c) { return c.pool === "analog"; });
    var digital = (atl.chips || []).filter(function (c) { return c.pool !== "analog"; });
    function chipByIndex(i) {
      var hit = null;
      analog.forEach(function (c) { var mm = c.id.match(/(\d+)$/); if (mm && parseInt(mm[1], 10) === i) hit = c; });

    });

    var bl = elx("text", { x: L, y: rowD_y - 14, "font-size": 11, fill: "#5f7280", "letter-spacing": ".08em" });
    bl.textContent = "SHARED DIGITAL \u2014 scan / attention engines";
    var bl2 = elx("text", { x: L, y: rowA_y - 10, "font-size": 11, fill: "#5f7280", "letter-spacing": ".08em" });
    bl2.textContent = "ANALOG \u2014 weight macros (width \u221d occupied macro slots), pipeline order \u2192";
    var x = L, seg = [];
    stages.forEach(function (st, i) {
      var w = usable * widths[i] / totalW;
      var chip = chipByIndex((st.chips || [])[0]);
      var g = elx("g", {});
      var r = elx("rect", { x: x, y: rowA_y, width: w, height: rowA_h, rx: 4, fill: "#dfe9ee", stroke: "#176778", "stroke-width": 1.2, cursor: "pointer" }, g);
      var occ = (chip && typeof chip.occupancy === "number") ? chip.occupancy : null;
      if (occ != null) elx("rect", { x: x, y: rowA_y + rowA_h - 6, width: w * Math.min(1, occ), height: 6, rx: 2, fill: "#176778", "fill-opacity": 0.65 }, g);
      var t = elx("text", { x: x + w / 2, y: rowA_y + 24, "text-anchor": "middle", "font-size": 11.5, fill: "#1c2a33", "font-weight": 600 }, g);
      t.textContent = "S" + st.stage;
      var t2 = elx("text", { x: x + w / 2, y: rowA_y + 40, "text-anchor": "middle", "font-size": 10.5, fill: "#5f7280" }, g);
      t2.textContent = "L" + st.layers[0] + "\u2013" + st.layers[st.layers.length - 1];
      (function (stx, chipx, wx) {
        rsHover(r, function () {

          return '<div class="t">' + esc(stx.label || ("stage " + stx.stage)) + "</div>"
            + "chips: " + esc((stx.chips || []).join(", "))

    });

      var t = elx("text", { x: cx0, y: rowD_y + rowD_h / 2 + 4, "text-anchor": "middle", "font-size": 10.5, fill: "#1c2a33" });
      var mnum = did.match(/(\d+)$/); t.textContent = "DIG " + (mnum ? parseInt(mnum[1], 10) : di);

  // ---- detailed tables -----------------------------------------------------
  function rsKv(rows) {
    return '<table class="rtable"><tr><th>metric</th><th>value</th><th>basis</th></tr>' + rows.join("") + "</table>";
  }
  function rsRenderDetails() {
    var host = $("h-details"); if (!host) return;
    if (RS.solo) { host.innerHTML = ""; return; }
    var rep = RS.report;
    if (!rep) { host.innerHTML = '<h2 class="sect">Detailed results</h2><p class="rerr">report artifact missing</p>'; return; }
    var ev = rep.evaluation || {};
    var out = '<h2 class="sect">Detailed results \u2014 one accounting per metric (D21)</h2>';
    var entries = entriesOf(ev.metrics);
    out += '<h3 class="rsub">All metrics \u2014 ' + entries.length + "</h3>";
    out += rsKv(entries.map(function (e) {
      return "<tr><td><code>" + esc(e.key) + '</code><br><span class="rnote">' + esc(e.label || "") + "</span></td>"
        + "<td>" + rfmt(e.value, 4) + (e.unit ? " " + esc(e.unit) : "") + '</td><td class="basis">' + esc(e.basis || "") + "</td></tr>";
    }));
    var sr = ev.state_residency;
    try {
      if (sr) {
        var srl = Array.isArray(sr) ? sr : (Array.isArray(sr.stages) ? sr.stages : (Array.isArray(sr.per_stage) ? sr.per_stage : []));
        if (srl.length) {
          out += '<h3 class="rsub">State / KV residency \u2014 scales with D (D29)</h3>';
          out += rsKv(srl.map(function (st) {
            var v = st.verdict || (st.fits === true ? "fits" : (st.fits === false ? "VIOLATED" : ""));
            var sb = st.state_bytes != null ? st.state_bytes : (st.total_bytes != null ? st.total_bytes : st.bytes);
            var detail = "recurrent " + rbytes(st.recurrent_state_bytes) + " + KV " + rbytes(st.kv_bytes)
              + (st.capacity_bytes ? " vs capacity " + rbytes(st.capacity_bytes) : "");
            return "<tr><td>" + esc(st.label || ("stage " + st.stage)) + "</td><td>" + rbytes(sb) + " (all D streams)</td>"
              + '<td class="basis"><span class="' + (String(v).indexOf("VIOL") >= 0 ? "verd-bad" : "verd-ok") + '">' + esc(v) + "</span> " + esc(detail) + " " + esc(st.basis || "") + "</td></tr>";
          }));
        }
      }
    } catch (e) { out += '<p class="rerr">state residency failed to render: ' + esc(e.message) + "</p>"; }
    var en = ev.energy;
    try {
      if (en && Array.isArray(en.components)) {
        out += '<h3 class="rsub">Energy per component \u2014 coverage-labeled</h3>';
        out += rsKv(en.components.map(function (c) {
          var epj = c.energy_pj != null ? c.energy_pj : (c.value_pj != null ? c.value_pj : c.pj);
          return "<tr><td>" + esc(c.label || c.name || c.key || c.component) + "</td><td>"
            + (epj != null && epj >= 1e9 ? rfmt(epj / 1e9, 3) + " mJ" : rfmt(epj, 3) + " pJ")
            + '</td><td class="basis">[' + esc(c.coverage || "?") + "] " + esc(c.basis || "") + "</td></tr>";
        }));
      }
    } catch (e) { out += '<p class="rerr">energy failed to render: ' + esc(e.message) + "</p>"; }
    var occ = ev.occupancy;
    try {
      if (Array.isArray(occ) && occ.length) {
        out += '<h3 class="rsub">Utilization per device class \u2014 mean / max over devices</h3>';
        var agg = {};
        occ.forEach(function (o) {
          var k = o.device_class || "?"; (agg[k] = agg[k] || { n: 0, sum: 0, max: 0, maxOwner: "" });
          agg[k].n++; agg[k].sum += o.occupancy || 0;
          if ((o.occupancy || 0) > agg[k].max) { agg[k].max = o.occupancy; agg[k].maxOwner = o.owner || ""; }
        });
        out += rsKv(Object.keys(agg).map(function (k) {
          var a = agg[k];
          return "<tr><td>" + esc(k) + " (" + a.n + " devices)</td><td>mean " + (a.sum / a.n * 100).toFixed(3) + "% \u00b7 max " + (a.max * 100).toFixed(2) + "%"
            + '</td><td class="basis">busiest: ' + esc(a.maxOwner) + " \u2014 " + esc(ev.occupancy_basis || "") + "</td></tr>";
        }));
      }
    } catch (e) { out += '<p class="rerr">utilization failed to render: ' + esc(e.message) + "</p>"; }

  }

    }).join("") + "</div>";
  }
  function discKey(x) { return typeof x === "string" ? x : [x.constraint, x.value, x.reason].join("|"); }
  function rsRenderDisc() {
    var host = $("h-disc"); if (!host) return;
    if (RS.solo) { host.innerHTML = ""; return; }
    var seen = {};
    (((RS.atlas || {}).relaxations) || []).forEach(function (x) { seen[discKey(x)] = 1; });
    var all = ((RS.report || {}).disclosures) || [];
    var repD = all.filter(function (x) { return !seen[discKey(x)]; });
    var h = "";
    if (all.length) {
      h += '<h3 class="rsub">Report disclosures \u2014 ' + all.length
        + (all.length - repD.length ? " (" + (all.length - repD.length) + " identical to the relaxations above and shown once; the " + repD.length + " others follow)" : "") + "</h3>";
      h += discBlock(repD);
    }
    var fd = ((RS.frontier || {}).disclosures) || [];
    if (fd.length) h += '<h3 class="rsub">Frontier sweep disclosures \u2014 ' + fd.length + "</h3>" + discBlock(fd);
    host.innerHTML = h;
  }

  // ---- load ----------------------------------------------------------------
  function rsLoad(id) {
    RS.id = id; RS.sel = null;
    var m = rsModel();
    document.title = "QIF Results \u2014 " + m.label;
    rsRenderModels();
    $("h-frontsec").innerHTML = '<h2 class="sect">Frontier</h2><div class="panel2"><p class="ui">loading the sweep\u2026</p></div>';
    $("h-pipesec").innerHTML = "";
    Promise.all([
      rsFetch(id + "_report.json"),
      rsFetch("../dse/" + id + "_frontier/dse_report.json"),
      rsFetch(id + ".json")
    ]).then(function (r) {
      RS.report = r[0]; RS.frontier = r[1]; RS.atlas = r[2];
      RS.sel = RS.frontier ? RS.frontier.selected_id : null;
      if (RS.atlas) adopt(RS.atlas, id + ".json");
      else { S.doc = null; S.source = id + ".json (missing)"; render(); }
      rsRenderAll();
    });
  }
  function rsRenderAll() {
    rsRenderModels(); rsRenderHeadline(); rsRenderFrontier(); rsRenderSelCand();
    rsRenderPipeline(); rsRenderDetails(); rsRenderDisc();
  }

  // ------------------------------------------------------------------ input --
  // Deep links keep a screenshot reproducible: ?view=chip&chip=<id>, ?selftest=1
  function adopt(doc, source) {
    S.doc = doc; S.source = source; S.chip = null; S.macro = null;
    S.pinned = false; S.selftest = null; S.filter = A.emptyFilter();
    var q = location.search || "";
    function param(name) {
      var m = new RegExp("[?&]" + name + "=([^&]*)").exec(q);
      return m ? decodeURIComponent(m[1]) : null;
    }
    if (param("chip")) S.chip = param("chip");
    if (param("macro")) S.macro = param("macro");
    if (param("view") === "chip") S.view = "chip";
    if (param("view") === "macro") S.view = "macro";
    if (param("view") === "fold") S.view = "fold";
    if (param("view") === "frontier") S.view = "frontier";
    if (param("fold")) S.foldCard = param("fold");
    if (param("lanes") === "1") S.lanes = true;
    if (param("duty") === "1") S.duty = true;
    ["model", "layer", "group", "pool", "q"].forEach(function (k) {
      if (param(k) != null) S.filter[k] = param(k);
    });
    render();
    if (param("selftest") === "1") { S.selftest = allSelfTests(); render(); }
  }
  // A frontier document is its own kind and never replaces the atlas: dropping
  // one alongside an atlas gives the reader both pictures at once.
  function adoptFrontier(doc, source) {
    S.front = doc; S.frontSource = source; S.selftest = null; S.view = "frontier";
    render();
  }
  function readFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var parsed = JSON.parse(fr.result);
        if (parsed && parsed.schema === A.FRONTIER_SCHEMA) { adoptFrontier(parsed, file.name); return; }
        adopt(parsed, file.name);
        return;
      }
      catch (e) { S.doc = null; S.source = file.name; render(); $("h-canvas").innerHTML = '<div class="refuse ui"><h2>Not JSON</h2><p>' + esc(e.message) + "</p></div>"; }
    };
    fr.readAsText(file);
  }

  document.addEventListener("dragover", function (e) { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", function () { document.body.classList.remove("dropping"); });
  document.addEventListener("drop", function (e) {
    e.preventDefault(); document.body.classList.remove("dropping");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  // ------------------------------------------------------------------ boot --
  // The results layer owns the load. ?model=<id> picks the model,
  // ?data=<sibling.json> keeps the old one-document deep links (drilldown
  // only), and drag-and-drop of any fws_atlas/1 or fws_frontier/1 file still
  // works. The stale embedded fixture is gone: what you see is what the
  // artifacts say, fetched fresh on every reload. window.RS_PRELOADED (a
  // baked snapshot) short-circuits every fetch for file:// screenshots.
  (function () {
    var q = location.search || "";
    function param(name) {
      var m = new RegExp("[?&]" + name + "=([^&]*)").exec(q);
      return m ? decodeURIComponent(m[1]) : null;
    }
    var Pre = window.RS_PRELOADED || null;
    if (Pre) {
      RS.id = Pre.id || RS.MODELS[0].id;
      RS.report = Pre.report || null; RS.frontier = Pre.frontier || null; RS.atlas = Pre.atlas || null;
      RS.sel = RS.frontier ? RS.frontier.selected_id : null;
      document.title = "QIF Results \u2014 " + rsModel().label;
      if (RS.atlas) adopt(RS.atlas, "preloaded snapshot");
      else { S.doc = null; S.source = "preloaded snapshot (no atlas)"; render(); }
      rsRenderAll();
      return;
    }
    var wanted = param("data");
    if (wanted && /[\/\\]/.test(wanted)) wanted = null;
    if (wanted) {
      RS.solo = true;
      ["h-headline", "h-pipesec", "h-details", "h-disc", "h-models"].forEach(function (id) {
        var n = $(id); if (n) n.innerHTML = "";
      });
      $("h-frontsec").innerHTML = '<p class="rnote" style="margin:.8rem 0">one-document mode (?data=' + esc(wanted)
        + ") \u2014 the results layer is off; the drilldown below shows that document alone. "
        + '<a href="atlas.html">back to the full results page</a></p>';
      fetch(wanted, { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && j.schema === A.FRONTIER_SCHEMA) { adoptFrontier(j, wanted + " (sibling file)"); return; }
          if (j && j.schema) { adopt(j, wanted + " (sibling file)"); return; }
          S.doc = null; S.source = wanted + " (not found)"; render();
        })
        .catch(function () { S.doc = null; S.source = wanted + " (fetch failed)"; render(); });
      return;
    }
    var mid = param("model");
    var known = RS.MODELS.some(function (mm) { return mm.id === mid; });
    rsLoad(known ? mid : RS.MODELS[0].id);
  })();
})();
</script>
</body>
</html>
