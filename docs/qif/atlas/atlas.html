      '" rx="3" fill="url(#p-unk)" stroke="var(--line)"/>');
    tiles.forEach(function (t) {
      var a = px(t.columns.start);
      var w = Math.max(A.BAND_FLOOR_PX, (t.columns.count / stored) * w0);
      var hue = hueOf(t) || "#8497a2";
      var dim = !A.tileMatches(d, S.ix, t, S.filter);
      s.push('<g data-tile="' + esc(t.id) + '" style="cursor:pointer"' + (dim ? ' opacity="0.22"' : "") + ">");
      s.push('<rect x="' + a + '" y="' + top + '" width="' + w + '" height="' + TRACK +
        '" rx="2" fill="' + hue + '" stroke="var(--card)" stroke-width="0.75"/>');
      if (w > 54) {
        var o = t.owner || {};
        var lab = inkOn(hue);
        s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 17) + '" font-size="10.5" fill="' + lab + '">' +
          esc(o.block + (o.layer == null ? "" : " L" + o.layer)) + "</text>");
        s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 31) + '" font-size="10" fill="' + lab + '" opacity="0.88">' +
          esc(t.shape.K + "×" + t.shape.N) + "</text>");
        if (t.slice) {
          s.push('<text class="ui" x="' + (a + 5) + '" y="' + (top + 45) + '" font-size="10" fill="' + lab + '" opacity="0.88">' +
            esc("slice " + t.slice.index + "/" + t.slice.of) + "</text>");
        }
      }
      s.push("<title>" + esc(t.id + " — columns [" + t.columns.start + ", " +
        (t.columns.start + t.columns.count) + ")") + "</title></g>");
    });

    // the column axis: the only positions on screen are column offsets
    var yAxis = top + TRACK + 16;
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var col = Math.round(f * stored);
      s.push('<line x1="' + px(col) + '" y1="' + (top + TRACK) + '" x2="' + px(col) + '" y2="' + (yAxis - 8) +
        '" stroke="var(--line)"/>');
      s.push('<text class="mono" x="' + px(col) + '" y="' + yAxis + '" font-size="10" fill="var(--faint)" text-anchor="' +
        (f === 0 ? "start" : f === 1 ? "end" : "middle") + '">' + col + "</text>");
    });
    s.push('<text class="ui" x="' + x0 + '" y="' + (yAxis + 16) + '" font-size="10.5" fill="var(--faint)">' +
      esc("stored column offset · hatch = columns no tile holds; a macro is allowed to leave capacity unowned") +
      "</text>");
    if (S.duty) {
      s.push('<text class="ui" x="' + x0 + '" y="' + (yAxis + 32) + '" font-size="10.5" fill="' + A.DUTY_INK + '">' +
        esc(m.duty_cycle == null
          ? "duty cycle unknown — this document declares none for this macro"
          : "duty cycle " + A.fmt(m.duty_cycle) + " — the fraction of the period this macro is " +
            "active, drawn on the absolute 0–1 scale") + "</text>");
      s.push(dutyBar(m, x0, yAxis + 38, w0));
    }
    return '<div class="overflow"><svg viewBox="0 0 ' + W + " " + H + '" style="width:' + Math.min(W, 1100) + "px;max-width:" + W + 'px">' + s.join("") + "</svg></div>";
  }

  // ----------------------------------------------------------------- cards ---
  function meter(v, hue) {
    var t = Math.max(0, Math.min(1, v == null ? 0 : v));
    return '<div class="meter"><i style="width:' + (t * 100) + "%;background:" + (hue || A.MUTED) + '"></i></div>';
  }
  // The duty bar in a card: the SAME absolute 0-1 scale and the SAME neutral
  // ink as the overlay, so one number reads one way wherever it appears.
  function dutyMeter(v) {
    var t = Math.max(0, Math.min(1, v == null ? 0 : v));
    return '<div class="meter" title="absolute 0–1 scale"><i style="width:' +
      (t > 0 ? Math.max(0.6, t * 100) : 0) + "%;background:" + A.DUTY_INK + '"></i></div>' +
      '<span class="hintline" style="display:block">fraction of the period this macro is active — absolute 0–1 scale</span>';
  }
  function invMark(paths, coll, obj, field) {
    return A.isInvented(paths, coll, obj, field) ? '<span class="inv" title="fixture-invented value">◇</span> ' : "";
  }
  function groupWords(o) {
    if (!o || !o.groups) return "unknown";
    return A.AXES.map(function (a) { return a + " " + (o.groups[a] == null ? "—" : o.groups[a]); }).join(" &middot; ") +
      (o.primary_group ? " &middot; hue from <b>" + esc(o.primary_group) + "</b>" : "");
  }

  function macroCard(m) {
    var d = S.doc, paths = A.inventedIndex(d);
    var tById = A.byId(d.tiles);
    var cap = A.capacityOf(d, m) || {};
    var card = d.cards[m.card] || {};
    var tiles = (m.tiles || []).map(function (t) { return tById[t]; }).filter(Boolean)
      .sort(function (a, b) { return a.columns.start - b.columns.start; });
    var hue = tiles.length ? hueOf(tiles[0]) : null;
    var h = ['<div class="ttl">macro</div><div class="idl mono">' + esc(m.id) + "</div><dl>"];
    h.push("<dt>chip</dt><dd class=\"mono\">" + esc(m.chip) + "</dd>");
    h.push("<dt>device card</dt><dd>" + esc(card.label || m.card) + "<br><span class=\"mono\" style=\"font-size:11px\">" +
      esc(cap.rows + " rows × " + cap.cols_adc + " ADC × " + cap.mux + " mux = " + cap.stored_cols + " stored columns") + "</span></dd>");
    h.push("<dt>area</dt><dd>" + (card.area_mm2 == null ? '<span style="color:#8497a2">unknown — no run supplies it</span>' : esc(A.fmt(card.area_mm2)) + " mm²") + "</dd>");
    h.push("<dt>occupancy</dt><dd>" + invMark(paths, "macros", m, "occupancy") + esc(A.pct(m.occupancy)) + meter(m.occupancy, hue) + "</dd>");
    h.push("<dt>duty cycle</dt><dd>" + invMark(paths, "macros", m, "duty_cycle") +
      (m.duty_cycle == null
        ? '<span style="color:#8497a2">unknown — this document declares none</span>'
        : esc(A.fmt(m.duty_cycle)) + dutyMeter(m.duty_cycle)) + "</dd>");
    if (m.digital_pool) {
      h.push("<dt>per-macro digital pool</dt><dd>" + invMark(paths, "macros", m, "digital_pool") +
        esc(m.digital_pool.shift_add_units + " shift/add units · " + m.digital_pool.act_lanes + " activation lanes · " +
          A.fmt(m.digital_pool.area_mm2) + " mm²") + "</dd>");
    }
    if (m.reserved) h.push("<dt>reserved</dt><dd>" + esc(m.reserved) + "</dd>");
    h.push("</dl>");
    if (tiles.length) {
      h.push('<div class="ttl" style="margin-top:.7rem">tiles — ' + tiles.length + "</div>");
      h.push("<table><tr><th>owner</th><th>K×N</th><th>columns</th><th>group</th></tr>");
      tiles.forEach(function (t) {
        var o = t.owner || {};
        var g = t.groups ? t.primary_group + " " + t.groups[t.primary_group] : "—";
        h.push("<tr><td>" + esc(o.model) + "<br>" +
          esc(o.layer == null ? "endpoint" : "layer " + o.layer) + " &middot; " + esc(o.block) +
          (o.expert == null ? "" : " &middot; expert " + esc(o.expert)) +
          (t.slice ? "<br>slice " + esc(t.slice.index + "/" + t.slice.of) : "") + "</td>" +
          "<td>" + esc(t.shape.K + "×" + t.shape.N) + "</td>" +
          "<td>" + invMark(paths, "tiles", t, "columns") +
          esc("[" + t.columns.start + ", " + (t.columns.start + t.columns.count) + ")") + "</td>" +
          '<td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' +
          (hueOf(t) || "#8497a2") + '"></span> ' + esc(g) + "</td></tr>");
      });
      h.push("</table>");
      h.push('<p class="hintline">Gaps in the column strip are columns no tile spans. Unowned capacity is legal and reported.</p>');
      var brackets = A.bracketsFor(d, S.ix, m);
      if (brackets.length) {
        h.push('<div class="ttl" style="margin-top:.7rem">column map brackets — ' + brackets.length + "</div>");
        h.push("<ul style=\"margin:.2rem 0 0;padding-left:1.05rem;font-size:11.5px\">");
        brackets.forEach(function (b) {
          h.push("<li>" + esc(b.label) +
            (b.chained.length ? ' <span class="mono" style="font-size:10.5px">' + esc(b.chained.join(" ")) + "</span>" : "") +
            "</li>");
        });
        h.push("</ul>");
      }
      h.push('<p class="hintline">Open the Macro view for the full column map and its brackets.</p>');
    }
    return h.join("");
  }

  function tileCard(t) {
    var d = S.doc, paths = A.inventedIndex(d);
    var o = t.owner || {};
    var macro = S.ix.macro[t.macro];
    var siblings = (S.ix.owner[A.ownerKey(t)] || []).filter(function (id) { return id !== t.id; });
    var h = ['<div class="ttl">tile</div><div class="idl mono">' + esc(t.id) + "</div><dl>"];
    h.push("<dt>owner</dt><dd>" + esc(o.model) + "<br>" +
      esc((o.layer == null ? "endpoint" : "layer " + o.layer) + " · " + o.block +
        (o.expert == null ? "" : " · expert " + o.expert)) + "</dd>");
    h.push("<dt>shape</dt><dd>" + esc(t.shape.K + " × " + t.shape.N) + " — this tile, not the whole matrix</dd>");
    h.push("<dt>columns</dt><dd>" + invMark(paths, "tiles", t, "columns") +
      esc("[" + t.columns.start + ", " + (t.columns.start + t.columns.count) + ") of " +
        ((A.capacityOf(d, macro) || {}).stored_cols || "?")) + "</dd>");
    h.push("<dt>slice</dt><dd>" + (t.slice
      ? esc("slice " + t.slice.index + " of " + t.slice.of + " · " + t.slice.bits + " bits per cell")
      : '<span style="color:#8497a2">none — this card stores whole weight words</span>') + "</dd>");
    h.push("<dt>group</dt><dd>" + groupWords(t) + "</dd>");
    h.push("<dt>host</dt><dd class=\"mono\">" + esc(t.macro + " · " + (macro ? macro.chip : "?")) + "</dd>");
    h.push("</dl>");
    if (siblings.length) {
      h.push('<p class="hintline">This weight matrix is carried by ' + (siblings.length + 1) +
        " tiles sharing one owner tuple; the column map brackets them.</p>");
    }
    return h.join("");
  }

  function chipCard(c) {
    var d = S.doc, paths = A.inventedIndex(d);
    var h = ['<div class="ttl">chip</div><div class="idl mono">' + esc(c.id) + "</div><dl>"];
    h.push("<dt>label</dt><dd>" + esc(c.label || "—") + "</dd>");
    h.push("<dt>system</dt><dd class=\"mono\">" + esc(c.system) + "</dd>");
    h.push("<dt>pool</dt><dd>" + esc(c.pool) + (c.pool === "digital" ? " — shared digital chiplet; it stores no weights" : " — analog macro chiplet") + "</dd>");
    h.push("<dt>slots</dt><dd>" + esc((c.capacity && c.capacity.macro_slots) || "?") + " enumerated macro slots</dd>");
    h.push("<dt>occupancy</dt><dd>" + invMark(paths, "chips", c, "occupancy") + esc(A.pct(c.occupancy)) + meter(c.occupancy, hueOf(c)) + "</dd>");
    h.push("<dt>groups</dt><dd>" + groupWords(c) + "</dd>");
    h.push("</dl>");
    var ls = d.links.filter(function (l) { return l.from === c.id || l.to === c.id; });
    if (ls.length) {
      h.push('<div class="ttl" style="margin-top:.7rem">links — ' + ls.length + "</div>");
      h.push("<table><tr><th>role</th><th>other end</th><th>bytes</th></tr>");
      ls.forEach(function (l) {
        h.push("<tr><td>" + esc(l.role) + "</td><td class=\"mono\">" + esc(l.from === c.id ? l.to : l.from) + "</td><td>" +
          invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</td></tr>");
      });
      h.push("</table>");
    }
    h.push('<p class="hintline">Click the chip, or pick it in the Chip view, to see its macros.</p>');
    return h.join("");
  }

  function linkCard(l) {
    var paths = A.inventedIndex(S.doc);
    return ['<div class="ttl">link</div><div class="idl mono">' + esc(l.id) + "</div><dl>",
      "<dt>role</dt><dd>" + esc(l.role) + "</dd>",
      "<dt>from &rarr; to</dt><dd class=\"mono\">" + esc(l.from) + " &rarr; " + esc(l.to) + "</dd>",
      "<dt>bytes per " + esc(l.per || "unit") + "</dt><dd>" + invMark(paths, "links", l, "bytes") + esc(A.fmtBytes(l.bytes)) + "</dd>",
      "<dt>carries</dt><dd>" + esc(l.label || "—") + "</dd>",
      "</dl>",
      '<p class="hintline">Fully-connected p2p, no congestion model. The atlas draws bytes, never link times.</p>'
    ].join("");
  }

  // One line of model shape, built only from the fields the document carries.
  // A model with no vocabulary — a toy chain of weight blocks, an encoder —
  // publishes no vocab_size, and the card names the shape it has rather than
  // printing a word where a number belongs.
  function modelShape(mdl) {
    var parts = [];
    if (mdl.layers != null) parts.push(mdl.layers + " layers");
    if (mdl.hidden_dim != null) parts.push("hidden " + mdl.hidden_dim);
    if (mdl.intermediate_size != null) parts.push("ffn " + mdl.intermediate_size);
    if (mdl.vocab_size != null) parts.push("vocab " + mdl.vocab_size);
    return parts.length ? parts.join(" · ") : "no shape published";
  }
  function defaultCard() {
    var d = S.doc;
    if (!d) return '<div class="ttl">No document</div><p class="hintline">This point has no spatial map. Open one with the file picker above, or read the stage map instead.</p>';
    if (d.systems.length > 1) return pdCard();
    var sys = d.systems[0] || {}, mdl = (sys.models || [])[0] || {};
    var h = ['<div class="ttl">system</div><div class="idl mono">' + esc(sys.id || "") + "</div><dl>"];
    h.push("<dt>role &middot; phase</dt><dd>" + esc((sys.role || "?") + " · " + (sys.phase || "?")) + "</dd>");
    h.push("<dt>parallelism</dt><dd>" + esc(A.AXES.map(function (a) { return a + " = " + ((sys.parallelism || {})[a]); }).join(" · ")) + "</dd>");
    h.push("<dt>model</dt><dd>" + esc(mdl.label || mdl.id || "—") + "<br><span style=\"font-size:11px;color:#5f7280\">" +
      esc(modelShape(mdl)) + "</span></dd>");
    if (mdl.serving) h.push("<dt>serving</dt><dd>" + esc("batch " + mdl.serving.batch + " · prefill " + mdl.serving.prefill_len +
      " · decode " + mdl.serving.decode_len) + "</dd>");
    h.push("</dl>");
    h.push('<p class="hintline">Hover a chip, link or macro for its card. Click to pin it.</p>');
    return h.join("");
  }

  // A PD document has two systems and no single "the system", so the
  // resting card is the pair and the one thing that couples them.
  function pdCard() {
    var d = S.doc;
    var h = ['<div class="ttl">PD machine — ' + d.systems.length + " systems</div>"];
    d.systems.forEach(function (sys) {
      var mdl = (sys.models || [])[0] || {};
      var chips = d.chips.filter(function (c) { return c.system === sys.id; });
      h.push('<div class="idl mono">' + esc(sys.id) + "</div><dl>");
      h.push("<dt>role &middot; phase</dt><dd>" + esc(sys.role + " · " + sys.phase) + "</dd>");
      h.push("<dt>inventory</dt><dd>" + esc(chips.filter(function (c) { return c.pool === "analog"; }).length +
        " analog chiplets · " + chips.filter(function (c) { return c.pool === "digital"; }).length +
        " shared digital") + "</dd>");
      h.push("<dt>parallelism</dt><dd>" + esc(A.AXES.map(function (a) {
        return a + " = " + ((sys.parallelism || {})[a]);
      }).join(" · ")) + "</dd>");
      h.push("<dt>model</dt><dd>" + esc(mdl.label || mdl.id || "—") + "</dd>");
      h.push("</dl>");
    });
    var pd = d.links.filter(function (l) { return l.role === "pd"; })[0];
    if (pd) {
      h.push('<div class="ttl" style="margin-top:.7rem">handoff</div><dl>');
      h.push("<dt>bytes per " + esc(pd.per || "unit") + "</dt><dd>" + esc(A.fmtBytes(pd.bytes)) + "</dd>");
      h.push("<dt>basis</dt><dd>" + esc(pd.basis || "—") + "</dd></dl>");
    }
    h.push('<p class="hintline">Two inventories, one priced handoff. Each system holds the whole model and is priced on its own timeline — read relaxations[] before comparing the two.</p>');
    return h.join("");
  }

  // ---- P7.6 cards -----------------------------------------------------------
  function showCard(html) { $("h-card").innerHTML = html; }

  function renderLegend() {
    if (!S.doc || S.res.errors.length) {
      $("h-legend").innerHTML = ""; $("h-legend").style.display = "none"; return;
    }
    $("h-legend").style.display = "";
    var blocks = blockOrder(), dom = hueDomain();
    var h = ["<h3>Legend</h3>"];
    h.push('<div class="leg-sub">Colour \u2014 layer number</div>');
    var stops = [];
    for (var i = 0; i < 24; i++) {
      var L = dom.lo + (i / 23) * (dom.hi - dom.lo);
      stops.push('<rect x="' + (i * 7) + '" y="0" width="7" height="14" fill="' + layerHue(L) + '"/>');
    }
    h.push('<div class="legrow"><svg width="168" height="14">' + stops.join("") + "</svg></div>");
    h.push('<div class="legrow"><span class="tx" style="font-size:11px">layer ' + dom.lo
      + " \u2014\u2014\u2014\u2014 layer " + dom.hi
      + (dom.hi - dom.lo + 1 < layerCount() ? " (the layers on screen)" : "") + "</span></div>");
    if (blocks.length) {
      h.push('<div class="leg-sub">Hatch \u2014 weight block</div>');
      h.push('<div class="legrow"><span class="tx">' + blocks.map(function (b, bi) {
        var hf = hatchFor(b);
        return '<span class="blk"><svg width="16" height="16">' + hatchDefs() +
          '<rect width="16" height="16" rx="3" fill="#c9d6dd"/>' +
          (hf ? '<rect width="16" height="16" rx="3" fill="' + hf + '"/>' : "") +
          "</svg>" + esc(b) + (hf ? "" : " (no hatch left)") + "</span>";
      }).join("") + "</span></div>");
    }
    h.push('<div class="leg-sub">Fill depth \u2014 how full the macro is</div>');
    var base = layerHue(0) || A.MUTED;
    var ramp = [0, 0.25, 0.5, 0.75, 1].map(function (t) {
      return '<rect x="' + (t * 128) + '" y="0" width="32" height="14" fill="' + A.ramp(base, t) + '" stroke="#dde5e9"/>';
    }).join("");
    h.push('<div class="legrow"><svg width="160" height="14">' + ramp + "</svg></div>");
    h.push('<div class="legrow"><span class="tx" style="font-size:11px">0% \u2014\u2014\u2014\u2014 100% of columns held</span></div>');
    h.push('<div class="leg-sub">Outline \u2014 chiplet kind</div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="3" fill="none" stroke="#1c2a33" stroke-width="1.4"/></svg></span><span class="tx">analog weight chiplet</span></div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16"><rect x="1" y="1" width="24" height="14" rx="3" fill="none" stroke="#1c2a33" stroke-width="1.4" stroke-dasharray="5 3"/></svg></span><span class="tx">shared digital chiplet</span></div>');
    h.push('<div class="leg-sub">Hatch \u2014 empty, not unknown</div>');
    h.push('<div class="legrow"><span class="sw"><svg width="26" height="16">' + svgDefs() + '<rect width="26" height="16" rx="3" fill="url(#p-res)" stroke="#c2ced5"/></svg></span><span class="tx">slot holds no tiles</span></div>');
    var roles = {};
    S.doc.links.forEach(function (l) { roles[l.role] = (roles[l.role] || 0) + 1; });
    var drawn = ["tp", "ep", "pp", "pd", "act", "svc"].filter(function (r) { return roles[r]; });
    if (drawn.length) {
      h.push('<div class="leg-sub">Wires \u2014 thickness is bytes</div>');
      drawn.forEach(function (r) {
        h.push('<div class="legrow"><span class="sw"><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="#4a5c68" stroke-width="2.4" stroke-dasharray="' +
          roleDash(r) + '"/></svg></span><span class="tx"><b>' + r + "</b> " + roles[r] + "</span></div>");
      });
    }
    $("h-legend").innerHTML = h.join("");
  }

  // ---------------------------------------------------------------- toolbar --
  // D13. A dropdown whose whole document holds one value is a control that
  // cannot change the picture, so it is not drawn. A filter that selects
  // nothing says so, in place, with one click back.
  function realValues(list) {
    return (list || []).filter(function (v) { return v != null && v !== ""; });
  }
  function selectionCount() {
    var d = S.doc, n = 0, total = 0;
    if (!d) return { n: 0, total: 0, noun: "objects" };
    if (S.view === "package") {
      total = d.chips.length;
      d.chips.forEach(function (c) { if (A.chipMatches(d, S.ix, c, S.filter)) n++; });
      return { n: n, total: total, noun: "chiplets" };
    }
    if (S.view === "macro") {
      var macro = S.ix.macro[S.macro];
      A.macroTiles(d, S.ix, macro || { tiles: [] }).forEach(function (t) {
        total++;
        if (A.tileMatches(d, S.ix, t, S.filter)) n++;
      });
      return { n: n, total: total, noun: "tiles on this macro" };
    }
    var chip = S.ix.chip[S.chip];
    (chip ? chip.macros || [] : []).forEach(function (mid) {
      var m = S.ix.macro[mid];
      if (!m) return;
      total++;
      if (A.macroMatches(d, S.ix, m, S.filter)) n++;
    });
    return { n: n, total: total, noun: "macros on this chip" };
  }
  function selectionNote() {
    if (!A.filterActive(S.filter)) return "";
    var c = selectionCount();
    return "selects " + c.n + " of " + c.total + " " + c.noun
      + " — the rest still draw, dimmed. A selection count, not a figure";
  }

  function renderBar() {
    var host = $("h-bar");
    if (!host) return;
    var ok = S.doc && !S.res.errors.length;
    var chips = ok ? S.doc.chips : [];
    var opts = chips.map(function (c) {
      return '<option value="' + esc(c.id) + '"' + (c.id === S.chip ? " selected" : "") + ">" +
        esc(c.id) + " — " + esc(c.label || "") + "</option>";
    }).join("");
    var f = S.filter;
    var choices = ok ? A.filterOptions(S.doc, S.ix) : { models: [], layers: [], groups: [], pools: [] };
    function sel(id, label, values, current, render) {
      var vals = realValues(values);
      // fewer than two real values: the control cannot change anything
      if (vals.length < 2 && !current) return "";
      return '<label class="pick">' + esc(label) +
        '<select id="' + id + '"><option value="">any</option>' +
        vals.map(function (v) {
          return '<option value="' + esc(v) + '"' + (String(v) === String(current) ? " selected" : "") +
            ">" + esc(render ? render(v) : v) + "</option>";
        }).join("") + "</select></label>";
    }
    var dutyOn = A.hasDuty(S.doc || { macros: [] });
    var lines = [];
    lines.push('<div class="bar ui">' +
      '<button id="b-pkg" aria-pressed="' + (S.view === "package") + '">Pipeline</button>' +
      '<button id="b-chip" aria-pressed="' + (S.view === "chip") + '"' + (chips.length ? "" : " disabled") + ">Chip</button>" +
      '<button id="b-macro" aria-pressed="' + (S.view === "macro") + '"' +
      (S.macro ? "" : " disabled") + ">Macro</button>" +
      (chips.length ? '<select id="b-sel">' + opts + "</select>" : "") +
      '<label class="chk"><input type="checkbox" id="b-duty"' + (S.duty ? " checked" : "") +
      (dutyOn ? "" : " disabled") + "> duty cycle overlay</label>" +
      // D19. The page used to tell the reader to "use Open" and carry no file
      // input at all. Here is the input, and it says what it opens.
      '<label class="file" for="b-file">Open an fws_atlas/1 document…</label>' +
      '<input type="file" id="b-file" accept=".json,application/json">' +
      '<span class="note">' + esc(S.source || "") + "</span></div>");
    if (ok) {
      var picks = [
        sel("f-model", "model", choices.models, f.model),
        sel("f-layer", "layer", choices.layers, f.layer),
        sel("f-group", "group", choices.groups, f.group, function (v) { return v.replace(":", " "); }),
        sel("f-pool", "pool", choices.pools, f.pool)
      ].filter(Boolean);
      lines.push('<div class="bar filt ui">' +
        '<span class="tag">filter</span>' + picks.join("") +
        '<label class="pick">owner search<input type="search" id="f-q" value="' + esc(f.q) +
        '" placeholder="model / layer / block / expert / id"></label>' +
        '<button id="f-clear"' + (A.filterActive(f) ? "" : " disabled") + ">Clear</button>" +
        '<span class="note">' + selectionNote() + "</span></div>");
      var count = A.filterActive(f) ? selectionCount() : null;
      if (count && count.total > 0 && count.n === 0) {
        lines.push('<div class="zeroban ui">This filter selects none of the ' + count.total + " "
          + esc(count.noun) + " in this view. Nothing is hidden by mistake: the document holds no "
          + "object that matches. <button id=\"f-clear2\">Clear the filter</button></div>");
      }
    }
    host.innerHTML = lines.join("");

    var pkg = $("b-pkg"), chip = $("b-chip"), macro = $("b-macro"), pick = $("b-sel");
    if (pkg) pkg.addEventListener("click", function () { go("package", null, null); });
    if (chip) chip.addEventListener("click", function () { go("chip", S.chip, null); });
    if (macro) macro.addEventListener("click", function () { go("macro", S.chip, S.macro); });
    if (pick) pick.addEventListener("change", function () { go("chip", pick.value, null); });
    var duty = $("b-duty");
    if (duty) duty.addEventListener("change", function () { S.duty = duty.checked; S.selftest = null; pushURL(); render(); });
    var file = $("b-file");
    if (file) file.addEventListener("change", function () {
      if (file.files && file.files[0]) readFile(file.files[0]);
    });
    [["f-model", "model"], ["f-layer", "layer"], ["f-group", "group"], ["f-pool", "pool"]].forEach(function (pair) {
      var node = $(pair[0]);
      if (node) node.addEventListener("change", function () {
        S.filter[pair[1]] = node.value; S.selftest = null; pushURL(); render();
      });
    });
    var q = $("f-q");
    if (q) {
      var take = function () { S.filter.q = q.value; S.selftest = null; pushURL(); render(); };
      q.addEventListener("change", take);
      q.addEventListener("keydown", function (e) { if (e.key === "Enter") take(); });
    }
    ["f-clear", "f-clear2"].forEach(function (id) {
      var clear = $(id);
      if (clear) clear.addEventListener("click", function () {
        S.filter = A.emptyFilter(); S.selftest = null; pushURL(); render();
      });
    });
  }

  // ------------------------------------------------------------ breadcrumbs --
  function renderCrumbs() {
    var host = $("h-crumbs");
    if (!host) return;
    if (!S.doc || S.res.errors.length || S.selftest) { host.innerHTML = ""; return; }
    var path = A.crumbs(S.doc, S.ix, S.view, S.chip, S.macro);
    var parts = path.map(function (c, i) {
      var last = i === path.length - 1;
      var label = esc(c.label) + (c.note ? ' <span class="note">' + esc(c.note) + "</span>" : "");
      return last
        ? '<span class="here">' + label + "</span>"
        : '<a href="#" data-crumb="' + esc(c.level) + '" data-id="' + esc(c.id == null ? "" : c.id) + '">' + label + "</a>";
    });
    // D19. A macro used to be a dead end: the only way on was the browser's
    // Back button. Its siblings on the same chip are one click away now.
    var sibs = "";
    if (S.view === "macro" && S.chip && S.ix.chip[S.chip]) {
      var ids = (S.ix.chip[S.chip].macros || []).slice().sort();
      var at = ids.indexOf(S.macro);
      if (ids.length > 1) {
        sibs = '<span class="sep">&middot;</span>'
          + '<a href="#" data-sib="' + esc(ids[(at - 1 + ids.length) % ids.length]) + '">&lsaquo; previous slot</a>'
          + '<span class="sep">&middot;</span>'
          + '<a href="#" data-sib="' + esc(ids[(at + 1) % ids.length]) + '">next slot &rsaquo;</a>'
          + '<span class="note">' + (at + 1) + " of " + ids.length + " on " + esc(S.chip) + "</span>";
      }
    }
    host.innerHTML = '<nav class="crumbs ui">' + parts.join('<span class="sep">&rsaquo;</span>') + sibs + "</nav>";
    Array.prototype.forEach.call(host.querySelectorAll("[data-crumb]"), function (n) {
      n.addEventListener("click", function (e) {
        e.preventDefault();
        var level = n.getAttribute("data-crumb"), id = n.getAttribute("data-id");
        if (level === "package") go("package", null, null);
        else go("chip", id, null);
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll("[data-sib]"), function (n) {
      n.addEventListener("click", function (e) {
        e.preventDefault();
        go("macro", null, n.getAttribute("data-sib"));
      });
    });
  }

  // Descend / ascend. Containment only. A descent may carry a FILTER with it:
  // clicking one layer band of a stage means "show me that block's tiles", and
  // dropping the filter on the way down landed the reader on the whole chip
  // with no idea which band they had picked (D19).
  function go(view, chipId, macroId, carry) {
    S.view = view;
    S.selftest = null;
    S.pinned = false;
    if (carry) {
      S.filter = A.emptyFilter();
      Object.keys(carry).forEach(function (k) { S.filter[k] = carry[k]; });
    }
    if (chipId != null) S.chip = chipId;
    S.macro = macroId == null ? (view === "macro" ? S.macro : null) : macroId;
    if (view === "macro" && S.macro && S.ix.macro[S.macro]) S.chip = S.ix.macro[S.macro].chip;
    pushURL();
    render();
    // Descending keeps the card of the thing you descended INTO.
    if (view === "macro" && S.ix.macro[S.macro]) { S.pinned = true; showCard(macroCard(S.ix.macro[S.macro])); }
    else if (view === "chip" && S.ix.chip[S.chip]) { S.pinned = true; showCard(chipCard(S.ix.chip[S.chip])); }
  }

  // ------------------------------------------------------- validation panel --
  function refusalPanel() {
    var rows = S.res.errors.slice(0, 200).map(function (e) {
      return '<tr><td class="mono">' + esc(e.rule) + '</td><td class="mono">' + esc(e.field) + "</td><td>" + esc(e.message) + "</td></tr>";
    }).join("");
    return '<div class="refuse ui"><h2>The atlas refuses to draw</h2>' +
      "<p>A mapping that cannot be drawn is not a mapping. " + S.res.errors.length +
      " check" + (S.res.errors.length === 1 ? "" : "s") + " failed; each names the field that failed it. " +
      'See <span class="mono">SCHEMA.md</span> for the rule numbers.</p>' +
      "<table><tr><th>rule</th><th>field</th><th>what is wrong</th></tr>" + rows + "</table>" +
      (S.res.errors.length > 200 ? "<p>&hellip; and " + (S.res.errors.length - 200) + " more.</p>" : "") + "</div>";
  }

  // D16. One scoring rule, used by every harness on this page: a case that
  // could not be BUILT is not a pass and not a miss, so it is counted out of
  // the denominator and named separately. The panel used to divide by the
  // whole list and print a score no reader could reconcile with the rows.
  function score(rows) {
    var skipped = rows.filter(function (r) { return r.skipped; }).length;
    var live = rows.length - skipped;
    var pass = rows.filter(function (r) { return r.pass && !r.skipped; }).length;
    return { pass: pass, live: live, skipped: skipped };
  }
  function stSection(title, rows, verb, tail) {
    if (!rows || !rows.length) return "";
    var sc = score(rows);
    var head = 'style="font:600 10.5px/1 \'Segoe UI\',sans-serif;letter-spacing:.12em;' +
      'text-transform:uppercase;color:#8497a2;margin:1rem 0 .5rem"';
    var body = rows.map(function (r) {
      return '<tr' + (r.skipped ? ' class="skip"' : "") + '><td class="mono">' + esc(r.rule) +
        "</td><td>" + esc(r.what) + '</td><td class="' + (r.skipped ? "" : r.pass ? "ok" : "no") + '">' +
        (r.skipped ? "n/a" : r.pass ? verb[0] : verb[1]) + '</td><td class="mono" style="font-size:11px">' +
        esc(r.got) + "</td></tr>";
    }).join("");
    return "<h3 " + head + ">" + esc(title) + " &mdash; " + sc.pass + " / " + sc.live + " pass" +
      (sc.skipped ? " &middot; " + sc.skipped + " not constructible on this document" : "") + "</h3>" +
      "<table><tr><th>rule</th><th>case</th><th>verdict</th><th>evidence</th></tr>" + body + "</table>" +
      (tail ? '<p class="hintline">' + tail + "</p>" : "");
  }
  function allSelfTests() {
    if (!S.doc) return null;
    // Both suites are pure and both are guarded case by case: a self-test may
    // report a miss, and it may never take the results layer down with it (D5).
    var out = { refusals: null, views: null, error: null };
    try { out.refusals = A.selfTest(S.doc); } catch (e) { out.error = String(e && e.message || e); }
    try { out.views = A.viewTest(S.doc); } catch (e) { out.error = (out.error || "") + " " + String(e && e.message || e); }
    return out;
  }
  function selfTestPanel() {
    var t = S.selftest || {};
    return '<div class="st ui">'
      + '<p class="hintline">on <b>' + esc(S.source) + "</b>"
      + (S.selftestMs != null ? " &middot; " + (S.selftestMs / 1000).toFixed(2) + " s of cloning and validating" : "")
      + " &middot; run on request only, never on a plain load</p>"
      + (t.error ? '<p class="rerr">part of the suite threw: ' + esc(t.error) + "</p>" : "")
      + stSection("Loader self-test", t.refusals, ["fires", "MISSED"],
        "Each row corrupts a copy of the loaded document and asserts the loader refuses it and names the "
        + "right field. A rule this document gives the harness no way to corrupt is reported as n/a and "
        + "counted out of the score rather than as a free pass.")
      + stSection("View rules", t.views, ["holds", "BROKEN"],
        "The encoding law, asserted on this document: one fact per channel, a filter that moves no figure, "
        + "a stated draw budget, brackets that claim only one weight matrix, and one lane per system.")
      + "</div>";
  }

  // ---------------------------------------------------------- the map -------
  // The drilldown's root view IS the pipeline map of the SELECTED point.
  // Analog chiplets form the bottom band, one segment per pipeline stage in
  // pipeline order; inside a segment the weight space is split by LAYER (hue)
  // and by BLOCK (hatch). Shared digital chiplets sit above, wired to the
  // analog chiplets they serve. Every number here is read off the document
  // that is BOUND to this point, never off another point's.
  function chipComposition(chip) {
    if (S.cache.comp[chip.id]) return S.cache.comp[chip.id];
    var byLayer = {}, order = [], totalCols = 0, totalCells = 0, held = 0;
    (chip.macros || []).forEach(function (mid) {
      var m = S.ix.macro[mid];
      if (!m) return;
      var tiles = (m.tiles || []).map(function (tid) { return S.ix.tile[tid]; }).filter(Boolean);
      if (tiles.length) held++;
      tiles.forEach(function (t) {
        var L = t.owner && typeof t.owner.layer === "number" ? t.owner.layer : -1;
        var b = (t.owner && t.owner.block) || "?";
        var cols = (t.columns && t.columns.count) || 0;
        var cells = cols * ((t.shape && t.shape.K) || 0);
        if (!byLayer[L]) { byLayer[L] = { layer: L, cols: 0, cells: 0, tiles: 0, blocks: {}, border: [] }; order.push(L); }
        var e = byLayer[L];
        e.cols += cols; e.cells += cells; e.tiles++;
        if (!e.blocks[b]) { e.blocks[b] = { block: b, cols: 0, tiles: 0 }; e.border.push(b); }
        e.blocks[b].cols += cols; e.blocks[b].tiles++;
        totalCols += cols; totalCells += cells;
      });
    });
    order.sort(function (a, b) { return a - b; });
    var out = { layers: order.map(function (L) { return byLayer[L]; }), totalCols: totalCols, totalCells: totalCells, held: held };
    S.cache.comp[chip.id] = out;
    return out;
  }
  // A stage row states its layers as a LIST in the per-model report and as a
  // count plus `layer_ids` in the sweep's own compact rows. Both are read here
  // rather than one being assumed (the map used to index st.layers[0] blind).
  function stageLayerIds(st) {
    if (st && Array.isArray(st.layer_ids)) return st.layer_ids;
    if (st && Array.isArray(st.layers)) return st.layers;
    return [];
  }
  function stageSpan(st) {
    var ids = stageLayerIds(st);
    if (!ids.length) return null;
    return ids[0] === ids[ids.length - 1] ? "L" + ids[0] : "L" + ids[0] + "–" + ids[ids.length - 1];
  }

  function drawPipelinePackage(stages) {
    if (!S.doc || !stages || !stages.length) return null;
    var d = S.doc;
    var analog = (d.chips || []).filter(function (c) { return c.pool === "analog"; });
    var digital = (d.chips || []).filter(function (c) { return c.pool !== "analog"; });
    if (!analog.length) return null;
    function chipByIndex(i) {
      var hit = null;
      analog.forEach(function (c) { var mm = String(c.id).match(/(\d+)$/); if (mm && parseInt(mm[1], 10) === i) hit = c; });
      return hit || analog[i] || null;
    }
    function tip(html) { return encodeURIComponent(html); }
    function slotsOf(c) {
      if (!c) return 1;
      return (c.capacity && (c.capacity.macro_slots || c.capacity.slots)) || (c.macros ? c.macros.length : 1);
    }
    var W = 1180, rowA_y = 268, rowA_h = 108, rowD_y = 58, rowD_h = 46, L = 34, R = 34, GAP = 9;
    var stageChips = stages.map(function (st) {
      return (Array.isArray(st.chips) ? st.chips : []).map(chipByIndex).filter(Boolean);
    });
    // Width IS the weight columns the stage holds, so an uneven partition is
    // visible as an uneven picture rather than hidden by a uniform grid.
    var widths = stageChips.map(function (cs) {
      return cs.reduce(function (a, c) { return a + (chipComposition(c).totalCols || 0); }, 0) || 1;
    });
    var totalW = widths.reduce(function (a, b) { return a + b; }, 0);
    var usable = W - L - R - GAP * (stages.length - 1);
    var H = rowA_y + rowA_h + 58;
    var p = [hatchDefs()];
    p.push('<defs><marker id="pl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker>'
      + svgDefs().replace("<defs>", "").replace("</defs>", "") + "</defs>");
    p.push('<text x="' + L + '" y="' + (rowD_y - 16) + '" font-size="11" fill="var(--muted)" letter-spacing=".08em">SHARED DIGITAL CHIPLETS</text>');
    p.push('<text x="' + L + '" y="' + (rowA_y - 12) + '" font-size="11" fill="var(--muted)" letter-spacing=".08em">ANALOG WEIGHT CHIPLETS — colour is layer, hatch is block, width is weight columns · pipeline order →</text>');
    var x = L, seg = [], segOfChip = {};
    stages.forEach(function (st, i) {
      var w = usable * widths[i] / totalW;
      var chips = stageChips[i];
      var chip = chips[0];
      var comp = { layers: [], totalCols: 0, totalCells: 0, held: 0 }, slots = 0;
      chips.forEach(function (c) {
        var cc = chipComposition(c);
        slots += slotsOf(c);
        comp.totalCols += cc.totalCols; comp.totalCells += cc.totalCells; comp.held += cc.held;
        cc.layers.forEach(function (le) {
          var hit = null;
          comp.layers.forEach(function (e) { if (e.layer === le.layer) hit = e; });
          if (!hit) { hit = { layer: le.layer, cols: 0, cells: 0, tiles: 0, blocks: {}, border: [] }; comp.layers.push(hit); }
          hit.cols += le.cols; hit.cells += le.cells; hit.tiles += le.tiles;
          le.border.forEach(function (b) {
            if (!hit.blocks[b]) { hit.blocks[b] = { block: b, cols: 0, tiles: 0 }; hit.border.push(b); }
            hit.blocks[b].cols += le.blocks[b].cols; hit.blocks[b].tiles += le.blocks[b].tiles;
          });
        });
      });
      comp.layers.sort(function (a, b) { return a.layer - b.layer; });
      var span = stageSpan(st);
      var stTip = '<div class="t">Stage ' + st.stage + (span ? " · layers " + span.slice(1) : "") + "</div>"
        + chips.length + " analog chiplet" + (chips.length > 1 ? "s" : "") + " · " + slots.toLocaleString("en-US") + " macro slots"
        + "<br>" + comp.held.toLocaleString("en-US") + " slots hold weights (" + (slots ? (comp.held / slots * 100).toFixed(1) : "0") + "%)"
        + "<br>" + rfmt(comp.totalCells) + " weight cells"
        + '<div class="b">click to open this chiplet</div>';
      p.push('<g><rect data-chip="' + esc(chip ? chip.id : "") + '" data-rstip="' + tip(stTip) + '" x="' + x + '" y="' + rowA_y + '" width="' + w + '" height="' + rowA_h + '" rx="4" fill="var(--code)" stroke="var(--faint)" stroke-width="1" cursor="pointer"/>');
      var innerX = x + 3, innerW = w - 6, innerY = rowA_y + 20, innerH = rowA_h - 40;
      var denom = comp.totalCols || 1;
      comp.layers.forEach(function (le) {
        var lw = innerW * le.cols / denom;
        if (lw <= 0) return;
        var hue = layerHue(le.layer) || "#8497a2";
        var by = innerY, bl = le.border.slice().sort();
        bl.forEach(function (b) {
          var be = le.blocks[b];
          var bh = innerH * be.cols / (le.cols || 1);
          if (bh <= 0) return;
          var bt = '<div class="t">layer ' + le.layer + " · " + esc(b) + "</div>"
            + be.cols.toLocaleString("en-US") + " weight columns · " + be.tiles.toLocaleString("en-US") + " tile(s)"
            + "<br>stage " + st.stage + (chip ? " · " + esc(chip.id) : "")
            + '<div class="b">click for this block’s tiles on that chiplet</div>';
          // D19. A band click used to land on the whole chip with the band
          // forgotten. It carries its own layer and block down as a filter.
          p.push('<rect data-chip="' + esc(chip ? chip.id : "") + '" data-layer="' + le.layer + '" data-block="' + esc(b)
            + '" data-rstip="' + tip(bt) + '" x="' + innerX + '" y="' + by + '" width="' + lw + '" height="' + bh + '" fill="' + hue + '" cursor="pointer"/>');
          var hf = hatchFor(b);
          if (hf) p.push('<rect x="' + innerX + '" y="' + by + '" width="' + lw + '" height="' + bh + '" fill="' + hf + '" pointer-events="none"/>');
          by += bh;
        });
        if (lw > 15) {
          p.push('<text x="' + (innerX + lw / 2) + '" y="' + (innerY + innerH + 12) + '" text-anchor="middle" font-size="9" fill="var(--muted)" pointer-events="none">' + le.layer + "</text>");
        }
        innerX += lw;
      });
      if (slots > comp.held) {
        var frac = (slots - comp.held) / slots;
        p.push('<rect x="' + (x + 3) + '" y="' + (rowA_y + rowA_h - 15) + '" width="' + ((w - 6) * frac) + '" height="5" fill="url(#p-res)" stroke="var(--line)" stroke-width=".5" pointer-events="none"/>');
      }
      p.push('<text x="' + (x + w / 2) + '" y="' + (rowA_y + 14) + '" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-weight="600" pointer-events="none">S' + st.stage
        + (span ? " · " + span : "") + "</text>");
      p.push("</g>");
      var entry = { x: x, w: w, cx: x + w / 2, chip: chip, chips: chips };
      chips.forEach(function (c) { segOfChip[c.id] = entry; });
      seg.push(entry);
      x += w + GAP;
    });
    // D18. The handoff arrows used to be paired by ARRAY INDEX — links[i] was
    // drawn between segment i and segment i+1 whatever its own ends said. They
    // are paired by l.from and l.to now, and a link whose ends are not both on
    // the drawn stages is not drawn at all rather than drawn somewhere else.
    var links = (d.links || []);
    var unplaced = 0;
    links.filter(function (l) { return l.role === "act"; }).forEach(function (l) {
      var a = segOfChip[l.from], b = segOfChip[l.to];
      if (!a || !b || a === b) { unplaced++; return; }
      var left = a.x < b.x ? a : b, right = a.x < b.x ? b : a;
      var forward = a.x < b.x;
      var x1 = left.x + left.w, x2 = right.x, ym = rowA_y + rowA_h / 2;
      var t = '<div class="t">' + esc(clean(l.label || l.id)) + "</div>" + rbytes(l.bytes) + " per " + esc(l.per || "beat")
        + '<div class="b">' + esc(l.from) + " → " + esc(l.to) + "</div>";
      p.push('<path d="M' + (forward ? (x1 - 2) : (x2 + 2)) + " " + ym + " L" + (forward ? (x2 + 2) : (x1 - 2)) + " " + ym + '" stroke="var(--ink)" stroke-width="2" fill="none" marker-end="url(#pl-arr)"/>');
      p.push('<path data-link="' + esc(l.id) + '" data-rstip="' + tip(t) + '" d="M' + (x1 - 7) + " " + ym + " L" + (x2 + 7) + " " + ym + '" stroke="transparent" stroke-width="16" fill="none" cursor="pointer"/>');
    });
    var svc = links.filter(function (l) { return l.role === "svc"; });
    var served = {}; svc.forEach(function (l) { (served[l.from] = served[l.from] || []).push(l); });
    var laneY = rowD_y + rowD_h + 24, laneStep = 11;
    digital.forEach(function (chip, di) {
      var did = chip.id;
      var myLinks = served[did] || [];
      var xs = [];
      myLinks.forEach(function (l) { if (segOfChip[l.to]) xs.push(segOfChip[l.to].cx); });
      var cx0, cw;
      if (xs.length) { var mn = Math.min.apply(null, xs), mx = Math.max.apply(null, xs); cx0 = (mn + mx) / 2; cw = Math.max(58, mx - mn > 120 ? 104 : 78); }
      else { cw = 84; cx0 = L + 42 + di * ((W - L - R - 84) / Math.max(1, digital.length - 1) || 0); if (digital.length === 1) cx0 = W / 2; }
      var dt = '<div class="t">' + esc(clean(chip.label || did)) + "</div>attention, softmax and scan for "
        + (myLinks.length ? myLinks.length + " analog chiplet(s)" : "its stage")
        + '<div class="b">click to open this chiplet</div>';
      p.push('<rect data-chip="' + esc(did) + '" data-rstip="' + tip(dt) + '" x="' + (cx0 - cw / 2) + '" y="' + rowD_y + '" width="' + cw + '" height="' + rowD_h + '" rx="4" fill="#eee9db" stroke="#8a5a10" stroke-width="1.2" stroke-dasharray="5 3" cursor="pointer"/>');
      var mnum = String(did).match(/(\d+)$/);
      p.push('<text x="' + cx0 + '" y="' + (rowD_y + rowD_h / 2 + 4) + '" text-anchor="middle" font-size="10.5" fill="' + inkOn("#eee9db") + '" pointer-events="none">DIG ' + (mnum ? parseInt(mnum[1], 10) : di) + "</text>");
      if (myLinks.length) {
        var busY = laneY + di * laneStep;
        var total = myLinks.reduce(function (a, l) { return a + (l.bytes || 0); }, 0);
        var tw = Math.max(2, Math.min(9, Math.log2(1 + total / 1024)));
        var tt = '<div class="t">service trunk · ' + esc(clean(chip.label || did)) + "</div>" + rbytes(total) + " per beat across " + myLinks.length + " branch(es)";
        p.push('<path data-rstip="' + tip(tt) + '" d="M' + cx0 + " " + (rowD_y + rowD_h) + " L" + cx0 + " " + busY + '" stroke="var(--muted)" stroke-width="' + tw + '" fill="none"/>');
        var dropXs = myLinks.map(function (l) { return segOfChip[l.to] ? segOfChip[l.to].cx : null; });
        var valid = dropXs.filter(function (v) { return v != null; });
        if (valid.length) {
          var mn2 = Math.min.apply(null, valid.concat([cx0])), mx2 = Math.max.apply(null, valid.concat([cx0]));
          p.push('<path d="M' + mn2 + " " + busY + " L" + mx2 + " " + busY + '" stroke="var(--muted)" stroke-width="' + tw + '" fill="none"/>');
          p.push('<circle cx="' + cx0 + '" cy="' + busY + '" r="2.6" fill="var(--muted)"/>');
          myLinks.forEach(function (l, li) {
            var hx = dropXs[li]; if (hx == null) return;
            var bw = Math.max(1.4, Math.min(7, Math.log2(1 + (l.bytes || 0) / 1024)));
            var lt = '<div class="t">' + esc(clean(l.label || l.id)) + "</div>" + rbytes(l.bytes) + " per " + esc(l.per || "beat");
            p.push('<path d="M' + hx + " " + busY + " L" + hx + " " + rowA_y + '" stroke="var(--muted)" stroke-width="' + bw + '" fill="none"/>');
            p.push('<path data-link="' + esc(l.id) + '" data-rstip="' + tip(lt) + '" d="M' + hx + " " + busY + " L" + hx + " " + rowA_y + '" stroke="transparent" stroke-width="16" fill="none" cursor="pointer"/>');
          });
        }
      }
    });
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="max-width:' + W + 'px">' + p.join("") + "</svg>";
    if (unplaced) {
      svg += '<p class="hintline">' + unplaced + " activation link(s) name a chiplet that carries no drawn stage, "
        + "so they are counted here rather than drawn between the wrong pair.</p>";
    }
    return svg;
  }

  // The map when the point carries a STAGE PLAN but no spatial document: the
  // sweep's own compact per-stage rows (layers, chips, tiles by block). It is a
  // schematic, and it says so — there is no chiplet to open under it.
  function drawStageSchematic(stages) {
    if (!stages || !stages.length) return null;
    var W = 1180, L = 34, R = 34, GAP = 8, top = 46, boxH = 118;
    var usable = W - L - R - GAP * (stages.length - 1);
    var weights = stages.map(function (st) { return Math.max(1, st.tiles || 1); });
    var totalW = weights.reduce(function (a, b) { return a + b; }, 0);
    var blocks = {};
    stages.forEach(function (st) { Object.keys(st.blocks || {}).forEach(function (b) { blocks[b] = 1; }); });
    var order = Object.keys(blocks).sort();
    var p = [hatchDefs()];
    p.push('<text x="' + L + '" y="24" font-size="11" fill="var(--muted)" letter-spacing=".08em">PIPELINE STAGES OF THIS POINT — width is placed tiles, bands are weight blocks, colour is layer</text>');
    var x = L;
    stages.forEach(function (st, i) {
      var w = usable * weights[i] / totalW;
      var ids = stageLayerIds(st);
      var hue = layerHue(ids.length ? ids[0] : i) || "#8497a2";
      var tipHtml = '<div class="t">Stage ' + st.stage + "</div>" + esc(st.label || "")
        + "<br>" + (st.layers != null ? st.layers + " layer(s)" : "")
        + (Array.isArray(st.chips) && st.chips.length ? " · chips " + st.chips.join(", ") : "")
        + "<br>" + rint(st.tiles) + " placed tiles · " + rint(st.owners) + " weight matrices"
        + '<div class="b">no spatial document for this point: this is the sweep’s own stage row</div>';
      p.push('<rect data-rstip="' + encodeURIComponent(tipHtml) + '" x="' + x + '" y="' + top + '" width="' + w + '" height="' + boxH + '" rx="4" fill="var(--code)" stroke="var(--faint)"/>');
      var by = top + 20, innerH = boxH - 38, denom = Math.max(1, st.tiles || 1);
      order.forEach(function (b) {
        var n = (st.blocks || {})[b] || 0;
        if (!n) return;
        var bh = innerH * n / denom;
        p.push('<rect x="' + (x + 3) + '" y="' + by + '" width="' + (w - 6) + '" height="' + bh + '" fill="' + hue + '" fill-opacity="' + (0.35 + 0.5 * (n / denom)) + '"/>');
        var hf = hatchFor(b);
        if (hf) p.push('<rect x="' + (x + 3) + '" y="' + by + '" width="' + (w - 6) + '" height="' + bh + '" fill="' + hf + '" pointer-events="none"/>');
        by += bh;
      });
      p.push('<text x="' + (x + w / 2) + '" y="' + (top + 14) + '" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)" pointer-events="none">S' + st.stage
        + (stageSpan(st) ? " · " + stageSpan(st) : "") + "</text>");
      x += w + GAP;
    });
    var H = top + boxH + 30;
    var keys = order.map(function (b) {
      var hf = hatchFor(b);
      return '<span class="blk"><svg width="14" height="14">' + hatchDefs()
        + '<rect width="14" height="14" rx="2" fill="var(--line)"/>'
        + (hf ? '<rect width="14" height="14" rx="2" fill="' + hf + '"/>' : "") + "</svg>" + esc(b) + "</span>";
    }).join("");
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="max-width:' + W + 'px">' + p.join("") + "</svg>"
      + '<p class="rnote">' + keys + "</p>";
  }

  // ---------------------------------------------------------------- render ---
  function render() {
    S.res = S.doc ? A.validate(S.doc) : { errors: [], warnings: [] };
    S.hue = S.doc ? A.hueMap(S.doc) : { order: [], hue: {} };
    S.cache.hueDomain = null;   // the ramp is per-view; recompute it each render
    S.ix = S.doc ? A.makeIndex(S.doc) : { chip: {}, macro: {}, tile: {}, link: {}, sys: {}, owner: {} };
    if (S.doc && (!S.chip || !S.ix.chip[S.chip])) {
      var first = S.doc.chips && S.doc.chips[0];
      S.chip = first ? first.id : null;
    }
    if (S.macro && !S.ix.macro[S.macro]) S.macro = null;
    if (S.view === "macro" && !S.macro) S.view = "chip";
    if (S.view === "chip" && !S.chip) S.view = "package";
    renderBar(); renderCrumbs();

    var canvas = $("h-canvas");
    if (!canvas) return;
    if (!S.doc) { canvas.innerHTML = '<p class="ui">No document bound to this point.</p>'; }
    else if (S.selftest) { canvas.innerHTML = selfTestPanel(); }
    else if (S.res.errors.length) { canvas.innerHTML = refusalPanel(); }
    else if (S.view === "package") {
      canvas.innerHTML = drawPipelinePackage(RS.stageRows) || drawPackage();
    } else if (S.view === "macro") { canvas.innerHTML = drawMacro(); }
    else { canvas.innerHTML = drawChip(); }

    renderLegend();
    if (!S.pinned) showCard(defaultCard());
    wireCanvas();
  }

  // D19. wireCanvas ran on EVERY render and added one more background click
  // listener to the same node every time — after twenty clicks a single click
  // ran twenty handlers. The per-object listeners live on nodes this render
  // just created, so they go with them; the background one is installed once.
  function wireCanvas() {
    var canvas = $("h-canvas");
    if (!canvas) return;
    function bind(sel, attr, make, descend) {
      Array.prototype.forEach.call(canvas.querySelectorAll(sel), function (n) {
        var id = n.getAttribute(attr);
        n.addEventListener("mouseenter", function () { if (!S.pinned) showCard(make(id)); });
        n.addEventListener("click", function (ev) {
          ev.stopPropagation();
          S.pinned = true;
          showCard(make(id));
          if (descend) descend(id, n);
        });
      });
    }
    bind("[data-macro]", "data-macro", function (id) { return macroCard(S.ix.macro[id]); },
      function (id) { go("macro", null, id); });
    bind("[data-chip]", "data-chip", function (id) { return chipCard(S.ix.chip[id]); },
      function (id, node) {
        var block = node.getAttribute("data-block"), layer = node.getAttribute("data-layer");
        go("chip", id, null, block ? { q: block, layer: layer == null ? "" : String(layer) } : null);
      });
    bind("[data-link]", "data-link", function (id) { return linkCard(S.ix.link[id]); }, null);
    bind("[data-tile]", "data-tile", function (id) { return tileCard(S.ix.tile[id]); }, null);
    Array.prototype.forEach.call(canvas.querySelectorAll("[data-rstip]"), function (n) {
      rsHover(n, function () { return decodeURIComponent(n.getAttribute("data-rstip")); });
    });
    if (!S.wired) {
      S.wired = true;
      canvas.addEventListener("click", function () { S.pinned = false; showCard(defaultCard()); });
    }
  }

  // ------------------------------------------------------------------ input --
  // D1. adopt() REPLACES the cache object. Nothing derived from the previous
  // document can survive into this one.
  function adopt(doc, source, provenance) {
    S.doc = doc; S.source = source; S.provenance = provenance || "";
    S.chip = null; S.macro = null; S.pinned = false; S.selftest = null;
    S.filter = A.emptyFilter();
    S.view = "package";
    S.cache = newCache();
  }
  function readFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var parsed = JSON.parse(fr.result);
        S.opened = file.name;
        adopt(parsed, file.name + " (opened by hand)",
          "opened from disk: this document is NOT bound to the selected point unless you opened that point’s own file");
        renderPipelineSection();
      } catch (e) {
        S.doc = null; S.source = file.name; S.cache = newCache();
        renderPipelineSection();
        var c = $("h-canvas");
        if (c) c.innerHTML = '<div class="refuse ui"><h2>Not JSON</h2><p>' + esc(e.message) + "</p></div>";
      }
    };
    fr.readAsText(file);
  }

  // ==========================================================================
  // THE RESULTS LAYER (D33).
  //
  // There is no shipped point. The page opens on the model selector and then
  // on the Pareto frontier; every other panel describes the SELECTED point and
  // rebinds when the reader clicks another one. The sweep's own lexicographic
  // pick is the INITIAL selection and carries no privileged name. A panel that
  // cannot be produced for the selected point says so FOR THAT POINT — it
  // never falls back to another point's content, or another model's.
  // ==========================================================================
  // THE MODEL SET IS A MANIFEST, not a list in this file. A parallel effort
  // writes ../dse/subset_v1.json naming the models that make up the report and
  // where each one's sweep lives; the selector is exactly that, in that order.
  // An old checkout without the manifest falls back to the list below, and a
  // ?model= deep link opens any model whose artifacts exist whether the
  // manifest names it or not — typing the URL is opting in.
  // THE BUNDLE is a parameter. ?bundle=<name> reads ../dse/<name>.json, so the
  // same page opens the model report or a mapper debug run without a second
  // copy of the page existing anywhere.
  var DEFAULT_BUNDLE = "subset_v1";
  var TOY_BUNDLE = "toy_slotmap";
  var BUNDLE_OK = /^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$/;
  var MANIFEST_URL = "../dse/subset_v1.json";
  var FALLBACK_MODELS = [
    { id: "vit_huge_story_64", label: "ViT-Huge (encoder)" },
    { id: "granite_4_0_h_1b", label: "Granite-4.0-H-1B (small hybrid SSM)" },
    { id: "qwen3_5_4b", label: "Qwen3.5-4B (hybrid)" },
    { id: "granite_4_0_h_tiny", label: "Granite-4.0-H-Tiny (hybrid)" },
    { id: "falcon_mamba_7b", label: "Falcon-Mamba-7B (pure SSM)" }
  ];
  var MODEL_HUES = ["#4a7a2f", "#176778", "#8a5a10", "#1b6b4a", "#7a3f8a", "#a63931"];
  var RS = {
    MODELS: [], bundle: null, bundleName: DEFAULT_BUNDLE, bundleMissing: null, manifest: null, slotSel: null,
    id: null, token: 0, loading: false,
    frontier: null, report: null, sibling: null, point: null, pointFor: null,
    sel: null, stageRows: null, stageBasis: "", mapKind: "none",
    tried: { sibling: false, report: false },
    fetches: [], rejects: [], pending: null,
    // Where the reader came from, when another bundle sent them here. It is
    // what the way back is aimed at, so a round trip lands on the point they
    // left rather than on the report's default one.
    backModel: null, backCand: null
  };
  function hueFor(i) { return MODEL_HUES[i % MODEL_HUES.length]; }
  // One member record, whatever it was built from.
  function member(id, label, dir, i) {
    return { id: id, label: label || id, dir: dir || (id + "_frontier"), hex: hueFor(i || 0) };
  }
  function setModels(list) {
    RS.MODELS = list.map(function (m, i) {
      return { id: m.id, label: m.label, dir: m.dir, hex: hueFor(i), adhoc: !!m.adhoc };
    });
  }
  function adoptManifest(doc) {
    var members = doc && Array.isArray(doc.members) ? doc.members : null;
    if (!members || !members.length) return false;
    RS.manifest = doc;
    RS.bundle = doc.bundle || null;
    setModels(members.map(function (m, i) {
      var id = m.name || m.model_id || m.dir;
      return member(String(id), m.label || m.model_id || String(id),
        m.dir ? String(m.dir).replace(/^\.?\/*/, "").replace(/\/+$/, "") : null, i);
    }));
    return true;
  }
  function rsModel(id) {
    var want = id == null ? RS.id : id, hit = null;
    RS.MODELS.forEach(function (m) { if (m.id === want) hit = m; });
    return hit;
  }
  function isModel(id) { return !!rsModel(id); }
  // A TOY member is a mapper debug run: one chain, no digital pool, no state
  // store. It renders on the same page, and the panels it has no data for say
  // so in the words they already use.
  function isToy() { return String((RS.frontier || {}).mode || "").toUpperCase() === "TOY"; }
  // A deep link to a model the manifest does not carry is honoured: the member
  // is built by convention and appended to the selector so the reader can see
  // what they opened and get back to the report.
  function ensureModel(id) {
    if (!id || isModel(id)) return isModel(id);
    var m = member(String(id), String(id), null, RS.MODELS.length);
    m.adhoc = true;
    RS.MODELS = RS.MODELS.concat([m]);
    return true;
  }

  // ---- artifact locations, relative to this page (D15) ---------------------
  function dirOf(id) {
    // The manifest writes REPO-relative dirs (docs/qif/dse/<name>_frontier)
    // because the runner and other consumers live at the repo root; this page
    // lives at docs/qif/atlas/ and prefixes ../dse/. Normalize either spelling
    // to the bare directory name so the two conventions cannot double up.
    var m = rsModel(id);
    var d = (m && m.dir) || (id + "_frontier");
    d = String(d).replace(/\/+$/, "");
    var i = d.lastIndexOf("/");
    return i >= 0 ? d.slice(i + 1) : d;
  }
  function urlFrontier(id) { return "../dse/" + dirOf(id) + "/dse_report.json"; }
  function urlReport(id) { return id + "_report.json"; }
  function urlSibling(id) { return id + ".json"; }
  function urlPoint(id, rel) { return "../dse/" + dirOf(id) + "/" + rel; }

  // D15. One parsed document per URL per session. The page used to re-fetch and
  // re-parse 14 MB on every click; freshness still comes from cache: no-store on
  // the wire, and the reload control below forces a real round trip.
  var DOCS = {};
  function rsFetch(url, force) {
    if (!force && Object.prototype.hasOwnProperty.call(DOCS, url)) {
      return Promise.resolve(DOCS[url]);
    }
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) return { url: url, ok: false, status: r.status, doc: null, error: "HTTP " + r.status };
      return r.json().then(
        function (j) { return { url: url, ok: true, status: r.status, doc: j }; },
        function (e) { return { url: url, ok: false, status: r.status, doc: null, error: "not JSON: " + String(e && e.message || e) }; }
      );
    }, function (e) {
      return { url: url, ok: false, status: 0, doc: null, error: String(e && e.message || e) };
    }).then(function (res) { DOCS[url] = res; return res; });
  }

  // ---- the selected point --------------------------------------------------
  function cands() { return (((RS.frontier || {}).candidates) || []); }
  function candById(id) {
    var hit = null;
    cands().forEach(function (c) { if (c && c.id === id) hit = c; });
    return hit;
  }
  // The initial selection is the sweep's lexicographic pick. It has no name on
  // this page and no privilege: it is simply where the reader starts.
  function initialId() {
    var f = RS.frontier || {};
    if (candById(f.selected_id)) return f.selected_id;
    var front = (f.front_ids || []).filter(function (id) { return !!candById(id); });
    if (front.length) return front[0];
    return cands().length ? cands()[0].id : null;
  }
  function selected() { return candById(RS.sel) || null; }
  function onFront(id) { return ((RS.frontier || {}).front_ids || []).indexOf(id) >= 0; }

  // D17. The headline unit is the sweep's own declaration. It used to be probed
  // off candidates[0], which on a mixed sweep is a different candidate from the
  // one on screen and on a failed first candidate is no candidate at all.
  function headlineKey() {
    var declared = (RS.frontier || {}).headline_metric;
    if (declared === "tokens_per_s" || declared === "requests_per_s") return declared;
    var m = (selected() || {}).metrics || {};
    if (typeof m.tokens_per_s === "number") return "tokens_per_s";
    if (typeof m.requests_per_s === "number") return "requests_per_s";
    return null;
  }
  // D9. ONE workload kind, derived from the artifact, and every piece of copy
  // on the page is selected from it. The page used to tell a ViT it decodes.
  function workload() {
    var f = RS.frontier || {}, c = selected() || {};
    var hk = headlineKey();
    var mode = String(f.mode || "");
    var regime = String((c.pipeline || {}).serving_regime || "");
    var toy = mode.toUpperCase() === "TOY";
    var kind = (mode === "VIT" || hk === "requests_per_s") ? "request"
      : (mode === "LLM" || hk === "tokens_per_s") ? "decode" : "unknown";
    return {
      kind: kind, mode: mode, regime: regime, toy: toy,
      staged: regime === "filled_pipeline",
      lockstep: regime === "lockstep",
      unit: toy ? "tokens / s"
        : kind === "request" ? "requests / s" : kind === "decode" ? "decode tokens / s" : "headline throughput",
      per: kind === "request" ? "request" : kind === "decode" ? "token" : "unit",
      latency: toy ? "chain latency"
        : kind === "request" ? "per-request latency" : kind === "decode" ? "per-token latency" : "latency"
    };
  }
  function headlineValue(c) {
    var m = (c && c.metrics) || {}, k = headlineKey();
    if (k && typeof m[k] === "number") return m[k];
    if (typeof m.tokens_per_s === "number") return m.tokens_per_s;
    if (typeof m.requests_per_s === "number") return m.requests_per_s;
    return null;
  }
  function siliconValue(c) {
    var si = (c && c.silicon) || {};
    return typeof si.total_silicon_mm2 === "number" ? si.total_silicon_mm2 : null;
  }
  // D4. The two questions the artifact answers are DIFFERENT questions, and the
  // old schema spelled both `binding_device_class`. What SETS THE BEAT is the
  // derived_digital field in every schema version; what is BUSIEST is the
  // candidate-level field, called `busiest_device_class` in the current one.
  function newSchema(c) { return !!(c && Object.prototype.hasOwnProperty.call(c, "busiest_device_class")); }
  function beatClass(c) {
    var dd = (c && c.derived_digital) || {};
    if (dd.binding_device_class != null) return String(dd.binding_device_class);
    if (newSchema(c) && c.binding_device_class != null) return String(c.binding_device_class);
    return null;
  }
  function busiestClass(c) {
    if (!c) return null;
    if (newSchema(c)) return c.busiest_device_class == null ? null : String(c.busiest_device_class);
    return c.binding_device_class == null ? null : String(c.binding_device_class);
  }
  function runOf(doc) {
    if (!doc) return null;
    var r = doc.run || {};
    var id = r.run_id || doc.run_id || null;
    return id ? { id: String(id), tool: r.tool_version || r.tool || null, at: r.generated_at || null } : null;
  }
  // ---- deep-link state (D14) ----------------------------------------------
  // The whole reading position is in the URL: the model, the point, the
  // drilldown view, the chiplet, the macro and the filters. A model click used
  // to replaceState away every other parameter and leave no history entry, so
  // Back left the page and a shared link lost the point it was about.
  function readParams(search) {
    var q = {}, s = String(search || "").replace(/^\?/, "");
    if (!s) return q;
    s.split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? "" : kv.slice(i + 1);
      try { q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, " ")); }
      catch (e) { q[k] = v; }
    });
    return q;
  }
  function stateURL() {
    var parts = [];
    function add(k, v) { if (v != null && v !== "" && v !== false) parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(v)); }
    if (RS.bundleName !== DEFAULT_BUNDLE) add("bundle", RS.bundleName);
    add("model", RS.id);
    add("cand", RS.sel);
    add("back_model", RS.backModel);
    add("back_cand", RS.backCand);
    if (S.doc) {
      if (S.view !== "package") add("view", S.view);
      if (S.view !== "package" && S.chip) add("chip", S.chip);
      if (S.view === "macro" && S.macro) add("macro", S.macro);
      if (S.duty) add("duty", "1");
      ["model", "layer", "group", "pool", "q"].forEach(function (k) {
        if (S.filter[k]) add(k === "model" ? "fmodel" : k, S.filter[k]);
      });
    }
    return "?" + parts.join("&");
  }
  var SUPPRESS_PUSH = false;
  function pushURL() {
    if (SUPPRESS_PUSH) return;
    try {
      var url = stateURL();
      if (url !== (location.search || "?")) history.pushState({ rs: 1 }, "", url);
    } catch (e) { /* a page opened from a file:// URL cannot push; the page still works */ }
  }
  function replaceURL() {
    if (SUPPRESS_PUSH) return;
    try { history.replaceState({ rs: 1 }, "", stateURL()); } catch (e) {}
  }

  // ---- artifact identity ---------------------------------------------------
  // THE SWEEP IS THE REPORT. Every number on this page is read off it, and that
  // is not news: it needs no banner. The page does NOT compare the sweep against
  // the legacy per-model artifacts (<model>_report.json and the sibling
  // <model>.json) and does not comment on their age — they are used for nothing
  // numeric, so a disagreement with them is not a finding about this page. The
  // run ids are still collected, for the provenance footer to print.
  function runIds() {
    return {
      frontier: runOf(RS.frontier),
      sibling: runOf(RS.sibling),
      report: runOf(RS.report),
      point: runOf(RS.point)
    };
  }
  // The ONE identity check that still has teeth, because it can refuse a
  // BINDING rather than a number: a per-point document claims to be one
  // candidate's machine. A document that names another candidate, or that was
  // written by another run than the sweep on screen, is not this point's
  // machine and is not drawn as one. Returns the reason, or null to bind.
  function pointDocRefusal(doc, candId) {
    if (!doc) return null;
    var names = (doc.dse_point || {}).candidate_id;
    if (names != null && String(names) !== String(candId)) {
      return "it names point " + names + ", not point " + candId;
    }
    var mine = runOf(doc), sweep = runOf(RS.frontier);
    if (mine && sweep && mine.id !== sweep.id) {
      return "it was written by run " + mine.id + " and this sweep is run " + sweep.id;
    }
    return null;
  }

  // ---- is this document THIS point's machine? ------------------------------
  // The sibling <model>.json is one point's export and says which run made it
  // but not which point. Its enumerated placement does say: a document whose
  // analog chiplets, digital chiplets, placed tiles and analog macro slots all
  // equal the candidate's is that candidate's machine, and one that does not
  // is another point's and is not drawn as this one's (D33).
  function censusOf(doc) {
    if (!doc || !Array.isArray(doc.chips)) return null;
    var analog = doc.chips.filter(function (c) { return c.pool === "analog"; });
    var digital = doc.chips.filter(function (c) { return c.pool !== "analog"; });
    var ids = {};
    analog.forEach(function (c) { (c.macros || []).forEach(function (m) { ids[m] = 1; }); });
    return {
      analog: analog.length, digital: digital.length,
      tiles: (doc.tiles || []).length,
      analogSlots: Object.keys(ids).length
    };
  }
  function boundToCandidate(doc, c) {
    var x = censusOf(doc), p = (c && c.placement) || null;
    if (!x || !p) return false;
    return x.analog === p.analog_chips
      && x.digital === p.shared_digital_chiplets
      && x.tiles === p.tiles
      && x.analogSlots === p.analog_macro_slots;
  }

  // ---- the model selector (the page opens on it) --------------------------
  // One line under the selector: which bundle this page is reading, and the way
  // to the other one. It is a plain link, so it is also a URL a reader can send.
  function bundleSwitch() {
    var here = RS.bundleName;
    function q(pairs) {
      return "?" + pairs.filter(function (kv) { return kv[1]; })
        .map(function (kv) { return kv[0] + "=" + encodeURIComponent(kv[1]); }).join("&");
    }
    if (here === DEFAULT_BUNDLE) {
      // The link hands the toy the point being read, so the way back can aim
      // at it.
      return '<div class="bswitch" id="h-bundle">Reading the model report. '
        + '<a href="' + q([["bundle", TOY_BUNDLE], ["back_model", RS.id], ["back_cand", RS.sel]])
        + '">toy slot map (mapper debug) &rarr;</a></div>';
    }
    var back = RS.backModel
      ? q([["model", RS.backModel], ["cand", RS.backCand]])
      : q([["bundle", DEFAULT_BUNDLE]]);
    return '<div class="bswitch" id="h-bundle">Reading <b>' + esc(here) + "</b>"
      + (here === TOY_BUNDLE ? " — the toy slot map, a mapper debug run." : " — a bundle opened by URL.")
      + ' <a href="' + back + '">back to '
      + (RS.backModel ? "the point you left" : "the model report") + " &rarr;</a></div>";
  }
  function rsRenderModels() {
    var host = $("h-models"); if (!host) return;
    host.innerHTML = RS.MODELS.map(function (m) {
      return '<button data-mid="' + esc(m.id) + '" aria-pressed="' + (m.id === RS.id) + '"'
        + (m.adhoc ? ' title="opened by URL: this model is not in the report’s model set"' : "")
        + ">" + esc(m.label) + (m.adhoc ? " ·" : "") + "</button>";
    }).join("");
    host.innerHTML += bundleSwitch();
    Array.prototype.forEach.call(host.querySelectorAll("[data-mid]"), function (n) {
      // D2. No "already selected" short circuit. A click always reloads, so a
      // load that lost a race can always be recovered by clicking again.
      n.addEventListener("click", function () {
        var mid = n.getAttribute("data-mid");
        rsLoad(mid, { push: true });
      });
    });
  }
  function rsRenderHeader() {
    var m = rsModel();
    var f = RS.frontier || {};
    $("h-title").textContent = m ? m.label : "QIF Results";
    $("h-sub").textContent = RS.loading ? "loading the sweep…"
      : (f.model_id ? f.model_id + " — " + (f.sweep && f.sweep.label ? clean(f.sweep.label) : "design-space sweep") : "");
    var p = [];
    if (f.num_candidates != null) p.push('<span class="pill on">' + f.num_candidates + " points evaluated</span>");
    if ((f.front_ids || []).length) p.push('<span class="pill">' + f.front_ids.length + " on the front</span>");
    if (f.objective) p.push('<span class="pill">objective: ' + esc(f.objective) + "</span>");
    if (RS.sel) p.push('<span class="pill mark">selected: ' + esc(RS.sel) + "</span>");
    $("h-pills").innerHTML = p.join("");
  }

  // ---- the one band -------------------------------------------------------
  // h-alerts renders ONLY when the page cannot function: the sweep artifact
  // itself is missing or unparseable, and without it there is no design space,
  // no point and no panel. Everything else — a legacy companion that 404s, a
  // point document refused, a query parameter this page does not accept — is a
  // muted line in the provenance footer or an inline note in the panel it is
  // about. Nothing else reaches the top of the page.
  function sweepFailure() {
    if (RS.loading || RS.frontier) return null;
    var url = urlFrontier(RS.id);
    var hit = null;
    RS.fetches.forEach(function (r) { if (r && r.url === url) hit = r; });
    if (!hit) return { url: url, why: "it was not fetched" };
    if (!hit.ok) return { url: url, why: hit.error || ("HTTP " + hit.status) };
    return { url: url, why: "it loaded but carries no sweep this page can read" };
  }
  function rsRenderAlerts() {
    var host = $("h-alerts"); if (!host) return;
    if (RS.bundleMissing) {
      host.innerHTML = '<div class="band hard ui"><h2>That bundle is not in this checkout</h2><p>'
        + '<span class="mono">' + esc(RS.bundleMissing.url) + "</span> — " + esc(RS.bundleMissing.why)
        + ". A bundle names the models a report is made of; without it there is no model set to open. "
        + "Use the link above to go back to the model report.</p></div>";
      return;
    }
    var fail = sweepFailure();
    if (!fail) { host.innerHTML = ""; return; }
    host.innerHTML = '<div class="band hard ui"><h2>The sweep did not load</h2><p>'
      + '<span class="mono">' + esc(fail.url) + "</span> — " + esc(fail.why)
      + ". This page is that sweep: without it there is no design space to open on and no point to bind, "
      + "so nothing below is drawn.</p></div>";
  }

  // ---- THE FRONTIER (the entry point) -------------------------------------
  function candXY(c) { return { x: headlineValue(c), y: siliconValue(c) }; }
  function candTip(c) {
    var xy = candXY(c), w = workload();
    var knobs = Object.keys(c.knobs || {}).map(function (k) { return esc(k + " = " + c.knobs[k]); }).join("<br>");
    var extra = c.ok ? "" : '<div class="b">does not fit: ' + esc(String(c.fail_message || "no reason given").slice(0, 260)) + "</div>";
    return '<div class="t">' + esc(c.id) + (onFront(c.id) ? " · on the front" : "") + "</div>"
      + (xy.x != null ? rint(xy.x) + " " + esc(w.unit) : "—") + " · " + (xy.y != null ? rmm2(xy.y) + " mm²" : "—")
      + '<div class="b">' + knobs + "</div>" + extra
      + '<div class="b">click to bind the page to this point</div>';
  }
  function rsFrontierPlot() {
    var f = RS.frontier, m = rsModel(), w = workload();
    var pts = cands().map(function (c) {
      var xy = candXY(c);
      return { c: c, x: xy.x, y: xy.y, front: onFront(c.id) };
    }).filter(function (p) { return p.x != null && p.y != null; });
    if (!pts.length) return null;
    var W = 1000, H = 440, L = 84, R = 30, T = 22, B = 52;
    // The frame is set by the points that can be BUILT: an infeasible outlier
    // must not push every buildable machine into one corner. Points outside it
    // are clamped to the edge and marked, never dropped (D8).
    var frame = pts.filter(function (p) { return p.c.ok; });
    if (!frame.length) frame = pts;
    var xs = frame.map(function (p) { return p.x; }), ys = frame.map(function (p) { return p.y; });
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
    var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
    var padx = (xmax - xmin) * 0.08 || Math.abs(xmax) * 0.05 || 1;
    var pady = (ymax - ymin) * 0.08 || Math.abs(ymax) * 0.05 || 1;
    xmin = Math.max(0, xmin - padx); xmax += padx;
    ymin = Math.max(0, ymin - pady); ymax += pady;
    function X(v) { return L + (v - xmin) / (xmax - xmin || 1) * (W - L - R); }
    function Y(v) { return H - B - (v - ymin) / (ymax - ymin || 1) * (H - T - B); }
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", "100%"); svg.style.maxWidth = W + "px";
    function elx(t, att, parent) {
      var e = document.createElementNS(ns, t);
      Object.keys(att || {}).forEach(function (k) { e.setAttribute(k, att[k]); });
      (parent || svg).appendChild(e); return e;
    }
    function ticks(min, max, n) {
      var span = max - min; if (span <= 0) return [min];
      var step = Math.pow(10, Math.floor(Math.log10(span / n)));
      if (span / step > n * 2) step *= 5; else if (span / step > n) step *= 2;
      var t = [], v = Math.ceil(min / step) * step;
      for (; v <= max + step * 1e-9; v += step) t.push(v);
      return t;
    }
    ticks(ymin, ymax, 6).forEach(function (v) {
      elx("line", { x1: L, y1: Y(v), x2: W - R, y2: Y(v), "class": "fx-grid" });
      elx("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", "class": "fx-lab" }).textContent = rmm2(v);
    });
    ticks(xmin, xmax, 7).forEach(function (v) {
      elx("text", { x: X(v), y: H - B + 18, "text-anchor": "middle", "class": "fx-lab" }).textContent = rint(v);
    });
    elx("line", { x1: L, y1: H - B, x2: W - R, y2: H - B, "class": "fx-axis" });
    elx("line", { x1: L, y1: T, x2: L, y2: H - B, "class": "fx-axis" });
    elx("text", { x: (L + W - R) / 2, y: H - 10, "text-anchor": "middle", "class": "fx-axlab" }).textContent = w.unit;
    elx("text", {
      x: 16, y: (T + H - B) / 2, "class": "fx-axlab",
      transform: "rotate(-90 16 " + ((T + H - B) / 2) + ")", "text-anchor": "middle"
    }).textContent = "total silicon (mm²)";
    var front = pts.filter(function (p) { return p.front; }).sort(function (a, b) { return a.x - b.x; });
    if (front.length > 1) {
      elx("polyline", {
        points: front.map(function (p) { return X(p.x) + "," + Y(p.y); }).join(" "),
        fill: "none", stroke: m.hex, "stroke-width": 2, "stroke-opacity": 0.5
      });
    }
    var clamped = 0, nFront = 0, nDom = 0, nOpen = 0;
    pts.forEach(function (p) {
      var offX = p.x < xmin || p.x > xmax, offY = p.y < ymin || p.y > ymax;
      var cx = X(Math.max(xmin, Math.min(xmax, p.x)));
      var cy = Y(Math.max(ymin, Math.min(ymax, p.y)));
      if (offX || offY) clamped++;
      var picked = p.c.id === RS.sel;
      if (!p.c.ok) nOpen++; else if (p.front) nFront++; else nDom++;
      var g = elx("g", { cursor: "pointer" });
      if (picked) elx("circle", { cx: cx, cy: cy, r: 11, fill: "none", stroke: m.hex, "stroke-width": 1.8 }, g);
      var dot = { cx: cx, cy: cy, r: picked ? 6.5 : 5, stroke: m.hex, "stroke-width": p.c.ok ? 0 : 1.8,
        opacity: p.c.ok ? (p.front || picked ? 1 : 0.45) : 0.95 };
      if (p.c.ok) dot.fill = m.hex; else dot["class"] = "fx-open";
