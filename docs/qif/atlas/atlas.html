    rsRenderHardware();
    renderPipelineSection();
    rsRenderBeat(); rsRenderState(); rsRenderEnergy(); rsRenderUtil();
    rsRenderBounds(); rsRenderDisc();
    ensureCompanions();
    if (RS.wantSelfTest) runSelfTest();
  }
  function runSelfTest() {
    // D5 / D16. A self-test never aborts a load, and it runs only when asked.
    // It clones the whole document once per rule — five seconds of synchronous
    // work on a twenty-thousand-tile mapping — so it says it is running before
    // it blocks, and it reports what that cost.
    var canvas = $("h-canvas");
    if (!S.doc) {
      if (canvas) canvas.innerHTML = '<div class="absent">No document is bound to this point, so there is nothing to '
        + "self-test. Select a point that carries one.</div>";
      return;
    }
    if (canvas) {
      canvas.innerHTML = '<div class="absent">Running the conformance self-test on <b>' + esc(S.source)
        + "</b>. It corrupts a copy of the document once per rule — " + rint((S.doc.tiles || []).length)
        + " tiles, cloned " + A.CORRUPTIONS.length + " times — and the page is blocked while it does.</div>";
    }
    var go = function () {
      try {
        var t0 = Date.now();
        S.selftest = allSelfTests();
        S.selftestMs = Date.now() - t0;
        render();
      } catch (e) {
        var host = $("h-alerts");
        if (host) host.innerHTML += '<div class="band hard ui"><h2>The self-test could not run</h2><p>'
          + esc(String(e && e.message || e)) + "</p></div>";
      }
    };
    if (typeof setTimeout === "function") setTimeout(go, 0); else go();
  }
  function selectPoint(id, push) {
    if (!candById(id)) {
      // Nothing surfaces: the page still works, it simply keeps the point it
      // had. A reader who mistyped a URL sees the page, not a scolding.
      return;
    }
    if (RS.sel !== id) {
      RS.point = null; RS.pointFor = null;
      RS.pointRefusal = null; RS.mapMissing = null; RS.mapUrl = null;
      RS.slotSel = null;
    }
    RS.sel = id;
    rsRenderAll();
    if (push !== false) pushURL();
    fetchPointDoc();
  }
  // The deep spatial map is lazy: a front of thirteen points is thirteen full
  // atlas documents, and the reader asked for one.
  function fetchPointDoc() {
    var c = selected();
    RS.mapUrl = null;
    if (!c || !c.atlas_point) return;
    var url = urlPoint(RS.id, String(c.atlas_point));
    RS.mapUrl = url;
    if (RS.pointFor === c.id && RS.point) return;
    var token = RS.token, want = c.id, model = RS.id;
    rsFetch(url).then(function (res) {
      if (token !== RS.token || model !== RS.id) return;      // D2
      if ((selected() || {}).id !== want) return;
      if (!res.ok) {
        // The sweep names a document for this point and this run did not write
        // it. One muted sentence in the map panel, one line in the footer.
        if (!RS.fetches.some(function (x) { return x.url === res.url; })) RS.fetches.push(res);
        RS.mapMissing = { url: url, why: res.error || ("HTTP " + res.status), cand: want };
        renderPipelineSection();
        ensureCompanions();
        return;
      }
      // The document says which point it is and which run wrote it. One that
      // names another candidate, or another run, is not this point's machine
      // whatever the path said, and it is not drawn as one (D33).
      var refusal = pointDocRefusal(res.doc, want);
      if (refusal) {
        RS.pointRefusal = { url: url, cand: want, why: refusal };
        renderPipelineSection();
        ensureCompanions();
        return;
      }
      RS.point = res.doc; RS.pointFor = want;
      // Every panel that reads the BOUND DOCUMENT rebinds here, the duty
      // caption included: it says a different thing about a machine whose
      // placement is a schedule, and that document only arrives now.
      bindMap(); rsRenderHardware(); renderPipelineSection(); rsRenderUtil(); rsRenderDisc();
      ensureCompanions();
    });
  }

  // ---- the legacy companions, fetched only when they would be USED ---------
  // The sibling <model>.json is map source 2 and the <model>_report.json is
  // stage source 3. A run that exports a document for the selected point never
  // reaches source 2, and a point that publishes its own stage rows — or a slot
  // map, which IS its schedule — never reaches source 3. Asking for a file the
  // page has already decided not to read costs a round trip and, when the run
  // wrote no such file, an error line in the reader's console for a document
  // that was never required. So the page waits until the point's own document
  // has settled, then fetches only the sources still open. Each is attempted at
  // most once per model load.
  function companionNeed() {
    var c = selected();
    if (!c) return null;
    // The point's own document decides both questions. While it is still in
    // flight, neither answer is known.
    var missed = (RS.mapMissing && RS.mapMissing.cand === c.id)
      || (RS.pointRefusal && RS.pointRefusal.cand === c.id);
    if (c.atlas_point && RS.pointFor !== c.id && !missed) return null;
    var bound = !!(RS.point && RS.pointFor === c.id);
    var stages = (c.pipeline || {}).stages;
    return {
      sibling: !RS.tried.sibling && !bound,
      report: !RS.tried.report && RS.mapKind !== "slots"
        && !(Array.isArray(stages) && stages.length)
    };
  }
  function ensureCompanions() {
    var need = companionNeed();
    if (!need || (!need.sibling && !need.report)) return;
    var token = RS.token, model = RS.id, jobs = [];
    if (need.sibling) { RS.tried.sibling = true; jobs.push(["sibling", urlSibling(model)]); }
    if (need.report) { RS.tried.report = true; jobs.push(["report", urlReport(model)]); }
    Promise.all(jobs.map(function (j) { return rsFetch(j[1]); })).then(function (res) {
      if (token !== RS.token || model !== RS.id) return;        // D2
      res.forEach(function (r, i) {
        if (!RS.fetches.some(function (x) { return x.url === r.url; })) RS.fetches.push(r);
        if (r.ok) RS[jobs[i][0]] = r.doc;
      });
      rsRenderAll();
    });
  }

  // ---- the load ------------------------------------------------------------
  // D2. Every load carries a token. A response from an older load is dropped,
  // and because the click handler never short-circuits on "already selected",
  // a reader who out-ran the network always recovers by clicking again.
  function rsLoad(id, opts) {
    opts = opts || {};
    var token = ++RS.token;
    RS.id = id;
    RS.loading = true;
    RS.frontier = null; RS.report = null; RS.sibling = null;
    RS.point = null; RS.pointFor = null; RS.sel = opts.cand || null;
    RS.pointRefusal = null; RS.mapMissing = null; RS.mapUrl = null;
    RS.stageRows = null; RS.mapKind = "none"; RS.slotSel = null;
    RS.tried = { sibling: false, report: false };
    RS.fetches = [];
    if (!opts.keepRejects) RS.rejects = [];
    adopt(null, "", "");
    document.title = "QIF Results — " + (rsModel(id) ? rsModel(id).label : id);
    rsRenderModels(); rsRenderHeader(); rsRenderAlerts();
    $("h-frontsec").innerHTML = '<h2 class="sect first">The design space</h2><div class="panel2"><p class="ui">loading…</p></div>';
    ["h-hw", "h-pipesec", "h-beat", "h-state", "h-energy", "h-util", "h-bounds", "h-disc"]
      .forEach(function (n) { var e = $(n); if (e) e.innerHTML = ""; });
    Promise.all([
      rsFetch(urlFrontier(id), opts.force)
    ]).then(function (res) {
      if (token !== RS.token) return;                          // a newer load won
      RS.loading = false;
      RS.fetches = res.slice();
      RS.frontier = res[0].ok ? res[0].doc : null;
      if (RS.sel && !candById(RS.sel)) {
        RS.rejects.push({ k: "cand", v: String(RS.sel), why: "this model's sweep has no candidate with that id" });
        RS.sel = null;
      }
      if (!RS.sel) RS.sel = initialId();
      rsRenderAll();
      applyDrillParams();
      fetchPointDoc();
      if (opts.push !== false) pushURL(); else replaceURL();
    }, function (e) {
      if (token !== RS.token) return;
      RS.loading = false;
      RS.fetches = [{ url: urlFrontier(id), ok: false, status: 0, error: String(e && e.message || e) }];
      rsRenderAlerts();
    });
  }

  // ---- deep-link parameters, validated ------------------------------------
  var PENDING = null;
  function applyDrillParams() {
    var q = PENDING; PENDING = null;
    if (!q) return;
    var touched = false;
    if (q.chip != null) {
      if (S.doc && S.ix.chip[q.chip]) { S.chip = q.chip; touched = true; }
      else RS.rejects.push({ k: "chip", v: q.chip, why: S.doc ? "the document bound to this point holds no chiplet with that id" : "no document is bound to this point" });
    }
    if (q.macro != null) {
      if (S.doc && S.ix.macro[q.macro]) { S.macro = q.macro; S.chip = S.ix.macro[q.macro].chip; touched = true; }
      else RS.rejects.push({ k: "macro", v: q.macro, why: S.doc ? "the document bound to this point holds no macro with that id" : "no document is bound to this point" });
    }
    if (q.view != null) {
      if (["package", "chip", "macro"].indexOf(q.view) < 0) {
        RS.rejects.push({ k: "view", v: q.view, why: "the drilldown has three views: package, chip, macro" });
      } else if (q.view === "chip" && !S.chip) {
        RS.rejects.push({ k: "view", v: q.view, why: "no chiplet is selected, so there is no chip view to open" });
      } else if (q.view === "macro" && !S.macro) {
        RS.rejects.push({ k: "view", v: q.view, why: "no macro is selected, so there is no macro view to open" });
      } else { S.view = q.view; touched = true; }
    }
    if (q.duty === "1") { S.duty = A.hasDuty(S.doc || { macros: [] }); if (!S.duty) RS.rejects.push({ k: "duty", v: "1", why: "this document declares no duty cycle" }); else touched = true; }
    var opts = S.doc ? A.filterOptions(S.doc, S.ix) : { models: [], layers: [], groups: [], pools: [] };
    [["fmodel", "model", opts.models], ["layer", "layer", opts.layers], ["group", "group", opts.groups], ["pool", "pool", opts.pools]].forEach(function (t) {
      var v = q[t[0]];
      if (v == null || v === "") return;
      if (t[2].map(String).indexOf(String(v)) < 0) {
        RS.rejects.push({ k: t[0], v: v, why: "the document bound to this point has no " + t[1] + " by that name" });
      } else { S.filter[t[1]] = v; touched = true; }
    });
    if (q.q) { S.filter.q = q.q; touched = true; }
    if (touched) { renderPipelineSection(); }
    /* a rejected deep-link parameter is dropped in silence: the page works */
  }

  // ------------------------------------------------------------------ boot --
  window.addEventListener("popstate", function () {
    var q = readParams(location.search);
    SUPPRESS_PUSH = true;
    try {
      PENDING = q;
      if (q.model && q.model !== RS.id && ensureModel(q.model)) {
        rsLoad(q.model, { cand: q.cand || null, push: false });
      } else if (q.cand && candById(q.cand)) {
        selectPoint(q.cand, false);
        applyDrillParams();
      } else {
        applyDrillParams();
      }
    } finally { SUPPRESS_PUSH = false; }
  });
  document.addEventListener("dragover", function (e) { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", function () { document.body.classList.remove("dropping"); });
  document.addEventListener("drop", function (e) {
    e.preventDefault(); document.body.classList.remove("dropping");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  (function () {
    var q = readParams(location.search);
    PENDING = q;
    RS.wantSelfTest = q.selftest === "1";
    if (q.bundle != null) {
      if (BUNDLE_OK.test(String(q.bundle))) {
        RS.bundleName = String(q.bundle);
        MANIFEST_URL = "../dse/" + RS.bundleName + ".json";
      } else {
        RS.rejects.push({ k: "bundle", v: String(q.bundle), why: "a bundle name is a file name in ../dse, not a path" });
      }
    }
    // The way back to the bundle the reader came from. Both are names, not
    // paths: anything else is dropped and the link falls back to the report.
    if (q.back_model != null && BUNDLE_OK.test(String(q.back_model))) {
      RS.backModel = String(q.back_model);
      if (q.back_cand != null && BUNDLE_OK.test(String(q.back_cand))) RS.backCand = String(q.back_cand);
    }
    setModels(FALLBACK_MODELS);
    if (q.data != null) {
      RS.rejects.push({ k: "data", v: q.data, why: "this page has no one-document mode: the map is bound to the selected point, and a file you open by hand is labelled as such" });
    }
    if (q.frontier != null) {
      RS.rejects.push({ k: "frontier", v: q.frontier, why: "this page reads no fws_frontier/1 document; the design space comes from the sweep report" });
    }
    // The manifest decides the selector. It is one small file, so the page
    // waits for it rather than drawing one model set and then another.
    rsFetch(MANIFEST_URL).then(function (res) {
      if (res.ok) adoptManifest(res.doc);
      // A bundle named on the URL and not in this checkout is a dead end, and
      // the fallback model set would answer a question the reader did not ask.
      if (!res.ok && RS.bundleName !== DEFAULT_BUNDLE) {
        RS.bundleMissing = { url: MANIFEST_URL, why: res.error || ("HTTP " + res.status) };
        RS.MODELS = [];
        rsRenderModels(); rsRenderHeader(); rsRenderAlerts();
        var fs2 = $("h-frontsec"); if (fs2) fs2.innerHTML = "";
        return;
      }
      var want = q.model || null;
      if (want && !isModel(want)) ensureModel(want);
      rsLoad(want || (RS.MODELS[0] || {}).id, { cand: q.cand || null, push: false, keepRejects: true });
    });
  })();
})();
</script>
</body>
</html>
