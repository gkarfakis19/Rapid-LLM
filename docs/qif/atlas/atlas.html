      elx("circle", dot, g);
      if (offX || offY) {
        // an arrowhead on the frame edge: the point is real, it is off the
        // frame the buildable machines set, and it is still hoverable
        var dx = p.x > xmax ? 1 : p.x < xmin ? -1 : 0;
        var dy = p.y > ymax ? -1 : p.y < ymin ? 1 : 0;
        var ax = cx + dx * 10, ay = cy + dy * 10;
        elx("path", {
          d: "M" + ax + " " + ay + " l" + (dx ? dx * 8 : -5) + " " + (dx ? -5 : dy * 8) + " l"
            + (dx ? 0 : 10) + " " + (dx ? 10 : 0) + " z",
          fill: m.hex, opacity: 0.75
        }, g);
      }
      rsHover(g, function () { return candTip(p.c) + (offX || offY ? '<div class="b">drawn on the frame edge: it is outside the range the buildable points set</div>' : ""); });
      g.addEventListener("click", function () { selectPoint(p.c.id, true); });
    });
    RS.clamped = clamped;
    RS.nFront = nFront;
    RS.nDom = nDom;
    RS.nOpen = nOpen;
    RS.plotted = pts.length;
    RS.unplottable = cands().length - pts.length;
    return svg;
  }
  function rsRenderFrontier() {
    var sec = $("h-frontsec"); if (!sec) return;
    var w = workload();
    sec.innerHTML = '<h2 class="sect first">The design space — every point this sweep evaluated</h2>'
      + '<div class="panel2"><div id="h-frontier"></div></div>'
      + '<div id="h-candtable"></div>';
    var host = $("h-frontier");
    if (!RS.frontier) {
      host.innerHTML = '<p class="rerr">' + (RS.loading ? "loading…" : "no sweep artifact for this model — see the band above for the URL that failed.") + "</p>";
      return;
    }
    if (!cands().length) {
      host.innerHTML = '<p class="rerr">this sweep artifact lists no candidates, so there is no design space to draw.</p>';
      return;
    }
    var svg = rsFrontierPlot();
    if (!svg) {
      host.innerHTML = '<p class="rerr">no candidate in this sweep carries both a headline figure and a silicon total, so no point can be placed.</p>';
    } else {
      host.appendChild(svg);
      var lg = document.createElement("p");
      lg.className = "rnote";
      // A legend keys the ink ON THE PLOT. A state nothing draws is not
      // explained, and a state something draws is never left unnamed.
      var keys = [];
      if (RS.nFront) keys.push("● on the front");
      if (RS.nDom) keys.push("pale ● dominated — another point beats it on both axes");
      if (RS.nOpen) keys.push("○ does not fit (" + RS.nOpen + " of them — hover any one for the reason it was refused)");
      keys.push("ring = the point this page is bound to");
      keys.push("click a point and every panel below rebinds to it");
      lg.innerHTML = keys.join(" · ")
        + (RS.clamped ? " · " + RS.clamped + " point(s) drawn on the frame edge, outside the range the buildable points set" : "")
        + (RS.unplottable ? " · " + RS.unplottable + " point(s) carry no plottable pair and appear in the table only" : "");
      host.appendChild(lg);
      var f = RS.frontier;
      if (f.front_note || (f.knee && f.knee.point)) {
        var note = document.createElement("p");
        note.className = "rnote";
        note.innerHTML = (f.front_note ? esc(plain(f.front_note, 2)) : "")
          + (f.knee && f.knee.point ? "<br><b>knee: " + esc(f.knee.point) + "</b> — " + esc(plain(f.knee.basis, 2)) : "");
        host.appendChild(note);
      }
    }
    rsRenderCandTable();
  }
  // The chiplet census of one row. A run that builds no digital silicon
  // publishes no digital count, and a count is the one thing this cell must
  // never invent: it names the analog chiplets alone and leaves the digital
  // question to the hardware panel, which answers it in words.
  function chipletCell(pl) {
    if (!pl || pl.analog_chips == null) return "";
    var a = pl.analog_chips + " analog";
    return pl.shared_digital_chiplets == null ? a : a + " + " + pl.shared_digital_chiplets + " digital";
  }
  // D8. The plot said "listed below" and there was no list. Here it is: every
  // candidate the sweep evaluated, ordered by the silicon it costs, with its
  // knobs, its verdict and — for a refused point — the message that refused it.
  function rsRenderCandTable() {
    var host = $("h-candtable"); if (!host) return;
    var w = workload();
    var rows = cands().slice().sort(function (a, b) {
      var sa = siliconValue(a), sb = siliconValue(b);
      if (sa == null && sb == null) return String(a.id) < String(b.id) ? -1 : 1;
      if (sa == null) return 1;
      if (sb == null) return -1;
      return sa - sb;
    });
    if (!rows.length) { host.innerHTML = ""; return; }
    var knobNames = {};
    rows.forEach(function (c) { Object.keys(c.knobs || {}).forEach(function (k) { knobNames[k] = 1; }); });
    var knobs = Object.keys(knobNames).sort();
    // A column no point fills is not drawn. The verdict column only exists when
    // some point was refused; the refusal column with it.
    var anyBad = rows.some(function (c) { return !c.ok; });
    var anyChips = rows.some(function (c) { return (c.placement || {}).analog_chips != null; });
    var head = "<tr><th>point</th>" + (anyBad ? "<th>verdict</th>" : "")
      + knobs.map(function (k) { return "<th>" + esc(k) + "</th>"; }).join("")
      + "<th>" + esc(w.unit) + "</th><th>silicon mm²</th>"
      + (anyChips ? "<th>chiplets</th>" : "")
      + (anyBad ? "<th>why it was refused</th>" : "") + "</tr>";
    var body = rows.map(function (c) {
      var pl = c.placement || {};
      var cls = (c.id === RS.sel ? "pick " : "") + (c.ok ? "" : "bad ") + "click";
      return '<tr class="' + cls + '" data-cand="' + esc(c.id) + '">'
        + "<td>" + esc(c.id) + (onFront(c.id) ? " <span class=\"pill\">front</span>" : "") + "</td>"
        + (anyBad ? "<td>" + (c.ok ? '<span class="verd-ok">builds</span>' : '<span class="verd-bad">refused at ' + esc(c.fail_stage || "?") + "</span>") + "</td>" : "")
        + knobs.map(function (k) {
          var v = (c.knobs || {})[k];
          return "<td>" + (v == null ? "" : esc(String(v))) + "</td>";
        }).join("")
        + "<td>" + num(headlineValue(c), rint, "This point reports no headline figure.") + "</td>"
        + "<td>" + num(siliconValue(c), rmm2, "This point was refused before its silicon was totalled.") + "</td>"
        + (anyChips ? "<td>" + chipletCell(pl) + "</td>" : "")
        + (anyBad ? '<td class="basis">' + (c.ok ? "" : esc(plain(c.fail_message, 2))) + "</td>" : "") + "</tr>";
    }).join("");
    host.innerHTML = '<h3 class="rsub">Every point, cheapest silicon first</h3>'
      + '<div class="panel2"><table class="rtable">' + head + body + "</table>"
      + '<p class="rnote">Click any row to bind the page to that point. A refused point still reports the '
      + "throughput it would have delivered, because the sweep prices it and only then applies the area budget.</p></div>";
    Array.prototype.forEach.call(host.querySelectorAll("[data-cand]"), function (n) {
      n.addEventListener("click", function () { selectPoint(n.getAttribute("data-cand"), true); });
    });
  }

  // ---- the two chiplet kinds, for the SELECTED point ----------------------
  // Every capacity row below comes from the device card of the document BOUND
  // to this point. A sibling document exported at another point's knobs holds
  // another point's mux and another point's macro geometry, so when nothing is
  // bound the capacity rows state their absence rather than borrow it (D33).
  function boundCards() {
    if (RS.mapKind === "none" || !S.doc || !S.doc.cards) return null;
    var analog = null, digital = null;
    Object.keys(S.doc.cards).forEach(function (k) {
      var card = S.doc.cards[k];
      if (card.kind === "analog_macro" && !analog) analog = card;
      if (card.kind === "digital_engine" && !digital) digital = card;
    });
    return { analog: analog, digital: digital, why: S.source };
  }
  function rsRenderHardware() {
    var host = $("h-hw"); if (!host) return;
    var c = selected();
    if (!c) { host.innerHTML = ""; return; }
    var si = c.silicon || {}, dd = c.derived_digital || {}, pl = c.placement || {};
    var pk = c.packing || {}, dc = c.derived_chiplets || {}, w = workload();
    var util = {};
    (c.utilization || []).forEach(function (u) { util[u.device_class] = u; });
    var cards = boundCards();
    var noCard = "No map is bound to this point yet, so its macro geometry — the rows, ADC columns and mux "
      + "its knobs set — is not on screen.";
    var cap = cards && cards.analog ? cards.analog.capacity : null;
    var dcap = cards && cards.digital ? cards.digital.capacity : null;
    var wbits = cards && cards.analog ? cards.analog.weight_bits : null;
    var nA = pl.analog_chips, nD = pl.shared_digital_chiplets;
    var slotsPer = (nA && si.analog_macro_slots != null) ? si.analog_macro_slots / nA : null;
    var cellsPerMacro = cap && cap.rows && cap.stored_cols ? cap.rows * cap.stored_cols : null;
    var macs = (dd.fabric_num_arrays != null && dcap) ? dd.fabric_num_arrays * dcap.rows * dcap.cols_adc : null;

    function card(title, count, rows, note) {
      var kept = [], pending = null;
      rows.forEach(function (row) {
        if (!row) return;
        if (row.indexOf('class="grp"') >= 0) { pending = row; return; }
        if (pending) { kept.push(pending); pending = null; }
        kept.push(row);
      });
      if (!kept.length && !note) return "";
      return '<div class="hwcard"><h3>' + title + "</h3><div class=\"cnt\">" + count + "</div>"
        + (note ? '<p class="rnote">' + esc(note) + "</p>" : "")
        + (kept.length ? "<table>" + kept.join("") + "</table>" : "") + "</div>";
    }
    // A row this point has no value for is DROPPED, not dash-filled: a card of
    // em-dashes is a card that says nothing at length. `r` prints a row whose
    // content is a stated FINDING (an area no library could compose, a class
    // that measured nothing) and `rv` prints one only when the number exists.
    function r(k, v) { return v == null || v === "" ? "" : "<tr><td>" + esc(k) + "</td><td>" + v + "</td></tr>"; }
    function rv(k, v, render) { return has(v) ? r(k, render(v)) : ""; }
    function grp(t) { return '<tr><td class="grp" colspan="2">' + esc(t) + "</td></tr>"; }

    // How many pipeline stages one shared chiplet carries. Above one, the
    // engine had to be sized for the set rather than for a single stage.
    var nStages = stageCount(c);
    var stagesPer = (nStages && nD) ? nStages / nD : null;

    var aRows = [
      grp("weight storage"),
      rv("macro slots per chiplet", slotsPer, rint),
      r("one macro", cap ? rint(cap.rows) + " rows × " + rint(cap.cols_adc) + " ADC cols × " + rint(cap.mux) + " mux" : null),
      rv("cells per macro", cellsPerMacro, rint),
      r("weight capacity per chiplet", (slotsPer && cellsPerMacro && wbits)
        ? rbytes(slotsPer * cellsPerMacro * wbits / 8) + " @ " + wbits + "-bit" : null),
      grp("what the mapping put here"),
      r("macros holding weights", (nA && pl.macros_holding_tiles != null && si.analog_macro_slots)
        ? rint(pl.macros_holding_tiles / nA) + " (" + rpct(pl.macros_holding_tiles / si.analog_macro_slots) + ")" : null),
      r("empty macro slots per chiplet", (nA && pl.unowned_macro_slots != null) ? rint(pl.unowned_macro_slots / nA) : null),
      rv("cell waste", pk.measured === false ? null : pk.waste_pct, function (v) { return v.toFixed(1) + "%"; }),
      r("duty cycle", util.analog_macro
        ? rpct(util.analog_macro.mean_occupancy, 2) + " mean, " + rpct(util.analog_macro.max_occupancy, 2) + " peak" : null),
      grp("silicon"),
      rv("macro area", si.macro_footprint_mm2, function (v) { return v.toFixed(3) + " mm² each"; }),
      // A pool area of 0.0 with provenance "absent" is not a free pool: it is a
      // pool nothing could compose. That IS the finding, so it is printed.
      (si.macro_pool_area_provenance === "absent"
        ? r("pool area per macro", ab("This card names no library to compose a per-macro digital pool from, so its area is unknown rather than zero."))
        : rv("pool area per macro", si.macro_pool_area_mm2_per_macro, function (v) { return v.toFixed(5) + " mm²"; })),
      rv("all analog silicon", si.analog_macro_silicon_mm2, function (v) {
        return rmm2(v + (si.macro_pool_silicon_mm2 || 0)) + " mm²";
      })
    ];

    var beat = beatClass(c);
    var noEngine = whyAbsent("digital", c);
    var dRows = [
      grp("compute"),
      r("systolic arrays", dd.fabric_num_arrays != null
        ? rint(dd.fabric_num_arrays) + (dcap ? " × " + dcap.rows + "×" + dcap.cols_adc : "") : null),
      rv("MACs in the fabric", macs, rint),
      rv("softmax lanes", dd.fabric_softmax_lanes, rint),
      rv("scan / vector lanes", dd.vector_lanes, rint),
      r("sizing", dd.sizing_target === "analog_stage_time"
        ? "widened until it keeps up with the analog stage"
        : (dd.sizing_target ? esc(String(dd.sizing_target)) : null)),
      grp("what it does per beat"),
      r("serves", (nA && nD)
        ? (nA / nD).toFixed(1) + " analog chiplet(s)"
          + (stagesPer != null ? ", " + (stagesPer > 1 ? stagesPer.toFixed(1) + " pipeline stages" : "one pipeline stage") : "")
        : null),
      rv("busiest chiplet", dc.built_duty_max, function (v) {
        return rpct(v) + " of the beat" + (dc.built_duty_mean != null ? " (" + rpct(dc.built_duty_mean) + " mean)" : "");
      }),
      r("duty cycle", util.shared_digital
        ? rpct(util.shared_digital.mean_occupancy) + " mean, " + rpct(util.shared_digital.max_occupancy) + " peak" : null),
      // This row used to read "no — the analog side binds" for EVERY class that
      // was not shared_digital, so a link-bound point and a point that measured
      // nothing both claimed the analog side sets the beat.
      r("what sets the beat", beat
        ? "<b>" + esc(beat) + "</b>"
          + (dd.binding_block ? " — " + esc(String(dd.binding_block)) : "")
          + (dd.binding_stage != null ? " on stage " + dd.binding_stage : "")
        : null),
      r("busiest device class", busiestClass(c) ? esc(busiestClass(c)) : null),
      grp("state it must hold"),
      rv("worst stage state", (c.metrics || {}).max_stage_state_bytes, rbytes),
      r("state verdict", (c.metrics || {}).state_residency_verdict
        ? '<span class="' + (String((c.metrics || {}).state_residency_verdict).toUpperCase().indexOf("VIOL") >= 0 ? "verd-bad" : "verd-ok") + '">'
          + esc((c.metrics || {}).state_residency_verdict) + "</span>" : null),
      grp("silicon"),
      // .toFixed used to run on a value that is null whenever the provenance
      // says composed but the area did not compose.
      (si.shared_digital_area_provenance === "composed-measured" && has(si.shared_digital_area_mm2_per_chiplet)
        ? r("area per chiplet", si.shared_digital_area_mm2_per_chiplet.toFixed(2) + " mm²")
        : ""),
      r("power per chiplet", (dd.digital_power_W_total != null && nD)
        ? (dd.digital_power_W_total / nD).toFixed(1) + " W" : null),
      (si.shared_digital_area_provenance === "composed-measured"
        ? rv("all digital silicon", si.digital_silicon_mm2, function (v) { return rint(v) + " mm²"; })
        : "")
    ];
    var digitalCard = card("Shared digital chiplet",
      has(nD) ? (nD === 0 ? "none in this machine" : "× " + rint(nD) + " in this machine")
        : (isToy() ? "none in this machine" : "× ? in this machine"),
      dRows, noEngine);
    // The point's identity rides on this heading. It used to have a stat row of
    // its own above it, repeating the two numbers the frontier had just shown.
    var idBits = Object.keys(c.knobs || {}).map(function (k) { return esc(k + " = " + c.knobs[k]); });
    if (has(headlineValue(c))) idBits.push("<b>" + rint(headlineValue(c)) + "</b> " + esc(w.unit));
    if (has(siliconValue(c))) idBits.push("<b>" + rmm2(siliconValue(c)) + "</b> mm² of silicon");
    if (has((c.pipeline || {}).beat_s)) idBits.push(rsSecs(c.pipeline.beat_s) + " beat");
    if (has((c.metrics || {}).per_token_latency_s)) idBits.push(rsSecs(c.metrics.per_token_latency_s) + " " + esc(w.latency));
    else if (has((c.metrics || {}).request_latency_s)) idBits.push(rsSecs(c.metrics.request_latency_s) + " " + esc(w.latency));
    idBits.push(onFront(c.id) ? "on the Pareto front" : "dominated by at least one other point");
    host.innerHTML = '<h2 class="sect">Point ' + esc(c.id)
      + (isToy() ? " — what this machine is built from</h2>" : " — the two chiplet kinds it is built from</h2>")
      + '<p class="rnote">' + idBits.join(" · ") + "</p>"
      + (c.ok ? "" : '<p class="rnote">' + refusalStory(c) + " Everything the sweep priced before refusing it is below.</p>")
      + (cards ? "" : '<p class="rnote">' + esc(noCard) + "</p>")
      + '<div class="hwgrid">'
      + digitalCard
      + card("Analog weight chiplet", "× " + (has(nA) ? rint(nA) : "?") + " in this machine", aRows)
      + "</div>";
  }
  function stageCount(c) {
    var pipe = (c && c.pipeline) || {};
    if (typeof pipe.stage_count === "number") return pipe.stage_count;
    if (typeof pipe.stages === "number") return pipe.stages;          // pre-D33 spelling
    if (Array.isArray(pipe.stages)) return pipe.stages.length;
    var sb = (c && c.state_bill) || {};
    return typeof sb.stages === "number" ? sb.stages : null;
  }

  // ---- DEDUPLICATION -------------------------------------------------------
  // A fact appears once. Twenty stages that hold the same layers do the same
  // work and hold the same state, and printing twenty identical rows is twenty
  // times the ink for one fact. Runs of identical rows collapse into one row
  // and a count; the labels of the run are kept so a reader can see which
  // stages it covers.
  function collapse(rows, keyOf) {
    var out = [];
    rows.forEach(function (r) {
      var k = keyOf(r);
      var last = out[out.length - 1];
      if (last && last.key === k) { last.rows.push(r); return; }
      out.push({ key: k, rows: [r] });
    });
    return out;
  }
  function runLabel(group, name) {
    var n = group.rows.length;
    if (n === 1) return name(group.rows[0]);
    var a = group.rows[0], z = group.rows[n - 1];
    return name(a) + " – " + name(z) + " <span class=\"rnote\">(" + n + " identical)</span>";
  }

  // ---- the stage-balance finding -------------------------------------------
  // A pipeline whose stages take wildly different times wastes every stage but
  // the longest one, and the longest one sets the beat. The sweep judges that
  // and this panel prints the judgement where the reader cannot miss it. An
  // artifact that predates the judgement simply has none, and nothing is drawn.
  function stageBalanceNote(c) {
    var sb = c && c.stage_balance;
    if (!sb || typeof sb !== "object") return "";
    var verdict = String(sb.verdict || "").toLowerCase();
    if (!verdict || /balanced/.test(verdict) && !/mis|un/.test(verdict)) return "";
    var longs = sb.long_stages;
    var ids = [], blocks = {};
    (Array.isArray(longs) ? longs : []).forEach(function (x) {
      if (x == null) return;
      if (typeof x === "number") { ids.push(x); return; }
      if (x.stage != null) ids.push(x.stage);
      Object.keys(x.blocks || {}).forEach(function (b) { blocks[b] = (blocks[b] || 0) + (x.blocks[b] || 1); });
    });
    var names = Object.keys(blocks).sort(function (a, b) { return blocks[b] - blocks[a]; });
    var w = workload();
    var reach = has(sb.balanced_beat_bound_s) && sb.balanced_beat_bound_s > 0
      ? 1 / sb.balanced_beat_bound_s : null;
    var now = headlineValue(c);
    var parts = [];
    parts.push("This point's stages are not the same length.");
    if (has(sb.ratio)) {
      parts.push("Its longest stage runs <span class=\"num\">" + rfmt(sb.ratio, 1)
        + "\u00d7</span> the median stage");
      parts[parts.length - 1] += ids.length
        ? " — stage" + (ids.length === 1 ? " " : "s ") + ids.join(", ") + "."
        : ".";
    } else if (ids.length) {
      parts.push("Stage" + (ids.length === 1 ? " " : "s ") + ids.join(", ") + " run far longer than the rest.");
    }
    if (names.length) {
      parts.push("What makes " + (ids.length === 1 ? "it" : "them") + " long is "
        + names.slice(0, 3).join(", ") + " work that the other stages do not carry.");
    }
    parts.push("Every other stage waits on " + (ids.length === 1 ? "it" : "them") + ", and "
      + (ids.length === 1 ? "it sets" : "they set") + " the beat.");
    if (reach != null) {
      parts.push("A partition that spread the work evenly could reach <span class=\"num\">"
        + rint(reach) + "</span> " + esc(w.unit)
        + (has(now) ? " instead of <span class=\"num\">" + rint(now) + "</span>" : "") + ".");
    }
    return '<div class="finding"><h4>Unbalanced pipeline</h4><p style="margin:0">'
      + parts.join(" ") + "</p></div>";
  }

  // ---- where the beat goes, stage by stage (the SELECTED point) -----------
  function rsRenderBeat() {
    var host = $("h-beat"); if (!host) return;
    var c = selected(); if (!c) { host.innerHTML = ""; return; }
    var w = workload();
    var head = '<h2 class="sect">Where the beat goes on this point</h2>';
    var bt = c.binding_term || null;
    var dd = c.derived_digital || {};
    var rows = (bt && Array.isArray(bt.per_stage)) ? bt.per_stage : [];
    // A workload with no beat has no "where the beat goes". An encoder runs one
    // pass; it does not lower a beat, and a panel explaining at length why a
    // concept it does not have is missing is worse than no panel.
    if (!rows.length && !w.staged && !stageBalanceNote(c)) { host.innerHTML = ""; return; }
    if (!rows.length) {
      // No per-stage roll-up for THIS point. Say what the point does report and
      // never borrow another point's stage table.
      var facts = [];
      function fr(k, v) { if (v != null && v !== "") facts.push("<tr><td>" + esc(k) + "</td><td>" + v + "</td></tr>"); }
      fr("what sets the beat", beatClass(c) ? "<b>" + esc(beatClass(c)) + "</b>" : null);
      fr("beat-setting stage", dd.binding_stage != null ? String(dd.binding_stage) : null);
      fr("beat-setting block", dd.binding_block ? esc(String(dd.binding_block)) : null);
      fr("its busy time", has(dd.binding_busy_s) ? rsSecs(dd.binding_busy_s) : null);
      fr("the analog pass under it", has(dd.binding_analog_time_s) ? rsSecs(dd.binding_analog_time_s) : null);
      var why = whyAbsent("beat", c);
      var bal0 = stageBalanceNote(c);
      if (!why && !facts.length && !bal0) { host.innerHTML = ""; return; }
      host.innerHTML = head + '<div class="panel2">' + bal0
        + (why ? '<p class="rnote">' + why + "</p>" : "")
        + (c.ok && facts.length ? '<table class="rtable">' + facts.join("") + "</table>" : "")
        + "</div>";
      return;
    }
    rows = rows.slice().sort(function (a, b) { return a.stage - b.stage; });
    // Runs of stages with the same three times are one line, not twenty.
    var sig = function (r) {
      return [r.analog_time_s, r.engine_time_s, r.fabric_time_s].map(function (v) {
        return has(v) ? v.toPrecision(6) : "-";
      }).join("|");
    };
    var groups = collapse(rows, sig);
    var W = 1180, rowH = 26, top = 44, L = 84, R = 230, barH = 6, gap = 1;
    var H = top + groups.length * rowH + 18;
    var maxT = 0;
    rows.forEach(function (r) {
      maxT = Math.max(maxT, r.analog_time_s || 0, r.engine_time_s || 0, r.fabric_time_s || 0);
    });
    if (maxT <= 0) maxT = 1;
    var plotW = W - L - R;
    function X(t) { return Math.max(1, plotW * t / maxT); }
    var SERIES = [
      { key: "analog_time_s", label: "analog weight pass", colour: "#176778" },
      { key: "engine_time_s", label: "scan / vector engine", colour: "#8a5a10" },
      { key: "fabric_time_s", label: "attention fabric", colour: "#7a2e2e" }
    ];
    var p = [];
    p.push('<text x="' + L + '" y="18" font-size="11" fill="var(--muted)" letter-spacing=".06em">TIME EACH ENGINE IS BUSY ON EACH STAGE OF POINT ' + esc(c.id.toUpperCase()) + "</text>");
    var span = bt.span_s;
    if (typeof span === "number" && span > 0 && span <= maxT * 1.05) {
      var bx = L + X(span);
      p.push('<line x1="' + bx + '" y1="' + (top - 10) + '" x2="' + bx + '" y2="' + (top + groups.length * rowH - 4) + '" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3"/>');
      p.push('<text x="' + (bx + 4) + '" y="' + (top - 14) + '" font-size="10" fill="var(--ink)">the beat-setting span</text>');
    }
    groups.forEach(function (g, i) {
      var r = g.rows[0];
      var y = top + i * rowH;
      var binds = bt.stage != null && g.rows.some(function (x) { return x.stage === bt.stage; });
      if (binds) p.push('<rect x="' + (L - 78) + '" y="' + (y - 3) + '" width="' + (W - L + 72) + '" height="' + (rowH - 2) + '" rx="3" fill="var(--code)"/>');
      var name = g.rows.length === 1 ? "stage " + r.stage
        : "stages " + r.stage + "–" + g.rows[g.rows.length - 1].stage;
      p.push('<text x="' + (L - 8) + '" y="' + (y + 13) + '" text-anchor="end" font-size="10.5" fill="'
        + (binds ? "#1c2a33" : "#5f7280") + '"' + (binds ? ' font-weight="600"' : "") + ">" + name + "</text>");
      var yy = y, drawn = 0;
      SERIES.forEach(function (ser) {
        var t = r[ser.key];
        if (typeof t !== "number" || t <= 0) return;
        drawn++;
        p.push('<rect x="' + L + '" y="' + yy + '" width="' + X(t) + '" height="' + barH + '" rx="2" fill="' + ser.colour + '" fill-opacity=".9"/>');
        yy += barH + gap;
      });
      var right;
      if (!drawn) {
        right = "no engine time on this stage";
      } else {
        var worst = Math.max(r.analog_time_s || 0, r.engine_time_s || 0, r.fabric_time_s || 0);
        var who = (worst === (r.fabric_time_s || 0) && r.fabric_time_s) ? "attention fabric"
          : (worst === (r.engine_time_s || 0) && r.engine_time_s) ? "scan engine" : "analog pass";
        right = rsSecs(worst) + " · " + who + (r.analog_bound === true ? " · analog-bound" : r.analog_bound === false ? " · digital-bound" : "");
      }
      p.push('<text x="' + (W - R + 10) + '" y="' + (y + 13) + '" font-size="10" fill="var(--muted)">' + esc(right)
        + (g.rows.length > 1 ? " · ×" + g.rows.length : "")
        + (binds ? " · sets the beat" : "") + "</text>");
    });
    var keys = SERIES.map(function (ser) {
      return '<span class="blk"><span style="display:inline-block;width:11px;height:7px;border-radius:2px;background:'
        + ser.colour + '"></span>' + ser.label + "</span>";
    }).join("");
    var bindNote = beatClass(c)
      ? "The beat-setting term on this point is <b>" + esc(beatClass(c)) + "</b>"
        + (dd.binding_block ? " (" + esc(String(dd.binding_block)) + ")" : "")
        + (bt.stage != null ? " on stage " + bt.stage : "") + "."
      : "This point names no beat-setting class.";
    host.innerHTML = head + '<div class="panel2">' + stageBalanceNote(c)
      + '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="max-width:' + W + 'px">' + p.join("") + "</svg>"
      + '<p class="rnote">' + keys + "<br>" + bindNote
      + " Each bar is how long that engine is busy on that stage; the two digital engines share one queue, so a "
      + "stage is analog-bound when the analog pass is at least as long as their sum."
      + (groups.length < rows.length
        ? " Stages that do identical work are drawn once, with the count beside them." : "")
      + "</p></div>";
  }

  // ---- the state bill of the SELECTED point -------------------------------
  function rsRenderState() {
    var host = $("h-state"); if (!host) return;
    var c = selected(); if (!c) { host.innerHTML = ""; return; }
    var sb = c.state_bill || {};
    var head = '<h2 class="sect">The state this point holds while it runs</h2>';
    var rows = Array.isArray(sb.per_stage) ? sb.per_stage : [];
    if (!rows.length) {
      // A workload that holds no resident state has no state bill. Say it in
      // one sentence on a refused point; say nothing at all on an encoder,
      // which never had streams to hold state for.
      var why = whyAbsent("state", c);
      if (!c.ok) { host.innerHTML = head + '<div class="panel2"><p class="rnote">' + why + "</p></div>"; return; }
      if (!workload().staged) { host.innerHTML = ""; return; }
      host.innerHTML = head + '<div class="panel2"><p class="rnote">' + (why || "This point publishes no per-stage state rows.") + "</p></div>";
      return;
    }
    var anyKv = rows.some(function (r) { return (r.kv_bytes || 0) > 0; });
    var anyRec = rows.some(function (r) { return (r.recurrent_state_bytes || 0) > 0; });
    var anyStore = rows.some(function (r) { return r.store_macros != null; });
    var anyLayers = rows.some(function (r) { return r.layers != null; });
    function cell(v, render, reason) { return "<td>" + num(v, render, reason) + "</td>"; }
    // `label` is HTML: a collapsed run carries its own count markup.
    function row(st, label) {
      return "<tr><td>" + label + "</td>"
        + (anyLayers ? "<td>" + (st.layers == null ? "" : esc(String(st.layers))) + "</td>" : "")
        + cell(st.state_bytes, rbytes, "Not reported on this stage.")
        + (anyRec ? cell(st.recurrent_state_bytes, rbytes, "Not reported on this stage.") : "")
        + (anyKv ? cell(st.kv_bytes, rbytes, "Not reported on this stage.") : "")
        + (anyStore ? "<td>" + (st.store_provenance && st.store_provenance !== "composed-measured"
          ? ab("No SRAM macro could be composed for this stage, so its store area is unknown rather than zero.")
          : num(st.store_area_mm2, function (v) { return v.toFixed(1) + " mm²"; }, "Not composed.")
          + (st.store_macros ? ' <span class="rnote">(' + rint(st.store_macros) + " macros)</span>" : "")) + "</td>" : "")
        + '<td><span class="' + (String(st.verdict || "").toUpperCase().indexOf("VIOL") >= 0 ? "verd-bad" : "verd-ok") + '">'
        + esc(st.verdict || "") + "</span></td></tr>";
    }
    var head2 = "<tr><th>stage</th>" + (anyLayers ? "<th>layers</th>" : "") + "<th>total</th>"
      + (anyRec ? "<th>recurrent</th>" : "") + (anyKv ? "<th>KV</th>" : "")
      + (anyStore ? "<th>store built</th>" : "") + "<th></th></tr>";
    var groups = collapse(rows, function (st) {
      return [st.state_bytes, st.recurrent_state_bytes, st.kv_bytes, st.layers, st.store_macros, st.verdict].join("|");
    });
    var body = groups.map(function (g) {
      var n = g.rows.length;
      if (n === 1) return row(g.rows[0], esc(clean(String(g.rows[0].label || ("stage " + g.rows[0].stage)))));
      if (n === rows.length) return row(g.rows[0], "every stage (" + n + " of them)");
      return row(g.rows[0], "stages " + g.rows[0].stage + "–" + g.rows[n - 1].stage
        + ' <span class="rnote">(' + n + " identical)</span>");
    }).join("");
    var summary = [];
    if (sb.resident_streams != null) summary.push(rint(sb.resident_streams) + " resident streams");
    if (sb.max_stage_state_bytes != null) summary.push("worst stage " + rbytes(sb.max_stage_state_bytes));
    if (sb.store_area_mm2 != null) summary.push("store " + rint(sb.store_area_mm2) + " mm² of silicon");
    if (sb.verdict) summary.push("verdict " + sb.verdict);
    host.innerHTML = head + '<div class="panel2"><table class="rtable">' + head2 + body + "</table>"
      + (summary.length ? '<p class="rnote">' + esc(summary.join(" · ")) + "</p>" : "")
      + (groups.length < rows.length
        ? '<p class="rnote">Stages holding the same bill are drawn once: they hold the same number of identical layers.</p>' : "")
      + (anyKv ? "" : '<p class="rnote">No stage holds any KV: no layer of this model is an attention layer, '
        + "so the KV column is not drawn.</p>")
      + (sb.basis ? '<p class="rnote">' + esc(plain(sb.basis)) + "</p>" : "")
      + "</div>";
  }

  // ---- energy, with its coverage (D7) -------------------------------------
  function rsRenderEnergy() {
    var host = $("h-energy"); if (!host) return;
    var c = selected(); if (!c) { host.innerHTML = ""; return; }
    var w = workload();
    var comps = ((c.metrics || {}).energy_components) || [];
    var head = '<h2 class="sect">Energy per ' + esc(w.per) + " on this point</h2>";
    if (!comps.length) {
      host.innerHTML = head + '<div class="panel2"><p class="rnote">'
        + (refusalStory(c) || "This point prices no energy.")
        + "</p></div>";
      return;
    }
    var uncovered = comps.filter(function (x) { return x.coverage === "uncovered"; });
    var partial = comps.filter(function (x) { return x.coverage === "partial"; });
    var total = (c.metrics || {}).total_energy_pj;
    var covered = comps.reduce(function (a, x) {
      return a + (x.coverage === "uncovered" ? 0 : (typeof x.energy_pj === "number" ? x.energy_pj : 0));
    }, 0);
    var body = comps.map(function (x) {
      var label = clean(String(x.component || x.key || x.name || "?"));
      // An UNCOVERED component has no model at all. Its 0.0 is the absence of a
      // law, not a measurement of zero joules, and it used to print "0".
      if (x.coverage === "uncovered") {
        return "<tr><td>" + esc(label) + "</td><td>"
          + ab("Nothing in this run models this term, so its energy is unknown rather than zero.")
          + "</td><td>" + ab("no figure to take a share of") + "</td><td>uncovered</td></tr>";
      }
      var pj = x.energy_pj;
      // A PARTIAL component whose priced part is exactly zero is the same
      // trap one step down: what is priced contributes nothing measurable and
      // what is not priced is unknown, so the row is an absence, not a zero.
      if (x.coverage !== "covered" && pj === 0) {
        return "<tr><td>" + esc(label) + "</td><td>"
          + ab("Part of this term is priced and part of it is not, and the priced part came to zero, so the whole is unknown rather than zero.")
          + "</td><td>" + ab("no figure to take a share of") + "</td><td>" + esc(x.coverage || "?") + "</td></tr>";
      }
      return "<tr><td>" + esc(label) + "</td><td>" + num(pj, mJ, "not reported") + "</td>"
        + "<td>" + (covered > 0 && typeof pj === "number" ? rpct(pj / covered, 1) : ab("no covered total to divide by")) + "</td>"
        + "<td>" + esc(x.coverage || "?") + "</td></tr>";
    }).join("");
    // D7. The 100% row is only true when the column is complete. It is not.
    var totalRow = "<tr><td><b>total of what IS modelled</b></td><td><b>" + num(covered, mJ, "nothing covered") + "</b></td>"
      + "<td><b>" + (uncovered.length ? ab("this column cannot sum to 100%: " + uncovered.length + " component(s) are uncovered") : "100%") + "</b></td>"
      + "<td>" + (uncovered.length || partial.length ? "incomplete" : "complete") + "</td></tr>";
    var foot = [];
    if (uncovered.length) {
      foot.push("<b>" + uncovered.length + " component(s) are UNCOVERED</b> — "
        + uncovered.map(function (x) { return esc(clean(String(x.component))); }).join(", ")
        + ". No law in this run prices them, so the total row is a LOWER BOUND and the shares are shares of "
        + "what is modelled, not of the machine's energy.");
    }
    if (partial.length) {
      foot.push("<b>" + partial.length + " component(s) are PARTIAL</b> — "
        + partial.map(function (x) { return esc(clean(String(x.component))); }).join(", ")
        + ". Part of the term is priced and part of it is not.");
    }
    if (typeof total === "number" && Math.abs(total - covered) > Math.abs(total) * 1e-9) {
      foot.push("The point also publishes a total of " + mJ(total) + ", which is the same sum.");
    }
    host.innerHTML = head + '<div class="panel2"><table class="rtable">'
      + "<tr><th>component</th><th>per " + esc(w.per) + "</th><th>share of what is modelled</th><th>coverage</th></tr>"
      + body + totalRow + "</table>"
      + (foot.length ? '<p class="why">' + foot.join("<br>") + "</p>" : "") + "</div>";
  }

  // ---- duty cycle, per device class ---------------------------------------
  function rsRenderUtil() {
    var host = $("h-util"); if (!host) return;
    var c = selected(); if (!c) { host.innerHTML = ""; return; }
    var util = Array.isArray(c.utilization) ? c.utilization : [];
    var head = '<h2 class="sect">Duty cycle — the share of the beat each device is busy</h2>';
    if (!util.length) {
      host.innerHTML = head + '<div class="panel2"><p class="rnote">'
        + (refusalStory(c) || "This point publishes no per-device-class utilization.")
        + "</p></div>";
      return;
    }
    var busiest = busiestClass(c);
    var body = util.map(function (u) {
      var idle = u.idle_devices || 0;
      var mark = (busiest && u.device_class === busiest) ? " <span class=\"pill mark\">busiest</span>" : "";
      return "<tr><td>" + esc(u.device_class || "?") + mark + "</td>"
        + "<td>" + num(u.devices, rint, "not counted") + (idle ? " (" + rint(idle) + " never fire)" : "") + "</td>"
        + "<td>" + num(u.mean_occupancy, function (v) { return rpct(v, 2); }, "not measured") + "</td>"
        + "<td>" + num(u.max_occupancy, function (v) { return rpct(v, 2); }, "not measured") + "</td></tr>";
    }).join("");
    host.innerHTML = head + '<div class="panel2"><table class="rtable">'
      + "<tr><th>device</th><th>instances</th><th>mean</th><th>busiest</th></tr>" + body + "</table>"
      + '<p class="rnote">The mean is over EVERY instance of the class, idle ones included, so idle silicon stays visible. '
      + (slotDoc()
        ? "A weight macro fires on every tick whose slot holds weights, so its analog duty cycle IS the filled share of "
          + "its rotation: an idle tick is an empty slot, not a stall."
        : "A weight macro fires once per beat and waits out the rest of it, so a low analog duty cycle is the pipeline "
          + "working as designed, not a stall — and it is a different question from how full of weights that macro is.")
      + (busiestClass(c) ? " The busiest class on this point is <b>" + esc(busiestClass(c)) + "</b>"
        + (beatClass(c) && beatClass(c) !== busiestClass(c)
          ? ", which is NOT what sets its beat: that is " + esc(beatClass(c)) + "." : ".") : "")
      + "</p></div>";
  }

  // ---- the boundaries this point places -----------------------------------
  function rsRenderBounds() {
    var host = $("h-bounds"); if (!host) return;
    var c = selected(); if (!c) { host.innerHTML = ""; return; }
    var bs = Array.isArray(c.boundaries) ? c.boundaries : [];
    var head = '<h2 class="sect">Boundaries — what crosses between chiplets</h2>';
    if (!bs.length) {
      host.innerHTML = head + '<div class="panel2"><p class="rnote">'
        + (refusalStory(c)
          || ((c.placement && c.placement.analog_chips === 1)
            ? "This point places one analog chiplet, so nothing crosses a chip boundary at all."
            : "This point publishes no boundary table."))
        + "</p></div>";
      return;
    }
    // 620 handoffs of which 619 are the same handoff is one row and a count.
    var groups = collapse(bs, function (b) {
      return [b.role, b.bytes_per_unit, b.unit, b.required_time_s, b.crosses_link].join("|");
    });
    var anyCross = bs.some(function (b) { return b.crosses_link != null; });
    var shown = groups.slice(0, 40);
    var body = shown.map(function (g) {
      var b = g.rows[0], n = g.rows.length;
      var name = esc(b.boundary_id || "?")
        + (n > 1 ? ' <span class="rnote">and others like it</span>' : "");
      return '<tr><td class="mono">' + name + "</td><td>" + esc(b.role || "?") + "</td>"
        + "<td>" + num(b.bytes_per_unit, rbytes, "Not priced.") + "</td>"
        + "<td>" + esc(b.unit || "?") + "</td>"
        + "<td>" + num(b.required_time_s, rsSecs, "Not priced.") + "</td>"
        + (anyCross ? "<td>" + (b.crosses_link === true ? "crosses a link" : b.crosses_link === false ? "on one chip" : "") + "</td>" : "")
        + "<td>" + (n > 1 ? "× " + n : "") + "</td></tr>";
    }).join("");
    host.innerHTML = head + '<div class="panel2"><table class="rtable">'
      + "<tr><th>boundary</th><th>role</th><th>bytes</th><th>per</th><th>time</th>"
      + (anyCross ? "<th></th>" : "") + "<th>count</th></tr>" + body + "</table>"
      + (groups.length > shown.length ? '<p class="rnote">' + (groups.length - shown.length) + " further distinct boundaries are in the artifact.</p>" : "")
      + (groups.length < bs.length ? '<p class="rnote">' + rint(bs.length) + " boundaries in all; identical ones are drawn once.</p>" : "")
      + "</div>";
  }

  // ---- disclosures (D10) ---------------------------------------------------
  // The sweep's own list, the bound document's relaxations, and the SELECTED
  // point's own notes. Nothing else. The page used to merge every candidate's
  // disclosures and print ninety items, twenty-eight of them about the vector
  // lane count of machines the reader was not looking at.
  function discKey(x) {
    return typeof x === "string" ? x : [x.constraint || x.name, x.value, x.reason].join("|");
  }
  function discBlock(items) {
    return '<div class="disc2">' + items.map(function (x) {
      if (typeof x === "string") return '<div class="d"><p>' + esc(x) + "</p></div>";
      var name = x.constraint || x.name || x.key || "";
      var val = x.value == null ? "" : (typeof x.value === "string" ? x.value : JSON.stringify(x.value));
      return '<div class="d"><b>' + esc(name) + "</b>" + (val ? " — <em>" + esc(val) + "</em>" : "")
        + (x.reason ? "<p>" + esc(x.reason) + "</p>" : "") + "</div>";
    }).join("") + "</div>";
  }
  function rsRenderDisc() {
    var host = $("h-disc"); if (!host) return;
    var c = selected();
    // The sweep's own list REPEATS each candidate's derived-engine notes, so
    // merging it whole put twenty-eight statements about other machines'
    // vector-lane counts in front of a reader looking at one machine. An item
    // that belongs to some OTHER point and not to this one is another point's
    // content, and D33 keeps it off this page.
    var mine = {}, others = {};
    (c && c.disclosures || []).forEach(function (x) { mine[discKey(x)] = 1; });
    cands().forEach(function (x) {
      if (!c || x.id === c.id) return;
      (x.disclosures || []).forEach(function (y) {
        var k = discKey(y);
        if (!mine[k]) others[k] = 1;
      });
    });
    var seen = {}, items = [], sources = [], dropped = 0;
    function add(list, where, filter) {
      var n = 0;
      (list || []).forEach(function (x) {
        var k = discKey(x);
        if (seen[k]) return;
        if (filter && others[k]) { dropped++; return; }
        seen[k] = 1; items.push(x); n++;
      });
      if (n) sources.push(n + " from " + where);
    }
    if (RS.mapKind !== "none") add((S.doc || {}).relaxations, "the document bound to this point", false);
    add((RS.frontier || {}).disclosures, "the sweep", true);
    add(c ? c.disclosures : null, "point " + (c ? c.id : "?"), false);
    if (!items.length) { host.innerHTML = ""; return; }
    host.innerHTML = '<h2 class="sect">What this point does not account for — ' + items.length + " item(s)</h2>"
      + '<p class="rnote">' + esc(sources.join(" · ")) + ". No other point’s notes are merged in here"
      + (dropped ? "; " + dropped + " item(s) in the sweep’s own list belong to other points and are left with them" : "")
      + '.</p><details><summary class="rnote" style="cursor:pointer;margin-bottom:.5rem">show all</summary>'
      + discBlock(items) + "</details>";
  }

  // ==========================================================================
  // THE SLOT MAP (a document carrying `slots`, schema fws_slot/1).
  //
  // The macro rotates through its mux slots once per beat, so a slot index IS
  // a firing phase: where a weight sits and when it fires are ONE decision.
  // This section draws that decision three ways — the slots themselves, the
  // wavefront they make in time, and the ledgers the mapping is judged by.
  //
  // Every figure in the ledger strip is READ from slots.ledgers. The atlas
  // recounts them only to REFUSE: a map whose own checker failed, or one that
  // contradicts the law, draws nothing and prints what is wrong with it.
  // ==========================================================================
  function isInt(n) { return typeof n === "number" && isFinite(n) && Math.floor(n) === n; }
  function svgTag(w, h, body) {
    return '<svg class="slotsvg" width="' + Math.ceil(w) + '" height="' + Math.ceil(h) + '" viewBox="0 0 '
      + Math.ceil(w) + " " + Math.ceil(h) + '" role="img">' + body + "</svg>";
  }
  // Textures that are NOT hues: a free slot, a slot the mapping left behind and
  // the ragged tail of a slot-layer narrower than the ADC set it sits in.
  var SLOT_PATTERNS = null;
  function slotPatterns() {
    if (SLOT_PATTERNS == null) {
      SLOT_PATTERNS = '<defs>'
        + '<pattern id="sp-strand" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
        + '<rect width="5" height="5" class="sp-strandbg"/>'
        + '<line x1="0" y1="0" x2="0" y2="5" class="sp-strandline"/></pattern>'
        + '<pattern id="sp-ragged" width="4" height="4" patternUnits="userSpaceOnUse">'
        + '<rect width="4" height="4" class="sp-raggedbg"/>'
        + '<line x1="0" y1="4" x2="4" y2="0" class="sp-raggedline"/></pattern>'
        + "</defs>";
    }
    return SLOT_PATTERNS;
  }
  function slotsOf(doc) {
    var sl = doc && doc.slots;
    return (sl && typeof sl === "object" && !Array.isArray(sl) && sl.schema === "fws_slot/1") ? sl : null;
  }
  function slotDoc() { return slotsOf(S.doc); }
  function slotIndex(sl) {
    var ix = { macro: {}, chip: {}, bundle: {}, layers: [], blocks: [], fires: [] };
    (sl.chips || []).forEach(function (c) { ix.chip[c.id] = c; });
    (sl.macros || []).forEach(function (m) { ix.macro[m.id] = m; });
    (sl.bundles || []).forEach(function (b) {
      ix.bundle[b.id] = b;
      if (ix.layers.indexOf(b.layer) < 0) ix.layers.push(b.layer);
      if (ix.blocks.indexOf(b.block) < 0) ix.blocks.push(b.block);
    });
    ix.layers.sort(function (a, b) { return a - b; });
    ix.blocks.sort();
    (sl.macros || []).forEach(function (m) {
      (m.slots || []).forEach(function (e) { ix.fires.push({ macro: m.id, chip: m.chip, e: e }); });
    });
    ix.order = (sl.bundles || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    return ix;
  }
  function nsText(ns) {
    if (typeof ns !== "number" || !isFinite(ns)) return "—";
    if (ns === 0) return "0 ns";          // a zero keeps its unit: it is a tick, not "no figure"
    return rsSecs(ns * 1e-9);
  }
  function tipAttr(html) { return ' data-rstip="' + esc(encodeURIComponent(html)) + '"'; }
  // One slot-layer, described once. The slot map and the wavefront draw the
  // same cell, so they must not tell the reader two different things about it.
  // Waste is stated in both units the page uses: columns of the ADC set left
  // unfilled, and the cells behind them, which is what the ledger counts.
  function slotCellTip(sl, ix, macroId, e) {
    var P = sl.platform, b = ix.bundle[e.bundle] || {};
    var shortBy = P.z - e.columns.count;
    return '<div class="t">' + esc(e.bundle) + " · " + esc(e.block) + "</div>"
      + "layer " + e.layer
      + ((b.k_blocks || 1) > 1 ? " · k-block " + e.kblock : "")
      + " · columns " + rint(e.columns.start) + "–" + rint(e.columns.start + e.columns.count - 1)
      + " of " + rint(b.columns == null ? e.columns.count : b.columns)
      + (shortBy > 0 ? " · " + plural(shortBy, "column") + " short of the " + rint(P.z) + " ADCs, "
        + rint(shortBy * P.rows) + " cells wasted" : "")
      + '<div class="b">' + esc(macroId) + " slot " + e.slot + " · fires at tick " + e.tick
      + " (phase " + (e.tick % P.mux) + ") · " + nsText(e.tick * P.tick_ns) + " into the token</div>";
  }

  // ---- the three pictures --------------------------------------------------
  function drawSlotGrid(sl, ix) {
    var P = sl.platform, mux = P.mux, z = P.z;
    var nMac = sl.macros.length;
    var cw = nMac > 42 ? 10 : nMac > 24 ? 14 : nMac > 12 ? 19 : nMac > 6 ? 26 : 34;
    var ch = Math.max(3.2, Math.min(cw, 430 / mux));
    // One cell is cw wide and cellH tall. When it is shorter than the 8 px
    // hatch lattice the grid draws its own scaled copy, so every cell of a
    // bundle wears the same hatch instead of every other one.
    var cellH = Math.max(2, ch - (ch > 6 ? 1 : 0.5));
    var HS = cellH < 8 ? "g" : "";
    var gapM = 2, padC = 7, gapC = 20, AX = 52, TOP = 42, BOT = nMac > 24 ? 40 : 30;
    var x = AX, boxes = [], px = {};
    sl.chips.forEach(function (c) {
      var ms = c.macros || [];
      var w = ms.length * cw + Math.max(0, ms.length - 1) * gapM + 2 * padC;
      boxes.push({ c: c, x: x, w: w });
      ms.forEach(function (mid, i) { px[mid] = x + padC + i * (cw + gapM); });
      x += w + gapC;
    });
    var W = Math.max(320, x - gapC + 12), H = TOP + mux * ch + BOT;
    var p = [hatchDefs(HS, cellH / 8), slotPatterns()];
    // slot axis: the index IS the phase
    p.push('<text x="4" y="' + (TOP - 20) + '" class="sg-ax">slot</text>');
    p.push('<text x="4" y="' + (TOP - 8) + '" class="sg-ax2">= phase</text>');
    var step = Math.max(1, Math.ceil(mux / 16));
    for (var s = 0; s < mux; s += step) {
      p.push('<text x="' + (AX - 7) + '" y="' + (TOP + s * ch + Math.min(ch, 9)) + '" text-anchor="end" class="sg-ax2">' + s + "</text>");
    }
    boxes.forEach(function (bx) {
      var c = bx.c;
      var used = 0, strand = 0;
      (c.macros || []).forEach(function (mid) {
        var m = ix.macro[mid];
        if (!m) return;
        used += (m.slots || []).length;
        strand += (m.stranded_slots || []).length;
      });
      var cap = (c.macros || []).length * mux;
      p.push('<rect x="' + (bx.x - 3) + '" y="' + (TOP - 4) + '" width="' + (bx.w + 6) + '" height="' + (mux * ch + 8)
        + '" rx="4" class="sg-chip"/>');
      p.push('<text x="' + bx.x + '" y="' + (TOP - 22) + '" class="sg-chipname">' + esc(c.id) + "</text>");
      p.push('<text x="' + bx.x + '" y="' + (TOP - 10) + '" class="sg-ax2">' + used + " of " + cap + " slots"
        + (strand ? " · " + strand + " stranded" : "") + "</text>");
      (c.macros || []).forEach(function (mid) {
        var m = ix.macro[mid];
        if (!m) return;
        var mx = px[mid];
        var occ = {};
        (m.slots || []).forEach(function (e) { occ[e.slot] = e; });
        var strandSet = {};
        (m.stranded_slots || []).forEach(function (s2) { strandSet[s2] = 1; });
        for (var s2 = 0; s2 < mux; s2++) {
          var y = TOP + s2 * ch, hgt = cellH;
          var e = occ[s2];
          if (e) {
            var hue = layerHue(e.layer) || "#5f7280";
            var frac = Math.max(0.12, Math.min(1, (e.columns && e.columns.count ? e.columns.count : z) / z));
            var tip = slotCellTip(sl, ix, mid, e);
            p.push('<g data-sbundle="' + esc(e.bundle) + '"' + tipAttr(tip) + ">"
              + '<rect class="cell" x="' + mx + '" y="' + y + '" width="' + (cw * frac).toFixed(2) + '" height="' + hgt
              + '" fill="' + hue + '"/>'
              + (hatchFor(e.block, HS) ? '<rect x="' + mx + '" y="' + y + '" width="' + (cw * frac).toFixed(2) + '" height="' + hgt
                + '" fill="' + hatchFor(e.block, HS) + '"/>' : "")
              + (frac < 1 ? '<rect x="' + (mx + cw * frac).toFixed(2) + '" y="' + y + '" width="' + (cw * (1 - frac)).toFixed(2)
                + '" height="' + hgt + '" class="sg-ragged"/>' : "")
              + "</g>");
          } else {
            var strandCell = !!strandSet[s2];
            var tip2 = strandCell
              ? '<div class="t">stranded slot</div>' + esc(mid) + " slot " + s2
                + '<div class="b">the next bundle did not fit this chip, so it moved whole and left this slot behind. '
                + "Its cells are counted as waste.</div>"
              : '<div class="t">free slot</div>' + esc(mid) + " slot " + s2
                + '<div class="b">the rotation reaches it and nothing fires: capacity this map did not need.</div>';
            p.push('<g' + tipAttr(tip2) + '><rect x="' + mx + '" y="' + y + '" width="' + cw + '" height="' + hgt
              + '" class="' + (strandCell ? "sg-strand" : "sg-free") + '"/></g>');
          }
        }
        var label = String(mid).split(".").pop();
        if (cw >= 16) {
          p.push('<text x="' + (mx + cw / 2) + '" y="' + (TOP + mux * ch + 13) + '" text-anchor="middle" class="sg-ax2">' + esc(label) + "</text>");
        } else {
          p.push('<text x="' + (mx + cw / 2 + 3) + '" y="' + (TOP + mux * ch + 6) + '" class="sg-ax2" transform="rotate(90 '
            + (mx + cw / 2 + 3) + " " + (TOP + mux * ch + 6) + ')">' + esc(label) + "</text>");
        }
      });
    });
    return svgTag(W, H, p.join(""));
  }

  function drawSlotWave(sl, ix) {
    var P = sl.platform, led = sl.ledgers || {}, mux = P.mux;
    var L = isInt(led.L_ticks) ? led.L_ticks : 1;
    var beat = P.beat_ticks;
    var span = L + beat;                        // token 1 is drawn to its own end
    var nMac = sl.macros.length;
    // 84 + 920 + 116 = 1120, which is inside the panel a desktop reader gets,
    // so a wide point does not hand them a 19 px scrub with nothing in it.
    var LFT = 84, RGT = 116, TOPW = 88, BOTW = 58;
    var tw = Math.max(1.6, Math.min(span < 48 ? 26 : 13, 920 / span));
    var rh = Math.max(4.5, Math.min(13, 320 / nMac));
    var chipGap = 7;
    var rowY = {}, y = TOPW, chipRows = [];
    sl.chips.forEach(function (c) {
      var y0 = y;
      (c.macros || []).forEach(function (mid) { rowY[mid] = y; y += rh; });
      chipRows.push({ c: c, y0: y0, y1: y });
      y += chipGap;
    });
    var H = y - chipGap + BOTW, W = LFT + span * tw + RGT;
    function X(t) { return LFT + t * tw; }
    var p = [hatchDefs(), slotPatterns()];
    // beat rules: one full rotation each
    var nBeats = Math.ceil(span / beat);
    var lab = Math.max(1, Math.ceil(nBeats / 10));
    for (var k = 0; k <= nBeats; k++) {
      var bx = X(k * beat);
      if (bx > W - RGT + 2) break;
      p.push('<line x1="' + bx + '" y1="' + (TOPW - 16) + '" x2="' + bx + '" y2="' + (y - chipGap) + '" class="sw-beat"/>');
      if (k < nBeats && k % lab === 0) {
        p.push('<text x="' + (bx + 3) + '" y="' + (TOPW - 18) + '" class="sw-beatlab">beat ' + (k + 1) + "</text>");
      }
    }
    // seams and hop gaps, in chain order
    var prev = null;
    ix.order.forEach(function (b) {
      if (prev) {
        var a = prev.end_tick + 1, bb = b.start_tick;
        if (bb > a) {
          var w = (bb - a) * tw;
          p.push('<rect x="' + X(a) + '" y="' + (TOPW - 6) + '" width="' + w + '" height="' + (y - chipGap - TOPW + 6)
            + '" class="' + (b.seam_before ? "sw-seam" : "sw-hop") + '"' + tipAttr(
              '<div class="t">' + (b.seam_before ? "chip crossing" : "hop") + '</div>'
              + esc(prev.id) + " ends at tick " + prev.end_tick + ", " + esc(b.id) + " starts at tick " + b.start_tick
              + '<div class="b">' + (b.seam_before
                ? "the next bundle sits on another chip: " + P.seam_ticks + " ticks (" + nsText(P.seam_ns) + ") on top of the "
                  + P.hop_gap_ticks + "-tick hop"
                : P.hop_gap_ticks + " ticks: one to finish converting, one for the wire and the reduce")
              + "</div>") + "/>");
          if (b.seam_before && w > 54) {
            p.push('<text x="' + (X(a) + w / 2) + '" y="' + (TOPW + 10) + '" text-anchor="middle" class="sw-seamlab">seam · '
              + nsText(P.seam_ns) + "</text>");
          }
        }
      }
      prev = b;
    });
    // chip bands and macro labels
    chipRows.forEach(function (r) {
      p.push('<line x1="' + (LFT - 74) + '" y1="' + (r.y0 - 3) + '" x2="' + (W - RGT + 6) + '" y2="' + (r.y0 - 3) + '" class="sw-chiprule"/>');
      p.push('<text x="2" y="' + (r.y0 + Math.min(11, rh)) + '" class="sw-chipname">' + esc(r.c.id) + "</text>");
      (r.c.macros || []).forEach(function (mid) {
        if (rh >= 9) {
          p.push('<text x="' + (LFT - 6) + '" y="' + (rowY[mid] + rh - 2) + '" text-anchor="end" class="sg-ax2">'
            + esc(String(mid).split(".").pop()) + "</text>");
        }
      });
    });
    // the firings: token 0, then token 1 one beat later
    var mw = Math.max(1.6, Math.min(9, tw * 0.62));
    ix.fires.forEach(function (f) {
      var e = f.e;
      var hue = layerHue(e.layer) || "#5f7280";
      var yy = rowY[f.macro];
      if (yy == null) return;
      var tip = slotCellTip(sl, ix, f.macro, e);
      p.push('<g data-sbundle="' + esc(e.bundle) + '"' + tipAttr(tip) + ">"
        + '<rect class="cell" x="' + X(e.tick).toFixed(2) + '" y="' + (yy + 0.6).toFixed(2) + '" width="' + mw.toFixed(2)
        + '" height="' + Math.max(2, rh - 1.6).toFixed(2) + '" fill="' + hue + '"/>'
        + '<rect class="sw-ghost" x="' + X(e.tick + beat).toFixed(2) + '" y="' + (yy + 0.6).toFixed(2) + '" width="' + mw.toFixed(2)
        + '" height="' + Math.max(2, rh - 1.6).toFixed(2) + '" fill="' + hue + '"/>'
        + "</g>");
    });
    // bundle brackets, in chain order, packed so no two labels collide
    var brkRow = [-1e9, -1e9, -1e9];
    ix.order.forEach(function (b, i) {
      var x0 = X(b.start_tick), x1 = X(b.end_tick) + mw;
      var wLab = (b.id.length + b.block.length + 1) * 5.6 + 8;
      var r = 0;
      while (r < brkRow.length - 1 && brkRow[r] > x0 - 4) r++;
      brkRow[r] = Math.max(x1, x0 + wLab);
      var by = 20 + r * 16;
      p.push('<g data-sbundle="' + esc(b.id) + '"' + tipAttr(slotBundleTip(b, sl)) + ">"
        + '<path d="M' + x0.toFixed(2) + " " + (by + 7) + "L" + x0.toFixed(2) + " " + by + "L" + x1.toFixed(2) + " " + by
        + "L" + x1.toFixed(2) + " " + (by + 7) + '" class="sw-brk"/>'
        + '<text x="' + (x0 + 2).toFixed(2) + '" y="' + (by - 3) + '" class="sw-brklab">' + esc(b.id) + " " + esc(b.block)
          + "</text></g>");
    });
    // L and D in the margin
    var lx = X(L);
    var lTxt = "L = " + rint(L) + " ticks · " + nsText(led.L_ns);
    var dTxt = rint(led.D) + " sequence" + (led.D === 1 ? "" : "s") + " in flight";
    // The rule sits one beat from the plot's end, so the label beside it can be
    // wider than the margin left for it. Measure it in the 10 px face the two
    // classes use, and hang it on the other side of the rule rather than off
    // the panel.
    var labW = Math.max(lTxt.length, dTxt.length) * 5.8 + 8;
    var labRight = lx + 6 + labW <= W - 4;
    var labX = labRight ? lx + 6 : lx - 6;
    var labA = labRight ? "" : ' text-anchor="end"';
    p.push('<line x1="' + lx + '" y1="' + (TOPW - 14) + '" x2="' + lx + '" y2="' + (y - chipGap + 6) + '" class="sw-L"/>');
    p.push('<text x="' + labX + '" y="' + (y - chipGap + 4) + '"' + labA + ' class="sw-Llab">' + lTxt + "</text>");
    p.push('<text x="' + labX + '" y="' + (y - chipGap + 18) + '"' + labA + ' class="sw-Llab2">' + dTxt + "</text>");
    // tick axis, in ticks and in ns
    var ax = y - chipGap + 20;
    var tstep = beat;
    while (span / tstep > 12) tstep *= 2;
    while (tstep > 1 && span / tstep < 5) tstep = Math.max(1, Math.round(tstep / 2));
    for (var t = 0; t <= span; t += tstep) {
      p.push('<line x1="' + X(t) + '" y1="' + ax + '" x2="' + X(t) + '" y2="' + (ax + 4) + '" class="sw-tick"/>');
      p.push('<text x="' + X(t) + '" y="' + (ax + 15) + '" text-anchor="middle" class="sg-ax2">' + t + "</text>");
      p.push('<text x="' + X(t) + '" y="' + (ax + 26) + '" text-anchor="middle" class="sw-ns">' + rint(t * P.tick_ns) + " ns</text>");
    }
    p.push('<text x="2" y="' + (ax + 15) + '" class="sg-ax">tick</text>');
    return svgTag(W, H, p.join(""));
  }

  function slotBundleTip(b, sl) {
    var P = sl.platform;
    return '<div class="t">' + esc(b.id) + " · " + esc(b.block) + " · layer " + b.layer + "</div>"
      + rint(b.columns) + " columns"
      + (b.k_blocks > 1 ? " in " + b.k_blocks + " k-blocks whose partials reduce" : "")
      + " · " + plural(b.slot_layers, "slot-layer") + " on " + esc(b.chip)
      + (b.ragged_columns ? " · " + plural(b.ragged_columns, "ragged column") : "")
      + '<div class="b">fires at ticks ' + b.start_tick + "–" + b.end_tick + " (" + plural(b.serial_ticks, "tick")
      + (b.stall_ticks ? ", started " + plural(b.stall_ticks, "tick") + " after the hop allowed it" : "") + ")"
      + (b.seam_before ? " · reached across a chip crossing, " + nsText(P.seam_ns) : "") + "</div>";
  }

  // A count and its noun. One chip is a chip, not "1 chips".
  function plural(n, one, many) { return rint(n) + " " + (Number(n) === 1 ? one : (many || one + "s")); }

  // ---- the ledger strip: every figure read from slots.ledgers --------------
  function slotLedger(sl) {
    var P = sl.platform, g = sl.ledgers || {};
    var tiles = [];
    function tile(v, k, b, cls) {
      tiles.push('<div class="t' + (cls ? " " + cls : "") + '"><div class="v">' + v + '</div><div class="k">' + esc(k) + "</div>"
        + (b ? '<div class="b">' + b + "</div>" : "") + "</div>");
    }
    tile(nsText(g.beat_ns), "beat", "mux " + rint(P.mux) + " × " + rint(P.tick_ns) + " ns · the platform sets it");
    tile(rint(g.throughput_tokens_per_s) + " <span class=\"u\">tokens/s</span>", "throughput", "one token per beat");
    tile(rint(g.L_ticks) + " <span class=\"u\">ticks</span>", "chain latency",
      nsText(g.L_ns) + " · floor " + rint(g.L_min_ticks) + " ticks");
    tile(rint(g.D), "sequences in flight", "floor " + rint(g.D_min) + " · chain latency over the beat");
    tile(rint(g.per_user_tokens_per_s) + " <span class=\"u\">tokens/s</span>", "per user", "one over the chain latency");
    var split = (g.cells_ragged != null || g.cells_stranded != null)
      ? rint(g.cells_ragged || 0) + " ragged + " + rint(g.cells_stranded || 0) + " stranded, of "
        + rint(g.cells_total) + " cells"
      : rint(g.cells_wasted) + " of " + rint(g.cells_total) + " cells";
    tile(rpct(g.waste_frac, 1), "cell waste",
      split + " · floor " + (g.waste_min == null ? "0" : rpct(g.waste_min, 1)),
      g.waste_frac > 0 ? "warn" : "");
    tile(rint(g.slots_used) + " <span class=\"u\">of " + rint(g.slots_total) + "</span>", "slots filled",
      rint(g.slots_stranded) + " stranded · " + rint(g.slots_total - g.slots_used - g.slots_stranded) + " free");
    tile(rint(g.seams), "chip crossings",
      (g.seams ? nsText(P.seam_ns) + " each" : "the chain never leaves its chiplet") + " · "
      + (g.seams_min == null ? "the floor is what the capacity forces" : "floor " + rint(g.seams_min)));
    tile(rint(g.stall_ticks) + " <span class=\"u\">ticks</span>", "stalls", "a bundle waiting for a free phase · floor 0");
    tile(rint(g.macros_used) + " <span class=\"u\">macros</span>", "machine",
      plural(g.chips_used, "chiplet") + " × " + plural(P.chip_macros, "macro"));
    tile(rmm2(g.analog_area_mm2) + " <span class=\"u\">mm²</span>", "analog silicon",
      rint(g.macros_used) + " × " + rmm2(P.macro_area_mm2) + " mm²");
    return '<div class="sled">' + tiles.join("") + "</div>";
  }

  // ---- the chain, as a row of bundles you can click ------------------------
  function slotChain(sl, ix) {
    var items = ix.order.map(function (b) {
      var hue = layerHue(b.layer) || "#5f7280";
      var hf = hatchFor(b.block);
      return '<button class="bchip" data-sbtn="' + esc(b.id) + '" aria-pressed="' + (RS.slotSel === b.id) + '"'
        + tipAttr(slotBundleTip(b, sl)) + '>'
        + '<svg width="12" height="12">' + hatchDefs()
        + '<rect width="12" height="12" fill="' + hue + '"/>'
        + (hf ? '<rect width="12" height="12" fill="' + hf + '"/>' : "") + "</svg>"
        + '<span class="nm">' + esc(b.id) + "</span> " + esc(b.block)
        + '<span class="sub">' + rint(b.columns) + " cols · " + plural(b.slot_layers, "slot") + "</span></button>";
    });
    var out = [];
    ix.order.forEach(function (b, i) {
      if (i) {
        out.push(b.seam_before
          ? '<span class="arrow seam" title="the next bundle sits on another chip">&rarr; seam '
            + nsText(sl.platform.seam_ns) + " &rarr;</span>"
          : '<span class="arrow">&rarr;</span>');
      }
      out.push(items[i]);
    });
    return '<div class="bchain">' + out.join("") + "</div>";
  }

  // ---- the legend ----------------------------------------------------------
  function slotLegend(sl, ix) {
    var out = [];
    var layers = ix.layers.map(function (L) {
      return '<span class="blk"><svg width="14" height="14"><rect width="14" height="14" fill="' + (layerHue(L) || "#5f7280")
        + '"/></svg>layer ' + L + "</span>";
    }).join("");
    // The swatch is drawn the way a cell is drawn — the layer hue under the
    // block's hatch — or the hatch would vanish on whatever the legend's own
    // background happens to be.
    var base = layerHue(ix.layers[0]) || "#5f7280";
    var blocks = ix.blocks.map(function (b) {
      var hf = hatchFor(b);
      var plain = !hf || hf === "url(#hx0)";
      return '<span class="blk"><svg width="14" height="14">' + hatchDefs()
        + '<rect width="14" height="14" fill="' + base + '"/>'
        + (hf ? '<rect width="14" height="14" fill="' + hf + '"/>' : "") + "</svg>" + esc(b)
        + (plain ? " (no hatch)" : "") + "</span>";
    }).join("");
    var states = '<span class="blk"><svg width="14" height="14">' + slotPatterns()
      + '<rect width="14" height="14" class="sg-free"/></svg>free</span>'
      + '<span class="blk"><svg width="14" height="14">' + slotPatterns()
      + '<rect width="14" height="14" class="sg-strand"/></svg>stranded</span>'
      + '<span class="blk"><svg width="14" height="14">' + slotPatterns()
      + '<rect width="14" height="14" class="sg-ragged"/></svg>ragged columns</span>';
    var marks = '<span class="blk"><svg width="24" height="14"><rect x="2" y="1" width="5" height="12" fill="'
      + (layerHue(ix.layers[0]) || "#5f7280") + '"/></svg>token 0</span>'
      + '<span class="blk"><svg width="24" height="14"><rect x="2" y="1" width="5" height="12" fill="'
      + (layerHue(ix.layers[0]) || "#5f7280") + '" opacity=".32"/></svg>token 1, one beat later</span>';
    out.push('<div class="legband"><div><div class="lb">colour = layer</div>' + layers + "</div>"
      + '<div><div class="lb">hatch = weight block</div>' + blocks + "</div>"
      + '<div><div class="lb">slot state</div>' + states + "</div>"
      + '<div><div class="lb">firing</div>' + marks + "</div></div>");
    return out.join("");
  }

  // ---- selection: one bundle, highlighted in every picture ------------------
  function slotPaint() {
    var root = $("h-slotsec");
    if (!root) return;
    var sel = RS.slotSel;
    Array.prototype.forEach.call(root.querySelectorAll("[data-sbundle]"), function (n) {
      var on = !sel || n.getAttribute("data-sbundle") === sel;
      if (n.classList) { n.classList.toggle("s-dim", !on); n.classList.toggle("s-hot", !!sel && on); }
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-sbtn]"), function (n) {
      n.setAttribute("aria-pressed", String(n.getAttribute("data-sbtn") === sel));
    });
    var note = $("h-slotpick");
    if (note) {
      var b = sel ? (slotDoc() ? slotIndex(slotDoc()).bundle[sel] : null) : null;
      note.innerHTML = b
        ? "Following <b>" + esc(b.id) + "</b> — " + esc(b.block) + ", layer " + b.layer + ", " + rint(b.columns)
          + " columns on " + esc(b.chip) + ". Click it again to follow the whole chain."
        : "Click any bundle — in the chain, the slot map or the wavefront — to follow it through all three.";
    }
  }
  function slotPick(id) {
    RS.slotSel = (RS.slotSel === id) ? null : id;
    slotPaint();
  }
  function wireSlots() {
    var root = $("h-slotsec");
    if (!root) return;
    Array.prototype.forEach.call(root.querySelectorAll("[data-rstip]"), function (n) {
      rsHover(n, function () { return decodeURIComponent(n.getAttribute("data-rstip")); });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-sbundle]"), function (n) {
      n.style.cursor = "pointer";
      n.addEventListener("click", function (ev) { ev.stopPropagation(); slotPick(n.getAttribute("data-sbundle")); });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-sbtn]"), function (n) {
      n.addEventListener("click", function (ev) { ev.stopPropagation(); slotPick(n.getAttribute("data-sbtn")); });
    });
    slotPaint();
  }

  // ---- the section ---------------------------------------------------------
  function renderSlotSection(host, c, sl) {
    var head = '<h2 class="sect">The slot map of point ' + esc(c.id) + "</h2>";
    var res = A.validateSlots(S.doc);
    var check = sl.check || {};
    if (check.ok === false || res.errors.length) {
      var rows = [];
      (check.violations || []).forEach(function (v) {
        rows.push("<tr><td>the mapping's own checker</td><td>" + esc(typeof v === "string" ? v : JSON.stringify(v)) + "</td></tr>");
      });
      res.errors.forEach(function (e) {
        rows.push("<tr><td>" + esc(e.rule) + " <span class=\"mono\">" + esc(e.field) + "</span></td><td>" + esc(e.message) + "</td></tr>");
      });
      host.innerHTML = head + '<div class="refuse ui"><h2>This map is not drawn</h2>'
        + "<p>A slot map is a schedule. This one contradicts itself, so nothing below it would be a picture of a "
        + "machine that can run.</p><table><tr><th>where</th><th>what is wrong</th></tr>" + rows.join("") + "</table></div>";
      return;
    }
    var ix = slotIndex(sl);
    var P = sl.platform, g = sl.ledgers || {};
    if (RS.slotSel && !ix.bundle[RS.slotSel]) RS.slotSel = null;
    var lead = "Each macro of this platform rotates through its " + rint(P.mux) + " slots once per beat, so a slot index "
      + "is a firing phase: a slot-layer in slot j fires on every tick that is j modulo " + rint(P.mux) + ". Where a weight "
      + "sits and when it fires are one decision. Colour is the layer, hatch is the weight block.";
    var warn = res.warnings.length
      ? '<p class="why"><b>The atlas counted the slots and got a different figure.</b> The numbers below stay the '
        + "mapping's own; the differences are: "
        + res.warnings.map(function (w) { return esc(w.field.replace("slots.ledgers.", "") + " — " + w.message); }).join("; ")
        + ".</p>"
      : "";
    var oneBeat = isInt(g.L_ticks) && isInt(P.beat_ticks) && g.L_ticks < P.beat_ticks
      ? '<p class="rnote">The whole chain finishes inside one beat, so one sequence is in flight and the beat — not the '
        + "chain — sets what a single user sees.</p>"
      : "";
    host.innerHTML = head
      + '<p class="rnote">' + esc(lead) + "</p>"
      + '<p class="rnote"><b>bound document:</b> <span class="mono">' + esc(S.source) + "</span> — " + esc(S.provenance)
      + "<br><b>platform:</b> " + esc(P.label) + " — " + rint(P.rows) + " rows × " + rint(P.y) + " columns behind "
      + rint(P.z) + " ADCs, " + rint(P.chip_macros) + " macros per chip, one ADC firing every " + rint(P.tick_ns) + " ns.</p>"
      + '<div id="h-slotsec">'
      + '<div id="h-slotchain">' + slotChain(sl, ix) + "</div>"
      + '<p class="rnote" id="h-slotpick"></p>'
      + '<div class="slotwrap"><div class="cap">The slot map — chips left to right, macros as columns, slot 0 on top. '
      + "A filled cell is a slot-layer: " + rint(P.z) + " columns of one bundle, " + rint(P.rows)
      + ' rows deep.</div><div class="slotscroll" id="h-slotgrid">' + drawSlotGrid(sl, ix) + "</div></div>"
      + '<div class="slotwrap"><div class="cap">The wavefront — every firing of token 0, and the same firings for token 1 '
      + "one beat later. The rotation overlaps: that overlap is the throughput.</div>"
      + '<div class="slotscroll" id="h-slotwave">' + drawSlotWave(sl, ix) + "</div></div>"
      + '<div id="h-slotledger">' + slotLedger(sl) + "</div>"
      + oneBeat + warn
      + '<div id="h-slotlegend">' + slotLegend(sl, ix) + "</div>"
      + "</div>";
    wireSlots();
  }

  // ---- THE PIPELINE MAP of the SELECTED point -----------------------------
  // Three sources, in this order, and never a fourth:
  //   1. the point's OWN fws_atlas/1 document (report.atlas_points), fetched
  //      lazily when the reader selects the point;
  //   2. the sibling <model>.json, but ONLY when its enumerated placement is
  //      this point's placement — otherwise it is another point's machine;
  //   3. the sweep's compact per-stage rows, drawn as a schematic.
  // With none of the three the panel states the absence for THIS point and
  // names the command that emits the missing document.
  function bindMap() {
    var c = selected();
    S.opened = null;
    if (!c) { adopt(null, "", ""); RS.mapKind = "none"; RS.stageRows = null; RS.stageBasis = ""; return; }
    if (RS.point && RS.pointFor === c.id) {
      adopt(RS.point, (c.atlas_point || "points/" + c.id + ".json"),
        "the sweep exported this document for point " + c.id + " at its own knobs");
      RS.mapKind = "point";
    } else if (RS.sibling && boundToCandidate(RS.sibling, c)) {
      adopt(RS.sibling, urlSibling(RS.id),
        "matched to point " + c.id + " by its enumerated placement: "
        + (c.placement || {}).analog_chips + " analog chiplets, " + (c.placement || {}).shared_digital_chiplets
        + " digital, " + (c.placement || {}).tiles + " placed tiles, " + (c.placement || {}).analog_macro_slots + " macro slots");
      RS.mapKind = "matched";
    } else {
      adopt(null, "", "");
      RS.mapKind = "none";
    }
    // A document carrying a slot map is drawn as one: the placement IS the
    // schedule, and no stage plan stands between them.
    if (RS.mapKind !== "none" && slotsOf(S.doc)) RS.mapKind = "slots";
    // the stage plan that the map is drawn in
    var pipe = c.pipeline || {};
    if (Array.isArray(pipe.stages) && pipe.stages.length) {
      RS.stageRows = pipe.stages;
      RS.stageBasis = clean(String(pipe.stages_basis || "the sweep's own per-stage rows for this point"));
    } else {
      var rep = (((RS.report || {}).evaluation || {}).pipeline || {}).stages;
      var n = stageCount(c);
      if (RS.mapKind !== "none" && Array.isArray(rep) && n && rep.length === n) {
        // Accepted only because it describes the same number of stages as this
        // point does, on a document that IS this point's machine. A stage plan
        // of a different length would be a different partition of the model.
        RS.stageRows = rep;
        RS.stageBasis = "the stage plan comes from " + urlReport(RS.id) + ", accepted for this point because it "
          + "lists exactly the " + n + " stages this point measures on the machine bound above";
      } else {
        RS.stageRows = null;
        RS.stageBasis = "";
      }
    }
  }
  function renderPipelineSection() {
    var host = $("h-pipesec"); if (!host) return;
    var c = selected(), w = workload();
    var head = '<h2 class="sect">The map of point ' + (c ? esc(c.id) : "?") + "</h2>";
    if (!c) { host.innerHTML = ""; return; }
    var sl = slotDoc();
    if (sl) { renderSlotSection(host, c, sl); return; }
    var lead;
    if (RS.stageRows && RS.stageRows.length) {
      lead = "Each segment below is one pipeline stage. Colour is the layer number, hatch is the weight block, "
        + "width is the weight columns the stage holds."
        + (RS.mapKind === "none" ? " No spatial document is bound to this point, so this is the sweep’s own stage census and there is nothing to open under it."
          : " Click a chiplet to open it; click one layer band to open that block’s tiles.");
    } else if (RS.mapKind !== "none") {
      lead = w.lockstep
        ? "This point is lowered under the lockstep regime: one batch steps through the whole model rather than "
          + "streams rotating through stages, so it has no stage plan. The chiplets are drawn as a package."
        : "This point publishes no stage plan, so the chiplets are drawn as a package rather than in pipeline order.";
    } else {
      lead = "";
    }
    var bodyId = '<div id="h-bar"></div><div id="h-crumbs"></div>'
      + '<div class="body"><div class="canvas" id="h-canvas"></div>'
      + '<div class="rail"><div class="panel" id="h-legend"></div><div class="panel card" id="h-card"></div></div></div>';
    if (RS.mapKind !== "none") {
      host.innerHTML = head
        + '<p class="rnote">' + esc(lead) + "</p>"
        + '<p class="rnote"><b>bound document:</b> <span class="mono">' + esc(S.source) + "</span> — " + esc(S.provenance)
        + (RS.stageBasis ? "<br><b>stage plan:</b> " + esc(plain(RS.stageBasis, 2)) : "") + "</p>"
        + bodyId;
      render();
      return;
    }
    // No spatial document bound. There are exactly three ways to get here and
    // each one is a SENTENCE, not a paragraph: the point was refused before it
    // was ever placed, the document this run should have written is missing, or
    // the document that came back was not this point's. The sweep now writes a
    // map for every candidate it can build, so none of these is the normal case
    // and none of them earns an emit-command lecture.
    var schematic = RS.stageRows ? drawStageSchematic(RS.stageRows) : null;
    var note;
    if (!c.ok) {
      note = refusalStory(c);
    } else if (RS.pointRefusal && RS.pointRefusal.cand === c.id) {
      note = "The document at <span class=\"mono\">" + esc(RS.pointRefusal.url)
        + "</span> is not this point’s machine — " + esc(RS.pointRefusal.why) + " — so it is not drawn as one.";
    } else if (RS.mapMissing && RS.mapMissing.cand === c.id) {
      note = "The map of this point is missing from this run’s output ("
        + '<span class="mono">' + esc(RS.mapMissing.url) + "</span>, " + esc(RS.mapMissing.why) + ").";
    } else if (c.atlas_point) {
      note = "The map of this point is still loading.";
    } else {
      note = "This run wrote no map for this point.";
    }
    host.innerHTML = head
      + (schematic
        ? '<p class="rnote">' + esc(lead) + '</p><div class="panel2">' + schematic
          + '<p class="rnote">' + esc(plain(RS.stageBasis, 2)) + "</p></div>"
        : "")
      + '<p class="rnote" style="margin-top:.7rem">' + note + "</p>"
      + '<p class="rnote"><label class="file" for="b-file2">Open an fws_atlas/1 document…</label>'
      + '<input type="file" id="b-file2" accept=".json,application/json"> '
      + "a file opened by hand describes whatever you opened, not this point.</p>";
    var f2 = $("b-file2");
    if (f2) f2.addEventListener("change", function () { if (f2.files && f2.files[0]) readFile(f2.files[0]); });
  }

  // A REFUSED POINT IS A RESULT, not an absence. Every panel that finds no data
  // on an ok:false candidate says why the machine does not exist rather than
  // reporting that a number is missing: the sweep priced it, the area budget
  // refused it, and that message IS the point's story.
  function refusalStory(c) {
    if (!c || c.ok) return null;
    return "This point was refused at stage <b>" + esc(String(c.fail_stage || "?")) + "</b>: "
      + esc(plain(c.fail_message, 2) || "the sweep gives no message.");
  }

  // ---- selection: EVERY candidate-dependent panel rebinds (D6) ------------
  function rsRenderAll() {
    rsRenderModels(); rsRenderHeader();
    // The map binds FIRST: the hardware cards and the disclosure list read the
    // document bound to this point, and a panel drawn before the binding would
    // report an absence the page had not looked for yet.
    bindMap();
    rsRenderAlerts();
    rsRenderFrontier();
