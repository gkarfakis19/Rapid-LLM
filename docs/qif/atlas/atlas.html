<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FWS-CIM System Atlas</title>
<style>
:root{
  --ink:#1c2a33; --muted:#5f7280; --faint:#8497a2; --accent:#176778;
  --line:#dde5e9; --bg:#f7f9fa; --card:#ffffff; --code:#eef2f4;
  --notice-bg:#f4f1e8; --notice-rule:#6b5a2a;
  --refuse-bg:#f6ecea; --refuse-rule:#7a2e2e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Georgia,"Times New Roman",serif}
.ui{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
main{max-width:74rem;margin:0 auto;padding:1.6rem 1.1rem 4rem}

header.top{border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:1rem}
.pid{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-size:1.65rem;line-height:1.2;margin:.3rem 0 .25rem;text-wrap:balance}
.sub{color:var(--muted);font-style:italic;margin:0 0 .6rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;font:11px/1 "Segoe UI",system-ui,sans-serif}
.pill{display:inline-block;letter-spacing:.06em;text-transform:uppercase;padding:.42em .62em;border-radius:999px;background:var(--code);color:var(--muted);font-weight:600}
.pill.on{background:#e4eef0;color:var(--accent)}
.pill.mark{background:#efeadd;color:#6b5a2a}

.bar.filt{border-top:0;padding-top:.1rem}
.bar .tag{font:700 10px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.bar .pick{display:inline-flex;align-items:center;gap:.35rem;font-size:11.5px;color:var(--muted)}
.bar .pick select,.bar .pick input{font:inherit;font-size:11.5px;padding:.18rem .3rem;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.bar .pick input[type=search]{min-width:15rem}
.bar .chk{display:inline-flex;align-items:center;gap:.3rem;font-size:11.5px;color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem;margin:.1rem 0 .6rem;font-size:12px}
.crumbs a{color:var(--accent);text-decoration:none;border-bottom:1px solid #cfe0e4}
.crumbs a:hover{border-bottom-color:var(--accent)}
.crumbs .here{font-weight:700;color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .note{color:var(--faint);font-size:11px}
.st tr.skip td{color:var(--faint)}
.band{border-left:3px solid var(--notice-rule);background:var(--notice-bg);padding:.7rem .9rem;margin:0 0 1rem;border-radius:0 4px 4px 0}
.band h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .45rem;color:var(--notice-rule)}
.band ul{margin:0;padding-left:1.1rem}
.band ul.two{column-count:2;column-gap:1.6rem}
.band ul.two li{break-inside:avoid}
@media (max-width:60rem){.band ul.two{column-count:1}}
.band li{margin:.22rem 0;font-size:.9rem}
.band .c{font-weight:700}

.refuse{border-left:3px solid var(--refuse-rule);background:var(--refuse-bg);padding:.9rem 1rem;border-radius:0 4px 4px 0}
.refuse h2{font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 0 .5rem;color:var(--refuse-rule)}
.refuse p{margin:.3rem 0 .7rem;font-size:.92rem}
.refuse table{width:100%;border-collapse:collapse;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif}
.refuse th{text-align:left;border-bottom:1px solid #e0cdc9;padding:.3rem .45rem;font-weight:600;color:var(--refuse-rule)}
.refuse td{border-bottom:1px solid #eddedb;padding:.3rem .45rem;vertical-align:top}

.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.5rem;margin:0 0 1rem}
.metric{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:.5rem .6rem;cursor:pointer}
.metric:hover{border-color:var(--accent)}
.metric .k{font:600 10px/1.2 "Segoe UI",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.metric .v{font:400 1.22rem/1.25 Georgia,serif;margin:.16rem 0 .05rem}
.metric .v small{font-size:.62em;color:var(--muted);margin-left:.2em}
.metric .l{font:400 11.5px/1.35 "Segoe UI",system-ui,sans-serif;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 .7rem;font:12.5px/1 "Segoe UI",system-ui,sans-serif}
button,select,label.file{font:12.5px/1 "Segoe UI",system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;cursor:pointer}
button:hover,select:hover,label.file:hover{border-color:var(--accent);color:var(--accent)}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=file]{display:none}
.bar .note{color:var(--faint);margin-left:auto;font-size:11.5px}

.body{display:flex;gap:1rem;align-items:flex-start}
.canvas{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem}
.canvas .overflow{overflow-x:auto}
svg{display:block;width:100%;height:auto;max-width:100%}
.rail{flex:0 0 19rem;max-width:19rem}
@media (max-width:60rem){.body{flex-direction:column}.rail{flex:1 1 auto;max-width:none;width:100%}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem;margin-bottom:.7rem}
.panel h3{font:600 10.5px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 .5rem}
.legrow{display:flex;align-items:center;gap:.5rem;margin:.28rem 0;font:12px/1.35 "Segoe UI",system-ui,sans-serif}
.legrow .sw{flex:0 0 auto}
.legrow .tx{color:var(--muted)}
.legrow .tx b{color:var(--ink);font-weight:600}
.leg-sub{font:11px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.45rem 0 .1rem;border-top:1px solid var(--line);padding-top:.45rem}

.card dl{margin:0;font:12.2px/1.5 "Segoe UI",system-ui,sans-serif}
.card dt{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:.5rem}
.card dd{margin:.1rem 0 0;color:var(--ink);word-break:break-word}
.card .ttl{font:600 13px/1.35 "Segoe UI",system-ui,sans-serif;margin:0 0 .1rem}
.card .idl{font-size:11px;color:var(--muted);word-break:break-all}
.card table{width:100%;border-collapse:collapse;font:11.5px/1.4 "Segoe UI",system-ui,sans-serif;margin-top:.3rem}
.card th{text-align:left;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line);padding:.22rem .3rem}
.card td{border-bottom:1px solid var(--line);padding:.22rem .3rem;vertical-align:top}
.meter{height:6px;background:var(--code);border-radius:3px;overflow:hidden;margin:.2rem 0}
.meter i{display:block;height:100%}
.inv{color:#6b5a2a;font-weight:700}
.hintline{font:11.5px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--faint);margin:.5rem 0 0}

.st table{width:100%;border-collapse:collapse;font:12px/1.45 "Segoe UI",system-ui,sans-serif}
.st th{text-align:left;border-bottom:1px solid var(--line);padding:.28rem .4rem;color:var(--faint);font-weight:600}
.st td{border-bottom:1px solid var(--line);padding:.28rem .4rem}
.st .ok{color:#2f6b46;font-weight:700}
.st .no{color:var(--refuse-rule);font-weight:700}
.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
foreignObject div{font:11px/1.2 "Segoe UI",system-ui,sans-serif}

/* ---- results layer ---- */
.pid a{color:var(--faint);text-decoration:none} .pid a:hover{color:var(--accent)}
h2.sect{font:600 1.02rem/1.3 "Segoe UI",system-ui,sans-serif;margin:2.4rem 0 .8rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--ink)}
h3.rsub{margin:1.5rem 0 .3rem;font:600 .9rem/1.3 "Segoe UI",system-ui,sans-serif;color:var(--ink)}
.panel2{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1rem;overflow-x:auto}
#h-models{margin:.2rem 0 .6rem}
#h-models button{font:600 12.5px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.03em;padding:.5em .95em;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;margin-right:.45rem}
#h-models button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.hl{display:flex;flex-wrap:wrap;gap:.8rem;margin:1.1rem 0 .4rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem 1rem;min-width:9.5rem}
.stat .v{font:600 1.35rem/1.2 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat .k{font:11px/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:.15rem}
#rs-tip{position:fixed;z-index:40;background:#20303b;color:#eef4f7;border-radius:5px;padding:.55rem .75rem;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif;max-width:26rem;pointer-events:none;display:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#rs-tip .t{font-weight:600;margin-bottom:.15rem}
#rs-tip .b{color:#aebfca;font-size:11.5px;margin-top:.25rem}
.rtable{border-collapse:collapse;width:100%;font:13px/1.5 "Segoe UI",system-ui,sans-serif;margin:.4rem 0}
.rtable th{text-align:left;border-bottom:2px solid var(--ink);padding:.35rem .5rem;font-weight:600}
.rtable td{border-bottom:1px solid var(--line);padding:.35rem .5rem;vertical-align:top;font-variant-numeric:tabular-nums}
.rtable td.basis{color:var(--muted);font-size:12px;max-width:36rem;font-variant-numeric:normal}
.selcand{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:.9rem 1rem;margin:.8rem 0}
.selcand.bad{border-left-color:var(--refuse-rule)}
.selcand h3{margin:0 0 .35rem;font:600 1rem/1.3 "Segoe UI",system-ui,sans-serif}
.selcand .knobs{font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:.3rem}
.selcand details{margin-top:.5rem} .selcand summary{cursor:pointer;font:600 12.5px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--accent)}
.verd-ok{color:#2f6b46;font-weight:600}.verd-bad{color:var(--refuse-rule);font-weight:600}
.disc2 .d{background:var(--code);border-left:3px solid var(--faint);padding:.55rem .8rem;margin:.45rem 0;font:12.5px/1.55 "Segoe UI",system-ui,sans-serif;color:#3d4f5c}
.disc2 .d p{margin:.25rem 0 0;white-space:pre-wrap}
.rnote{font:12.5px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--muted)}
.rerr{color:var(--refuse-rule);font-weight:600}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="pid"><a href="../index.html">QIF board</a> &middot; results &middot; fws_atlas/1</div>
    <div id="h-models"></div>
    <h1 id="h-title">QIF Results</h1>
    <p class="sub" id="h-sub"></p>
    <div class="pills" id="h-pills"></div>
  </header>
  <div id="h-headline"></div>
  <div id="h-frontsec"></div>
  <div id="h-pipesec"></div>
  <h2 class="sect">Drilldown &mdash; package &rarr; chip &rarr; macro; every number wears its basis</h2>
  <div id="h-bar"></div>
  <div id="h-crumbs"></div>
  <div class="body">
    <div class="canvas" id="h-canvas"></div>
    <div class="rail">
      <div class="panel" id="h-legend"></div>
      <div class="panel card" id="h-card"></div>
    </div>
  </div>
  <div id="h-details"></div>
  <div id="h-band"></div>
  <div id="h-disc"></div>
</main>
<div id="rs-tip"></div>

<script type="application/json" id="atlas-embedded">null</script>
<script type="application/json" id="frontier-embedded">null</script>

<script>
// ==ATLAS-CORE-START==  (no DOM here: this block is also run headlessly)
var ATLAS = (function () {
  "use strict";

  // The four validated group hues. Slot order is fixed; hues are never cycled.
  // Checked with the dataviz palette validator, all-pairs, surface #f7f9fa:
  // lightness band PASS, chroma floor PASS, CVD dE 9.3 (deutan) PASS,
  // normal-vision dE 17.8 PASS, contrast >= 3:1 PASS. See SCHEMA.md.
  var HUES = ["#108ca0", "#a63931", "#714ba8", "#808402"];
  var AXES = ["tp", "ep", "pp"];
  var PAPER = "#f7f9fa";
  var MUTED = "#5f7280";
  var DRAW_BUDGET = 10000;
  // Duty cycle is its OWN channel: a dedicated bar in one neutral ink, never a
  // hue and never the occupancy fill (P5's encoding law). The ink is deliberately
  // outside HUES so no reader can mistake a duty bar for a group.
  var DUTY_INK = "#3d4f5c";
  // A tile band narrower than this would vanish; it is drawn at the floor and
  // the exact span is printed in the card beside it.
  var BAND_FLOOR_PX = 1.5;

  function isInt(n) { return typeof n === "number" && isFinite(n) && Math.floor(n) === n; }
  function isStr(s) { return typeof s === "string" && s.length > 0; }
  function byId(list) { var m = {}; (list || []).forEach(function (o) { if (o && o.id != null) m[o.id] = o; }); return m; }

  function capacityOf(doc, macro) {
    if (macro && macro.capacity) return macro.capacity;
    var card = doc.cards && doc.cards[macro && macro.card];
    return (card && card.capacity) || null;
  }

  // Hue keys are a property of the file, not of what is on screen: sorted by
  // the fixed axis order tp, ep, pp and then by index, so a filter never
  // repaints a group.
  function hueKeys(doc) {
    var seen = {};
    function take(o) {
      if (!o || !isStr(o.primary_group) || !o.groups) return;
      var idx = o.groups[o.primary_group];
      if (!isInt(idx)) return;
      seen[o.primary_group + ":" + idx] = true;
    }
    (doc.tiles || []).forEach(take);
    (doc.chips || []).forEach(take);
    return Object.keys(seen).sort(function (a, b) {
      var A = a.split(":"), B = b.split(":");
      return (AXES.indexOf(A[0]) - AXES.indexOf(B[0])) || (+A[1] - +B[1]);
    });
  }

  function hueMap(doc) {
    var keys = hueKeys(doc), m = {};
    keys.forEach(function (k, i) { m[k] = i < HUES.length ? HUES[i] : null; });
    return { order: keys, hue: m };
  }

  function groupKey(o) {
    if (!o || !isStr(o.primary_group) || !o.groups) return null;
    var idx = o.groups[o.primary_group];
    return isInt(idx) ? o.primary_group + ":" + idx : null;
  }

  // ---- colour helpers -------------------------------------------------------
  function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgb2hex(c) { return "#" + c.map(function (v) { return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0"); }).join(""); }
  function mix(a, b, t) {
    var A = hex2rgb(a), B = hex2rgb(b);
    return rgb2hex([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
  }
  // One hue, light to dark. The light end keeps a floor so an empty macro is
  // still a drawn object rather than a hole in the page.
  function ramp(hue, occ) {
    if (hue == null) return PAPER;
    var t = Math.max(0, Math.min(1, occ == null ? 0 : occ));
    return mix(PAPER, hue, 0.10 + 0.90 * t);
  }

  // ---- formatting -----------------------------------------------------------
  function fmt(v) {
    if (v == null) return "—";
    if (typeof v !== "number") return String(v);
    if (!isFinite(v)) return String(v);
    var a = Math.abs(v);
    if (a === 0) return "0";
    if (a < 1e-3) return v.toExponential(3);
    if (a < 1) return String(Math.round(v * 1e6) / 1e6);
    if (a < 1000) return String(Math.round(v * 1000) / 1000);
    return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function fmtBytes(n) {
    if (!isFinite(n)) return "—";
    var u = ["B", "KiB", "MiB", "GiB"], i = 0, v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i === 0 ? String(n) : (Math.round(v * 100) / 100) + " " + u[i]) + (i === 0 ? " B" : " (" + n.toLocaleString("en-US") + " B)");
  }
  function pct(v) { return v == null ? "—" : (Math.round(v * 1000) / 10) + "%"; }

  // ---- the fixture_invented convention -------------------------------------
  function inventedIndex(doc) {
    var paths = {};
    ((doc.provenance && doc.provenance.invented_fields) || []).forEach(function (p) { paths[p] = true; });
    return paths;
  }
  // collection is "macros" | "tiles" | "chips" | "links" | "metrics"
  function isInvented(paths, collection, obj, field) {
    if (obj && obj.fixture_invented === true) return true;
    if (obj && Array.isArray(obj.fixture_invented) && obj.fixture_invented.indexOf(field) >= 0) return true;
    return !!paths[collection + "[]." + field];
  }

  // ---- the loader's refusals ------------------------------------------------
  function validate(doc) {
    var errors = [], warnings = [];
    function E(rule, field, message) { errors.push({ rule: rule, field: field, message: message }); }
    function W(rule, field, message) { warnings.push({ rule: rule, field: field, message: message }); }

    if (!doc || typeof doc !== "object" || Array.isArray(doc)) {
      E("R1", "(document)", "not a JSON object");
      return { errors: errors, warnings: warnings };
    }
    if (doc.schema !== "fws_atlas/1") {
      E("R1", "schema", 'expected "fws_atlas/1", found ' + JSON.stringify(doc.schema));
    }

    // structure first; every later rule assumes the tables exist
    var arrays = ["systems", "chips", "macros", "tiles", "links", "metrics", "relaxations"];
    var structural = false;
    if (doc.cards == null || typeof doc.cards !== "object" || Array.isArray(doc.cards)) {
      E("R1", "cards", "required object of device cards is missing"); structural = true;
    }
    if (!isStr(doc.title)) E("R1", "title", "required string is missing");
    if (doc.provenance == null || typeof doc.provenance !== "object" || Array.isArray(doc.provenance)) {
      E("R1", "provenance",
        "required object is missing. Without it every fixture_invented mark disappears and a " +
        "placeholder reads as evidence — the one thing the convention exists to prevent");
    } else {
      if (!isStr(doc.provenance.authored)) E("R1", "provenance.authored", "a document states when it was authored");
      if (!isStr(doc.provenance.author)) E("R1", "provenance.author", "a document states what produced it");
      if (!Array.isArray(doc.provenance.invented_fields)) {
        E("R1", "provenance.invented_fields",
          "must be an array of marked field paths; a real producer's output declares an empty one");
      }
    }
    arrays.forEach(function (k) {
      if (!Array.isArray(doc[k])) {
        E(k === "chips" ? "R9" : "R1", k,
          k === "chips"
            ? "chips must be an array of objects. A chip count is not a placement"
            : "required array is missing or not an array");
        structural = true;
      }
    });
    if (structural) return { errors: errors, warnings: warnings };

    // R9 - a chip count that is a division is not a placement (AUDIT finding 1)
    var QUOTIENT = /(_per_chip$)|(^chips?_per_)|(chip_count$)|(^chips_count$)/i;
    function scanQuotient(obj, path, depth) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj) || depth > 3) return;
      Object.keys(obj).forEach(function (k) {
        var v = obj[k];
        if (QUOTIENT.test(k) && typeof v === "number" && !isInt(v)) {
          E("R9", path + k, "a derived chip count is not a placement: " + k + " = " + v);
        }
        if (v && typeof v === "object" && !Array.isArray(v)) scanQuotient(v, path + k + ".", depth + 1);
      });
    }
    scanQuotient(doc, "", 0);
    doc.systems.forEach(function (s) { scanQuotient(s, "systems[" + s.id + "].", 0); });
    doc.chips.forEach(function (c) { scanQuotient(c, "chips[" + c.id + "].", 0); });
    ["macros", "tiles", "links", "metrics"].forEach(function (k) {
      doc[k].forEach(function (o, i) {
        scanQuotient(o, k + "[" + ((o && o.id != null) ? o.id : i) + "].", 0);
      });
    });

    // R24 - the device cards themselves. ADJ-4: slicing is present iff
    // bits_per_cell < weight_bits, and a mux slot stores cols_adc columns (P2).
    Object.keys(doc.cards).forEach(function (cid) {
      var c = doc.cards[cid] || {}, at = "cards." + cid;
      if (["analog_macro", "digital_engine"].indexOf(c.kind) < 0) {
        E("R24", at + ".kind", 'must be "analog_macro" or "digital_engine", found ' + JSON.stringify(c.kind));
      }
      if (!isInt(c.weight_bits) || c.weight_bits <= 0) {
        E("R24", at + ".weight_bits", "must be a positive integer, found " + JSON.stringify(c.weight_bits));
      }
      var ccap = c.capacity || {};
      if (isInt(ccap.cols_adc) && isInt(ccap.mux) && isInt(ccap.stored_cols) &&
          ccap.stored_cols !== ccap.cols_adc * ccap.mux) {
        E("R24", at + ".capacity.stored_cols",
          "declares " + ccap.stored_cols + " but cols_adc x mux = " + (ccap.cols_adc * ccap.mux));
      }
      var slices = isInt(c.bits_per_cell) && isInt(c.weight_bits) && c.bits_per_cell < c.weight_bits;
      if (c.slicing !== slices) {
        E("R24", at + ".slicing",
          "declares " + JSON.stringify(c.slicing) + " but bits_per_cell " + JSON.stringify(c.bits_per_cell) +
          " against weight_bits " + JSON.stringify(c.weight_bits) + " makes slicing " + slices +
          " (ADJ-4: slicing is present iff bits_per_cell < weight_bits)");
      }
    });

    // R26 - a system states which inventory it is and at which phase (D16)
    doc.systems.forEach(function (sy) {
      var at = "systems[" + sy.id + "]";
      if (["unified", "prefill", "decode"].indexOf(sy.role) < 0) {
        E("R26", at + ".role", 'must be "unified", "prefill" or "decode" (D16), found ' + JSON.stringify(sy.role));
      }
      if (["prefill", "decode"].indexOf(sy.phase) < 0) {
        E("R26", at + ".phase",
          'must be "prefill" or "decode": the metrics and duty cycles describe one operating point, found ' +
          JSON.stringify(sy.phase));
      }
    });

    var sysById = byId(doc.systems), chipById = byId(doc.chips);
    var macroById = byId(doc.macros), tileById = byId(doc.tiles);

    var modelById = {};
    doc.systems.forEach(function (s) {
      (s.models || []).forEach(function (m) { if (m && m.id != null) modelById[m.id] = m; });
    });

    // R2 / R8 / R4 - chips
    var chipHolds = {};
    doc.chips.forEach(function (c) {
      var at = "chips[" + c.id + "]";
      if (!sysById[c.system]) E("R2", at + ".system", 'no system "' + c.system + '" in systems[]');
      if (c.pool !== "analog" && c.pool !== "digital") E("R2", at + ".pool", 'pool must be "analog" or "digital", found ' + JSON.stringify(c.pool));

      var slots = c.capacity && c.capacity.macro_slots;
      if (!isInt(slots) || slots <= 0) {
        E("R8", at + ".capacity.macro_slots", "must be a positive integer, found " + JSON.stringify(slots));
      } else if (!Array.isArray(c.macros) || c.macros.length !== slots) {
        E("R8", at + ".capacity.macro_slots",
          "declares " + slots + " slots but lists " + (Array.isArray(c.macros) ? c.macros.length : 0) + " macros");
      }
      var held = {};
      (c.macros || []).forEach(function (mid) {
        held[mid] = true;
        var m = macroById[mid];
        if (!m) E("R4", at + ".macros", 'lists macro "' + mid + '", which is not in macros[]');
        else if (m.chip !== c.id) E("R4", at + ".macros", 'lists macro "' + mid + '", whose .chip is "' + m.chip + '"');
      });
      chipHolds[c.id] = held;
    });

    // R3 / R7 / R10 / R5 - macros
    doc.macros.forEach(function (m) {
      var at = "macros[" + m.id + "]";
      if (!chipById[m.chip]) E("R3", at + ".chip", 'no chip "' + m.chip + '" in chips[]');
      else if (!chipHolds[m.chip][m.id]) E("R3", at + ".chip", 'chip "' + m.chip + '" does not list this macro');

      if (!doc.cards[m.card]) E("R7", at + ".card", 'no device card "' + m.card + '" in cards');

      var tl = Array.isArray(m.tiles) ? m.tiles : [];
      if (!Array.isArray(m.tiles)) E("R5", at + ".tiles", "must be an array of tile ids");
      tl.forEach(function (tid) {
        var t = tileById[tid];
        if (!t) E("R5", at + ".tiles", 'lists tile "' + tid + '", which is not in tiles[]');
        else if (t.macro !== m.id) E("R5", at + ".tiles", 'lists tile "' + tid + '", whose .macro is "' + t.macro + '"');
      });
      // R27 - a duty cycle is a fraction of a period, and it is painted as a
      // bar: an out-of-range value would render as a plausible full or empty one.
      if (m.duty_cycle != null &&
          (typeof m.duty_cycle !== "number" || !isFinite(m.duty_cycle) || m.duty_cycle < 0 || m.duty_cycle > 1)) {
        E("R27", at + ".duty_cycle", "must be a fraction in [0, 1] or null, found " + JSON.stringify(m.duty_cycle));
      }
      // the named-owner invariant (D21)
      if (tl.length === 0 && !isStr(m.reserved)) {
        E("R10", at + ".reserved",
          "a macro with no tiles must name its reservation: every macro has a named owner");
      }
    });

    // R11..R16 - tiles
    var spans = {};
    doc.tiles.forEach(function (t) {
      var at = "tiles[" + t.id + "]";
      var m = macroById[t.macro];
      if (!m) { E("R5", at + ".macro", 'no macro "' + t.macro + '" in macros[]'); return; }
      if ((m.tiles || []).indexOf(t.id) < 0) E("R5", at + ".macro", 'macro "' + m.id + '" does not list this tile');

      var o = t.owner || {};
      var model = modelById[o.model];
      if (!model) E("R11", at + ".owner.model", 'no model "' + o.model + '" in systems[].models[]');
      else if (Array.isArray(model.blocks) && model.blocks.indexOf(o.block) < 0) {
        E("R11", at + ".owner.block", '"' + o.block + '" is not in the model\'s blocks[]');
      } else if (!isInt(o.layer)) {
        var ends = (model.endpoint_blocks || []);
        if (o.layer !== null) E("R11", at + ".owner.layer", "must be an integer or null, found " + JSON.stringify(o.layer));
        else if (ends.indexOf(o.block) < 0) E("R11", at + ".owner.layer", 'is null, but "' + o.block + '" is not an endpoint block');
      }

      var cap = capacityOf(doc, m);
      var col = t.columns || {};
      if (!isInt(col.start) || col.start < 0) E("R12", at + ".columns.start", "must be a non-negative integer, found " + JSON.stringify(col.start));
      if (!isInt(col.count) || col.count <= 0) E("R12", at + ".columns.count", "must be a positive integer, found " + JSON.stringify(col.count));
      if (cap && isInt(col.start) && isInt(col.count) && col.start + col.count > cap.stored_cols) {
        E("R12", at + ".columns", "span [" + col.start + ", " + (col.start + col.count) + ") exceeds the macro's " + cap.stored_cols + " stored columns");
      }
      var sh = t.shape || {};
      if (isInt(col.count) && sh.N !== col.count) E("R14", at + ".shape.N", "N = " + JSON.stringify(sh.N) + " but the column span holds " + col.count);
      if (cap && isInt(sh.K) && sh.K > cap.rows) E("R15", at + ".shape.K", "K = " + sh.K + " exceeds the macro's " + cap.rows + " rows");

      // R25 - bit slicing (D11) is a card property; a tile may not claim a
      // slice role on a card that stores whole weight words.
      var tcard = doc.cards[m.card] || {};
      if (t.slice != null) {
        if (!tcard.slicing) {
          E("R25", at + ".slice", 'is set, but card "' + m.card + '" does not slice (D11)');
        } else if (!isInt(t.slice.of) || t.slice.of <= 0 || !isInt(t.slice.index) ||
                   t.slice.index < 0 || t.slice.index >= t.slice.of ||
                   !isInt(t.slice.bits) || t.slice.bits <= 0) {
          E("R25", at + ".slice",
            "must be {index, of, bits} with 0 <= index < of and bits > 0, found " + JSON.stringify(t.slice));
        }
      }

      if (!isStr(t.primary_group) || AXES.indexOf(t.primary_group) < 0) {
        E("R20", at + ".primary_group", 'must be "tp", "ep" or "pp", found ' + JSON.stringify(t.primary_group));
      } else if (!t.groups || !isInt(t.groups[t.primary_group])) {
        E("R20", at + ".groups." + t.primary_group, "the primary axis has no index in groups");
      }

      if (isInt(col.start) && isInt(col.count)) {
        (spans[t.macro] = spans[t.macro] || []).push({ id: t.id, a: col.start, b: col.start + col.count });
      }
    });

    // R13 / R16 - column spans and the occupancy they imply
    doc.macros.forEach(function (m) {
      var at = "macros[" + m.id + "]";
      var list = (spans[m.id] || []).slice().sort(function (x, y) { return x.a - y.a; });
      var held = 0;
      for (var i = 0; i < list.length; i++) {
        held += list[i].b - list[i].a;
        if (i > 0 && list[i].a < list[i - 1].b) {
          E("R13", "tiles[" + list[i].id + "].columns",
            'overlaps tile "' + list[i - 1].id + '" on macro ' + m.id + " (columns " + list[i].a + " < " + list[i - 1].b + ")");
        }
      }
      var cap = capacityOf(doc, m);
      if (cap && isInt(cap.stored_cols) && cap.stored_cols > 0) {
        var want = held / cap.stored_cols;
        if (typeof m.occupancy !== "number" || Math.abs(m.occupancy - want) > 1e-9) {
          E("R16", at + ".occupancy",
            "declares " + fmt(m.occupancy) + " but the enumerated column spans hold " + held + " of " + cap.stored_cols + " (" + fmt(want) + ")");
        }
      }
    });

    // R17 - chip occupancy against the enumerated macros
    doc.chips.forEach(function (c) {
      var slots = c.capacity && c.capacity.macro_slots;
      if (!isInt(slots) || slots <= 0) return;
      var used = 0;
      (c.macros || []).forEach(function (mid) {
        var m = macroById[mid];
        if (m && Array.isArray(m.tiles) && m.tiles.length > 0) used++;
      });
      var want = used / slots;
      if (typeof c.occupancy !== "number" || Math.abs(c.occupancy - want) > 1e-9) {
        E("R17", "chips[" + c.id + "].occupancy",
          "declares " + fmt(c.occupancy) + " but " + used + " of " + slots + " enumerated slots hold tiles (" + fmt(want) + ")");
      }
    });

    // R21 - a chip may not claim a group its own tiles contradict
    doc.chips.forEach(function (c) {
      if (!isStr(c.primary_group) || !c.groups || !isInt(c.groups[c.primary_group])) {
        if (c.primary_group != null || c.groups != null) {
          E("R21", "chips[" + c.id + "].primary_group", "must name an axis that groups indexes");
        }
        return;
      }
      var ax = c.primary_group, idx = c.groups[ax];
      (c.macros || []).forEach(function (mid) {
        var m = macroById[mid];
        ((m && m.tiles) || []).forEach(function (tid) {
          var t = tileById[tid];
          if (t && t.groups && isInt(t.groups[ax]) && t.groups[ax] !== idx) {
            E("R21", "chips[" + c.id + "].groups." + ax,
              "chip claims " + ax + " " + idx + ' but resident tile "' + tid + '" is ' + ax + " " + t.groups[ax]);
          }
        });
      });
    });

    // R6 - links
    doc.links.forEach(function (l) {
      var at = "links[" + l.id + "]";
      if (!chipById[l.from]) E("R6", at + ".from", 'no chip "' + l.from + '" in chips[]');
      if (!chipById[l.to]) E("R6", at + ".to", 'no chip "' + l.to + '" in chips[]');
      if (["tp", "ep", "pp", "pd", "act", "svc"].indexOf(l.role) < 0) E("R6", at + ".role", "unknown link role " + JSON.stringify(l.role));
      if (typeof l.bytes !== "number" || !isFinite(l.bytes) || l.bytes < 0) E("R6", at + ".bytes", "must be a non-negative number, found " + JSON.stringify(l.bytes));
      if (!isStr(l.per)) E("R6", at + ".per", "a byte count states what it is per (a step, a token, a request)");
      if (!isStr(l.basis)) E("R6", at + ".basis", "every link states where its number came from");
    });

    // R18 - one labeled accounting per metric (AUDIT finding 4)
    var byKey = {};
    doc.metrics.forEach(function (m, i) {
      var at = "metrics[" + i + " " + (m && m.key) + "]";
      if (!isStr(m.key)) { E("R18", at + ".key", "a metric needs a key"); return; }
      if (!isStr(m.basis)) E("R18", at + ".basis", "every metric states where its number came from");
      if (typeof m.value !== "number" || !isFinite(m.value)) {
        E("R18", at + ".value", "must be a finite number, found " + JSON.stringify(m.value));
      }
      (byKey[m.key] = byKey[m.key] || []).push({ i: i, label: m.label });
    });
    Object.keys(byKey).forEach(function (k) {
      var list = byKey[k], seen = {};
      list.forEach(function (e) {
        var at = "metrics[" + e.i + " " + k + "].label";
        if (!isStr(e.label)) {
          E("R18", at, list.length > 1
            ? "two figures for one metric are legal only when both are labeled"
            : "a metric needs a label; the atlas never picks which figure is the headline");
        } else if (seen[e.label]) {
          E("R18", at, 'duplicates the label "' + e.label + '" already used for metric "' + k + '"');
        } else seen[e.label] = true;
      });
    });

    // R19 - disclosed relaxations
    doc.relaxations.forEach(function (r, i) {
      ["constraint", "value", "reason"].forEach(function (f) {
        if (!isStr(r && r[f])) E("R19", "relaxations[" + i + "]." + f, "a disclosed relaxation states its " + f);
      });
    });

    // R28 - in a document with more than one system, every metric must name the
    // system it measures. A PD pair publishes the same headline LABEL twice,
    // once per inventory (D16), so a metric strip that does not say whose figure
    // it is puts two readings of one quantity in front of a reader with no way
    // to tell them apart - AUDIT finding 4 one level up.
    if (doc.systems.length > 1) {
      doc.metrics.forEach(function (m, i) {
        var at = "metrics[" + i + " " + (m && m.key) + "]";
        var named = null;
        if (m && m.system != null) {
          if (!sysById[m.system]) {
            E("R28", at + ".system", 'names system "' + m.system + '", which is not in systems[]');
          } else named = m.system;
        } else if (isStr(m && m.key)) {
          doc.systems.forEach(function (sy) {
            if (m.key.indexOf(sy.id + ".") === 0 && (named == null || sy.id.length > named.length)) {
              named = sy.id;
            }
          });
        }
        if (named == null) {
          E("R28", at + ".system",
            "this document holds " + doc.systems.length + " systems, so every metric states which one it " +
            "measures: give it a system field naming one, or a key prefixed with the system id");
        }
      });
    }

    // R29 - PD is two inventories and ONE handoff (D16). Two systems drawn side
    // by side with no link between them are two pictures, not a machine, and a
    // pd link with both ends inside one system is a handoff to itself.
    var pdLinks = doc.links.filter(function (l) { return l.role === "pd"; });
    pdLinks.forEach(function (l) {
      var a = chipById[l.from], b = chipById[l.to];
      if (a && b && a.system === b.system) {
        E("R29", "links[" + l.id + "].role",
          'a pd handoff runs BETWEEN a prefill system and a decode system (D16); both ends of this one are in "' +
          a.system + '"');
      }
    });
    if (doc.systems.length > 1) {
      var roles = doc.systems.map(function (sy) { return sy.role; });
      if (roles.slice().sort().join(",") !== "decode,prefill") {
        E("R29", "systems[].role",
          "two or more systems in one document is PD disaggregation: exactly one prefill and one decode " +
          "(D16). Found " + JSON.stringify(roles));
      }
      if (pdLinks.length !== 1) {
        E("R29", "links[].role",
          "a PD document carries exactly ONE handoff link (D16); found " + pdLinks.length +
          ". The handoff is the only coupling the two inventories have, so a document without it draws " +
          "two machines that never meet");
      }
    }

    // R22 - hue capacity. A warning: the excess draws as the over-palette hatch,
    // and no hue is ever cycled.
    var keys = hueKeys(doc);
    if (keys.length > HUES.length) {
      W("R22", "tiles[].primary_group",
        keys.length + " distinct (axis, index) groups are co-visible but the validated palette holds " +
        HUES.length + ". " + keys.slice(HUES.length).join(", ") + " draw as the over-palette hatch. Hues are never cycled.");
    }

    // draw budget, stated out loud - and measured in the unit it is stated in
    doc.chips.forEach(function (c) {
      var rects = chipRects(doc, c, true);
      if (rects > DRAW_BUDGET) {
        W("R23", "chips[" + c.id + "].macros",
          ((c.macros || []).length) + " enumerated macros draw " + rects +
          " rects with the duty overlay on, past the phase-1 draw budget of " +
          DRAW_BUDGET + "; this chip is not drawn");
      }
    });

    return { errors: errors, warnings: warnings };
  }

  // ---- the drill/filter view rules (phase 2) --------------------------------
  // Everything here is PURE: it decides what is drawn, never what a number is.
  // A filter changes the picture and never a figure, and the hue map is built
  // from the whole file so a filter can never repaint a group.

  function makeIndex(doc) {
    var ix = {
      chip: byId(doc.chips), macro: byId(doc.macros), tile: byId(doc.tiles),
      link: byId(doc.links), sys: byId(doc.systems), owner: {}
    };
    // owner tuple -> every tile that carries a piece of that ONE weight matrix,
    // wherever it sits. It is what tells a reader whether a matrix composes
    // inside one macro or chains across several (D11).
    (doc.tiles || []).forEach(function (t) {
      var key = ownerKey(t);
      (ix.owner[key] = ix.owner[key] || []).push(t.id);
    });
    return ix;
  }

  function emptyFilter() { return { model: "", layer: "", group: "", pool: "", q: "" }; }
  function filterActive(f) {
    return !!(f && (f.model || f.layer || f.group || f.pool || f.q));
  }

  function layerKey(tile) {
    var o = (tile && tile.owner) || {};
    return o.layer == null ? "endpoint" : String(o.layer);
  }
  // The owner vocabulary a search may match: identities only. Occupancy, duty
  // cycle and every other MEASURED number is deliberately absent - a search that
  // matched digits would let a reader select by a value and read the selection
  // as a fact about it.
  function ownerText(doc, ix, tile) {
    var o = (tile && tile.owner) || {};
    var chip = ix.macro[tile.macro] ? ix.macro[tile.macro].chip : "";
    return [
      tile.id, tile.macro, chip, o.model, o.block,
      o.layer == null ? "endpoint" : "layer " + o.layer,
      o.expert == null ? "" : "expert " + o.expert,
      tile.slice ? "slice " + tile.slice.index + "/" + tile.slice.of : "",
      groupKey(tile) || ""
    ].join(" ").toLowerCase();
  }
  function macroText(doc, ix, macro) {
    return [macro.id, macro.chip, macro.card, macro.reserved || ""].join(" ").toLowerCase();
  }
  function chipText(doc, ix, chip) {
    return [chip.id, chip.label || "", chip.system, chip.pool].join(" ").toLowerCase();
  }

  function tileMatches(doc, ix, tile, f) {
    if (!filterActive(f)) return true;
    var o = (tile && tile.owner) || {};
    if (f.model && o.model !== f.model) return false;
    if (f.layer && layerKey(tile) !== f.layer) return false;
    if (f.group && groupKey(tile) !== f.group) return false;
    if (f.pool) {
      var macro = ix.macro[tile.macro], chip = macro && ix.chip[macro.chip];
      if (!chip || chip.pool !== f.pool) return false;
    }
    if (f.q && ownerText(doc, ix, tile).indexOf(f.q.toLowerCase()) < 0) return false;
    return true;
  }

  function macroMatches(doc, ix, macro, f) {
    if (!filterActive(f)) return true;
    var chip = ix.chip[macro.chip];
    if (f.pool && (!chip || chip.pool !== f.pool)) return false;
    var owned = (macro.tiles || []).map(function (id) { return ix.tile[id]; }).filter(Boolean);
    // An owner filter is about tiles, so a macro holding none can only match on
    // the axes that are its own: its pool and its text. It is still DRAWN either
    // way - a reserved slot is an object, not a gap (D21).
    var ownerish = !!(f.model || f.layer || f.group);
    if (!owned.length) {
      if (ownerish) return false;
      return f.q ? macroText(doc, ix, macro).indexOf(f.q.toLowerCase()) >= 0 : true;
    }
    var hit = owned.some(function (t) { return tileMatches(doc, ix, t, f); });
    if (hit) return true;
    return !!(f.q && !f.model && !f.layer && !f.group &&
      macroText(doc, ix, macro).indexOf(f.q.toLowerCase()) >= 0);
  }

  function chipMatches(doc, ix, chip, f) {
    if (!filterActive(f)) return true;
    if (f.pool && chip.pool !== f.pool) return false;
    var ownerish = !!(f.model || f.layer || f.group);
    if (!ownerish && f.q && chipText(doc, ix, chip).indexOf(f.q.toLowerCase()) >= 0) return true;
    return (chip.macros || []).some(function (mid) {
      var m = ix.macro[mid];
      return m && macroMatches(doc, ix, m, f);
    });
  }

  // The filter controls, built from the file itself so a filter can only ever
  // name something the document contains.
  function filterOptions(doc, ix) {
    var models = {}, layers = {}, pools = {};
    doc.systems.forEach(function (sy) {
      (sy.models || []).forEach(function (m) { if (m && m.id != null) models[m.id] = true; });
    });
    doc.tiles.forEach(function (t) { layers[layerKey(t)] = true; });
    doc.chips.forEach(function (c) { pools[c.pool] = true; });
    var layerList = Object.keys(layers).sort(function (a, b) {
      if (a === "endpoint") return 1;
      if (b === "endpoint") return -1;
      return (+a) - (+b);
    });
    return {
      models: Object.keys(models).sort(),
      layers: layerList,
      groups: hueKeys(doc),
      pools: Object.keys(pools).sort()
    };
  }

  // ---- duty cycle (P4) ------------------------------------------------------
  // The bar is drawn on the ABSOLUTE 0-1 scale, because a duty cycle is already
  // a fraction of the period and rescaling it to the busiest macro would invent
  // a second reading of the same number. dutyExtreme SELECTS the largest value
  // in the file - it is a lookup, not an accounting - so the legend can say out
  // loud why every bar on a real run is short.
  function dutyExtreme(doc) {
    var best = null;
    (doc.macros || []).forEach(function (m) {
      if (typeof m.duty_cycle === "number" && isFinite(m.duty_cycle)) {
        if (best == null || m.duty_cycle > best.value) best = { id: m.id, value: m.duty_cycle };
      }
    });
    return best;
  }
  function dutyState(macro) {
    if (!macro || macro.duty_cycle == null) return "unknown";
    return macro.duty_cycle > 0 ? "active" : "idle";
  }
  function hasDuty(doc) { return dutyExtreme(doc) != null; }

  // ---- the macro column map (D11) -------------------------------------------
  // Tiles that share ONE owner tuple are one weight matrix carried by several
  // tiles: bit slices of it (D11), or row slabs of a K taller than the macro.
  // They share a bracket. A bracket therefore never spans two owners - that is
  // the whole claim it makes.
  function ownerKey(tile) {
    var o = (tile && tile.owner) || {};
    return [o.model, o.layer == null ? "endpoint" : o.layer, o.block,
            o.expert == null ? "-" : o.expert].join("/");
  }
  function macroTiles(doc, ix, macro) {
    return (macro.tiles || []).map(function (id) { return ix.tile[id]; }).filter(Boolean)
      .sort(function (a, b) { return a.columns.start - b.columns.start; });
  }
  function bracketsFor(doc, ix, macro) {
    var tiles = macroTiles(doc, ix, macro);
    var order = [], groups = {};
    tiles.forEach(function (t) {
      var k = ownerKey(t);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(t);
    });
    var out = [];
    order.forEach(function (k) {
      var list = groups[k];
      var all = ix.owner[k] || list.map(function (t) { return t.id; });
      var elsewhere = {};
      all.forEach(function (id) {

        end: Math.max.apply(null, list.map(function (t) { return t.columns.start + t.columns.count; })),

  // It used to be enforced against capacity.macro_slots, which undercounts by
  // ~5x on every shipped document (a 640-slot chip emits ~3,160 rects), so a
  // chip declaring 9,999 slots was admitted and drew ~50,000. These three
  // counters mirror what drawPackage / drawChip / drawMacro actually emit;
  // CHANGE A DRAWER, CHANGE ITS COUNTER - they sit next to the drawers'
  // rect-per-object comments for exactly that reason.
  function packageRects(doc) {
    // drawPackage: one lane box per system when there is more than one, one
    // pool box per (lane, pool) that holds chips, and 3 rects per chip (body,
    // inner outline, label plate).
    var pools = {};
    doc.chips.forEach(function (c) { pools[c.system + "/" + c.pool] = true; });

    if (!metric) return null;
    if (metric.system != null) return metric.system;
    var named = null;
    if (isStr(metric.key)) {

  var CORRUPTIONS = [

    { rule: "R5", what: "macro lists a tile that does not exist", expect: "\\.tiles$", mutate: function (d) { firstMacroWith(d, 1).tiles[0] = "tile.ghost"; } },

    { rule: "R9", what: "a chip count arrives as a quotient", expect: "layers_per_chip$", mutate: function (d) { d.systems[0].layers_per_chip = 5.3333; } },

    { rule: "R12", what: "a tile's columns run past the macro's capacity", expect: "^tiles\\[.*\\]\\.columns$", mutate: function (d) { d.tiles[0].columns.start = 4000000; } },

    { rule: "R15", what: "shape.K exceeds the macro's rows", expect: "shape\\.K$", mutate: function (d) { d.tiles[0].shape.K = 999999; } },
    { rule: "R16", what: "declared macro occupancy disagrees with its spans", expect: "^macros\\[.*\\]\\.occupancy$", mutate: function (d) { firstMacroWith(d, 1).occupancy = 0.123; } },
    { rule: "R17", what: "declared chip occupancy disagrees with its macros", expect: "^chips\\[.*\\]\\.occupancy$", mutate: function (d) { d.chips[0].occupancy = 0.123; } },
    { rule: "R18", what: "two figures for one metric, one unlabeled", expect: "^metrics\\[.*\\]\\.label$", mutate: function (d) { var m = clone(d.metrics[0]); m.label = ""; d.metrics.push(m); } },
    { rule: "R18", what: "two figures for one metric share a label", expect: "^metrics\\[.*\\]\\.label$", mutate: function (d) { d.metrics.push(clone(d.metrics[0])); } },
    { rule: "R19", what: "a relaxation is disclosed without a reason", expect: "^relaxations\\[.*\\]\\.reason$", mutate: function (d) { d.relaxations[0].reason = ""; } },
    { rule: "R20", what: "primary_group names no parallelism axis", expect: "primary_group$", mutate: function (d) { d.tiles[0].primary_group = "zz"; } },
    { rule: "R21", what: "a chip claims a group its own tiles contradict", expect: "^chips\\[.*\\]\\.groups\\.", mutate: function (d) { var c = firstChipWithTiles(d); if (c) c.groups[c.primary_group] = 9; } },
    { rule: "R1", what: "the document carries no provenance", expect: "^provenance$", mutate: function (d) { delete d.provenance; } },
    { rule: "R6", what: "a link carries bytes with no basis", expect: "^links\\[.*\\]\\.basis$", mutate: function (d) { d.links[0].basis = ""; } },
    { rule: "R9", what: "a placement row carries a per-chip quotient", expect: "^macros\\[.*\\]\\.arrays_per_chip$", mutate: function (d) { d.macros[0].arrays_per_chip = 3.7; } },
    { rule: "R18", what: "a metric value is not a number", expect: "^metrics\\[.*\\]\\.value$", mutate: function (d) { d.metrics[0].value = "lots"; } },
    { rule: "R24", what: "stored columns disagree with cols_adc x mux", expect: "capacity\\.stored_cols$", mutate: function (d) { var k = Object.keys(d.cards)[0]; d.cards[k].capacity.stored_cols = d.cards[k].capacity.stored_cols + 1; } },
    { rule: "R24", what: "a card declares slicing its bit width contradicts", expect: "^cards\\..*\\.slicing$", mutate: function (d) { d.cards[Object.keys(d.cards)[0]].slicing = true; } },
    { rule: "R25", what: "a tile claims a slice role on a card that does not slice", expect: "^tiles\\[.*\\]\\.slice$", mutate: function (d) { d.tiles[0].slice = { index: 9, of: 2, bits: 4 }; } },
    { rule: "R26", what: "a system role is outside the PD vocabulary", expect: "^systems\\[.*\\]\\.role$", mutate: function (d) { d.systems[0].role = "mixed"; } },
    { rule: "R27", what: "a duty cycle is outside [0, 1]", expect: "^macros\\[.*\\]\\.duty_cycle$", mutate: function (d) { d.macros[0].duty_cycle = 5.0; } },
    {
      rule: "R29", what: "a pd handoff runs inside one system",
      expect: "^links\\[.*\\]\\.role$",
      needs: function (d) {

  function selfTest(doc) {

    rows.push({
      rule: "R0", what: "the loaded document itself draws clean", pass: clean.errors.length === 0,
      got: clean.errors.slice(0, 2).map(function (e) { return e.rule + " " + e.field; }).join("; ") || "no errors"
    });
    CORRUPTIONS.forEach(function (c) {

      // it, and reporting it as a miss would read as a broken loader. It is
      // reported as what it is: a rule this file gives the harness no way to
      // exercise (no macro holds two tiles, no second digital chiplet exists).
      if (c.needs && !c.needs(doc)) {

  // ---- the view rules, asserted on the loaded document ----------------------

  // claim only what D11 says they claim.
  function fillFor(doc, ix, macro, hue) {
    if (!(macro.tiles || []).length) return "url(#p-res)";
    if (hue == null) return "url(#p-over)";
    return ramp(hue, macro.occupancy);
  }

  function viewTest(doc) {

      repainted.length === 0, repainted.length ? JSON.stringify(repainted[0]) : probes.length + " filters, one hue map");

      fillFor(doc, ix, moved, hue) === before, before);

    // V4 - the draw budget is stated and applied.
    var fat = JSON.parse(JSON.stringify(doc.chips[0]));
    for (var gi = 0; gi <= DRAW_BUDGET; gi++) fat.macros.push("ghost.mac." + gi);
    fat.capacity.macro_slots = fat.macros.length;

      !chipDrawable(doc, fat) && doc.chips.every(function (c) { return chipDrawable(doc, c); }),
      "budget " + DRAW_BUDGET);

    // V5 - a slice bracket spans ONE weight matrix (D11).
    var bad = null, brackets = 0;
    doc.macros.forEach(function (m) {
      bracketsFor(doc, ix, m).forEach(function (b) {
        brackets++;
        var keys = {};
        b.tiles.forEach(function (id) { keys[ownerKey(ix.tile[id])] = true; });
        var span = b.tiles.every(function (id) {
          var t = ix.tile[id];
          return t.columns.start >= b.start && t.columns.start + t.columns.count <= b.end;

      bad == null, bad || brackets + " brackets");

    // V6 - breadcrumbs are containment, never a guess.
    var held = doc.macros.filter(function (m) { return (m.tiles || []).length; })[0] || doc.macros[0];
    var path = crumbs(doc, ix, "macro", null, held.id);

      path.length === 3 && path[1].id === held.chip && path[2].id === held.id,
      path.map(function (c) { return c.label; }).join(" / "));

    // V7 - owner search matches identities, never measurements.
    // A measured value with a decimal point: "1" would be a substring of half
    // the ids in the file and would prove nothing.
    var measured = doc.macros.filter(function (m) {
      return typeof m.duty_cycle === "number" && String(m.duty_cycle).indexOf(".") > 0;
    })[0] || doc.macros.filter(function (m) {
      return typeof m.occupancy === "number" && String(m.occupancy).indexOf(".") > 0;

      leaked === 0, "q = " + (needle || "(no measured value in this file)") + " -> " + leaked + " macros");

      lanes.length === doc.systems.length && placed === doc.chips.length && pdOk,
      lanes.length + " lane(s), " + placed + "/" + doc.chips.length + " chips, " + crossing.length + " crossing link(s)");

    var orphan = doc.metrics.filter(function (m) {
      var id = metricSystem(doc, m);

      orphan.length === 0, orphan.length ? orphan[0].key : doc.metrics.length + " metrics");

    // V10 / V11 - the P7.6 folding views, asserted only on a document that
    // carries their blocks. A rule with nothing to judge would be a pass that
    // proved nothing.
    rows = rows.concat(extViewRows(doc, ix));

  // ===================================================================
  // P7.6 - the folding extension. Three views, three contracts:
  //   folding  (fws_fold/1)      the folding card: one tensor, its mapping family
  //   passes   (fws_pass/1)      the macro time-lane view: banks x decode passes
  //   frontier (fws_frontier/1)  the frontier explorer: area vs decode tokens/s
  // The first two ride inside an fws_atlas/1 document as optional blocks; the
  // third is its own document, because a frontier is many provisionings and an
  // atlas is one. All three obey the same two rules as the atlas: the loader
  // computes only to REFUSE, and a fold that cannot be drawn is not a fold.
  // ===================================================================
  var FOLD_SCHEMA = "fws_fold/1";
  var PASS_SCHEMA = "fws_pass/1";
  var FRONTIER_SCHEMA = "fws_frontier/1";
  // D26: the DOA register BINDS. Every one of these names must appear in a
  // folding block's refused[] with a reason, and a variant that claims one as
  // its kind is refused by that name. Machinery for a dead fold is a
  // conformance violation, not initiative.
  var DOA_FOLDS = [
    "slicing_x_folding", "replication", "non_canonical_walk",
    "prefill_folding", "multi_tenant_fold", "pipelined_decode_fold", "idle_spread"
  ];
  // The folds that are alive in decode (P7 Facts 1 and 3).
  var FOLD_KINDS = ["n_spread", "k_spread", "k_stack", "dense_share", "row_band"];
  // D28: no safety margins anywhere. A margin smuggled in under any of these
  // names is refused by the name it wears - the frontier itself is the
  // statement of how close a point runs.
  var MARGIN_RE = /(^|_)(margin|margins|derate|derating|guard_band|guardband|safety|headroom_factor)(_|$)/i;
  var EPS = 1e-9;

  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function cardOf(doc, id) { return (doc.cards && doc.cards[id]) || null; }
  function capOfCard(doc, id) { var c = cardOf(doc, id); return c ? (c.capacity || {}) : null; }
  function passesOfBox(box) {
    var out = [];
    ((box && box.lanes) || []).forEach(function (l) {
      ((l && l.passes) || []).forEach(function (p) { out.push(p); });
    });
    return out;
  }
  function ownerText2(o) {
    if (!o) return "(no owner)";
    return o.model + " L" + (o.layer == null ? "-" : o.layer) + " " + o.block +
      (o.expert == null ? "" : " e" + o.expert);
  }
  function sameOwner(a, b) {
    if (!a || !b) return false;
    return a.model === b.model && a.layer === b.layer && a.block === b.block && a.expert === b.expert;
  }
  // A margin field, wherever it hides. Bounded depth, like the R9 quotient scan.
  function scanMargins(obj, path, depth, hit) {
    if (!obj || typeof obj !== "object" || depth > 6) return;
    if (Array.isArray(obj)) {
      obj.forEach(function (v, i) { scanMargins(v, path + "[" + i + "]", depth + 1, hit); });
      return;
    }
    Object.keys(obj).forEach(function (k) {
      if (MARGIN_RE.test(k)) hit.push(path + k);
      scanMargins(obj[k], path + k + ".", depth + 1, hit);
    });
  }

  // One lane check for both blocks: a box's lanes ARE the card's mux banks, the
  // x axis is pass order inside one decode step, and nothing fires twice at one
  // moment on one bank.
  function checkBoxLanes(E, W, at, box, cap, rules, doc, macro) {
    var lanes = (box && box.lanes) || [];
    if (!Array.isArray(lanes) || !lanes.length) {
      E(rules.lane, at + ".lanes", "a box draws its banks as lanes and declares none");
      return;
    }
    if (isInt(cap.mux) && lanes.length !== cap.mux) {
      E(rules.lane, at + ".lanes",
        "the card declares " + cap.mux + " mux banks and this box draws " + lanes.length +
        " lanes. Every bank is drawn whether it fires or not, so weight space no pass covers " +
        "is visible rather than omitted (D27)");
    }
    var seenBank = {};
    lanes.forEach(function (l, li) {
      var la = at + ".lanes[" + li + "]";
      l = l || {};
      if (!isInt(l.bank) || l.bank < 0 || (isInt(cap.mux) && l.bank >= cap.mux)) {
        E(rules.lane, la + ".bank",
          "must be a bank index in [0, " + cap.mux + "), found " + JSON.stringify(l.bank));
        return;
      }
      if (seenBank[l.bank]) {
        E(rules.lane, la + ".bank", "bank " + l.bank + " is drawn twice: one bank is one lane");
      }
      seenBank[l.bank] = true;
      var col = l.columns || {};
      if (isInt(cap.cols_adc) &&
          (col.start !== l.bank * cap.cols_adc || col.count !== cap.cols_adc)) {
        E(rules.lane, la + ".columns",
          "bank " + l.bank + " spans stored columns [" + (l.bank * cap.cols_adc) + ", " +
          (l.bank * cap.cols_adc + cap.cols_adc) + ") on this card; the lane declares " +
          JSON.stringify(col) + ". A lane that is not its bank is not a lane");
      }
      var list = l.passes || [];
      if (!Array.isArray(list)) {
        E(rules.pass, la + ".passes", "must be an array of passes (it may be empty: an idle bank)");
        return;
      }
      if (!list.length && rules.idle) {
        W(rules.idle, la + ".passes",
          "bank " + l.bank + " of " + (box.macro || box.id) + " fires on no pass of this decode " +
          "step: its weight space is not covered by the schedule. Under Invariant W every bank " +
          "holds real weights and fires once per step, so this is WASTE, reported (D27)");
      }
      var seenPass = {};
      list.forEach(function (p, pi) {
        var pa = la + ".passes[" + pi + "]";
        p = p || {};
        if (!isInt(p.pass) || p.pass < 0) {
          E(rules.pass, pa + ".pass", "must be a pass index >= 0, found " + JSON.stringify(p.pass));
        } else if (seenPass[p.pass]) {
          E(rules.pass, pa + ".pass",
            "two things fire on bank " + l.bank + " at pass " + p.pass + ". The x axis is time " +
            "inside one decode step: one bank does one thing at one moment");
        } else { seenPass[p.pass] = true; }
        if (!isStr(p.label)) E(rules.pass, pa + ".label", "every pass says what fires on it");
        var o = p.owner || {};
        if (!isStr(o.model) || !isStr(o.block)) {
          E(rules.pass, pa + ".owner", "a pass names the tensor it drives (model and block)");
        }
        var pc = p.columns || {}, pr = p.rows || {};
        if (!isInt(pc.start) || !isInt(pc.count) || pc.count <= 0 ||
            (isInt(col.start) && isInt(col.count) &&
             (pc.start < col.start || pc.start + pc.count > col.start + col.count))) {
          E(rules.pass, pa + ".columns",
            "must be a real span inside its own bank [" + col.start + ", " +
            (col.start + col.count) + "), found " + JSON.stringify(pc));
        }
        if (!isInt(pr.start) || !isInt(pr.count) || pr.count <= 0 ||
            (isInt(cap.rows) && (pr.start < 0 || pr.start + pr.count > cap.rows))) {
          E(rules.pass, pa + ".rows",
            "must be a real row span inside the card's " + cap.rows + " rows, found " +
            JSON.stringify(pr));
        }
        if (p.tile != null) {
          var t = (doc.tiles || []).filter(function (x) { return x.id === p.tile; })[0];
          if (!t) {
            E(rules.tile, pa + ".tile", 'no tile "' + p.tile + '" in tiles[]');
          } else {
            if (macro && t.macro !== macro.id) {
              E(rules.tile, pa + ".tile",
                'tile "' + p.tile + '" is on macro ' + t.macro + ", not on " + macro.id +
                ": a pass drives weights the macro actually holds");
            }
            var tc = t.columns || {};
            if (isInt(pc.start) && isInt(tc.start) &&
                (pc.start < tc.start || pc.start + pc.count > tc.start + tc.count)) {
              E(rules.tile, pa + ".columns",
                "the pass drives columns [" + pc.start + ", " + (pc.start + pc.count) +
                ") but tile " + p.tile + " holds [" + tc.start + ", " + (tc.start + tc.count) +
                "). A pass cannot drive columns its own tile does not own");
            }
          }
        }
      });
    });
  }

  // ---- fws_fold/1 -----------------------------------------------------------
  function validateFold(doc) {
    var errors = [], warnings = [];
    function E(rule, field, message) { errors.push({ rule: rule, field: field, message: message }); }
    function W(rule, field, message) { warnings.push({ rule: rule, field: field, message: message }); }
    var f = doc && doc.folding;
    if (f == null) return { errors: errors, warnings: warnings };
    if (!f || typeof f !== "object" || Array.isArray(f)) {
      E("F1", "folding", "must be an object"); return { errors: errors, warnings: warnings };
    }
    if (f.schema !== FOLD_SCHEMA) {
      E("F1", "folding.schema", 'expected "' + FOLD_SCHEMA + '", found ' + JSON.stringify(f.schema));
    }
    // D25 - every P7 artifact states the decode-only assumption, in words.
    if (!isStr(f.decode_only)) {
      E("F2", "folding.decode_only",
        "a folding artifact states the decode-only assumption in words (D25). Without it a " +
        "reader cannot tell whether these variants claim anything about prefill - they do not");
    }
    // D26 - the DOA register binds, and it is carried IN the artifact.
    if (!Array.isArray(f.refused)) {
      E("F3", "folding.refused", "the DOA register is part of the artifact (D26): an array of " +
        "{fold, reason, decision}");
    } else {
      var named = {};
      f.refused.forEach(function (r, i) {
        r = r || {};
        if (!isStr(r.fold) || !isStr(r.reason) || !isStr(r.decision)) {
          E("F3", "folding.refused[" + i + "]", "needs fold, reason and decision, all non-empty");
          return;
        }
        named[r.fold] = true;
      });
      DOA_FOLDS.forEach(function (name) {
        if (!named[name]) {
          E("F3", "folding.refused",
            'the DOA register does not refuse "' + name + '" by name. D26 makes the register ' +
            "binding, so an artifact that drops one of its entries is the one place a dead " +
            "fold could come back");
        }
      });
    }
    if (!Array.isArray(f.cards) || !f.cards.length) {
      E("F1", "folding.cards", "a folding block draws at least one card");
      return { errors: errors, warnings: warnings };
    }
    var models = {};
    (doc.systems || []).forEach(function (s) {
      (s.models || []).forEach(function (m) { if (m && m.id != null) models[m.id] = m; });
    });
    f.cards.forEach(function (c, ci) {
      c = c || {};
      var at = "folding.cards[" + (c.id || ci) + "]";
      var cap = capOfCard(doc, c.card);
      var card = cardOf(doc, c.card);
      if (!cap) {
        E("F5", at + ".card", 'no device card "' + c.card + '" in cards[]');
        return;
      }
      var t = c.tensor || {};
      var o = t.owner || {};
      var model = models[o.model];
      if (!model) {
        E("F5", at + ".tensor.owner.model", 'no model "' + o.model + '" in this document');
      } else if ((model.blocks || []).indexOf(o.block) < 0) {
        E("F5", at + ".tensor.owner.block",
          '"' + o.block + '" is not a block of ' + o.model + ": a fold card folds a tensor this " +
          "document's owner vocabulary has");
      }
      if (!isInt(t.K) || t.K <= 0 || !isInt(t.N) || t.N <= 0) {
        E("F5", at + ".tensor", "K and N must be positive integers, found " +
          JSON.stringify(t.K) + " x " + JSON.stringify(t.N));
      } else if (t.cells !== t.K * t.N) {
        E("F5", at + ".tensor.cells",
          "declares " + t.cells + " but K x N = " + (t.K * t.N) + ". One accounting per metric");
      }
      if (!isStr(t.basis)) E("F5", at + ".tensor.basis", "a fold card says where its shape came from");
      var macroCells = (isInt(cap.rows) && isInt(cap.stored_cols)) ? cap.rows * cap.stored_cols : null;
      // F6 - the global cell floor (D27). Analog silicon is decided by the
      // model, not by the mapper, so a card that misstates its own floor is
      // arguing that a fold buys silicon. It does not.
      if (macroCells) {
        var floor = Math.ceil((isInt(t.cells) ? t.cells : 0) / macroCells);
        if (c.floor_macros !== floor) {
          E("F6", at + ".floor_macros",
            "declares " + JSON.stringify(c.floor_macros) + " and ceil(" + t.cells + " / " +
            macroCells + ") is " + floor + ". The floor is the model's, not the fold's (D27)");
        }
        if (!isStr(c.floor_basis)) E("F6", at + ".floor_basis", "the floor states its own arithmetic");
      }

      if (!Array.isArray(c.variants) || c.variants.length < 2) {
        E("F1", at + ".variants",
          "a folding card draws the mapping FAMILY: at least two variants side by side");
        return;
      }
      c.variants.forEach(function (v, vi) {
        v = v || {};
        var va = at + ".variants[" + (v.id || vi) + "]";
        // F4 - a dead fold, refused BY NAME (D26).
        if (DOA_FOLDS.indexOf(v.kind) >= 0) {
          E("F4", va + ".kind",
            '"' + v.kind + '" is in the DOA register: it is refused by name (D26), and drawing ' +
            "it would be machinery for a dead fold");
        } else if (FOLD_KINDS.indexOf(v.kind) < 0) {
          E("F4", va + ".kind",
            "must be one of " + FOLD_KINDS.join(", ") + " (the folds alive in decode), found " +
            JSON.stringify(v.kind));
        }
        if (!isStr(v.label)) E("F1", va + ".label", "a variant is named");
        var boxes = v.boxes || [];
        if (!Array.isArray(boxes) || !boxes.length) {
          E("F1", va + ".boxes", "a variant draws at least one box");
          return;
        }
        var enumerated = 0, mine = 0, covered = {}, dup = null;
        boxes.forEach(function (b, bi) {
          b = b || {};
          var ba = va + ".boxes[" + (b.id || bi) + "]";
          var bcap = capOfCard(doc, b.card || c.card);
          if (!bcap) { E("F5", ba + ".card", 'no device card "' + b.card + '" in cards[]'); return; }
          var macro = b.macro == null ? null : (doc.macros || []).filter(function (m) { return m.id === b.macro; })[0];
          if (b.macro != null && !macro) {
            E("F5", ba + ".macro", 'no macro "' + b.macro + '" in macros[]');
          }
          checkBoxLanes(E, W, ba, b, bcap,
            { lane: "F12", pass: "F12", tile: "F12", idle: null }, doc, macro);
          var list = passesOfBox(b);
          enumerated += list.length;
          if (b.passes !== list.length) {
            E("F9", ba + ".passes",
              "declares " + b.passes + " passes and enumerates " + list.length);
          }
          list.forEach(function (p) {
            if (!sameOwner(p.owner, o)) return;
            mine++;
            if (isInt(p.rows && p.rows.count) && isInt(p.columns && p.columns.count)) {
              var key = p.k_block + "/" + p.n_block;
              if (covered[key]) dup = dup || key;
              covered[key] = (covered[key] || 0) + p.rows.count * p.columns.count;
            }
          });
        });
        // F7 - the enumerated blocks cover the tensor's cells exactly once. A
        // block drawn twice IS replication, caught by construction.
        var sum = 0;
        Object.keys(covered).forEach(function (k) { sum += covered[k]; });
        if (dup) {
          E("F7", va + ".boxes",
            "the (K, N) block " + dup + " is placed twice by this variant. A tensor's block " +
            "stored in two places is replication, and replication is in the DOA register (D26, D27)");
        }
        if (isInt(t.cells) && sum !== t.cells) {
          E("F7", va + ".boxes",
            "the enumerated blocks of this tensor hold " + sum + " cells and the tensor has " +
            t.cells + ". A fold moves cells; it never changes how many there are (D27)");
        }
        // F8 - area, with the accounting it used.
        var a = v.area || {};
        if (["slots", "cell_share"].indexOf(a.basis_kind) < 0) {
          E("F8", va + ".area.basis_kind",
            'must be "slots" (this variant spends whole macro slots) or "cell_share" (dense ' +
            "packing: the tensor's cost is its cells), found " + JSON.stringify(a.basis_kind));
        } else if (!isStr(a.basis)) {
          E("F8", va + ".area.basis", "every area states the arithmetic behind it");
        } else if (card && card.area_mm2 == null) {
          if (a.value !== null) {
            E("F8", va + ".area.value",
              "the card declares no area_mm2, so this variant's area is UNKNOWN and draws as the " +
              "hatch. A number here would fill an absent law with a guess");
          }
        } else if (card) {
          var want = a.basis_kind === "slots"
            ? (isInt(a.slots) ? a.slots * card.area_mm2 : null)
            : (isInt(a.cells) && macroCells ? a.cells / macroCells * card.area_mm2 : null);
          if (want == null) {
            E("F8", va + ".area",
              'a "' + a.basis_kind + '" area declares ' +
              (a.basis_kind === "slots" ? "an integer slots" : "an integer cells") + " count");
          } else if (!isNum(a.value) || Math.abs(a.value - want) > EPS) {
            E("F8", va + ".area.value",
              "declares " + fmt(a.value) + " mm2 but its own " + a.basis_kind +
              " accounting gives " + fmt(want) + " mm2");
          }
        }
        // F9 - time: the pass COUNT is the exact part and it must agree. It
        // counts THIS tensor's passes: a co-tenant sharing a bank pays its own
        // pass, and charging it to this tensor would be a second accounting.
        var tm = v.time || {};
        if (tm.passes !== mine) {
          E("F9", va + ".time.passes",
            "declares " + tm.passes + " and the variant draws " + mine +
            " passes on this tensor (" + enumerated + " in all, co-tenants included). " +
            "The pass count is the exact half of this figure");
        }
        if (!isStr(tm.basis)) E("F9", va + ".time.basis", "every time states where it came from");
        if (tm.value !== null && !isNum(tm.value)) {
          E("F9", va + ".time.value", "must be a finite number of seconds, or null when no law prices it");
        }
        // F10 - energy: null is legal, a SILENT zero is not.
        var en = v.energy || {};
        if (en.value === null) {
          if (!isStr(en.uncovered)) {
            E("F10", va + ".energy.uncovered",
              "an energy with no value states which law is ABSENT. An uncovered term and a " +
              "measured zero are not the same statement (D21)");
          }
        } else if (!isNum(en.value)) {
          E("F10", va + ".energy.value", "must be a finite number, or null with an uncovered reason");
        }
        // F11 - waste is a first-class REPORTED metric (D27), never silent.
        var w = v.waste || {};
        if (!isInt(w.cells) || w.cells < 0 || !isInt(w.denominator_cells) || w.denominator_cells <= 0) {
          E("F11", va + ".waste",
            "every variant reports the weight space it leaves over: cells and denominator_cells " +
            "as non-negative integers (D27 makes waste a reported metric)");
        } else {
          var wantPct = w.cells / w.denominator_cells * 100;
          if (!isNum(w.pct) || Math.abs(w.pct - wantPct) > 1e-6) {
            E("F11", va + ".waste.pct",
              "declares " + fmt(w.pct) + "% but " + w.cells + " / " + w.denominator_cells +
              " is " + fmt(wantPct) + "%");
          }
          if (!isStr(w.basis)) E("F11", va + ".waste.basis", "a waste figure states what it counted");
          // P7.2's own itemization, when the producer carries it: waste_cells =
          // remainder_cells + tail_cells and there is no third term.
          if (w.terms) {
            var rem = w.terms.remainder_cells, tail = w.terms.tail_cells;
            if (!isInt(rem) || rem < 0 || !isInt(tail) || tail < 0 || rem + tail !== w.cells) {
              E("F11", va + ".waste.terms",
                "remainder_cells + tail_cells must be the waste, and nothing else: " +
                JSON.stringify(rem) + " + " + JSON.stringify(tail) + " against " + w.cells +
                " (cim_timing.dense_pack's itemization, P7.2)");
            }
          }
        }
        // F13 - the accumulator, drawn where the K partials meet.
        var acc = v.accumulator || {};
        if (["none", "in_macro", "cross_macro"].indexOf(acc.where) < 0) {
          E("F13", va + ".accumulator.where",
            'must be "none", "in_macro" or "cross_macro", found ' + JSON.stringify(acc.where));
        }
        var kBlocks = {};
        Object.keys(covered).forEach(function (k) { kBlocks[k.split("/")[0]] = true; });
        var multiK = Object.keys(kBlocks).length > 1;
        if (multiK && acc.where === "none") {
          E("F13", va + ".accumulator.where",
            "this variant places " + Object.keys(kBlocks).length + " K blocks of one tensor and " +
            "declares no accumulator. K partials have to meet somewhere, and the card draws where");
        }
        if (multiK && (!isInt(acc.operands) || acc.operands < 2)) {
          E("F13", va + ".accumulator.operands",
            "K partials meet in an accumulator of at least 2 operands, found " + JSON.stringify(acc.operands));
        }
        (acc.sites || []).forEach(function (sid) {
          var hit = boxes.filter(function (b) { return b && b.id === sid; }).length;
          if (!hit) E("F13", va + ".accumulator.sites", 'names box "' + sid + '", which this variant does not draw');
        });
        if (!isNum(acc.transport_bytes) || acc.transport_bytes < 0) {
          E("F13", va + ".accumulator.transport_bytes",
            "a partial that crosses a macro boundary is bytes; declare 0 when nothing crosses");
        } else if (acc.where === "in_macro" && acc.transport_bytes !== 0) {
          E("F13", va + ".accumulator.transport_bytes",
            "an in-macro accumulator moves no partial off its macro, so this term is 0 by " +
            "construction; found " + acc.transport_bytes);
        }
        if (!isStr(acc.basis)) E("F13", va + ".accumulator.basis", "the accumulator states its own law");
      });
    });
    return { errors: errors, warnings: warnings };
  }

  // ---- fws_pass/1 -----------------------------------------------------------
  function validatePasses(doc) {
    var errors = [], warnings = [];
    function E(rule, field, message) { errors.push({ rule: rule, field: field, message: message }); }
    function W(rule, field, message) { warnings.push({ rule: rule, field: field, message: message }); }
    var p = doc && doc.passes;
    if (p == null) return { errors: errors, warnings: warnings };
    if (!p || typeof p !== "object" || Array.isArray(p)) {
      E("T1", "passes", "must be an object"); return { errors: errors, warnings: warnings };
    }
    if (p.schema !== PASS_SCHEMA) {
      E("T1", "passes.schema", 'expected "' + PASS_SCHEMA + '", found ' + JSON.stringify(p.schema));
    }
    // D25 - decode only, and the time-lane view refuses a prefill schedule by name.
    if (p.phase !== "decode") {
      E("T2", "passes.phase",
        'must be "decode": P7 is decode only (D25), and a prefill schedule - concurrent layers, ' +
        "SSD chunking - is refused by name rather than drawn on a decode axis. Found " +
        JSON.stringify(p.phase));
    }
    var st = p.step || {};
    if (!isInt(st.index) || st.index < 0 || !isInt(st.of) || st.of <= 0 || !isStr(st.basis)) {
      E("T3", "passes.step",
        "a schedule says WHICH decode step it is and out of what window: {index, of, basis}");
    }
    if (p.pass_time_s != null && !isNum(p.pass_time_s)) {
      E("T3", "passes.pass_time_s", "must be a finite number of seconds, or absent");
    }
    if (p.pass_time_s != null && !isStr(p.pass_time_basis)) {
      E("T3", "passes.pass_time_basis", "a per-pass time states where it came from");
    }
    if (!Array.isArray(p.boxes) || !p.boxes.length) {
      E("T1", "passes.boxes", "a schedule draws at least one macro");
      return { errors: errors, warnings: warnings };
    }
    p.boxes.forEach(function (b, bi) {
