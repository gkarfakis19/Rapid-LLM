# EMITTED BY tools/fws_qif_dse.py — the winning point of a mapped-path sweep
# (QIF P3.7). This is a COMPLETE RUNNABLE fws_cim hardware config: the base
# config of the sweep with the selected candidate's knobs written in and the
# `mapping_dse` sweep block removed (a runnable config declares a machine, not a
# candidate space).
#
# sweep base:  configs/hardware-config/fws_cim_granite_tiny_frontier.yaml
# model:       configs/model-config/granite_4_0_h_tiny_inf.yaml
# candidate:   c003 (layers_per_chip = 4, arrays_per_chip = 604, bank_depth = 1)
# headline:    26051.9 tokens/s, measured on this point's own timeline by fws_eval
#              (ADJ-6: tokens/s at the decode terminal when the run decodes).
device_class: fws_cim
cim:
  analog:
    rows: 1536
    cols_adc: 384
    adc_mux: 4
    slice_cycles: 2
    analog_clock_mhz: 100
    energy_per_vec_pj: 13730.312016
    shots_per_output: 2
    area_mm2_per_array: 2.0204136
  fabric:
    model: sa
    rows: 32
    cols: 64
    num_arrays: 2
    replicas: 1
    clock_ghz: 0.95
    softmax_lanes: 1
    softmax_pipeline_depth: 20
  chip:
    arrays_per_chip: 604
    layers_per_chip: 4
    moe_expert_parallel: 1
  cards:
    ctt:
      kind: analog_macro
      device: ctt
      bank_depth: 1
    sa:
      kind: digital_chiplet
      synthesis_library: 22nm
sw_param:
  full_recomputation: false
  kernel_launch_overhead: 0
  dp_zero_stage: 0
  precision:
    tensor_format: bf16
    kv_cache: as_tensor_format
    parameters: as_tensor_format
    gradients: fp32
    grad_communication: fp32
    optimizer_states: as_tensor_format
    stats: as_tensor_format
    master_parameters: 0.0
  h2d_bandwidth: -1
  const_mem_offset: 0 GB
tech_param:
  core:
    operating_frequency: 0.95e9
    num_bundles: 2
    nominal_flop_rate_per_mcu: 4096
    nominal_energy_per_flop: 1e-13
    num_mcu_per_bundle: 1
    FMA_d1: 8
    FMA_d2: 4
    dataflow: best
    util: 1
  DRAM:
    size: 8 GB
    bandwidth: 4 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1.0
  SRAM-L2:
    size: 64 MB
    bandwidth: 8 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
  SRAM-L1:
    size: 8 MB
    bandwidth: 16 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
  SRAM-R:
    size: 4 MB
    bandwidth: 128 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
memory_hierarchy:
  l0:
    type: SRAM-R
    scope: mcu
  l1:
    type: SRAM-L1
    scope: mcu-bundle
  l2:
    type: SRAM-L2
    scope: global
  l3:
    type: DRAM
    scope: global
parallelism:
  tp: 1
  tp_sp: false
  cp: 1
  pp: 1
  mb: 1
  train:
    dp: 1
    ep: 1
    tp_ep: true
  inference:
    replica_count: 1
    moe_dp: 1
network:
  overlap:
    tp_overlap: 0.0
    tp_sp_overlap: 0.0
    cp_overlap: 0.0
  dimensions:
  - id: dim0
    label: chip_ring_ep_tp
    size: auto
    topology:
      type: Ring
      bandwidth: 100 GB
      latency: 1e-6
      energy_per_bit: 1e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - tp
    - cp
    - ep
  - id: dim1
    label: chip_ring_pp
    size: auto
    topology:
      type: Ring
      bandwidth: 100 GB
      latency: 1e-6
      energy_per_bit: 1e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - pp
    - dp
execution_backend:
  model: analytical
inference:
  kvcache_type: cim_sram
mapping:
  parallelism:
    tp: 1
  packing: dense
  decode_window: 3
  layers_per_chip: 4
