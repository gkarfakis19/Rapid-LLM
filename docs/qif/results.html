<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QIF Results</title>
<style>
:root{--ink:#1c2a33;--muted:#5f7280;--accent:#176778;--line:#dde5e9;--bg:#f7f9fa;--card:#ffffff;--code:#eef2f4;
--g1:#176778;--g2:#8a5a10;--warn:#8a3a10;--ok:#1d6b3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",system-ui,sans-serif}
main{max-width:76rem;margin:0 auto;padding:2rem 1.5rem 5rem}
a{color:var(--accent)}
.crumb{font:12px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:1.2rem}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font:400 2rem/1.2 Georgia,serif;margin:.2rem 0 .3rem;text-wrap:balance}
h2{font:600 1rem/1.3 "Segoe UI",system-ui,sans-serif;margin:2.2rem 0 .7rem;padding-top:.9rem;border-top:1px solid var(--line)}
.sub{color:var(--muted);margin:0 0 1.4rem;max-width:52rem}
.hl{display:flex;flex-wrap:wrap;gap:.8rem;margin:1rem 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem 1rem;min-width:9.5rem}
.stat .v{font:600 1.35rem/1.2 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat .k{font:11px/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:.15rem}
.stat .b{font:11px/1.35 "Segoe UI",system-ui,sans-serif;color:var(--muted);margin-top:.3rem;max-width:14rem}
svg{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1rem;overflow-x:auto}
table{border-collapse:collapse;width:100%;font:13.5px/1.5 "Segoe UI",system-ui,sans-serif;margin:.4rem 0}
th{text-align:left;border-bottom:2px solid var(--ink);padding:.35rem .5rem;font-weight:600}
td{border-bottom:1px solid var(--line);padding:.35rem .5rem;vertical-align:top;font-variant-numeric:tabular-nums}
td.basis{color:var(--muted);font-size:12.5px;max-width:34rem}
code{font:.85em ui-monospace,Menlo,monospace;background:var(--code);padding:.06em .3em;border-radius:3px}
.disc{background:var(--code);border-left:3px solid var(--muted);padding:.7rem .9rem;margin:.6rem 0;font:12.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#3d4f5c}
.cardrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.9rem;margin:1rem 0}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1rem;cursor:pointer}
.mcard:hover{border-color:var(--accent)}
.mcard h3{margin:0 0 .3rem;font:600 1.05rem/1.3 "Segoe UI",system-ui,sans-serif}
.mcard .nums{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.tag{display:inline-block;font:600 10.5px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:.25em .55em;border-radius:999px;background:var(--code);color:var(--muted)}
.verd-ok{color:var(--ok);font-weight:600}.verd-bad{color:var(--warn);font-weight:600}
#tip{position:fixed;z-index:10;background:#20303b;color:#eef4f7;border-radius:5px;padding:.55rem .75rem;font:12.5px/1.5 "Segoe UI",system-ui,sans-serif;max-width:26rem;pointer-events:none;display:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#tip .t{font-weight:600;margin-bottom:.15rem}
#tip .b{color:#aebfca;font-size:11.5px;margin-top:.25rem}
.note{font:12.5px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--muted)}
.err{color:var(--warn);font-weight:600}
</style>
</head>
<body><main id="app"><p class="note">loading artifacts&hellip;</p></main>
<div id="tip"></div>
<script>
'use strict';
/* QIF results — orchestrator-built. Reads real artifacts only; a missing field
   renders as an absence, never a guess. Data is fetched at load so regenerated
   artifacts appear on refresh. */
var MODELS = [
  { id: 'granite_4_0_h_tiny', label: 'Granite-4.0-H-Tiny', color: 'var(--g1)', hex: '#176778' },
  { id: 'qwen3_5_4b', label: 'Qwen3.5-4B', color: 'var(--g2)', hex: '#8a5a10' }
];
var DATA = {};

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmt(v, digits){
  if (v==null || isNaN(v)) return '—';
  if (v===0) return '0';
  if (Math.abs(v)>=1e6) return (v/1e6).toFixed(2)+'M';
  if (Math.abs(v)>=1e4) return Math.round(v).toLocaleString('en-US');
  if (Math.abs(v)>=1) return (+v).toFixed(digits==null?2:digits).replace(/\.00$/,'');
  if (Math.abs(v)>=1e-3) return (v*1e3).toFixed(3)+'m';
  if (Math.abs(v)>=1e-6) return (v*1e6).toFixed(2)+'µ';
  return v.toExponential(2);
}
function bytesFmt(b){
  if (b==null) return '—';
  if (b>=1073741824) return (b/1073741824).toFixed(2)+' GiB';
  if (b>=1048576) return (b/1048576).toFixed(2)+' MiB';
  if (b>=1024) return (b/1024).toFixed(1)+' KiB';
  return Math.round(b)+' B';
}
function entriesOf(x){
  // report: evaluation.metrics is a LIST; candidates: metrics.entries; tolerate both
  if (!x) return [];
  if (Array.isArray(x)) return x;
  if (Array.isArray(x.entries)) return x.entries;
  return [];
}
function entryMap(entries){
  var m={}; (entries||[]).forEach(function(e){ m[e.key]=e; }); return m;
}
function findEntry(entries, frag){
  var hit=null; (entries||[]).forEach(function(e){ if(!hit && e.key && e.key.indexOf(frag)>=0) hit=e; }); return hit;
}
function deepFindNumber(obj, keyRe, best){
  // tolerant extraction: first numeric leaf whose key matches, prefer keys containing "total"
  var out = best || {v:null, score:-1};
  if (obj && typeof obj === 'object') {
    Object.keys(obj).forEach(function(k){
      var v = obj[k];
      if (typeof v === 'number' && keyRe.test(k)) {
        var score = /total/.test(k) ? 2 : 1;
        if (score > out.score) { out.v = v; out.score = score; out.key = k; }
      } else if (v && typeof v === 'object') deepFindNumber(v, keyRe, out);
    });
  }
  return out;
}

/* ---------- tooltip ---------- */
var tip = null;
function tipShow(html, ev){ tip.innerHTML=html; tip.style.display='block'; tipMove(ev); }
function tipMove(ev){
  var x=ev.clientX+14, y=ev.clientY+12;
  if (x+tip.offsetWidth > window.innerWidth-10) x = ev.clientX-tip.offsetWidth-10;
  if (y+tip.offsetHeight > window.innerHeight-10) y = ev.clientY-tip.offsetHeight-10;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function tipHide(){ tip.style.display='none'; }
function hoverable(el, htmlFn){
  el.addEventListener('mousemove', function(ev){ tipShow(htmlFn(), ev); });
  el.addEventListener('mouseleave', tipHide);
}

/* ---------- data load ---------- */
function fetchJson(url){
  return fetch(url, {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}
function boot(){
  tip=document.getElementById('tip');
  window.addEventListener('hashchange', route);
  route();
}
if (window.PRELOADED_DATA){ DATA = window.PRELOADED_DATA; boot(); }
else Promise.all(MODELS.map(function(m){
  return Promise.all([
    fetchJson('atlas/'+m.id+'_report.json'),
    fetchJson('atlas/'+m.id+'.json'),
    fetchJson('dse/'+m.id+'_frontier/dse_report.json')
  ]).then(function(r){ DATA[m.id]={report:r[0], atlas:r[1], frontier:r[2]}; });
})).then(boot);

function route(){
  var h = location.hash || '#/';
  var mm = h.match(/^#\/m\/([\w.\-]+)/);
  if (mm && DATA[mm[1]]) renderModel(mm[1]); else renderFront();
  window.scrollTo(0,0);
}

/* ---------- candidate extraction for frontier ---------- */
function candXY(c){
  var ce = entriesOf(c.metrics);
  var em = entryMap(ce);
  var tps = em['sys.fws.tokens_per_s'] || findEntry(ce, 'tokens_per_s');
  var area = deepFindNumber(c.silicon || {}, /mm2/);
  return { x: area.v, xkey: area.key, y: tps ? tps.value : null, em: em };
}
function candTip(mLabel, c){
  var xy = candXY(c);
  var knobs = Object.keys(c.knobs||{}).map(function(k){ return k+' = '+c.knobs[k]; }).join('<br>');
  var d = (c.pipeline && c.pipeline.resident_streams)!=null ? c.pipeline.resident_streams : null;
  var extra = '';
  if (!c.ok) extra = '<div class="b">INFEASIBLE ['+esc(c.fail_stage)+']: '+esc((c.fail_message||'').slice(0,180))+'</div>';
  return '<div class="t">'+esc(mLabel)+' · '+esc(c.id)+'</div>'
    + (xy.y!=null ? fmt(xy.y)+' tok/s' : '—')+' · '+(xy.x!=null? fmt(xy.x)+' mm²':'—')
    + (d!=null ? ' · D='+d : '')
    + '<div class="b">'+knobs+'</div>' + extra;
}

/* ---------- frontier plot ---------- */
function frontierSVG(seriesList, opts){
  // seriesList: [{label, hex, cands:[{c, x, y, onFront, selected}], modelId}]
  var W=opts.w||900, H=opts.h||420, L=70, R=20, T=18, B=46;
  var xs=[], ys=[];
  seriesList.forEach(function(s){ s.cands.forEach(function(p){ if(p.x!=null&&p.y!=null){xs.push(p.x);ys.push(p.y);} }); });
  if (!xs.length) return null;
  var xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  var pad=(xmax-xmin)*0.06 || xmax*0.01; xmin-=pad; xmax+=pad;
  var ymax=Math.max.apply(null,ys)*1.06;
  function X(v){ return L + (v-xmin)/(xmax-xmin)*(W-L-R); }
  function Y(v){ return T + (1 - v/ymax)*(H-T-B); }
  var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width','100%');
  svg.style.maxWidth = W+'px';
  var ns='http://www.w3.org/2000/svg';
  function el(t,att){ var e=document.createElementNS(ns,t); Object.keys(att||{}).forEach(function(k){e.setAttribute(k,att[k]);}); svg.appendChild(e); return e; }
  // gridlines + ticks
  function ticks(min,max,n){
    var span=max-min, step=Math.pow(10,Math.floor(Math.log10(span/n)));
    if (span/step > n*2) step*=5; else if (span/step > n) step*=2;
    var t=[], v=Math.ceil(min/step)*step;
    for(; v<=max; v+=step) t.push(v);
    return t;
  }
  ticks(0,ymax,6).forEach(function(v){
    el('line',{x1:L,y1:Y(v),x2:W-R,y2:Y(v),stroke:'#e8eef1','stroke-width':1});
    var t=el('text',{x:L-8,y:Y(v)+4,'text-anchor':'end','font-size':11,fill:'#5f7280'}); t.textContent=fmt(v);
  });
  ticks(xmin,xmax,7).forEach(function(v){
    var t=el('text',{x:X(v),y:H-B+18,'text-anchor':'middle','font-size':11,fill:'#5f7280'}); t.textContent=fmt(v);
  });
  el('line',{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:'#1c2a33','stroke-width':1.2});
  el('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:'#1c2a33','stroke-width':1.2});
  var xl=el('text',{x:(L+W-R)/2,y:H-8,'text-anchor':'middle','font-size':12,fill:'#3d4f5c'}); xl.textContent='total silicon (mm²) — analog floor + composed digital';
  var yl=el('text',{x:14,y:(T+H-B)/2,'font-size':12,fill:'#3d4f5c',transform:'rotate(-90 14 '+((T+H-B)/2)+')','text-anchor':'middle'}); yl.textContent='decode tokens / s (= 1 / beat)';
  seriesList.forEach(function(s){
    // front polyline
    var front = s.cands.filter(function(p){return p.onFront && p.x!=null;}).sort(function(a,b){return a.x-b.x;});
    if (front.length>1){
      el('polyline',{points:front.map(function(p){return X(p.x)+','+Y(p.y);}).join(' '),fill:'none',stroke:s.hex,'stroke-width':2,'stroke-opacity':.55});
    }
    s.cands.forEach(function(p){
      if (p.x==null||p.y==null) return;
      var c = el('circle',{cx:X(p.x),cy:Y(p.y),r:p.selected?7:5,fill:p.c.ok?s.hex:'#ffffff',stroke:s.hex,'stroke-width':p.c.ok?0:1.6,opacity:p.c.ok?(p.onFront?1:.45):.8,cursor:'pointer'});
      if (p.selected) el('circle',{cx:X(p.x),cy:Y(p.y),r:11,fill:'none',stroke:s.hex,'stroke-width':1.4,'stroke-dasharray':'3 2'});
      hoverable(c, function(){ return candTip(s.label, p.c); });
      c.addEventListener('click', function(){ location.hash='#/m/'+s.modelId; });
    });
  });
  return svg;
}
function seriesFor(m){
  var f = DATA[m.id].frontier;
  if (!f || !f.candidates) return null;
  var frontIds = f.front_ids || [];
  return {
    label:m.label, hex:m.hex, modelId:m.id,
    cands: f.candidates.map(function(c){
      var xy=candXY(c);
      return {c:c, x:xy.x, y:xy.y, onFront: frontIds.indexOf(c.id)>=0, selected: c.id===f.selected_id};
    })
  };
}

/* ---------- pipeline map ---------- */
function pipelineSVG(m){
  var rep = DATA[m.id].report, atl = DATA[m.id].atlas;
  if (!rep || !atl) return null;
  var pipe = rep.evaluation && rep.evaluation.pipeline;
  var stages = (pipe && pipe.stages) || [];
  if (!stages.length) return null;
  var chipsById={}; (atl.chips||[]).forEach(function(c){ chipsById[c.id]=c; });
  var analog=(atl.chips||[]).filter(function(c){return c.pool==='analog';});
  var digital=(atl.chips||[]).filter(function(c){return c.pool!=='analog';});
  // analog chip index -> atlas chip: match by trailing number in id
  function chipByIndex(i){
    var hit=null;
    analog.forEach(function(c){ var mm=c.id.match(/(\d+)$/); if(mm && parseInt(mm[1],10)===i) hit=c; });
    return hit || analog[i] || null;
  }
  function occupiedSlots(c){
    if (!c) return 1;
    var slots = (c.capacity && (c.capacity.macro_slots||c.capacity.slots)) || (c.macros? c.macros.length : 1);
    var occ = (typeof c.occupancy==='number') ? c.occupancy : 1;
    return Math.max(1, slots*occ);
  }
  // geometry
  var W=1100, rowA_y=250, rowA_h=64, rowD_y=60, rowD_h=48, L=30, R=30, GAP=8;
  var widths = stages.map(function(st){
    return (st.chips||[]).reduce(function(a,ci){ return a+occupiedSlots(chipByIndex(ci)); },0) || 1;
  });
  var totalW = widths.reduce(function(a,b){return a+b;},0);
  var usable = W-L-R-GAP*(stages.length-1);
  var H = rowA_y+rowA_h+70;
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.maxWidth=W+'px';
  var ns='http://www.w3.org/2000/svg';
  function el(t,att,parent){ var e=document.createElementNS(ns,t); Object.keys(att||{}).forEach(function(k){e.setAttribute(k,att[k]);}); (parent||svg).appendChild(e); return e; }
  // band labels
  var bl=el('text',{x:L,y:rowD_y-14,'font-size':11,fill:'#5f7280','letter-spacing':'.08em'}); bl.textContent='SHARED DIGITAL — scan / attention engines';
  var bl2=el('text',{x:L,y:rowA_y-10,'font-size':11,fill:'#5f7280','letter-spacing':'.08em'}); bl2.textContent='ANALOG — weight macros (width ∝ occupied macro slots), pipeline order →';
  // analog segments
  var x=L, seg=[];
  stages.forEach(function(st,i){
    var w = usable*widths[i]/totalW;
    var chip = chipByIndex((st.chips||[])[0]);
    var g = el('g',{});
    var r = el('rect',{x:x,y:rowA_y,width:w,height:rowA_h,rx:4,fill:'#dfe9ee',stroke:'#176778','stroke-width':1.2,cursor:'pointer'},g);
    var occ=(chip && typeof chip.occupancy==='number')? chip.occupancy : null;
    if (occ!=null) el('rect',{x:x,y:rowA_y+rowA_h-6,width:w*Math.min(1,occ),height:6,rx:2,fill:'#176778','fill-opacity':.65},g);
    var t=el('text',{x:x+w/2,y:rowA_y+24,'text-anchor':'middle','font-size':11.5,fill:'#1c2a33','font-weight':600},g);
    t.textContent='S'+st.stage;
    var t2=el('text',{x:x+w/2,y:rowA_y+40,'text-anchor':'middle','font-size':10.5,fill:'#5f7280'},g);
    t2.textContent='L'+st.layers[0]+'–'+st.layers[st.layers.length-1];
    (function(stx,chipx,wx){
      hoverable(r, function(){
        var slots = chipx? occupiedSlots(chipx):null;
        return '<div class="t">'+esc(stx.label||('stage '+stx.stage))+'</div>'
          +'chips: '+esc((stx.chips||[]).join(', '))
          +(slots!=null?'<br>occupied macro slots: '+Math.round(slots):'')
          +(chipx&&chipx.occupancy!=null?'<br>bank occupancy: '+(chipx.occupancy*100).toFixed(1)+'%':'')
          +'<div class="b">click opens the macro-level atlas view</div>';
      });
      r.addEventListener('click', function(){ window.open('atlas/atlas.html?view=chip&chip='+encodeURIComponent(chipx?chipx.id:''),'_blank'); });
    })(st, chip, w);
    seg.push({x:x,w:w,cx:x+w/2,stage:st,chip:chip});
    x+=w+GAP;
  });
  // boundary act links between adjacent segments
  var links=(atl.links||[]);
  links.filter(function(l){return l.role==='act';}).forEach(function(l,i){
    if (i+1>=seg.length) return;
    var x1=seg[i].x+seg[i].w, x2=seg[i+1].x, ym=rowA_y+rowA_h/2;
    var p=el('path',{d:'M'+(x1-2)+' '+ym+' L'+(x2+2)+' '+ym,stroke:'#3d4f5c','stroke-width':2,fill:'none','marker-end':'url(#arr)'});
    var hit=el('path',{d:'M'+(x1-6)+' '+ym+' L'+(x2+6)+' '+ym,stroke:'transparent','stroke-width':14,fill:'none',cursor:'pointer'});
    (function(lx){ hoverable(hit, function(){
      return '<div class="t">'+esc(lx.label||lx.id)+'</div>'+bytesFmt(lx.bytes)+' per '+esc(lx.per||'?')
        +'<div class="b">'+esc(lx.basis||'')+'</div>';
    });})(l);
  });
  var defs=el('defs',{}); var mk=el('marker',{id:'arr',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'},defs);
  el('path',{d:'M0 0 L10 5 L0 10 z',fill:'#3d4f5c'},mk);
  // digital chiplets + service wires (role svc). If none exported, lay chiplets evenly with a note.
  var svc = links.filter(function(l){return l.role==='svc';});
  var served={}; svc.forEach(function(l){ (served[l.from]=served[l.from]||[]).push(l); });
  var digIds = digital.map(function(c){return c.id;});
  var laneY = rowD_y+rowD_h+26, laneStep=12;
  digIds.forEach(function(did,di){
    var myLinks = served[did]||[];
    // span over served analog segments (by matching link.to to chip ids)
    var xs=[];
    myLinks.forEach(function(l){ seg.forEach(function(s){ if(s.chip && s.chip.id===l.to) xs.push(s.cx); }); });
    var cx0, cw;
    if (xs.length){ var mn=Math.min.apply(null,xs), mx=Math.max.apply(null,xs); cx0=(mn+mx)/2; cw=Math.max(60, mx-mn>120?110:80); }
    else { cw=90; cx0=L+40+di*( (W-L-R-80)/Math.max(1,digIds.length-1) || 0 ); if(digIds.length===1) cx0=W/2; }
    var dx=cx0-cw/2;
    var chip=chipsById[did];
    var r=el('rect',{x:dx,y:rowD_y,width:cw,height:rowD_h,rx:4,fill:'#eee9db',stroke:'#8a5a10','stroke-width':1.2,cursor:'pointer'});
    var t=el('text',{x:cx0,y:rowD_y+rowD_h/2+4,'text-anchor':'middle','font-size':10.5,fill:'#1c2a33'});
    var mnum=did.match(/(\d+)$/); t.textContent='DIG '+(mnum?parseInt(mnum[1],10):di);
    (function(cx){ hoverable(r, function(){
      return '<div class="t">'+esc(cx&&cx.label||did)+'</div>pool: shared digital'
        +(myLinks.length?'<br>services '+myLinks.length+' analog chip(s)':'<br><span style="color:#e8b46a">no service links exported in this artifact</span>');
    });})(chip);
    // wires: trunk -> bus lane -> drops
    if (myLinks.length){
      var busY = laneY + di*laneStep;
      var total = myLinks.reduce(function(a,l){return a+(l.bytes||0);},0);
      var tw = Math.max(2, Math.min(9, Math.log2(1+total/1024)));
      var trunk=el('path',{d:'M'+cx0+' '+(rowD_y+rowD_h)+' L'+cx0+' '+busY,stroke:'#4a5f6d','stroke-width':tw,fill:'none'});
      var dropXs = myLinks.map(function(l){ var hx=null; seg.forEach(function(s){ if(s.chip&&s.chip.id===l.to) hx=s.cx; }); return hx; });
      var valid = dropXs.filter(function(v){return v!=null;});
      if (valid.length){
        var mn=Math.min.apply(null,valid.concat([cx0])), mx=Math.max.apply(null,valid.concat([cx0]));
        el('path',{d:'M'+mn+' '+busY+' L'+mx+' '+busY,stroke:'#4a5f6d','stroke-width':tw,fill:'none'});
        el('circle',{cx:cx0,cy:busY,r:2.6,fill:'#4a5f6d'});
        myLinks.forEach(function(l,li){
          var hx=dropXs[li]; if(hx==null) return;
          var bw=Math.max(1.4, Math.min(7, Math.log2(1+(l.bytes||0)/1024)));
          el('path',{d:'M'+hx+' '+busY+' L'+hx+' '+rowA_y,stroke:'#4a5f6d','stroke-width':bw,fill:'none'});
          var hit=el('path',{d:'M'+hx+' '+busY+' L'+hx+' '+rowA_y,stroke:'transparent','stroke-width':14,fill:'none',cursor:'pointer'});
          (function(lx){ hoverable(hit, function(){
            return '<div class="t">'+esc(lx.label||lx.id)+'</div>'+bytesFmt(lx.bytes)+' per '+esc(lx.per||'?')
              +'<div class="b">'+esc(lx.basis||'')+'</div>';
          });})(l);
        });
      }
      hoverable(trunk, function(){ return '<div class="t">service trunk</div>'+bytesFmt(total)+' total per beat across '+myLinks.length+' branch(es)'; });
    }
  });
  var out=document.createElement('div');
  out.appendChild(svg);
  if (!svc.length){
    var n=document.createElement('p'); n.className='note';
    n.innerHTML='Digital&rarr;analog service wires: <b>not present in this artifact</b> — the export gains <code>role: "svc"</code> links in the in-flight regeneration; this map draws them automatically once the artifact carries them. Only the real boundary links are drawn.';
    out.appendChild(n);
  }
  return out;
}

/* ---------- pages ---------- */
function headlineStats(m){
  var rep=DATA[m.id].report; if(!rep) return '';
  var re_ = entriesOf(rep.evaluation && rep.evaluation.metrics);
  var em = entryMap(re_);
  function stat(key, label, unitFn){
    var e = em[key] || findEntry(re_, key);
    if (!e) return '';
    return '<div class="stat"><div class="v">'+ (unitFn?unitFn(e.value):fmt(e.value)) +'</div><div class="k">'+esc(label)+'</div></div>';
  }
  var pipe = rep.evaluation && rep.evaluation.pipeline;
  var extra = pipe && pipe.resident_streams!=null ? '<div class="stat"><div class="v">'+pipe.resident_streams+'</div><div class="k">resident streams (D)</div></div>' : '';
  return '<div class="hl">'
    + stat('sys.fws.tokens_per_s','decode tokens / s (headline)')
    + stat('sys.fws.beat','pipeline beat', function(v){return fmt(v*1e6,2)+' µs';})
    + extra
    + stat('sys.fws.per_stream_tokens_per_s','per-stream tokens / s')
    + stat('sys.fws.per_token_latency','per-token latency', function(v){return v>=0.01? fmt(v*1e3,2)+' ms' : fmt(v*1e6,1)+' µs';})
    + '</div>';
}
function renderFront(){
  var app=document.getElementById('app');
  var html='<div class="crumb"><a href="index.html">QIF board</a> &middot; results</div>'
    +'<h1>QIF Results</h1>'
    +'<p class="sub">Decode-only, filled pipeline (D29): local batch 1, one token exits per beat, D resident streams. '
    +'Every number below is a projection of one priced timeline; the frontier sweeps stage granularity, banking and chip capacity with the digital side derived, never swept. Prefill is external by assumption.</p>'
    +'<h2>The frontier — all models</h2><div class="panel" id="plot"></div>'
    +'<h2>Models</h2><div class="cardrow" id="cards"></div>'
    +'<p class="note">Deep dives: <a href="atlas/atlas.html">tile-level atlas</a> · <a href="index.html">plan board</a></p>';
  app.innerHTML=html;
  var series = MODELS.map(seriesFor).filter(Boolean);
  var svg = frontierSVG(series, {w:1000,h:460});
  var plot=document.getElementById('plot');
  if (svg) plot.appendChild(svg); else plot.innerHTML='<p class="err">no frontier artifacts found</p>';
  var legend=document.createElement('p'); legend.className='note';
  legend.innerHTML=MODELS.map(function(m){return '<span style="color:'+m.hex+';font-weight:600">●</span> '+esc(m.label);}).join(' &nbsp; ')
    +' &nbsp;·&nbsp; filled = feasible, hollow = refused (hover for the named verdict), ring = selected, line = Pareto front';
  plot.appendChild(legend);
  var cards=document.getElementById('cards');
  MODELS.forEach(function(m){
    var d=DATA[m.id];
    var div=document.createElement('div'); div.className='mcard';
    if (!d.report){ div.innerHTML='<h3>'+esc(m.label)+'</h3><p class="err">report artifact missing</p>'; }
    else {
      var em=entryMap(entriesOf(d.report.evaluation.metrics));
      var tps=em['sys.fws.tokens_per_s'], beat=em['sys.fws.beat'];
      var D=d.report.evaluation.pipeline? d.report.evaluation.pipeline.resident_streams : null;
      div.innerHTML='<h3 style="color:'+m.hex+'">'+esc(m.label)+'</h3>'
        +'<div class="nums">'+(tps?fmt(tps.value)+' tok/s':'—')
        +(beat? ' · beat '+fmt(beat.value*1e6,2)+' µs':'')
        +(D!=null? ' · D='+D:'')+'</div>'
        +'<div class="nums" style="margin-top:.4rem">open results →</div>';
    }
    div.addEventListener('click',function(){ location.hash='#/m/'+m.id; });
    cards.appendChild(div);
  });
}
function kvTable(rows){
  return '<table><tr><th>metric</th><th>value</th><th>basis</th></tr>'+rows.join('')+'</table>';
}
function renderModel(id){
  var m=MODELS.filter(function(x){return x.id===id;})[0];
  var d=DATA[id]; var rep=d.report;
  var app=document.getElementById('app');
  var html='<div class="crumb"><a href="index.html">QIF board</a> &middot; <a href="#/">results</a> &middot; '+esc(m.label)+'</div>'
    +'<h1 style="color:'+m.hex+'">'+esc(m.label)+'</h1>'
    +'<p class="sub">'+(rep&&rep.note?esc(rep.note):'decode-only, filled pipeline')+'</p>'
    + headlineStats(m)
    +'<h2>Frontier — where this mapping sits</h2><div class="panel" id="plot"></div>'
    +'<h2>Pipeline map</h2><div class="panel" id="pipe"></div>'
    +'<h2 id="detail">Detailed results</h2><div id="details"></div>'
    +'<h2>Disclosures &amp; relaxations (verbatim)</h2><div id="disc"></div>';
  app.innerHTML=html;
  var s=seriesFor(m);
  var plot=document.getElementById('plot');
  if (s){ var svg=frontierSVG([s],{w:1000,h:400}); if(svg) plot.appendChild(svg);
    var refused=(DATA[id].frontier.candidates||[]).filter(function(c){return !c.ok;});
    if (refused.length){
      var rd=document.createElement('div');
      rd.innerHTML='<p class="note" style="margin-top:.6rem"><b>'+refused.length+' candidate(s) refused, each with its named verdict:</b></p>'
        + '<table><tr><th>id</th><th>knobs</th><th>stage</th><th>verdict</th></tr>'
        + refused.map(function(c){
            var kn=Object.keys(c.knobs||{}).map(function(k){return k+'='+c.knobs[k];}).join(', ');
            return '<tr><td><code>'+esc(c.id)+'</code></td><td>'+esc(kn)+'</td><td>'+esc(c.fail_stage||'')+'</td><td class="basis">'+esc((c.fail_message||'').slice(0,240))+'</td></tr>';
          }).join('')+'</table>';
      plot.appendChild(rd);
    }
  }
  else plot.innerHTML='<p class="err">no frontier artifact for this model</p>';
  var pm=pipelineSVG(m); var pd=document.getElementById('pipe');
  if (pm) pd.appendChild(pm); else pd.innerHTML='<p class="err">no pipeline data in this artifact</p>';
  // details
  var det=document.getElementById('details'); var out='';
  if (rep){
    var entries=entriesOf(rep.evaluation.metrics);
    out+='<h2 style="border:0;padding-top:0;font-size:.9rem">All metrics (one accounting each)</h2>';
    out+=kvTable(entries.map(function(e){
      return '<tr><td><code>'+esc(e.key)+'</code><br><span class="note">'+esc(e.label||'')+'</span></td>'
        +'<td>'+fmt(e.value,4)+(e.unit?' '+esc(e.unit):'')+'</td><td class="basis">'+esc(e.basis||'')+'</td></tr>';
    }));
    var sr = rep.evaluation.state_residency;
    try { if (sr){
      out+='<h2 style="border:0;font-size:.9rem">State / KV residency (scales with D)</h2>';
      var srl = Array.isArray(sr)? sr : (Array.isArray(sr.stages)? sr.stages : (Array.isArray(sr.per_stage)? sr.per_stage : []));
      var rows = srl.map(function(st){
        var v = st.verdict || (st.fits===true?'fits':(st.fits===false?'VIOLATED':''));
        var sb = st.state_bytes!=null?st.state_bytes:(st.total_bytes!=null?st.total_bytes:st.bytes);
        var detail = 'recurrent '+bytesFmt(st.recurrent_state_bytes)+' + KV '+bytesFmt(st.kv_bytes)
          + (st.capacity_bytes? ' vs capacity '+bytesFmt(st.capacity_bytes):'');
        return '<tr><td>'+esc(st.label||('stage '+st.stage))+'</td><td>'+bytesFmt(sb)+' (all D streams)</td>'
          +'<td class="basis"><span class="'+(String(v).indexOf('VIOL')>=0?'verd-bad':'verd-ok')+'">'+esc(v)+'</span> '+esc(detail)+' '+esc(st.basis||'')+'</td></tr>';
      });
      out+= rows.length? kvTable(rows) : '<p class="note">'+esc(JSON.stringify(sr).slice(0,600))+'</p>';
    } } catch(e){ out+='<p class="err">state residency section failed to render: '+esc(e.message)+'</p>'; }
    var en = rep.evaluation.energy;
    try { if (en && Array.isArray(en.components)){
      out+='<h2 style="border:0;font-size:.9rem">Energy (per component, coverage-labeled)</h2>';
      out+=kvTable(en.components.map(function(c){
        var epj=c.energy_pj!=null?c.energy_pj:(c.value_pj!=null?c.value_pj:c.pj); return '<tr><td>'+esc(c.label||c.name||c.key||c.component)+'</td><td>'+(epj!=null&&epj>=1e9?fmt(epj/1e9,3)+' mJ':fmt(epj,3)+' pJ')+'</td><td class="basis">['+esc(c.coverage||'?')+'] '+esc(c.basis||'')+'</td></tr>';
      }));
    } else if (en) { out+='<h2 style="border:0;font-size:.9rem">Energy</h2><p class="note">'+esc(JSON.stringify(en).slice(0,600))+'</p>'; } } catch(e){ out+='<p class="err">energy section failed: '+esc(e.message)+'</p>'; }
    var occ = rep.evaluation.occupancy;
    try { if (Array.isArray(occ) && occ.length){
      out+='<h2 style="border:0;font-size:.9rem">Utilization per device class (mean / max over devices)</h2>';
      var agg={};
      occ.forEach(function(o){
        var k=o.device_class||'?'; (agg[k]=agg[k]||{n:0,sum:0,max:0,maxOwner:''});
        agg[k].n++; agg[k].sum+=o.occupancy||0;
        if ((o.occupancy||0)>agg[k].max){ agg[k].max=o.occupancy; agg[k].maxOwner=o.owner||''; }
      });
      out+=kvTable(Object.keys(agg).map(function(k){
        var a=agg[k];
        return '<tr><td>'+esc(k)+' ('+a.n+' devices)</td><td>mean '+(a.sum/a.n*100).toFixed(3)+'% · max '+(a.max*100).toFixed(2)+'%</td><td class="basis">busiest: '+esc(a.maxOwner)+' — '+esc(rep.evaluation.occupancy_basis||'')+'</td></tr>';
      }));
    } } catch(e){ out+='<p class="err">utilization section failed: '+esc(e.message)+'</p>'; }
  } else out='<p class="err">report artifact missing</p>';
  det.innerHTML=out;
  // disclosures
  var disc=document.getElementById('disc'); var dh='';
  var ds=(rep&&rep.disclosures)||[];
  if (ds.length){
    dh+='<div class="disc">'+ds.map(function(x){
      if (typeof x==='string') return esc(x);
      return esc((x.constraint||'')+' — '+(x.value||''))+'\n'+esc(x.reason||'');
    }).join('\n\n')+'</div>';
  }
  var rel=(d.atlas&&d.atlas.relaxations)||[];
  if (rel.length){
    dh+='<div class="disc">'+rel.map(function(x){
      if (typeof x==='string') return esc(x);
      return esc((x.constraint||'')+' — '+(x.value||''))+'\n'+esc(x.reason||'');
    }).join('\n\n')+'</div>';
  }
  var fr=d.frontier;
  if (fr && fr.disclosures && fr.disclosures.length){
    dh+='<p class="note">frontier sweep disclosures:</p><div class="disc">'+fr.disclosures.map(function(x){
      return typeof x==='string'? esc(x) : esc(JSON.stringify(x));
    }).join('\n\n')+'</div>';
  }
  disc.innerHTML= dh || '<p class="note">none recorded</p>';
}
</script>
