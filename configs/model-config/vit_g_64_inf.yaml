# ViT-g, seq 64 (128px / 16px patches, 0 prefix tokens), inference.
# Matches OPTIMA validation target T2 geometry: H1408 I6144 L40 h16.
# vision.num_prefix_tokens: 0 overrides the ViT default of 1 CLS token so the
# derived seq_len is exactly (128/16)^2 = 64.
model_param:
  mode: "ViT"
  model_type: "vit"          # plain (non-gated) MLP
  run_type: "inference"
  tied_embeddings: true
  global_batch_size: 1
  gradient_accumulation_steps: 1
  decode_len: 0
  hidden_dim: 1408
  vocab_size: 1000           # classifier head size (num_classes)
  intermediate_size: 6144
  num_layers: 40
  vision:
    image_size: 128
    patch_size: 16
    num_prefix_tokens: 0
  attention:
    attention_type: "mha"
    num_heads: 16
    use_flashattention: false   # fws_cim rejects flash attention
  moe:
    num_experts: 1
    top_k: 1
    moe_intermediate_size: 0
    n_shared_experts: 0
    moe_layer_freq: 0
    first_k_dense_replace: 0
