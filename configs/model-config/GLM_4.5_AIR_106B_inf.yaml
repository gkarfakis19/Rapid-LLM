# Model: GLM-4.5-Air, 106B (mixture of experts)
# Source: https://huggingface.co/zai-org/GLM-4.5-Air

model_param:
  mode: "LLM"                         # LLM, or GEMM for a single matrix multiply
  run_type: "inference"               # inference or training
  model_type: "glm4_moe"              # gpt (GELU MLP), llama (SwiGLU), deepseek_v3 or glm4_moe
  tied_embeddings: false              # input embedding shared with the output head (memory only)
  global_batch_size: 16               # sequences served together (B)
  gradient_accumulation_steps: 1      # training only; leave at 1
  seq_len: 16356                      # prefill + decode tokens
  decode_len: 1024                    # decode tokens (output length)
  hidden_dim: 4096                    # hidden size (H)
  num_layers: 46                      # transformer layers
  vocab_size: 151552                  # vocabulary size
  intermediate_size: 10944            # dense feed-forward width
  attention:
    attention_type: "gqa"             # mha, gqa or mla
    num_heads: 96                     # query heads
    kv_heads: 8                       # key/value heads
    head_dim: 128                     # width of one head (default hidden_dim / num_heads)
    use_flashattention: true          # price attention as FlashAttention
    attention_tile_size: 128          # FlashAttention tile size
  moe:
    num_experts: 128                  # experts per MoE layer (1 = dense model)
    top_k: 8                          # experts used per token
    moe_intermediate_size: 1408       # feed-forward width of one expert
    n_shared_experts: 1               # always-on shared experts
    moe_layer_freq: 1                 # every Nth layer is an MoE layer
    first_k_dense_replace: 1          # the first k layers are dense
