# Model: Llama-2-7B (dense)
# Source: https://huggingface.co/meta-llama/Llama-2-7b-hf

model_param:
  mode: "LLM"                         # LLM, or GEMM for a single matrix multiply
  run_type: "inference"               # inference or training
  model_type: "llama"                 # gpt (GELU MLP), llama (SwiGLU), deepseek_v3 or glm4_moe
  tied_embeddings: true               # input embedding shared with the output head (memory only)
  global_batch_size: 16               # sequences served together (B)
  gradient_accumulation_steps: 1      # training only; leave at 1
  seq_len: 2048                       # prefill + decode tokens
  decode_len: 1024                    # decode tokens (output length)
  hidden_dim: 4096                    # hidden size (H)
  num_layers: 32                      # transformer layers
  vocab_size: 32000                   # vocabulary size
  intermediate_size: 11008            # dense feed-forward width
  attention:
    attention_type: "mha"             # mha, gqa or mla
    num_heads: 32                     # query heads
    kv_heads: 8                       # key/value heads
    use_flashattention: true          # price attention as FlashAttention
    attention_tile_size: 128          # FlashAttention tile size
  moe:
    num_experts: 1                    # experts per MoE layer (1 = dense model)
    top_k: 1                          # experts used per token
    moe_intermediate_size: 0          # feed-forward width of one expert
    n_shared_experts: 0               # always-on shared experts
    moe_layer_freq: 0                 # every Nth layer is an MoE layer
    first_k_dense_replace: 0          # the first k layers are dense
