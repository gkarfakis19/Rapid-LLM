# Model: Hunyuan-4B-Instruct (dense)
# Source: https://huggingface.co/tencent/Hunyuan-4B-Instruct

model_param:
  mode: "LLM"                         # LLM, or GEMM for a single matrix multiply
  run_type: "inference"               # inference or training
  model_id: "hunyuan_4b"              # display name only
  model_type: "llama"                 # gpt (GELU MLP), llama (SwiGLU), deepseek_v3 or glm4_moe
  tied_embeddings: true               # input embedding shared with the output head (memory only)
  global_batch_size: 1                # sequences served together (B)
  gradient_accumulation_steps: 1      # training only; leave at 1
  seq_len: 512                        # prefill + decode tokens
  decode_len: 32                      # decode tokens (output length)
  hidden_dim: 3072                    # hidden size (H)
  num_layers: 36                      # transformer layers
  vocab_size: 120818                  # vocabulary size
  intermediate_size: 8192             # dense feed-forward width
  attention:
    attention_type: "gqa"             # mha, gqa or mla
    num_heads: 32                     # query heads
    kv_heads: 8                       # key/value heads
    head_dim: 128                     # width of one head (default hidden_dim / num_heads)
    use_flashattention: false         # price attention as FlashAttention
  moe:
    num_experts: 1                    # experts per MoE layer (1 = dense model)
    top_k: 1                          # experts used per token
    moe_intermediate_size: 8192       # feed-forward width of one expert
    n_shared_experts: 0               # always-on shared experts
    moe_layer_freq: 1                 # every Nth layer is an MoE layer
    first_k_dense_replace: 36         # the first k layers are dense

inference_param:
  sample_every: -1                    # -1: price only the first and last decode step; N: also every Nth
