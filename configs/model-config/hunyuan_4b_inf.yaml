# Hunyuan-4B-Instruct inference config — the SUPPORTED carrier of the Hunyuan
# family and a RUNS-NOW row: a plain dense GQA transformer the existing laws
# and schema already price (P1.3's recorded assumption; Hunyuan-7B at 7.50B raw
# stays a reference row).
# Dims verified 2026-08-24 against the published HuggingFace config.json:
#   https://huggingface.co/tencent/Hunyuan-4B-Instruct/blob/main/config.json
# seq_len / decode_len are kept small so the end-to-end smoke stays fast.
provenance:
  source: "https://huggingface.co/tencent/Hunyuan-4B-Instruct/blob/main/config.json"
  verified: "2026-08-24"
  published_total_params: 4221757440  # model.safetensors.index total_size
  # 8,443,514,880 B / 2 (bf16). 4.22B RAW, inside the D2 cutoff.
  d2_status: supported

model_param:
  mode: "LLM"
  run_type: "inference"
  tied_embeddings: true   # HF tie_word_embeddings: true
  model_id: "hunyuan_4b"
  model_type: "llama"     # PRICING CARRIER: the gated MLP is the llama stage shape
  global_batch_size: 1
  gradient_accumulation_steps: 1
  seq_len: 512
  decode_len: 32
  hidden_dim: 3072
  attention:
    attention_type: "gqa"
    num_heads: 32
    kv_heads: 8
    head_dim: 128  # HF head_dim / attention_head_dim; NOT hidden_dim/num_heads (3072/32 = 96)
    use_flashattention: false
  moe:
    num_experts: 1
    top_k: 1
    moe_intermediate_size: 8192
    n_shared_experts: 0
    moe_layer_freq: 1
    first_k_dense_replace: 36
  intermediate_size: 8192
  vocab_size: 120818
  num_layers: 36

inference_param:
  sample_every: -1
