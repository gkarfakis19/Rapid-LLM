# Model: one matrix multiply, M x K times K x N (mode: GEMM)

model_param:
  mode: "GEMM"                        # LLM, or GEMM for a single matrix multiply
  M: 4096                             # rows of the left matrix
  K: 524288                           # shared dimension
  N: 2048                             # columns of the right matrix
  backward: true                      # also price the backward pass
  gemm_shard_axis: "row"              # row or col, used when tp > 1
