# MiniCPM3-4B inference config — the MLA carrier at <= 7B (D6, ADJ-2).
# Dims verified 2026-08-23 against the published HuggingFace config.json:
#   https://huggingface.co/openbmb/MiniCPM3-4B/blob/main/config.json
# A uniform 62-layer MLA transformer: no layer plan, no new block kinds. It
# runs on the GPU/legacy paths and is rejected by device_class: fws_cim,
# which has no MLA pricing seam yet.
provenance:
  source: "https://huggingface.co/openbmb/MiniCPM3-4B/blob/main/config.json"
  verified: "2026-08-23"
  published_total_params: 4000000000  # model card "4B"; the repo ships
  # pytorch_model.bin only, so no safetensors parameter metadata exists.
  d2_status: supported

model_param:
  mode: "LLM"
  run_type: "inference"
  tied_embeddings: true
  model_type: "deepseek_v3"  # MLA + SwiGLU gated MLP
  global_batch_size: 4
  gradient_accumulation_steps: 1
  seq_len: 2048
  decode_len: 256
  hidden_dim: 2560
  attention:
    attention_type: "mla"
    num_heads: 40
    q_lora_rank: 768
    kv_lora_rank: 256
    qk_nope_head_dim: 64
    qk_rope_head_dim: 32
    v_head_dim: 64  # MiniCPM3 reuses qk_nope_head_dim for V
    use_flashattention: false
  moe:
    num_experts: 1
    top_k: 1
    moe_intermediate_size: 6400
    n_shared_experts: 0
    moe_layer_freq: 1
    first_k_dense_replace: 62
  intermediate_size: 6400
  vocab_size: 73448
  num_layers: 62

inference_param:
  sample_every: -1
