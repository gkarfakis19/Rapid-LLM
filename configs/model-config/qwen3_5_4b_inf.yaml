# Qwen3.5-4B inference config — the gated-DeltaNet LINEAR-ATTENTION carrier
# and the second P0 model (ADJ-1). Dims verified 2026-08-23 against the
# published HuggingFace config.json (the text_config sub-block):
#   https://huggingface.co/Qwen/Qwen3.5-4B/blob/main/config.json
# 32 layers, 3 linear-attention : 1 gated attention. The native 24-layer
# vision tower and the MTP head are NOT modeled here (D8, address-only).
# It RUNS on the mapped fws_cim path (configs/hardware-config/fws_cim_qwen3_5_4b.yaml)
# and is the first consumer of the delta-rule law, which is LAW_UNVALIDATED by
# design. The unmapped closed-form path and the GPU path still refuse it by
# name: neither has a stage for a linear-attention recurrence or for the gated
# attention output projection.
provenance:
  source: "https://huggingface.co/Qwen/Qwen3.5-4B/blob/main/config.json"
  verified: "2026-08-23"
  published_total_params: 4000000000  # model card: "Number of Parameters: 4B"
  # DISCLOSED RELAXATION: the card rounds the language model to one significant
  # figure. The exact checkpoint is 4,659,868,928 params (model.safetensors.index
  # total_size 9,319,737,856 B / 2, bf16) and includes the vision tower and the
  # MTP head, neither of which this YAML models — so the text backbone cannot be
  # read off either figure exactly. The P6.1 tolerance is widened for this row.
  published_total_params_tolerance: 0.06
  published_total_params_tolerance_reason: >-
    The published 4B is the card's one-significant-figure rounding of a
    4,659,868,928-param checkpoint that also carries the vision tower and the
    MTP head, neither of which this YAML models; 6% covers the text backbone
    against the rounded figure and nothing wider.
  d2_status: supported

model_param:
  mode: "LLM"
  run_type: "inference"
  tied_embeddings: true
  model_id: "qwen3_5_4b"  # the model's OWN name: owners, labels and the DAG report use this
  # model_type is the PRICING CARRIER, not the identity: Qwen3.5's gated MLP is
  # SwiGLU, which is the `llama` stage shape. The mapping raises a
  # model_type_carrier disclosure that reconciles the two spellings.
  model_type: "llama"
  global_batch_size: 4
  gradient_accumulation_steps: 1
  seq_len: 2048
  decode_len: 256
  hidden_dim: 2560
  layer_plan:
    # HF layer_types: 3 linear_attention then 1 full_attention, 8 times.
    pattern: ["linear_attention", "linear_attention", "linear_attention", "full_attention"]
  attention:
    attention_type: "gqa"
    num_heads: 16
    kv_heads: 4
    head_dim: 256  # HF head_dim; NOT hidden_dim/num_heads (2560/16 = 160)
    output_gate: true  # HF attn_output_gate: true
    use_flashattention: false
  linear_attention:
    num_key_heads: 16  # HF linear_num_key_heads
    key_head_dim: 128  # HF linear_key_head_dim
    num_value_heads: 32  # HF linear_num_value_heads
    value_head_dim: 128  # HF linear_value_head_dim
    conv_kernel: 4  # HF linear_conv_kernel_dim
    output_gate: true
    decay_gate: true
  moe:
    num_experts: 1  # HF mlp_only_layers: [] — dense FFN on every layer
    top_k: 1
    moe_intermediate_size: 9216
    n_shared_experts: 0
    moe_layer_freq: 1
    first_k_dense_replace: 32
  intermediate_size: 9216
  vocab_size: 248320
  num_layers: 32

inference_param:
  sample_every: -1
