# LFM2-2.6B inference config — the double-gated SHORT-CONV carrier.
# Dims verified 2026-08-23 against the published HuggingFace config.json:
#   https://huggingface.co/LiquidAI/LFM2-2.6B/blob/main/config.json
# 30 layers: 20 short-conv blocks and 10 full GQA layers in an irregular
# order, so layer_plan uses the explicit HF layer_types list.
# Rejected until the P2-P4 short-conv pricing laws land.
provenance:
  source: "https://huggingface.co/LiquidAI/LFM2-2.6B/blob/main/config.json"
  verified: "2026-08-23"
  published_total_params: 2569272320  # LFM2-2.6B model card, exact count
  d2_status: supported

model_param:
  mode: "LLM"
  run_type: "inference"
  tied_embeddings: true  # HF tie_embedding: true
  model_type: "llama"  # HF block_use_swiglu: true
  global_batch_size: 4
  gradient_accumulation_steps: 1
  seq_len: 2048
  decode_len: 256
  hidden_dim: 2048
  layer_plan:
    # HF layer_types, verbatim.
    layer_types: ["conv", "conv", "full_attention", "conv", "conv", "full_attention",
                  "conv", "conv", "conv", "full_attention", "conv", "conv", "conv",
                  "full_attention", "conv", "conv", "conv", "full_attention", "conv",
                  "conv", "conv", "full_attention", "conv", "conv", "full_attention",
                  "conv", "conv", "full_attention", "conv", "conv"]
  attention:
    attention_type: "gqa"
    num_heads: 32
    kv_heads: 8
    use_flashattention: false
  short_conv:
    kernel_size: 3  # HF conv_L_cache
    conv_dim: 2048  # HF conv_dim
    double_gated: true  # the input projection emits B, C and x
  moe:
    num_experts: 1
    top_k: 1
    moe_intermediate_size: 10752
    n_shared_experts: 0
    moe_layer_freq: 1
    first_k_dense_replace: 30
  intermediate_size: 10752  # HF block_ff_dim
  vocab_size: 65536
  num_layers: 30

inference_param:
  sample_every: -1
