# Mamba2-2.7B DECODE variant for the fws_cim MAPPED path (D29/D30).
#
# THE REAL PURE-SSD CASE. 64 Mamba-2 layers, no attention block anywhere, no
# MLP (ffn_per_layer: false), and inside the D2 cutoff — so unlike
# falcon_mamba_7b (Mamba-1, 7.27B, a reference row) it is a SUPPORTED workload
# the mapped path is expected to place end to end. One mixer kind, one weight
# block set, no KV.
#
# It is mamba2_2p7b_inf.yaml with the two fields the FILLED PIPELINE fixes:
#
#   global_batch_size: 1            - D29 removes batch size from the serving
#     surface: decode is independent streams staggered across the stages, one
#     token exits per beat, every analog op fires at M = 1, and throughput comes
#     from the resident stream count D (= the stage count, DERIVED).
#   disable_embedding_unembedding: true - D30 drops embedding and lm_head.
#
# The ORIGINAL file is untouched: it is the closed-form/lockstep workload and
# the model-matrix census row (its provenance carries the published total and
# the named D3 exception). The two are never used for one number.
model_param:
  mode: "LLM"
  run_type: "inference"
  tied_embeddings: true
  model_type: "llama"
  global_batch_size: 1  # D29: the local batch is always 1 and a batch does not exist here
  disable_embedding_unembedding: true  # D30: embedding and lm_head are dropped entirely
  gradient_accumulation_steps: 1
  seq_len: 2048
  decode_len: 256
  hidden_dim: 2560
  layer_plan:
    pattern: ["mamba"]
    ffn_per_layer: false  # mamba_ssm d_intermediate: 0 — the mixer stacks alone
  ssm:
    variant: "mamba2"
    d_state: 128
    n_groups: 1
    n_heads: 80
    d_head: 64
    expand: 2
    d_conv: 4
    chunk_size: 256
  moe:
    num_experts: 1
    top_k: 1
    moe_intermediate_size: 5120
    n_shared_experts: 0
    moe_layer_freq: 1
    first_k_dense_replace: 64
  intermediate_size: 5120  # required by the schema; unused (ffn_per_layer: false)
  vocab_size: 50288
  num_layers: 64

inference_param:
  sample_every: -1
