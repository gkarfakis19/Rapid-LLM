# Small MoE inference model for the fws_cim device class (pass 2).
# Derived from DeepSeekMOE.yaml, shrunk for smoke speed: GQA attention
# (fws_cim rejects mla), use_flashattention: false, small decode_len.
# Pair with configs/hardware-config/fws_cim_moe.yaml.
model_param:
  mode: LLM
  run_type: inference
  tied_embeddings: false
  model_type: llama  # llama-style architecture with SwiGLU (gated MLP)
  global_batch_size: 4  # kept small for smoke speed
  gradient_accumulation_steps: 1
  seq_len: 512   # Total context length (prefill + decode_len for inference)
  decode_len: 32 # small: smoke speed
  hidden_dim: 1024
  attention:
    attention_type: gqa  # fws_cim supports "mha" or "gqa" ("mla" is rejected)
    num_heads: 16
    kv_heads: 4
    use_flashattention: false # fws_cim prices attention on the digital fabric; flash is rejected
    attention_tile_size: 128
  intermediate_size: 2048  # dense (first_k_dense_replace) layers only
  moe:
    num_experts: 16
    top_k: 2
    moe_intermediate_size: 512
    n_shared_experts: 1
    expert_imbalance_factor: 1.0 # 1.0 preserves perfectly balanced MoE routing
    moe_layer_freq: 1
    first_k_dense_replace: 1
  vocab_size: 32000
  num_layers: 12

inference_param:
  sample_every: -1  # Price only the first and last decode steps (fast smoke)
