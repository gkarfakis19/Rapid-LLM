# Falcon-Mamba-7B inference config — the PURE-SSM corner case (zero attention).
# Dims verified 2026-08-23 against the published HuggingFace config.json:
#   https://huggingface.co/tiiuae/falcon-mamba-7b/blob/main/config.json
# 64 Mamba-1 selective-scan layers with no MLP at all, which is why the layer
# plan sets ffn_per_layer: false and the config carries no attention block.
# Rejected until the P2-P4 SSM pricing laws land.
provenance:
  source: "https://huggingface.co/tiiuae/falcon-mamba-7b/blob/main/config.json"
  verified: "2026-08-23"
  published_total_params: 7272665088  # model.safetensors.index total_size
  # 14,545,330,176 B / 2 (bf16). 7.27B RAW, over the D2 cutoff, so this row is
  # an architecture reference (ADJ-2 precedent), not a supported model.
  d2_status: reference

model_param:
  mode: "LLM"
  run_type: "inference"
  tied_embeddings: false
  model_type: "llama"
  global_batch_size: 4
  gradient_accumulation_steps: 1
  seq_len: 2048
  decode_len: 256
  hidden_dim: 4096
  layer_plan:
    pattern: ["mamba"]
    ffn_per_layer: false  # Mamba-1 stacks the mixer alone; there is no MLP
  ssm:
    variant: "mamba1"  # per-token selective scan, no chunking
    d_state: 16  # HF state_size
    d_conv: 4  # HF conv_kernel
    d_inner: 8192  # HF intermediate_size; HF expand: 16 is inert here
    dt_rank: 256  # HF time_step_rank
  moe:
    num_experts: 1
    top_k: 1
    moe_intermediate_size: 8192
    n_shared_experts: 0
    moe_layer_freq: 1
    first_k_dense_replace: 64
  intermediate_size: 8192  # required by the schema; unused (ffn_per_layer: false)
  vocab_size: 65024
  num_layers: 64

inference_param:
  sample_every: -1
