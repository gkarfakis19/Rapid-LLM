# Waferscale 8x8 (64-die) A100-class wafer for the synthetic-thermal STCO test.
# See WAFERSCALE_SYNTH_TEST_PLAN.md (george_thermal_26). Geometry matches the prior
# Anemoi campaign's 64-GPU wafer (Dummy_4HBM_64GPU: 44.1k mm^2, 826 mm^2 dies).
# Per-die tech_param/sw_param identical to a100_80GB.yaml so the A100-calibrated
# throttle/power rules transfer. Both network dims ride the same on-wafer fabric
# (200 GB/s per neighbor link, 200 ns — placeholders, tune to wafer tech).
# tp along wafer rows (dim0), pp down columns (dim1); tp8 x pp8 = 64 flattened devices.
# device_profiles: intentionally ABSENT here — the thermal loop driver injects a
# per-iteration block (or --device_profiles YAML). Requires full_astrasim_flattened.
sw_param:
  full_recomputation: true
  kernel_launch_overhead: 9e-6
  dp_zero_stage: 1
  precision:
    tensor_format: bf16
    kv_cache: as_tensor_format
    parameters: as_tensor_format
    gradients: fp32
    grad_communication: fp32
    optimizer_states: as_tensor_format
    stats: as_tensor_format
    master_parameters: 0.0
  h2d_bandwidth: -1
  const_mem_offset: 0 GB
  dp_microbatch: last_mb
tech_param:
  core:
    operating_frequency: 1.41e9
    num_bundles: 108
    nominal_flop_rate_per_mcu: 512
    nominal_energy_per_flop: 1.8e-13
    num_mcu_per_bundle: 4
    FMA_d1: 8
    FMA_d2: 4
    dataflow: best
    util: 1
  DRAM:
    size: 80 GB
    bandwidth: 1986 GB
    dynamic_energy_per_bit: 4.5e-12
    latency: 100e-9
    util: 1.0
  SRAM-L2:
    size: 40 MB
    bandwidth: 7050 GB
    dynamic_energy_per_bit: 130e-15
    latency: 0
    util: 1
  SRAM-L1:
    size: 20736 KB
    bandwidth: 18 TB
    dynamic_energy_per_bit: 130e-15
    latency: 0
    util: 1
  SRAM-R:
    size: 27 MB
    bandwidth: 122 TB
    dynamic_energy_per_bit: 110e-15
    latency: 0
    util: 1
memory_hierarchy:
  l0:
    type: SRAM-R
    scope: mcu
  l1:
    type: SRAM-L1
    scope: mcu-bundle
  l2:
    type: SRAM-L2
    scope: global
  l3:
    type: DRAM
    scope: global
parallelism:
  tp: 8
  tp_sp: true
  cp: 1
  pp: 8
  mb: 8
  train:
    dp: 1
    ep: 1
    tp_ep: true
  inference:
    replica_count: 1
    moe_dp: 1
network:
  overlap:
    tp_overlap: 0.0
    tp_sp_overlap: 0.0
    cp_overlap: 0.0
  dimensions:
  - id: dim0
    label: wafer_row_tp
    size: auto
    topology:
      type: Ring
      bandwidth: 200 GB
      latency: 2.0e-07
      energy_per_bit: 1.0e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - tp
    - cp
    - ep
  - id: dim1
    label: wafer_col_pp
    size: auto
    topology:
      type: Ring
      bandwidth: 200 GB
      latency: 2.0e-07
      energy_per_bit: 1.0e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - pp
    - dp
execution_backend:
  model: astra
  astra:
    backend: astra
    mode: full_astrasim_flattened
    collectives:
      all_gather: auto
      all_reduce: auto
      reduce_scatter: auto
      all_to_all: auto
    sys_options:
      endpoint_delay: 5
      active_chunks_per_dimension: 32
      preferred_dataset_splits: 4
      collective_arbitration: last_resort
inference:
  kvcache_type: hbm_only
