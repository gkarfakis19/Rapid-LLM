# THE MEASURED DIGITAL SYNTHESIS LIBRARY (12nm) — D32.
#
# PROVENANCE. Every block below is COPIED VERBATIM from OPTIMA's
# auto-generated synthesis library:
#
#   source file    /app/nanocad/projects/cim_ctt_big_optima/perf_model/configs/digital_hw_components_12nm.yaml
#   source reports /app/nanocad/projects/cim_ctt_big_optima/rtl/reports_12nm_1000_efh
#   generated by   OPTIMA's parse_rtl.py (a synthesis-report parser)
#   copied         2026-08-24, by hand, value for value
#
# The numbers are MEASURED VIA SYNTHESIS at 12nm: area from the post-synthesis
# area report, power from the post-synthesis power report, at the frequency and
# pipeline depth each block was synthesised for. They are not estimates and they
# are not scaled.
#
# WHY A COPY AND NOT A REFERENCE (D21, D32). cim_ctt_big_optima is another
# project on a shared mount. A run of this repo must never depend on it being
# present, readable, or unchanged, so the library is CHECKED IN here and the
# path above is provenance, not a dependency. Nothing in this repo fetches the
# source file at runtime.
#
# WHAT IS NOT COPIED. OPTIMA's collections multiply each composition by an
# `overhead` fraction (0.0 to 0.4 depending on the collection; the
# largest is the depthwise conv at 0.4) for glue and
# routing. D28 forbids safety margins, so this repo composes at overhead 0 and
# says so rather than carrying an uncalibrated pad. OPTIMA's area_scale /
# power_scale / dvfs_scale knobs are likewise not copied: they retarget the
# library to another node, and a retargeted number is no longer a measured one.
#
# WHAT IS NOT CALIBRATED, IN THE SOURCE'S OWN WORDS. Two blocks carry caveats
# that the numbers alone do not show, and both are named here so a reader of a
# composed area knows what it rests on:
#   * M_REG — the source's description reads "Register for MAMBA BF16.
#     TODO!!!!!". The area and power below are copied verbatim from the
#     synthesis report, but the SOURCE flags the block as unfinished. M_REG is
#     one of the three units in every derived vector lane (55.888 of 1588.708
#     um2, 3.5%) and is instantiated once per pool lane on every macro, so a
#     revision of it moves both the engine and the pool.
#   * TRANSPOSER — OPTIMA instantiates 9 per systolic replica and its own
#     comment says the 9 is unexplained. This repo composes 1 and says so in
#     the chiplet disclosure.
#
# BLOCKS THIS REPO NEVER COMPOSES. Copied for completeness, used by nothing:
# COMBINED_CONV, COMBINED_CONV_SEQUENTIAL and
# INT8_BUFF_DIV_SYS_ARRAY_PENALTY (measured at zero area and zero power in the
# source, so they are inert by measurement); M_SOFTPLUS and
# ELASTIC_BUFFER_256_MXFP4_ELEMS (real measured blocks that no composition in
# this repo instantiates — the scan lane holds no transcendental unit because
# the scan work law counts no transcendental op, and no elastic buffering is
# modelled between stages). Their absence from a composed area is a FLOOR, not
# a measured zero.
#
# HOW IT IS READ. cim_timing.SynthesisLibrary.load("12nm") parses this file.
# A block this file does not name is REFUSED BY NAME — there is no default
# block, no interpolation and no zero-fill (ADJ-4, no invented numbers).

