# FWS-CIM MAPPED run (QIF P4): the same Llama2-7B-class point as
# fws_cim_llama7b.yaml, plus the `mapping:` block that makes it a MAPPED run.
#
# ADJ-6 / A1: a run that declares `mapping:` publishes the placed-DAG
# evaluation (output/<MODE>/fws_qif_report.json) and NOT the pass-1/2
# closed-form section. Two accountings of one metric never share an artifact.
# Drop the `mapping:` block and this file becomes the legacy closed-form point
# again, byte for byte.
#
# FWS-CIM dense-LLM point (pass 2): Llama2-7B-class analog arrays, cim_sram KV.
# Pair with configs/model-config/llama2_7b_fws_inf.yaml at tp=1, pp=1.
#
# Analog point: rows = 4096 (K per array tile matches hidden_dim), stored
# cols = cols_adc * adc_mux = 4096. Per-layer arrays for Llama2-7B
# (H=4096, I=11008, SwiGLU): QKV 3 + O 1 + FFN1 ceil(2*11008/4096)=6 +
# FFN2 ceil(11008/4096)=3 -> 13. lm_head adds ceil(32000/4096)=8 arrays on
# the last chip. layers_per_chip 8 -> 4 chips, worst chip 8*13 + 8 = 112.
# Energy/area per array are the T1 OPTIMA point scaled by cell count
# (4096*4096 / 1280*1280 = 10.24).

device_class: fws_cim

# All values inside cim must be plain numbers: unit strings like "100 MB"
# would be rewritten into byte counts by the YAML preprocessor.
cim:
  analog:
    rows: 4096               # array rows (K per array tile)
    cols_adc: 1024           # ADC columns per array
    adc_mux: 4               # weight-column banks per ADC; stored cols = cols_adc*adc_mux
    slice_cycles: 2          # analog cycles per ADC evaluation
    analog_clock_mhz: 100
    energy_per_vec_pj: 97637.774   # T1 point scaled by cell count (x10.24)
    shots_per_output: 2      # energy only, never time
    area_mm2_per_array: 14.367386  # T1 point scaled by cell count (x10.24)
  fabric:
    model: sa                # sa | gpu_native
    rows: 32
    cols: 64
    num_arrays: 2            # QK and PV run concurrently on these
    replicas: 1              # attention array replicas
    clock_ghz: 0.95
    # fill_drain_penalty_cycles: absent -> default 3*rows = 96
    softmax_lanes: 1
    softmax_pipeline_depth: 20
  chip:
    arrays_per_chip: 120     # worst chip: 8 layers * 13 + lm_head 8 = 112
    layers_per_chip: 8       # 32 layers -> 4 chips; endpoints on first/last chips
    moe_expert_parallel: 1   # dense model; no expert spreading

sw_param:
  full_recomputation: false
  kernel_launch_overhead: 0   # (s) deterministic fabric; no per-kernel launch cost
  dp_zero_stage: 0
  precision:
    tensor_format: bf16
    kv_cache: as_tensor_format
    parameters: as_tensor_format
    gradients: fp32
    grad_communication: fp32
    optimizer_states: as_tensor_format
    stats: as_tensor_format
    master_parameters: 0.0
  h2d_bandwidth: -1  # Bytes/s; -1 disables H2D timing
  const_mem_offset: 0 GB

# Stub calibrated to the digital fabric (2 arrays x 32x64 MACs @ 0.95 GHz).
tech_param:
  core:
    operating_frequency: 0.95e9     # (Hz) fabric clock
    num_bundles: 2                  # = cim.fabric.num_arrays
    nominal_flop_rate_per_mcu: 4096 # = rows*cols*2 = 32*64*2
    nominal_energy_per_flop: 1e-13  # (J) placeholder; CIM energy is reported separately
    num_mcu_per_bundle: 1
    FMA_d1: 8
    FMA_d2: 4
    dataflow: best
    util: 1
  DRAM:                    # stands in for the chips' aggregate activation + KV SRAM (cim_sram story)
    size: 8 GB
    bandwidth: 4 TB        # (/s)
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0             # (s) on-chip SRAM
    util: 1.0
  SRAM-L2:
    size: 64 MB
    bandwidth: 8 TB
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0
    util: 1
  SRAM-L1:
    size: 8 MB
    bandwidth: 16 TB
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0
    util: 1
  SRAM-R:
    size: 4 MB
    bandwidth: 128 TB      # level-0 bandwidth feeds analytical collectives; keep it high
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0
    util: 1

memory_hierarchy:
  l0:   # Register memory
    type: SRAM-R
    scope: mcu
  l1:   # Shared memory
    type: SRAM-L1
    scope: mcu-bundle
  l2:   # L2
    type: SRAM-L2
    scope: global
  l3:   # Activation buffer (DRAM stub)
    type: DRAM
    scope: global

parallelism:
  tp: 1
  tp_sp: false
  cp: 1
  pp: 1     # fws_cim requires pp=1; chip placement comes from cim.chip.layers_per_chip
  mb: 1
  train:
    dp: 1
    ep: 1
    tp_ep: true
  inference:
    replica_count: 1
    moe_dp: 1

network:
  overlap:
    tp_overlap: 0.0
    tp_sp_overlap: 0.0
    cp_overlap: 0.0
  dimensions:
    - id: dim0
      label: chip_ring_ep_tp   # ep dispatch/combine and tp boundary links
      size: auto
      topology:
        type: Ring       # analytical mode requires ring topologies
        bandwidth: 100 GB
        latency: 1e-6
        energy_per_bit: 1e-12 # (J/bit)
        util: 1.0
      collective_override: {}
      parallelisms: [tp, cp, ep]
    - id: dim1
      label: chip_ring_pp      # chip-to-chip boundary (p2p) links
      size: auto
      topology:
        type: Ring
        bandwidth: 100 GB
        latency: 1e-6
        energy_per_bit: 1e-12 # (J/bit)
        util: 1.0
      collective_override: {}
      parallelisms: [pp, dp]

execution_backend:
  model: analytical   # fws_cim supports only the analytical backend

inference:
  kvcache_type: cim_sram   # KV lives in the fabric activation SRAM (the device has no HBM)

# --- the mapping block (P3, ADJ-5). Its presence is what makes this a
# --- MAPPED run: the DAG report replaces the closed-form section (ADJ-6).
mapping:
  parallelism:
    tp: 1
  # ADJ-6: the decode series is a bounded window plus a disclosed
  # extrapolation. Three steps give a first / median / last that are three
  # different readings rather than one repeated.
  decode_window: 3
