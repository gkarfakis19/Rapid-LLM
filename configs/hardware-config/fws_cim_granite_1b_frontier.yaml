# Granite-4.0-H-1B frontier sweep on the D35-REVISED PLATFORM MACRO.
#
# THE MACRO IS X x Y : Z — X rows, Y total CTT columns, Z ADCs, and the fold
# mux = Y/Z is DERIVED, never declared and never swept. X is fixed at 512 by the
# platform; the sweep walks Z in powers of two 8..X and Y in powers of two
# X..8X. The card below is the sweep's initializer point, 512 x 2048 : 512
# (mux 4), sheet-derived by cim_analog_calc.derive_analog_card(512, 2048, 512).
#
# HIDDEN NO LONGER EQUALS ROWS, and that is the point. This model's hidden dim
# is 1536 against X = 512, so every hidden-deep weight matrix TILES onto 3 row
# blocks (ceil(1536/512)) whose partials reduce through the priced P7.2
# K-accumulator; any row remainder is reported as D27 packing waste. Nothing
# about that is hidden: the waste_pct in the artifact IS the mismatch.
#
# cim.analog mirrors the card exactly — one file, one macro.
device_class: fws_cim
cim:
  allocation:
    conv_placement: shared_digital
  analog:
    rows: 512
    cols: 2048            # Y: total CTT columns (storage tile)
    adcs: 512            # Z: ADCs; mux = Y/Z = 4 is DERIVED
    slice_cycles: 2
    analog_clock_mhz: 100
    energy_per_vec_pj: 12950.954799267838
    shots_per_output: 2
    area_mm2_per_array: 1.2826567311359998
  fabric:
    model: sa
    rows: 32
    cols: 64
    num_arrays: 2
    replicas: 1
    clock_ghz: 0.95
    softmax_lanes: 1
    softmax_pipeline_depth: 20
    geometry: derived
  chip:
    layers_per_chip: 4
    moe_expert_parallel: 1
  cards:
    sa:
      kind: digital_chiplet
      synthesis_library: 22nm
    ctt_sheet:
      kind: analog_macro
      device: ctt
      calc_profile: george_cima_mux1
      params:
        rows: 512
        cols: 2048
        adcs: 512
        shots_per_output: 2
      bank_depth: 1
sw_param:
  full_recomputation: false
  kernel_launch_overhead: 0
  dp_zero_stage: 0
  precision:
    tensor_format: bf16
    kv_cache: as_tensor_format
    parameters: as_tensor_format
    gradients: fp32
    grad_communication: fp32
    optimizer_states: as_tensor_format
    stats: as_tensor_format
    master_parameters: 0.0
  h2d_bandwidth: -1
  const_mem_offset: 0 GB
tech_param:
  core:
    operating_frequency: 0.95e9
    num_bundles: 2
    nominal_flop_rate_per_mcu: 4096
    nominal_energy_per_flop: 1e-13
    num_mcu_per_bundle: 1
    FMA_d1: 8
    FMA_d2: 4
    dataflow: best
    util: 1
  DRAM:
    size: 8 GB
    bandwidth: 4 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1.0
  SRAM-L2:
    size: 64 MB
    bandwidth: 8 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
  SRAM-L1:
    size: 8 MB
    bandwidth: 16 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
  SRAM-R:
    size: 4 MB
    bandwidth: 128 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
memory_hierarchy:
  l0:
    type: SRAM-R
    scope: mcu
  l1:
    type: SRAM-L1
    scope: mcu-bundle
  l2:
    type: SRAM-L2
    scope: global
  l3:
    type: DRAM
    scope: global
parallelism:
  tp: 1
  tp_sp: false
  cp: 1
  pp: 1
  mb: 1
  train:
    dp: 1
    ep: 1
    tp_ep: true
  inference:
    replica_count: 1
    moe_dp: 1
network:
  overlap:
    tp_overlap: 0.0
    tp_sp_overlap: 0.0
    cp_overlap: 0.0
  dimensions:
  - id: dim0
    label: chip_ring_ep_tp
    size: auto
    topology:
      type: Ring
      bandwidth: 100 GB
      latency: 1e-6
      energy_per_bit: 1e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - tp
    - cp
    - ep
  - id: dim1
    label: chip_ring_pp
    size: auto
    topology:
      type: Ring
      bandwidth: 100 GB
      latency: 1e-6
      energy_per_bit: 1e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - pp
    - dp
execution_backend:
  model: analytical
inference:
  kvcache_type: cim_sram
mapping:
  shared_chiplets: 5
  layers_per_chip: 2
  parallelism:
    tp: 1
  packing: dense
  decode_window: 3
mapping_dse:
  label: 'Granite-4.0-H-1B (small SSM, 9:1 mamba:attention): the platform box (Z x Y)
    x stage granularity x bank depth, everything else derived'
  objective: throughput
  max_silicon_mm2: 20000
  search: ladder
  initializer:
    macro_z: 512
    macro_y: 2048
    layers_per_chip: 4
    bank_depth: 1
    shared_chiplets: 10
    conv_placement: macro_pool
  axes:
    layers_per_chip:
    - 20
    - 10
    - 8
    - 5
    - 4
    - 2
    - 1
    bank_depth:
    - 1
    - 2
    - 4
    shared_chiplets:
    - 40
    - 20
    - 10
    - 5
    - 2
    conv_placement:
    - macro_pool
    - shared_digital
    # THE PLATFORM AXES (D35-REVISED, 2026-08-29). The macro is X x Y : Z and
    # mux = Y/Z is DERIVED, so the sweep walks the axis-aligned legal box in the
    # CONSTRAINT-NATIVE coordinates: Z (converter count, output interface,
    # calibration) and Y (wordline length, tile granularity). Sweeping the fold
    # instead would let an absurd corner hide inside a derived quantity, so
    # adc_capacity_mux is REFUSED BY NAME. Y >= Z always; mux = 1 is legal.
    macro_z:
    - 512
    - 256
    - 128
    - 64
    - 32
    - 16
    - 8
    macro_y:
    - 512
    - 1024
    - 2048
    - 4096
