# FWS-CIM MAPPED run for Granite-4.0-H-Tiny — the QIF P1 HEADLINE model (ADJ-1).
# Pair with configs/model-config/granite_4_0_h_tiny_inf.yaml at tp=1, pp=1.
#
# This is the first HYBRID end-to-end point: 36 Mamba-2 layers and 4 attention
# layers, MoE on every layer. It runs ONLY on the mapped path — the `mapping:`
# block at the bottom is what makes P3 place the model and P4 price it op by op
# (ADJ-6 / A1). Drop that block and validate_model_config refuses the run by
# name: the pass-1/2 closed-form report has no stage for a recurrence and would
# price a Mamba layer as attention (P1.4, narrowed by P1.5).
#
# Analog point: rows = 1536 (K per array tile matches hidden_dim = 1536),
# stored cols = cols_adc * adc_mux = 1536. Per-layer analog macros for
# Granite-4.0-H-Tiny (H=1536, GQA q12/kv4 d=128, 64 routed experts at I=512,
# one shared MLP at I=1024, gated MLP, router):
#   MoE part, every layer: router 1 + 64*(ffn1 1 + ffn2 1) + shared
#     (ffn1 ceil(2*1024/1536)=2 + ffn2 1) = 132
#   Mamba-2 mixer (36 layers): in_proj ceil((2*3072 + 2*1*128 + 48)/1536) = 5,
#     out_proj ceil(3072/1536) = 2 -> 7, so 139 macros/layer
#   attention mixer (4 layers): QKV ceil((12+2*4)*128/1536) = 2, O 1 -> 3,
#     so 135 macros/layer
#   lm_head adds ceil(100352/1536) = 66 macros on the last chip.
# layers_per_chip 4 -> 10 chips; worst chip 4*139 + 66 = 622.
#
# Energy/area per array are the T1 OPTIMA point scaled by cell count
# (1536*1536 / 1280*1280 = 1.44), the same convention fws_cim_llama7b.yaml and
# fws_cim_moe.yaml use. They are NOT measured Granite silicon.

device_class: fws_cim

# All values inside cim must be plain numbers: unit strings like "100 MB"
# would be rewritten into byte counts by the YAML preprocessor.
cim:
  analog:
    rows: 1536               # array rows (K per array tile) = hidden_dim
    cols_adc: 384            # ADC columns per array
    adc_mux: 4               # weight-column banks per ADC; stored cols = cols_adc*adc_mux
    slice_cycles: 2          # analog cycles per ADC evaluation
    analog_clock_mhz: 100
    energy_per_vec_pj: 13730.312016  # T1 point scaled by cell count (x1.44)
    shots_per_output: 2      # energy only, never time
    area_mm2_per_array: 2.0204136    # T1 point scaled by cell count (x1.44)
  fabric:
    model: sa                # sa | gpu_native
    rows: 32
    cols: 64
    num_arrays: 2            # QK and PV run concurrently on these
    replicas: 1              # attention array replicas
    clock_ghz: 0.95
    # fill_drain_penalty_cycles: absent -> default 3*rows = 96
    softmax_lanes: 1
    softmax_pipeline_depth: 20
  chip:
    arrays_per_chip: 640     # worst chip: 4 layers * 139 = 556 under D30
                             # (which DROPS the lm_head; the +66 that used to
                             # sit here is gone). 640 is deliberately held at
                             # the pre-D30 value so the 84 unowned slots are
                             # the frontier's own area axis - read the D32
                             # pool total as the machine's SLOTS, never as
                             # demand.
    layers_per_chip: 4       # 40 layers -> 10 chips; endpoints on first/last chips
    moe_expert_parallel: 1   # routed experts of a layer stay on that layer's chip

  # Device cards (P2.1, D14). The analog card is the shipped CTT point above.
  # The shared digital chiplet card is what makes the SSD scan TIMEABLE, and
  # under D31 it no longer DECLARES the engine: it names the measured synthesis
  # library its silicon is composed from, and the width is derived from the
  # beat (ADJ-4 still forbids deriving scan lanes from the systolic array or
  # the softmax pipeline, which is why the beat is the only honest source).
  cards:
    ctt:
      kind: analog_macro
      device: ctt
    sa:
      kind: digital_chiplet
      # D32: this chiplet's AREA and POWER are COMPOSED from the measured
      # synthesis library checked in beside this file — the SA fabric from
      # GEMMINI_SYS_ARRAY blocks, the softmax pipeline from
      # FP_COMP/FP_ADD/FP_MULT/BF16_EXP/BF16_RECIP, the scan engine from
      # FP_MULT/FP_ADD/M_REG. Nothing is declared and nothing is estimated;
      # digital_components_22nm.yaml names the synthesis run every number
      # came from.
      synthesis_library: 22nm
      # D31: vector_lanes is GONE as an input. The engine's width is DERIVED
      # from the beat this run's ANALOG stages set — the smallest integer lane
      # count whose own priced time fits that beat, with no margin (D28) — and
      # it is REPORTED (evaluation.digital_silicon.derived_engine_sizing, plus
      # a derived_engine_sizing disclosure). The 1024-lane "declared design
      # point" this card used to carry was a number nobody measured; declaring
      # one again is still possible and rides a disclosure naming it an
      # OVERRIDE of a retired input. (P7.9 correction: that disclosure does not
      # print what the beat would have derived. A declared width skips the
      # probe pass entirely, so no derivation exists to compare it with, and
      # claiming otherwise described a sentence no run can emit.)
      # vector_clock_ghz / vector_pipeline_depth / state_bytes_per_cycle stay
      # undeclared on purpose: the first two inherit the chiplet's own clock
      # and softmax depth (disclosed per priced op), and an undeclared state
      # bandwidth REPORTS recurrent-state traffic without bounding it.
      # NOTE (ADJ-9): the mapping_dse block at the end of this file no longer
      # sweeps vector_lanes. D31-v2 derives the engine to the ANALOG FLOOR and
      # the axis is REFUSED BY NAME by tools/fws_qif_dse.py; the sweep that
      # declared it is frozen and labelled at
      # docs/qif/dse/granite_lanes_banks_retired.

sw_param:
  full_recomputation: false
  kernel_launch_overhead: 0   # (s) deterministic fabric; no per-kernel launch cost
  dp_zero_stage: 0
  precision:
    tensor_format: bf16
    kv_cache: as_tensor_format
    parameters: as_tensor_format
    gradients: fp32
    grad_communication: fp32
    optimizer_states: as_tensor_format
    stats: as_tensor_format
    master_parameters: 0.0
  h2d_bandwidth: -1  # Bytes/s; -1 disables H2D timing
  const_mem_offset: 0 GB

# Stub calibrated to the digital fabric (2 arrays x 32x64 MACs @ 0.95 GHz).
tech_param:
  core:
    operating_frequency: 0.95e9     # (Hz) fabric clock
    num_bundles: 2                  # = cim.fabric.num_arrays
    nominal_flop_rate_per_mcu: 4096 # = rows*cols*2 = 32*64*2
    nominal_energy_per_flop: 1e-13  # (J) placeholder; CIM energy is reported separately
    num_mcu_per_bundle: 1
    FMA_d1: 8
    FMA_d2: 4
    dataflow: best
    util: 1
  DRAM:                    # stands in for the chips' aggregate activation + KV SRAM (cim_sram story)
    size: 8 GB
    bandwidth: 4 TB        # (/s)
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0             # (s) on-chip SRAM
    util: 1.0
  SRAM-L2:
    size: 64 MB
    bandwidth: 8 TB
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0
    util: 1
  SRAM-L1:
    size: 8 MB
    bandwidth: 16 TB
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0
    util: 1
  SRAM-R:
    size: 4 MB
    bandwidth: 128 TB      # level-0 bandwidth feeds analytical collectives; keep it high
    dynamic_energy_per_bit: 1e-13   # (J)
    latency: 0
    util: 1

memory_hierarchy:
  l0:   # Register memory
    type: SRAM-R
    scope: mcu
  l1:   # Shared memory
    type: SRAM-L1
    scope: mcu-bundle
  l2:   # L2
    type: SRAM-L2
    scope: global
  l3:   # Activation buffer (DRAM stub)
    type: DRAM
    scope: global

parallelism:
  tp: 1
  tp_sp: false
  cp: 1
  pp: 1     # fws_cim requires pp=1; chip placement comes from cim.chip.layers_per_chip
  mb: 1
  train:
    dp: 1
    ep: 1
    tp_ep: true
  inference:
    replica_count: 1
    moe_dp: 1

network:
  overlap:
    tp_overlap: 0.0
    tp_sp_overlap: 0.0
    cp_overlap: 0.0
  dimensions:
    - id: dim0
      label: chip_ring_ep_tp   # ep dispatch/combine and tp boundary links
      size: auto
      topology:
        type: Ring       # analytical mode requires ring topologies
        bandwidth: 100 GB
        latency: 1e-6
        energy_per_bit: 1e-12 # (J/bit)
        util: 1.0
      collective_override: {}
      parallelisms: [tp, cp, ep]
    - id: dim1
      label: chip_ring_pp      # chip-to-chip boundary (p2p) links
      size: auto
      topology:
        type: Ring
        bandwidth: 100 GB
        latency: 1e-6
        energy_per_bit: 1e-12 # (J/bit)
        util: 1.0
      collective_override: {}
      parallelisms: [pp, dp]

execution_backend:
  model: analytical   # fws_cim supports only the analytical backend

inference:
  kvcache_type: cim_sram   # KV lives in the fabric activation SRAM (the device has no HBM)

# --- the mapping block (P3, ADJ-5). Its presence is what makes this a
# --- MAPPED run: the DAG report replaces the closed-form section (ADJ-6).
mapping:
  parallelism:
    tp: 1
  # D27 / Invariant W (HARD): the DENSE packer is the law, exactly as the shipped
  # card declares it (a test pins these two documents equal outside the sweep
  # block). At this card's whole-macro granularity dense and dedicated coincide;
  # at bank_depth 1 they separate, and the sweep visits both.
  packing: dense
  # ADJ-6: the decode series is a bounded window plus a disclosed
  # extrapolation. Three steps give a first / median / last that are three
  # different readings rather than one repeated.
  decode_window: 3

# --- the MAPPED-PATH sweep block (QIF P3.7, D10). Owned and strict-keyed by
# --- tools/fws_qif_dse.py, which strips it before the config parser sees the
# --- file — so this config still runs through run_perf unchanged, as the
# --- single design point its `cim:` and `mapping:` blocks declare.
#
# THE DEMO SWEEP: chip capacity x analog banking on the headline model. Every
# entry is an EXPLICIT candidate; there is no search phase (D19, and D10 keeps
# the automatic allocator future work). The cross product is 8 points and every
# one of them is placed by P3 and priced by P4 on its OWN timeline (ADJ-6) —
# the sweep costs about two minutes of wall clock and nothing in it is sampled.
#
# ADJ-9 RETIRED THIS SWEEP'S FIRST AXIS. It used to be `vector_lanes`, and its
# whole spread came from DECLARING a scan-engine width. D31-v2 derives that
# width to the ANALOG FLOOR — up until every stage's digital per-stage time
# fits that stage's own analog m-pass time — so a declared width is not a
# design point, it is the answer chosen instead of derived. The axis is now
# REFUSED BY NAME by tools/fws_qif_dse.py (REFUSED_AXES), and the sweep it fed
# is preserved, frozen and labelled, at docs/qif/dse/granite_lanes_banks_retired
# because it is the historical comparison ADJ-9 itself quotes (+27% tokens/s
# for +0.78% silicon). The two axes below are both D31-legal.
#
#   arrays_per_chip: CHIP CAPACITY — the macro slots one chip offers
#     (cim.chip.arrays_per_chip). Under Invariant W (D27) the analog macro
#     count is the global CELL FLOOR, so capacity does not change how many
#     macros hold weights; it changes how many slots the machine ENUMERATES,
#     and every enumerated-but-unowned slot is real silicon. This is therefore
#     the AREA axis, and the finding this sweep exists to draw is that at a
#     fixed stage plan it buys area and nothing else. The four values are the
#     shipped 640 plus ceil(L x 120.625) for L = 5, 8 and 10 — the same rungs
#     the P7.4 frontier walks, so the two artifacts price comparable machines.
#   bank_depth: the analog card's allocation granularity in mux slots
#     (cim.cards.ctt.bank_depth, A3/D10 — spatial column allocation). The card
#     declares adc_mux = 4, so 1, 2 and 4 are the values it admits; 3 is
#     refused BY THE CARD, which is the refusal path this axis rides.
mapping_dse:
  label: "Granite-4.0-H-Tiny: chip capacity x analog banking (D31-legal axes)"
  objective: throughput
  axes:
    arrays_per_chip: [604, 640, 965, 1207]
    bank_depth: [1, 2]
