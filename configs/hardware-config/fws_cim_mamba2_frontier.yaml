# Mamba2-2.7B frontier sweep — the PURE MAMBA-2 (SSD) machine, on the
# D35-REVISED PLATFORM MACRO.
#
# THE MACRO IS X x Y : Z — X rows, Y total CTT columns, Z ADCs, mux = Y/Z
# DERIVED. X is fixed at 512 by the platform; the sweep walks Z (powers of two
# 8..X) and Y (powers of two X..8X). The card below is the SHIPPED machine's
# point, 512 x 2048 : 512 (mux 4), sheet-derived by
# cim_analog_calc.derive_analog_card(512, 2048, 512). The sweep's rungs are
# declared in mapping_dse.axes and each point re-derives the card from the
# sheet, so the card here is the machine a plain run_perf run prices, not a
# rung of the grid.
#
# Hidden dim 2560 against X = 512 means every hidden-deep matrix tiles onto 5
# row blocks with the priced K-accumulator between them and a D27 remainder in
# the report.
#
# THERE IS DELIBERATELY NO `cim.fabric.geometry: derived` HERE. The SA geometry
# rule is read off the DECODE ATTENTION CALL's own row count, and this stack has
# no attention block at any layer — cim_timing refuses the key by name ("was
# asked for and there is no attention call"). The declared 32 x 64 fabric stays.
device_class: fws_cim
cim:
  allocation:
    # D38 (2026-08-29): the conv's work is ALWAYS on the shared digital
    # chiplet. It is no longer a sweep axis (REFUSED BY NAME) and it is no
    # longer a choice this machine makes.
    conv_placement: shared_digital
  analog:
    rows: 512
    cols: 2048            # Y: total CTT columns (storage tile)
    adcs: 512            # Z: ADCs; mux = Y/Z = 4 is DERIVED
    slice_cycles: 2
    analog_clock_mhz: 100
    energy_per_vec_pj: 12950.954799267838
    shots_per_output: 2
    area_mm2_per_array: 1.2826567311359998
  fabric:
    model: sa
    rows: 32
    cols: 64
    num_arrays: 2
    replicas: 1
    clock_ghz: 0.95
    softmax_lanes: 1
    softmax_pipeline_depth: 20
  chip:
    layers_per_chip: 4
    moe_expert_parallel: 1
  cards:
    sa:
      kind: digital_chiplet
      synthesis_library: 22nm
    ctt_sheet:
      kind: analog_macro
      device: ctt
      calc_profile: george_cima_mux1
      params:
        rows: 512
        cols: 2048
        adcs: 512
        shots_per_output: 2
      bank_depth: 1
sw_param:
  full_recomputation: false
  kernel_launch_overhead: 0
  dp_zero_stage: 0
  precision:
    tensor_format: bf16
    kv_cache: as_tensor_format
    parameters: as_tensor_format
    gradients: fp32
    grad_communication: fp32
    optimizer_states: as_tensor_format
    stats: as_tensor_format
    master_parameters: 0.0
  h2d_bandwidth: -1
  const_mem_offset: 0 GB
tech_param:
  core:
    operating_frequency: 0.95e9
    num_bundles: 2
    nominal_flop_rate_per_mcu: 4096
    nominal_energy_per_flop: 1e-13
    num_mcu_per_bundle: 1
    FMA_d1: 8
    FMA_d2: 4
    dataflow: best
    util: 1
  DRAM:
    size: 8 GB
    bandwidth: 4 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1.0
  SRAM-L2:
    size: 64 MB
    bandwidth: 8 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
  SRAM-L1:
    size: 8 MB
    bandwidth: 16 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
  SRAM-R:
    size: 4 MB
    bandwidth: 128 TB
    dynamic_energy_per_bit: 1e-13
    latency: 0
    util: 1
memory_hierarchy:
  l0:
    type: SRAM-R
    scope: mcu
  l1:
    type: SRAM-L1
    scope: mcu-bundle
  l2:
    type: SRAM-L2
    scope: global
  l3:
    type: DRAM
    scope: global
parallelism:
  tp: 1
  tp_sp: false
  cp: 1
  pp: 1
  mb: 1
  train:
    dp: 1
    ep: 1
    tp_ep: true
  inference:
    replica_count: 1
    moe_dp: 1
network:
  overlap:
    tp_overlap: 0.0
    tp_sp_overlap: 0.0
    cp_overlap: 0.0
  dimensions:
  - id: dim0
    label: chip_ring_ep_tp
    size: auto
    topology:
      type: Ring
      bandwidth: 100 GB
      latency: 1e-6
      energy_per_bit: 1e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - tp
    - cp
    - ep
  - id: dim1
    label: chip_ring_pp
    size: auto
    topology:
      type: Ring
      bandwidth: 100 GB
      latency: 1e-6
      energy_per_bit: 1e-12
      util: 1.0
    collective_override: {}
    parallelisms:
    - pp
    - dp
execution_backend:
  model: analytical
inference:
  kvcache_type: cim_sram
mapping:
  shared_chiplets: 4
  layers_per_chip: 2
  parallelism:
    tp: 1
  packing: dense
  decode_window: 3
mapping_dse:
  label: 'Mamba2-2.7B (pure Mamba-2 SSD, no attention anywhere) SMOKE GRID: the platform
    box (Z x Y) x the fill fraction (D38). The partition, the banking, the conv
    placement and the chiplet count are all REFUSED BY NAME as axes (D36/D38)'
  objective: throughput
  # STUB-ROUND BUDGET, RAISED DELIBERATELY (2026-08-29). At 20000 mm2 every
  # point of this grid is INFEASIBLE at stage budget and the smoke evaluates
  # nothing at all. The term that blows it is the SHARED DIGITAL chiplet at
  # ~16921 mm2 each: D36's stage 2 says a chiplet's engines are sized to ONE
  # GROUP's stages, and cim_timing.derive_group_engine_sizing exists to do
  # exactly that, but NOTHING CALLS IT YET — the engines are still derived
  # against the whole 64-stage stack, so the chiplet comes out roughly two
  # orders of magnitude too big and the D36 band arithmetic in the artifact
  # reports chips_per_group in the dozens.
  # This budget is raised only to let the mapped path run END TO END for the
  # stub round. It is NOT a claim that a 74000 mm2 machine is buildable, and it
  # returns to a real number the day the group engine sizing is wired.
  max_silicon_mm2: 150000
  search: ladder
  initializer:
    macro_z: 128
    macro_y: 2048
    pp_util: 1.0
  axes:
    # THE PLATFORM AXES (D35-REVISED, 2026-08-29). The macro is X x Y : Z and
    # mux = Y/Z is DERIVED, so the sweep walks the axis-aligned legal box in the
    # CONSTRAINT-NATIVE coordinates: Z (converter count, output interface,
    # calibration) and Y (wordline length, tile granularity). Sweeping the fold
    # instead would let an absurd corner hide inside a derived quantity, so
    # adc_capacity_mux is REFUSED BY NAME. Y >= Z always; mux = 1 is legal.
    #
    # THIS IS A SMOKE GRID, not the design sweep: two rungs per axis, 8 points,
    # enough to walk the machinery end to end on the new axis table. The real
    # ladder returns when the mapping law lands.
    macro_z:
    - 64
    - 128
    macro_y:
    - 2048
    - 4096
    # THE FILL FRACTION (D38, 2026-08-29) — the axis that REPLACED the
    # partition. layers_per_chip, layers_per_stage, bank_depth, conv_placement
    # and shared_chiplets are all REFUSED BY NAME now: stage granularity
    # DERIVES (finest motif-compatible stages, local microbatch 1), the
    # mux-slot allocation question is PARKED, the conv is always on the shared
    # digital chiplet, and the chiplet count is a derived FUNCTION of the
    # analog point (D36). What is still a choice is how full the pipeline is
    # run: resident streams = max(1, round(pp_util * stages)), throughput
    # linear in the fill, per-stage state and KV area linear in the streams.
    pp_util:
    - 1.0
    - 0.5
